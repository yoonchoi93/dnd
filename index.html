 <div class="card"><h3>중요 물품</h3><ul class="list">${c.items.map((it,i)=>`<li><span>${esc(it)}</span><button class="btn ghost sm" data-delitem="${i}">버리기</button></li>`).join('')}</ul>
  <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="newitem" placeholder="아이템 추가"><button class="btn sm" data-a="additem">추가</button></div></div>`:''}
 <div class="card"><h3>관리</h3><p class="muted" style="font-size:13px;margin-top:0">마지막 파일 백업: ${S.lastBackup?new Date(S.lastBackup).toLocaleString('ko-KR'):'아직 없음'} · 장이 끝날 때마다 저장 창이 자동으로 떠요.</p><div class="row"><button class="btn ghost sm" data-a="newchar">캐릭터 바꾸기</button><button class="btn ghost sm" data-a="backup">📁 파일로 백업</button><button class="btn ghost sm" data-a="restore">📂 파일에서 불러오기</button><button class="btn red sm" data-a="wipe">전체 초기화</button></div></div>`;}
function vDice(){const D=S.dice;const l=D.last;
 return`<div class="card"><h2>주사위</h2>
  <div class="dicebox" id="dbox">${D20SVG}<div class="big num">${l?l.total:'–'}</div></div><div class="muted" id="ddesc" style="text-align:center">${l?esc(l.desc):'주사위를 눌러 굴리세요'}</div>
  <hr><div class="dice">${[4,6,8,10,12,20,100].map(s=>`<button class="die" data-die="${s}">d${s}</button>`).join('')}<button class="die" data-a="clearhist">지우기</button></div>
  <div class="grid2" style="margin-top:14px"><div><div class="muted">개수</div><span class="stepper"><button data-dadj="count:-1">−</button><output>${D.count}</output><button data-dadj="count:1">+</button></span></div>
   <div><div class="muted">보정치</div><span class="stepper"><button data-dadj="mod:-1">−</button><output>${sgn(D.mod)}</output><button data-dadj="mod:1">+</button></span></div></div>
  <div class="muted" style="margin-top:12px">d20 굴림 방식</div><div class="seg">${[['norm','일반'],['adv','이점'],['dis','불리']].map(([m,t])=>`<button class="${D.mode===m?'on':''}" data-dmode="${m}">${t}</button>`).join('')}</div></div>
  ${S.hero?`<div class="card"><h3>내 캐릭터로 기술 판정</h3><div class="grid3">${Object.keys(SKILL).map(s=>`<button class="btn ghost sm" data-sk="${s}">${s} ${sgn(skillBonus(s))}</button>`).join('')}</div></div>`:''}
  <div class="card"><h3>최근 기록</h3><ul class="list">${D.hist.map(h=>`<li><span class="muted">${esc(h.desc)}</span><b>${h.total}</b></li>`).join('')||'<li class="muted">아직 없어요</li>'}</ul></div>`;}
function vOracle(){const o=S.olast;
 return`<div class="card"><h2>예/아니오 오라클</h2><p class="muted">GM 없이 혼자 할 때, 궁금한 걸 질문하고 굴리세요. "문이 잠겨 있나?" "경비병이 깨어 있나?"</p>
  <input id="oq" placeholder="질문 (선택)">
  <div class="muted" style="margin-top:10px">가능성</div><div class="seg" style="flex-wrap:wrap">${LIKE.map((l,i)=>`<button class="${S.like===i?'on':''}" data-like="${i}">${l[0]}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px;justify-content:space-between"><span>혼돈 지수 <span class="stepper" style="display:inline-flex"><button data-chaos="-1">−</button><output>${S.chaos}</output><button data-chaos="1">+</button></span></span>
  <button class="btn" data-a="ask">질문하기</button></div>
  <div class="muted" style="font-size:12px;margin-top:6px">혼돈 지수가 높을수록 무작위 사건이 자주 터져요. 일이 잘 풀리면 낮추고, 꼬이면 올리세요.</div>
  ${o?`<div class="res">${o}</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="tojournal">기록에 추가</button></div>`:''}</div>
 <div class="card"><h3>생성기</h3><div class="grid2">
  <button class="btn ghost" data-gen="scene">🎬 장면 체크</button><button class="btn ghost" data-gen="event">⚡ 무작위 사건</button>
  <button class="btn ghost" data-gen="npc">🧑 NPC</button><button class="btn ghost" data-gen="loot">💎 보물</button>
  <button class="btn ghost" data-gen="place">🏚️ 장소</button><button class="btn ghost" data-gen="idea">💡 영감 (행동+주제)</button>
  <button class="btn ghost" data-gen="enc:도시">🏙️ 도시 조우</button><button class="btn ghost" data-gen="enc:야생">🌲 야생 조우</button>
  <button class="btn ghost" data-gen="enc:던전" style="grid-column:span 2">🕳️ 던전 조우</button></div></div>
 <div class="card"><h3>혼자 하는 법</h3><p class="muted" style="margin:0">1) 장면을 정하고 '장면 체크'로 예상대로 흘러가는지 확인 → 2) 궁금한 건 오라클에 질문 → 3) 막히면 '영감'이나 '무작위 사건' → 4) 결과를 '기록'에 남기기. 전투는 주사위 탭에서 굴리세요.</p></div>`;}
function vJournal(){return`<div class="card"><h2>모험 기록장</h2><p class="muted">자동 저장돼요. 오라클 결과를 여기로 보낼 수 있어요.</p><textarea id="jr" rows="18" placeholder="오늘의 모험…">${esc(S.journal)}</textarea></div>`;}
function installHint(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(!ios||navigator.standalone||S.hintOff)return'';
 return`<div class="banner">📲 오프라인으로 쓰려면 Safari 아래쪽 <b>공유 버튼 → 홈 화면에 추가</b>를 누르고, 홈 화면 아이콘으로 실행하세요. <button class="btn ghost sm" data-a="hintoff" style="margin-top:6px">닫기</button></div>`;}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 $('#statbar').innerHTML=statbar();
 $('#view').innerHTML=installHint()+({adv:vAdv,char:vChar,dice:vDice,oracle:vOracle,journal:vJournal}[S.tab])();
 const cb=S.adv&&S.adv.combat;if(cb&&cb.ev&&cb.ev.length&&S.tab==='adv'&&!S.menu){const ev=cb.ev;cb.ev=[];setTimeout(()=>playFx(ev),20);}}

/* ================= 오라클 로직 ================= */
function plainOracle(){return(S.olast||'').replace(/<br>/g,'\n').replace(/<[^>]+>/g,'');}
function evt(){const r=rnd(100);const f=T.focus.find(x=>r<=x[0])[1];return`${f} — <i>${pick(T.action)} / ${pick(T.subject)}</i>`;}
function ask(){const th=LIKE[S.like][1],r=rnd(100);const q=($('#oq')||{}).value||'';let a,cls;
 if(r<=Math.ceil(th/5)){a='예, 그리고 더!';cls='ok-c';}else if(r<=th){a='예';cls='ok-c';}else if(r>100-Math.ceil((100-th)/5)){a='아니오, 오히려 반대로!';cls='bad-c';}else{a='아니오';cls='bad-c';}
 let ev='';const t=r%10,tens=fl(r/10)%10;if(r<100&&r>10&&t===tens&&t<=S.chaos)ev=`<br><b>⚡ 무작위 사건!</b> ${evt()}`;
 S.olast=`${q?`<div class="muted">Q. ${esc(q)}</div>`:''}<span class="k ${cls}">${a}</span> <span class="muted">(🎲${r} / ${LIKE[S.like][0]})</span>${ev}`;save();render();}
function gen(g){let h;
 if(g==='scene'){const r=rnd(10);h=r>S.chaos?'<span class="k">예상대로 진행</span><br>생각한 장면 그대로 시작하세요.':r%2?'<span class="k">변경된 장면</span><br>예상과 조금 다르게 흘러가요. 한 가지 요소를 바꾸세요.':`<span class="k">중단된 장면</span><br>전혀 다른 일이 끼어듭니다: ${evt()}`;h+=` <span class="muted">(🎲${r} vs 혼돈 ${S.chaos})</span>`;}
 else if(g==='event')h=`<span class="k">⚡ 무작위 사건</span><br>${evt()}`;
 else if(g==='npc')h=`<span class="k">${pick(T.name)}</span><br>${pick(T.trait)} ${pick(T.race)} ${pick(T.job)}<br>원하는 것: ${pick(T.want)}<br>비밀: ${pick(T.secret)}`;
 else if(g==='loot')h=`<span class="k">💎 보물</span><br>${pick(T.loot)}`;
 else if(g==='place')h=`<span class="k">${pick(T.place)}</span><br>분위기: ${pick(T.mood)}`;
 else if(g==='idea')h=`<span class="k">${pick(T.action)} / ${pick(T.subject)}</span><br><span class="muted">두 단어를 지금 상황에 맞게 해석해 보세요.</span>`;
 else{const w=g.split(':')[1];const r=rnd(12);h=`<span class="k">${w} 조우</span> <span class="muted">(d12 → ${r})</span><br>${T.enc[w][r-1]}`;}
 S.olast=h;save();render();}

/* ================= 이벤트 ================= */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-cr]');if(!t||t.closest('#overlay'))return;const ds=t.dataset;
 if(ds.tab){S.tab=ds.tab;save();render();window.scrollTo(0,0);return;}
 if(ds.goTab){S.tab=ds.goTab;save();render();return;}
 if(ds.ch!==undefined)return choose(+ds.ch);
 if(ds.act)return act(ds.act==='potion'?'potion':'x',ds.act);
 if(ds.tg!==undefined){const cb=S.adv.combat;if(cb.enemies[+ds.tg].hp>0){cb.target=+ds.tg;save();render();}return;}
 if(ds.cr!==undefined)return crClick(ds);
 if(ds.newc&&!ds.fresh&&askLegacy(ds.newc))return;
 if(ds.newc){const id=ds.newc;const has=S.saves[id]||(S.adv&&S.adv.camp===id);if(has)modal('<h2>처음부터 시작할까요?</h2><p class="muted">이 모험의 진행 상황이 사라져요.</p>',[{t:'처음부터',fn:()=>{if(S.adv&&S.adv.camp===id)S.adv=null;delete S.saves[id];startCamp(id);}},{t:'취소',cls:'ghost'}]);else startCamp(id);return;}
 if(ds.resume)return resumeCamp(ds.resume);
 if(ds.rch){const[id,ch]=ds.rch.split(':');modal(`<h2>${+ch+1}장을 다시 할까요?</h2><p class="muted">그 장을 시작했던 때의 상태로 돌아가요. 이후 진행은 사라져요.</p>`,[{t:'다시 하기',fn:()=>restartChapter(id,+ch)},{t:'취소',cls:'ghost'}]);return;}
 if(ds.adj){const[k,v]=ds.adj.split(':');const c=S.char;c[k]=Math.max(0,c[k]+ +v);if(k==='hp')c.hp=Math.min(c.hp,c.maxhp);if(k==='slots')c.slots=Math.min(c.slots,c.maxSlots);save();render();return;}
 if(ds.delitem!==undefined){S.char.items.splice(+ds.delitem,1);save();render();return;}
 if(ds.die){const D=S.dice,s=+ds.die;let total,desc;
  if(s===20&&D.count===1&&D.mode!=='norm'){const r=d20(D.mode);total=r.v+D.mod;desc=`d20 ${D.mode==='adv'?'이점':'불리'} ${r.txt}${D.mod?sgn(D.mod):''}`;if(r.v===20)desc+=' · 대성공!';if(r.v===1)desc+=' · 대실패!';}
  else{const r=roll(`${D.count}d${s}${D.mod?sgn(D.mod):''}`);total=r.t;desc=`${D.count}d${s}${D.mod?sgn(D.mod):''} [${r.r.join(', ')}]`;if(s===20&&D.count===1){if(r.r[0]===20)desc+=' · 대성공!';if(r.r[0]===1)desc+=' · 대실패!';}}
  D.last={total,desc};D.hist.unshift(D.last);D.hist=D.hist.slice(0,25);save();render();const dd=$('#ddesc');if(dd)dd.style.visibility='hidden';rollAnim($('#dbox'),total,s===100?100:s,600,()=>{if(dd)dd.style.visibility='visible';});return;}
 if(ds.dadj){const[k,v]=ds.dadj.split(':');const D=S.dice;D[k]+= +v;if(k==='count')D.count=Math.min(20,Math.max(1,D.count));if(k==='mod')D.mod=Math.max(-20,Math.min(20,D.mod));save();render();return;}
 if(ds.dmode){S.dice.mode=ds.dmode;save();render();return;}
 if(ds.sk){const s=ds.sk,b=skillBonus(s),r=d20(S.dice.mode);S.dice.last={total:r.v+b,desc:`${ABIL[SKILL[s]]}(${s}) ${r.txt}${sgn(b)}${r.v===20?' · 대성공!':r.v===1?' · 대실패!':''}`};S.dice.hist.unshift(S.dice.last);S.dice.hist=S.dice.hist.slice(0,25);save();render();window.scrollTo(0,0);const dd=$('#ddesc');if(dd)dd.style.visibility='hidden';rollAnim($('#dbox'),S.dice.last.total,20,600,()=>{if(dd)dd.style.visibility='visible';});return;}
 if(ds.like!==undefined){S.like=+ds.like;save();render();return;}
 if(ds.chaos){S.chaos=Math.max(1,Math.min(9,S.chaos+ +ds.chaos));save();render();return;}
 if(ds.gen)return gen(ds.gen);
 if(ds.buy)return buy(ds.buy);
 if(ds.talk)return talk(ds.talk);
 if(ds.sell)return sell(ds.sell);
 const a=ds.a;if(!a)return;
 ({menu:()=>{S.menu=true;save();render();window.scrollTo(0,0);},
  party:partyModal,nextch:nextChapter,bag:()=>bagModal(),cbag:()=>bagModal('combat'),
  won:()=>enterNode(S.adv.combat.win),
  mkchar:createHero,
  newchar:()=>modal('<h2>캐릭터를 바꿀까요?</h2><p class="muted">모든 모험의 진행 상황이 사라져요.</p>',[{t:'바꾸기',cls:'red',fn:()=>{S.hero=null;S.char=null;S.adv=null;S.saves={};S.done={};S.legacy={};S.menu=true;save();render();}},{t:'취소',cls:'ghost'}]),
  srest:()=>{const m=doRest(false);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);},
  lrest:()=>{const m=doRest(true);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);},
  additem:()=>{const v=$('#newitem').value.trim();if(v){S.char.items.push(v);save();render();}},
  clearhist:()=>{S.dice.hist=[];S.dice.last=null;save();render();},
  ask,hintoff:()=>{S.hintOff=1;save();render();},
  tojournal:()=>{const d=new Date();S.journal=(S.journal?S.journal.trimEnd()+'\n\n':'')+`[${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}] ${plainOracle()}`;save();modal('<p>기록장에 추가했어요.</p>',[{t:'확인'}]);},
  backup:saveBackupFile,
  restore:loadBackupFile,
  wipe:()=>modal('<h2>전부 지울까요?</h2><p class="muted">캐릭터, 모든 모험, 기록장이 삭제돼요.</p>',[{t:'모두 삭제',cls:'red',fn:()=>{S=fresh();save();render();}},{t:'취소',cls:'ghost'}])
 }[a]||(()=>{}))();
});
let jt;document.addEventListener('input',e=>{if(e.target.id==='jr'){S.journal=e.target.value;clearTimeout(jt);jt=setTimeout(save,300);}if(e.target.id==='cname')draft().name=e.target.value;});
function netState(){$('#offline').textContent=navigator.onLine?'':'✈︎ 오프라인';}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if(S.adv&&!NODES[S.adv.node]){S.adv=null;S.menu=true;}
try{migrateAll();}catch(e){console.error(e);}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
