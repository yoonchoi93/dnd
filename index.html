 nodes:{
/* ---------- 1장: 이스카르의 던전 (Lv7) ---------- */
b2_start:{title:'???',who:['iskar'],text:`차가운 쇠창살. 몸 곳곳에 남은 바늘 자국. 당신은 철창 안에서 눈을 뜬다.

어둠 속에서 낮은 목소리가 들린다. 얼굴의 절반을 매끈한 은빛 가면으로 가린 엘프 마법사가 당신을 내려다본다. 가면 아래 드러난 입술은 웃고 있지 않다.

<i>"아직 버티는군. 좋아. 네 안의 힘은… 생각보다 깊어. 조금만 더 들여다보자꾸나."</i>

그가 손을 드는 순간, 천장 너머로 폭음이 울린다. 누군가 이곳을 습격하고 있다. 마법사는 혀를 차며 사라진다.

잠시 뒤, 금 간 고글을 쓴 소년이 창살 앞에 나타난다. "일어나! 지금이 기회야!" 티오다. 그가 머리핀 두 개로 자물쇠를 딴다. 그의 손끝이 이상하게 붉게 깜빡인다.`,
 choices:[{t:'티오와 함께 감방을 나선다',go:'b2_cells'}]},
b2_cells:{title:'감옥 복도',who:['korva','brenna'],onEnter:{join:['tio','korva','brenna']},text:`복도의 다른 철창들에서 코르바와 브렌나를 찾아낸다. 코르바는 너덜너덜한 요리책을 품에 안고 있다. "감옥에서 이것만은 안 뺏겼다. 간수 놈한테 레시피 하나 알려주고 지켰지."

브렌나는 말이 없다. 그녀의 시선이 복도 끝 철창에 고정돼 있다. 그 안에 붉은 수염의 드워프가 누워 있다. 세 갈래로 땋은 수염. 라스다. 움직이지 않는다.

"…그 마법사가 실험했어. 라스에게." 브렌나의 목소리가 갈라진다. 그녀가 안경을 벗어 손에 쥔다. 손이 하얗게 질릴 만큼 꽉. "울 시간은 나중이다. 지금은 나가야 해."

복도 끝의 다른 감방에서 검은 머리를 높이 묶은 여자가 손을 흔든다. "이봐, 나도 좀 꺼내주지 않겠어? 이세라고 해. 나도 그 은가면한테 잡혀왔거든. 칼만 돌려받으면 쓸모 있을걸?"`,
 choices:[{t:'이세를 꺼내준다',join:'ise',go:'b2_lab'},{t:'믿을 수 없다. 그냥 간다',go:'b2_lab'}]},
b2_lab:{title:'이스카르의 실험실',text:`유리병 속에 무언가 떠다니는 실험실. 원소 정령 메피트들이 날아다니고, 구석에서 살덩이로 빚은 골렘이 몸을 일으킨다.

벽의 제어 문양이 골렘을 조종하는 것 같다.`,
 choices:[{t:'제어 문양을 해석해 골렘을 멈춘다',check:{skill:'비전',dc:15,ok:'b2_lab_half',fail:'b2_lab_fight'}},{t:'싸워서 뚫는다',go:'b2_lab_fight'}]},
b2_lab_half:{title:'이스카르의 실험실',text:`문양 하나를 손끝으로 지우자 골렘이 그대로 굳는다. 하지만 메피트들이 키득거리며 덤벼든다.`,combat:{enemies:[mob('불꽃 메피트',7,{n:3})],win:'b2_dryad'}},
b2_lab_fight:{title:'이스카르의 실험실',text:`골렘이 비틀거리며 다가오고, 메피트들이 불꽃을 뿜는다!`,combat:{enemies:[elite('살덩이 골렘',7),mob('불꽃 메피트',7,{n:2})],win:'b2_dryad'}},
b2_dryad:{title:'갇힌 정원',text:`실험실 안쪽, 마법으로 만든 작은 숲. 나무 정령 드라이어드 셋이 유리 벽 안에 갇혀 있다.

"부탁이에요… 저 마법사가 우리 도토리를 빼앗아 갔어요. 도토리가 없으면 숲으로 돌아갈 수 없어요. 저 옆방 상자에 있어요."

옆방에는 병 속에 갇힌 지니도 있다. "나를 풀어주면 보답하지, 필멸자."`,
 choices:[{t:'도토리를 찾아 드라이어드를 풀어준다',not:['dryad'],set:{dryad:1},go:'b2_dryad_free'},{t:'지니의 병을 연다',not:['genie'],set:{genie:1},go:'b2_genie'},{t:'출구를 찾는다',go:'b2_exit'}]},
b2_dryad_free:{title:'갇힌 정원',onEnter:{heal:'3d8',loot:'u_acorn'},text:`도토리를 돌려주자 드라이어드들이 노래하며 빛 속으로 사라진다. 그 빛이 당신의 상처를 감싸 아물게 한다. 하나가 남아 작은 도토리 하나를 당신 손에 쥐여준다. "숲이 당신을 기억할 거예요."`,choices:[{t:'돌아선다',go:'b2_dryad'}]},
b2_genie:{title:'병 속의 지니',onEnter:{potions:2},text:`병에서 푸른 연기가 솟구쳐 거대한 지니가 된다. "자유다! 약속대로." 그가 손가락을 튕기자 물약 두 병이 나타난다.

"한 가지 더 알려주지. 너를 가둔 자의 이름은 이스카르. 그는 엘프였지만, 엘프이길 버린 자다. 그 가면 아래엔 동족에게 받은 낙인이 있지."`,choices:[{t:'돌아선다',go:'b2_dryad'}]},
b2_exit:{title:'던전 출구',text:`계단을 오르자 그림자 길드 암살자들이 쓰러져 있다. 이들이 습격한 자들이다. 하지만 출구 앞에 아직 살아 있는 이스카르의 하수인들이 버티고 있다.`,combat:{enemies:[mob('복제인간 경비',7,{n:2}),elite('던전 관리인',7)],win:'b2_street'}},
b2_street:{title:'애스카틀라 거리',who:['iskar','tio'],text:`햇빛. 몇 달 만의 햇빛이다. 그곳은 앰의 수도, 애스카틀라였다.

광장에서 이스카르가 그림자 길드 암살자들을 마법으로 날려버리고 있다. 그때 티오가 앞으로 뛰쳐나간다.

"너 이 자식! 라스 아저씨를! 우리한테 무슨 짓을 한 거야!" 그가 단검을 던지려는 순간, 그의 두 손에서 붉은 빛이 폭발한다. 티오 자신도 놀란 얼굴이다. 그런 힘은 처음이다.

순간, 공기가 찢어지며 두건 쓴 마법사들이 나타난다. <b>두건 쓴 마법사단</b>. 이 나라에서 허가 없이 마법을 쓰는 자를 잡아가는 자들이다.

"허가 없는 마법 사용. 둘 다 연행한다." 이스카르가 가면 아래로 비웃는다. "좋아, 데려가라. 단, 이 아이도 함께라면." 티오와 이스카르가 빛 속으로 사라진다.`,
 choices:[{t:'"티오!!"',go:'b2_c1_end'}]},
b2_c1_end:{title:'1장 끝',chapterEnd:true,who:['fedor'],onEnter:{leave:'tio'},text:`광장에 정적이 내려앉는다. 티오가 사라졌다. 바닥에 그의 고글만 떨어져 있다.

후드를 깊이 눌러쓴 남자가 다가온다. "페도르라고 하오. 중개인이지. 친구분이 끌려간 곳은 <b>스펠홀드</b>. 마법 범죄자들을 가두는 섬의 정신병원이오. 그곳에 가는 배편을 구하려면… 금화 2만 닢쯤 필요할 거요. 일거리를 소개해 드릴 수 있소만."

브렌나가 고글을 주워 당신 손에 쥐여준다. "라스를 잃었다. 저 아이까지 잃을 순 없어."`}
,
/* ---------- 2장: 애스카틀라의 거래 (Lv8) ---------- */
b2_c2:{title:'애스카틀라 빈민가',who:['fedor','nieva'],text:`페도르의 은신처. 그가 두 가지 제안을 늘어놓는다.

"그림자 길드의 수장, '회색 손' 코렌이 돈을 대주겠다고 하오. 대가로 그의 전쟁을 도와야 하지. 요즘 도시에 흡혈귀 무리가 들어와서 길드와 전쟁 중이거든."

그날 밤, 여관 창밖에 은백색 머리카락의 창백한 여인이 나타난다. 붉은 눈, 입술 사이로 비치는 송곳니. "나는 니에바. 길드보다 더 빨리, 더 많이 주지. 대신 내 편에 서."

어느 쪽이든 먼저 돈을 모아야 한다. 도시에는 일거리가 넘친다.`,
 choices:[{t:'그림자 길드와 손을 잡는다',not:['side'],set:{side:1,thieves:1},go:'b2_jobs'},{t:'창백한 여인 니에바와 손을 잡는다',not:['side'],set:{side:1,vamp:1},go:'b2_jobs'}]},
b2_jobs:{title:'애스카틀라',text:f=>`금화 2만 닢. 큰돈이다. 도시 곳곳에서 일거리를 모은다.${(f.job_circus?1:0)+(f.job_pit?1:0)+(f.job_keep?1:0)>=2?'\n\n<b>충분한 돈이 모였다!</b>':''}`,
 choices:[
  {t:'와우킨 광장 시장에서 장비를 산다',go:'b2_market'},
  {t:'와우킨 광장의 이상한 서커스 천막 조사',not:['job_circus'],go:'b2_circus'},
  {t:'구리 왕관 주점 지하의 노예 투기장 소탕',not:['job_pit'],go:'b2_pit'},
  {t:'괴물에게 점령당한 로셀 가문의 성 탈환',not:['job_keep'],go:'b2_keep'},
  {t:'모은 돈을 들고 결판을 지으러 간다',req:['job_circus','job_pit'],go:'b2_war'},
  {t:'모은 돈을 들고 결판을 지으러 간다',req:['job_circus','job_keep'],not:['job_pit'],go:'b2_war'},
  {t:'모은 돈을 들고 결판을 지으러 간다',req:['job_pit','job_keep'],not:['job_circus'],go:'b2_war'}]},
b2_market:{title:'와우킨 광장 시장',shop:'b2_market',text:`세상의 온갖 물건이 모이는 앰의 시장. 마법 물품 상인이 당신을 보고 잠시 멈칫하더니, 이내 장사꾼의 미소를 짓는다.`,choices:[{t:'시장을 나선다',go:'b2_jobs'}]},
b2_circus:{title:'와우킨 광장',text:`광장 한복판의 서커스 천막. 들어가자마자 세상이 일그러진다. 관객은 인형이 되고, 광대들은 이빨을 드러낸다. 환영이다.

천막 깊은 곳에서 무언가 유리를 두드리는 소리가 들린다. 똑, 똑, 똑. 누군가 말 대신 신호를 보내고 있다.`,
 choices:[{t:'환영의 틈을 찾는다',check:{skill:'비전',dc:15,ok:'b2_circus_boss',fail:'b2_circus_fight'}},{t:'환영 따위 베어버린다',go:'b2_circus_fight'}]},
b2_circus_fight:{title:'뒤틀린 서커스',text:`광대 인형들이 칼날 같은 손가락을 세우고 달려든다!`,combat:{enemies:[mob('환영 광대',8,{n:3})],win:'b2_circus_boss'}},
b2_circus_boss:{title:'서커스 무대',who:['pipit'],text:`무대 위의 붉은 곱슬머리 노움, 환술사 피피트가 지팡이를 휘두른다. 그의 허리춤에서 작은 유리병이 반짝인다. 병 안에서 가느다란 빛줄기가 맴돈다.

"다들 내 쇼가 시시하다고 했지! 그래서 세상에서 제일 아름다운 목소리를 훔쳤다! 이제 내 쇼엔 노래가 있다고!"

무대 옆 새장에, 청록색 머리를 틀어 올린 노움 소녀가 갇혀 있다. 그녀가 입을 열어도 아무 소리가 나지 않는다. 대신 허공에 흐릿한 빛 글씨가 떠오른다. <i>도와줘요.</i>`,combat:{enemies:[elite('환술사 피피트',8,{ac:13}),mob('환영 분신',8,{hp:14,n:2})],win:'b2_aerie'}},
b2_aerie:{title:'와우킨 광장',who:['win'],onEnter:{set:{job_circus:1},join:'win',gold:250,loot:'u_kalah'},text:`피피트가 쓰러지며 유리병이 바닥에 떨어져 깨진다. 빛줄기가 새장 속 소녀에게 날아가 목 언저리로 스며든다.

소녀가 입을 연다. 아주 작은, 쉰 소리가 나온다. "…고, 마…" 그리고 다시 소리가 끊긴다. 그녀가 눈물을 닦으며 허공에 빛 글씨를 쓴다.

<i>윈이에요. 목소리가 조금씩 돌아오는 것 같아요. 환술은 그 사람한테 배웠어요. 제자였거든요. 따라가도 될까요? 빛으로 싸울 줄 알아요.</i>

광장 상인들이 사례금을 들고 몰려온다. 피피트의 망토가 무대 위에 떨어져 있다.`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
b2_pit:{title:'구리 왕관 주점',who:['osric'],text:`싸구려 술과 비명이 뒤섞인 주점. 지하 투기장에서는 노예들이 짐승과 싸우고, 귀족들이 돈을 건다.

주점 구석에서 회색 수염의 노인이 물잔을 내려놓는다. 술잔이 아니다. 얼굴에 오래된 칼자국, 낡았지만 손질 잘 된 갑옷.

"오스릭이오. 이 도시 경비대장이었지. 십 년 동안 이 투기장을 알면서도 눈감았소. 뇌물을 받았거든." 그가 물잔을 든다. "술을 끊은 지 삼 년. 이제 빚을 갚으러 왔소. 혼자서는 버겁군. 함께하겠소?"`,
 choices:[{t:'오스릭과 함께 투기장으로 쳐들어간다',join:'osric',go:'b2_pit_fight'},{t:'우리끼리 간다',go:'b2_pit_fight'}]},
b2_pit_fight:{title:'노예 투기장',text:`투기장 감독관 그로브가 노예 검투사들의 쇠사슬을 풀며 웃는다. "새 손님이군! 오늘 쇼의 주인공이 되어주시오!"

코르바가 모래 바닥을 밟고 선다. 열두 해 동안 밟았던 그 모래와 같은 냄새다.`,combat:{enemies:[elite('투기장 감독관 그로브',8),mob('노예 사냥꾼',8,{n:2})],win:'b2_pit_win'}},
b2_pit_win:{title:'노예 투기장',onEnter:{set:{job_pit:1},gold:250},text:`쇠사슬이 끊어지고, 노예들이 햇빛 속으로 나간다. 감독관의 금고는 꽤 두둑했다.

오스릭이 텅 빈 투기장을 오래 바라본다. "…십 년 늦었군. 그래도, 늦은 게 안 하는 것보단 낫겠지."`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
b2_keep:{title:'로셀 가문의 성',who:['idel'],text:`도시 북쪽 귀족 가문의 성채. 성주의 딸 이델 로셀이 애원한다. "트롤과 이상한 괴물들이 성을 점령했어요. 아버지가 아직 안에 계세요!"

트롤은 불이나 산으로 태워야 완전히 죽는다.`,
 choices:[{t:'하인용 통로로 몰래 들어간다',check:{skill:'은신',dc:14,ok:'b2_keep_boss',fail:'b2_keep_fight'}},{t:'성문을 부수고 들어간다',go:'b2_keep_fight'}]},
b2_keep_fight:{title:'로셀 가문의 성',text:`홀에 트롤들이 득실거린다. 잘린 팔이 다시 자라는 놈들이다!`,combat:{enemies:[mob('트롤',8,{hp:32,n:2})],win:'b2_keep_boss'}},
b2_keep_boss:{title:'로셀 성 지하',text:`지하실, 트롤들을 부리던 존재가 몸을 일으킨다. 거대한 갑각 괴물, 엄버 헐크다. 놈의 눈을 보면 정신이 흐려진다.`,combat:{enemies:[boss('엄버 헐크',8,{hp:90,attacks:1})],win:'b2_keep_win'}},
b2_keep_win:{title:'로셀 가문의 성',who:['idel'],onEnter:{set:{job_keep:1},gold:250,loot:'u_hulk'},text:`성주를 구출하자 이델이 눈물을 흘리며 감사한다. 성주는 큰 사례금을 내놓는다. "가문의 은인이오." 대장장이가 엄버 헐크의 갑각으로 방패를 만들어 준다.`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
b2_war:{title:'묘지 구역',who:['coren'],text:f=>f.thieves?`회색 손 코렌이 지도를 펼친다. 손등까지 잿빛으로 물들인 장갑을 낀 남자다. "니에바의 은신처는 묘지 구역 지하다. 놈을 쳐주면 약속대로 배편을 대주지."

밤의 묘지. 납골당 문을 열자 냉기가 쏟아져 나온다. 흡혈귀 하수인들이 붉은 눈을 번뜩인다.`:`니에바가 미소 짓는다. "회색 손 코렌의 본부를 쳐. 그럼 배를 대주지."

하지만 길드 본부를 습격한 순간, 니에바의 하수인들이 등 뒤에서 덮친다. "주인님이 그러시더군. 쓸모가 다했다고."`,
 combat:{enemies:[elite('흡혈귀 하수인',8,{n:2}),mob('구울',8)],win:'b2_war_win'}},
b2_war_win:{title:'묘지 구역',who:['nieva'],text:f=>`어둠 속에서 니에바가 웃는다. 붉은 눈, 은백색 머리카락, 그리고 이스카르와 똑같이 차가운 표정.

"오라버니가 말한 대로구나. 재미있는 장난감이야." <b>오라버니</b>. 그녀는 이스카르의 누이였다.

"스펠홀드에서 기다릴게. 오라버니가 너를 아주 보고 싶어 하거든." 그녀는 박쥐 떼가 되어 흩어진다.${f.vamp?'\n\n배신당했지만, 뜻밖에도 회색 손 코렌의 사람들이 다가온다. "적의 적은 친구지. 배는 우리가 대주겠소."':'\n\n코렌이 약속을 지킨다. 밀수꾼 바스코 선장의 배가 항구에서 기다린다.'}`,
 choices:[{t:'출항 준비를 한다',go:'b2_c2_end'}]},
b2_c2_end:{title:'2장 끝',chapterEnd:true,who:['vasco'],text:`안대를 한 밀수꾼 선장 바스코의 배가 어둠 속에서 닻을 올린다. "스펠홀드? 미친 짓이군. 마음에 들어."

목적지는 해적의 섬 브린로. 그리고 그 섬 절벽 위의 정신병원, 스펠홀드.

뱃전에서 윈이 하늘에 작은 빛 글씨를 띄운다. <i>티오 만나면 무슨 말 할 거예요?</i> 이세는 이상하게 말이 없다. 코르바가 갑판에서 생선을 손질하며 중얼거린다. "그 꼬맹이, 내 스튜 맛없다고 한 거 사과받아야지."`}
,
/* ---------- 3장: 스펠홀드와 언더다크 (Lv9) ---------- */
b2_c3:{title:'브린로 섬',who:['vasco'],text:`해적과 밀수꾼의 섬 브린로. 절벽 위 회색 성채가 스펠홀드다. 정문은 굳게 닫혀 있다.

바스코가 계획을 속삭인다. "가장 확실한 방법은… 환자로 들어가는 거요. 내가 당신을 미친 마법사라고 신고하겠소. 연기는 자신 있지?"`,
 choices:[{t:'환자로 위장해 들어간다',go:'b2_asylum'},{t:'해적 영주를 협박해 방문 허가증을 받는다',check:{skill:'위협',dc:15,ok:'b2_asylum',fail:'b2_pirates'}}]},
b2_pirates:{title:'해적 영주의 저택',text:`해적 영주가 코웃음 친다. "협박? 내 섬에서?" 해적들이 칼을 뽑는다.`,combat:{enemies:[mob('해적',9,{n:3})],win:'b2_asylum'}},
b2_asylum:{title:'스펠홀드',who:['iskar'],text:`병원 안은 기묘하게 고요하다. 환자들이 허공을 보며 중얼거린다. 복도 끝에서 원장이 당신을 맞는다.

…은빛 가면. 이스카르다. 그는 처음부터 이곳의 주인이었다.

"어서 오너라. 기다리고 있었다. 네 친구 티오도 함께지. 너희 둘에겐 같은 피가 흐른다는 걸 알고 있었나? 그 아이의 손에서 터진 붉은 빛, 그게 바로 증거지."

티오도… 바알의 자식이었다.`,
 choices:[{t:'달려든다',req:['has:ise'],set:{yoshi:1},leave:'ise',go:'b2_betray_y'},{t:'달려든다',not:['has:ise'],go:'b2_betray_n'}]},
b2_betray_y:{title:'스펠홀드',who:['ise'],text:`당신이 움직이려는 순간, 이세가 당신의 팔을 붙잡는다. 늘 웃던 그녀의 눈이 텅 비어 있다.

"미안해… 정말 미안해. 은가면이 내게 맹약의 저주를 걸었어. 거역하면 내 심장이 멎는대. 처음부터… 너희를 여기로 데려오는 게 내 일이었어."

이세가 칼을 뽑는다. 칼끝이 떨린다.`,combat:{enemies:[elite('맹약에 묶인 이세',9,{ac:16,dmg:'1d8+7'})],win:'b2_soul'}},
b2_betray_n:{title:'스펠홀드',text:`이스카르가 손가락을 튕기자 간수들이 사방에서 달려든다.`,combat:{enemies:[mob('스펠홀드 간수',9,{n:2})],win:'b2_soul'}},
b2_soul:{title:'의식의 방',who:['iskar','tio'],text:f=>`${f.yoshi?'이세는 쓰러지며 웃는다. 처음 만났을 때처럼. "…고마워. 이제야 내 심장이 내 거네."\n\n':''}이스카르의 마법이 당신을 제단에 묶는다. 옆 제단엔 티오가 누워 있다. 금 간 고글 대신, 그의 눈이 텅 비어 있다.

"너희 안의 신성한 정수, 바알의 힘. 그걸 내가 가져가겠다. 동족이 내게서 빼앗은 영원한 생명을 되찾기 위해서." 그의 손이 당신 가슴 위에 놓인다.

무언가가 뜯겨나간다. 영혼의 일부가. 비명조차 나오지 않는다.

눈을 떴을 때 이스카르는 사라졌고, 당신은 텅 빈 껍데기처럼 차갑다. 티오도 마찬가지다.`,
 choices:[{t:'티오를 일으킨다',go:'b2_dream'}]},
b2_dream:{title:'악몽',who:['tio'],onEnter:{join:'tio'},text:`그날 밤 꿈속. 당신은 거울 앞에 서 있다. 거울 속 당신은 뿔과 발톱이 돋은 괴물, <b>학살자</b>다. 바알의 피가 빚어낸 모습.

<i>"그 엘프가 네 영혼을 가져갔지. 빈자리엔 내가 들어왔다. 날 받아들여라. 그러면 아무도 너를 막지 못해."</i>

깨어나니 식은땀이 흐른다. 티오가 당신을 보고 있다. 그가 당신 손에 들린 자기 고글을 보고 희미하게 웃는다. "…그거 갖고 있었구나. 너도 그 꿈 꿨지?"`,
 choices:[{t:'고글을 돌려주며 "함께 빠져나가자."',go:'b2_trials'}]},
b2_trials:{title:'스펠홀드 지하 미궁',text:`이스카르는 섬 지하의 시험 미궁을 지나 도망쳤다. 미궁 입구 석판에 글이 새겨져 있다.

<i>"진실을 아는 자만 지나가리라. 문은 둘. 하나는 거짓만 말하는 수호자가, 하나는 진실만 말하는 수호자가 지킨다."</i>

두 석상이 동시에 입을 연다. "내 문이 출구다."`,
 choices:[{t:'석상 하나에게 "저쪽 석상은 어느 문을 출구라 하겠나?" 묻는다',check:{skill:'조사',dc:14,ok:'b2_trial2',fail:'b2_trial_fail'}},{t:'느낌대로 왼쪽 문을 연다',go:'b2_trial_fail'}]},
b2_trial_fail:{title:'미궁',onEnter:{dmg:'3d8'},text:`문을 연 순간 화염이 쏟아진다! 연기 속에서 반대편 문이 열린다.`,choices:[{t:'반대편 문으로',go:'b2_trial2'}]},
b2_trial2:{title:'미궁 최심부',who:['iskar'],text:`미궁 끝, 이스카르가 차원문 앞에 서 있다. 그의 몸에서 당신의 영혼 빛이 넘실거린다.

"끈질기군. 하지만 네 힘은 이제 내 것이다." 그가 손을 휘두르자 간수들이 일어선다.`,
 choices:[{t:'숨을 고르고 싸운다',sub:'짧은 휴식 후 전투',not:['r_sh'],set:{r_sh:1},rest:1,go:'b2_irenicus1'},{t:'곧장 싸운다',go:'b2_irenicus1'}]},
b2_irenicus1:{title:'미궁 최심부',who:['iskar'],text:`"맛보거라, 네 아버지의 힘을!"`,combat:{enemies:[boss('이스카르',9,{hp:110,ac:15}),mob('스펠홀드 간수',9,{hp:28})],win:'b2_underdark'}},
b2_underdark:{title:'언더다크',text:`이스카르는 쓰러지기 직전 차원문으로 몸을 던진다. 그를 쫓아 뛰어든 곳은… 끝없는 어둠의 지하 세계, 언더다크였다.

버섯이 빛나는 동굴. 그곳에서 거대한 은빛 용이 당신을 내려다본다.

"나는 아르겐티아. 드로우들이 내 알을 훔쳐갔다. 알을 되찾아준다면 너희를 지상으로 보내주마. 내 마법으로 너희를 드로우의 모습으로 바꿔주겠다. 그래야 그들의 도시 우스트 나사에 들어갈 수 있을 테니."`,
 choices:[{t:'드로우로 변장하고 우스트 나사로 간다',go:'b2_ustnatha'}]},
b2_ustnatha:{title:'우스트 나사',who:['zilla'],text:`거미줄 모양의 탑들, 보랏빛 마법등. 드로우 도시는 아름답고 잔혹하다.

알을 숨긴 곳은 여사제 질라의 신전. 은발에 붉은 눈, 이마에 핏빛 보석을 단 그녀가 당신을 새로 온 용병인 줄 안다. "마침 잘 왔다. 날 위해 일해라."`,
 choices:[{t:'질라를 속이고 신전 깊숙이 들어간다',check:{skill:'기만',dc:15,ok:'b2_eggs',fail:'b2_drow_fight'}},{t:'경비가 바뀌는 틈에 몰래 들어간다',check:{skill:'은신',dc:15,ok:'b2_eggs',fail:'b2_drow_fight'}}]},
b2_drow_fight:{title:'우스트 나사 신전',who:['zilla'],text:`"가짜다! 지상인이다!" 드로우 전사들이 독 묻은 칼날을 뽑는다.`,combat:{enemies:[mob('드로우 전사',9,{n:2}),elite('여사제 질라',9,{ac:15})],win:'b2_eggs'}},
b2_eggs:{title:'신전 금고',text:`은빛으로 빛나는 용의 알 두 개. 조심스럽게 감싸 들고 도시를 빠져나온다.

아르겐티아가 알을 품고 깊은 숨을 내쉰다. "약속을 지켰구나. 이제 내 차례다." 은빛 바람이 일행을 감싸 위로, 위로 올린다.`,
 choices:[{t:'지상으로',go:'b2_c3_end'}]},
b2_c3_end:{title:'3장 끝',chapterEnd:true,who:['tariel'],text:`햇빛이 눈을 찌른다. 숲속, 엘프 수비대가 활을 겨눈 채 당신을 둘러싼다.

"지상으로 올라온 자들이군. 이스카르를 쫓는다고?" 갈색 머리를 묶은 수비대장 타리엘이 활을 내린다. "그자는 우리 엘프들의 숨겨진 도시 술다네셀라르를 노리고 있다. 그 도시의 '생명의 나무'를 삼키면 그는 신이 된다."

영혼을 잃은 몸이 시리다. 하지만 티오가 곁에 있다. 고글을 다시 쓴 채로. "이번엔 우리가 쫓아가는 거야."`}
,
/* ---------- 4장: 생명의 나무 (Lv10) ---------- */
b2_c4:{title:'엘프 숲',who:['tariel'],text:`타리엘이 설명한다. "술다네셀라르는 마법으로 숨겨져 있다. 길을 여는 유일한 열쇠는 '린 란턴'. 그런데 그 란턴을… 니에바가 훔쳐갔다."

니에바. 이스카르의 누이, 흡혈귀. 그녀의 둥지는 애스카틀라 묘지 지하다.`,
 choices:[{t:'엘프 장인의 노점에 들른다',go:'b2_elfshop'},{t:'애스카틀라로 돌아간다',go:'b2_bodhi'}]},
b2_elfshop:{title:'엘프 장인의 노점',shop:'b2_elf',text:`피난 중인 엘프 장인이 귀한 물건들을 펼쳐 보인다. "술다네셀라르를 구해주신다면, 이것들도 제 몫을 하겠지요."`,choices:[{t:'노점을 나선다',go:'b2_c4'}]},
b2_bodhi:{title:'니에바의 둥지',who:['nieva'],text:`지하 무덤 가장 깊은 곳. 관들이 줄지어 열려 있고, 니에바가 왕좌에 걸터앉아 있다.

"돌아왔구나, 영혼 없는 아이야. 그 텅 빈 눈이 마음에 들어."

천장의 틈으로 한 줄기 햇빛이 새어 든다. 흡혈귀가 가장 두려워하는 것.`,
 choices:[{t:'천장 틈을 넓혀 햇빛을 쏟아붓는다',check:{skill:'운동',dc:16,ok:'b2_bodhi_sun',fail:'b2_bodhi_fight'}},{t:'성스러운 기도로 빛을 부른다',req:['class:cleric'],go:'b2_bodhi_sun'},{t:'윈에게 빛의 환영을 부탁한다',req:['party:win'],go:'b2_bodhi_sun'},{t:'정면으로 맞선다',go:'b2_bodhi_fight'}]},
b2_bodhi_sun:{title:'니에바의 둥지',who:['nieva'],text:`빛이 무덤 안을 가르자 흡혈귀들이 비명을 지르며 타들어 간다. 니에바가 그림자 속으로 물러나며 이를 드러낸다.`,combat:{enemies:[boss('니에바',10,{hp:85,ac:16,attacks:1})],win:'b2_lanthorn'}},
b2_bodhi_fight:{title:'니에바의 둥지',who:['nieva'],text:`니에바가 손짓하자 관에서 흡혈귀들이 일어난다. "내 아이들아, 저녁 식사 시간이다."`,combat:{enemies:[boss('니에바',10,{hp:110,ac:16}),mob('흡혈귀',10,{hp:30})],win:'b2_lanthorn'}},
b2_lanthorn:{title:'니에바의 둥지',onEnter:{item:'린 란턴',loot:'u_bodhi'},text:`니에바의 몸이 재가 되어 무너진다. 그녀가 쥐고 있던 은빛 등불, 린 란턴이 바닥을 굴러 당신 발치에 멈춘다.

브렌나가 등불을 비춘다. 빛 속에 숲의 길이 떠오른다. "가자. 엘프들이 버티고 있을 때."`,choices:[{t:'술다네셀라르로',go:'b2_city'}]},
b2_city:{title:'술다네셀라르',text:`나무 위에 지어진 엘프의 도시는 불타고 있다. 이스카르가 부른 락샤사들과 골렘들이 거리를 휩쓴다.

엘프 병사가 쓰러지며 외친다. "여왕 시르딘님이… 사원에 붙잡혀 계십니다! 그자는 생명의 나무로 가고 있어요!"`,
 choices:[{t:'불타는 다리를 뛰어넘어 지름길로 간다',check:{skill:'곡예',dc:14,ok:'b2_temple',fail:'b2_city_fight'}},{t:'거리의 락샤사들을 쓸어버린다',go:'b2_city_fight'}]},
b2_city_fight:{title:'불타는 거리',text:`호랑이 머리의 락샤사들이 손을 거꾸로 뒤집으며 웃는다. "엘프의 도시에 손님이라니."`,combat:{enemies:[elite('락샤사',10,{n:2})],win:'b2_temple'}},
b2_temple:{title:'라일리파네 사원',who:['sirdin'],text:`사원 안에서 금빛 머리의 엘프 여왕 시르딘이 마법 사슬에 묶여 있다. 그녀가 당신을 보고 슬프게 웃는다.

"이스카르, 아니 '아엘란'은 원래 우리 백성이었다. 그는… 내가 사랑했던 사람이었지. 영원을 탐하다 추방당했고, 우리는 그의 얼굴에 낙인을 찍었다. 그가 가면을 쓰는 이유다. 이제 이렇게 돌아왔구나."

그녀가 숨을 고른다. "생명의 나무에서 그를 막아다오. 그리고 네 영혼도 되찾아라. 그의 몸 안에 아직 남아 있으니."`,
 choices:[{t:'사슬을 풀고 여왕의 축복을 받는다',loot:'u_ellesime',heal:'full',potions:2,set:{blessed:1},go:'b2_tree'}]},
b2_tree:{title:'생명의 나무',who:['iskar'],text:`하늘에 닿을 듯한 거목. 그 뿌리에서 이스카르가 나무의 생명력을 들이켜고 있다. 그의 몸이 빛나고, 나무는 시들어간다. 은빛 가면에 금이 가 있다.

그가 돌아선다. "영혼 없는 껍데기가 여기까지 오다니. 감탄스럽군."

가슴 깊은 곳에서 학살자의 목소리가 속삭인다. <i>날 써라. 저놈을 찢어버려라.</i>`,
 choices:[{t:'학살자의 힘을 받아들인다',sub:'강력하지만 대가가 있다',set:{slayer:1},heal:'full',go:'b2_final_slayer'},{t:'내 힘으로, 동료들과 함께 싸운다',go:'b2_final'}]},
b2_final_slayer:{title:'생명의 나무',who:['iskar'],onEnter:{dmg:'2d6'},text:`뼈가 비틀리고 발톱이 돋는다. 학살자의 형상으로 이스카르에게 달려든다! 분노가 고통을 삼킨다. 하지만 동료들이 두려운 눈으로 당신을 본다.`,combat:{enemies:[boss('이스카르',10,{hp:120,ac:16})],win:'b2_end'}},
b2_final:{title:'생명의 나무',who:['iskar'],text:`동료들이 당신 곁에 선다. 코르바가 외친다. "영혼은 빼앗겨도 밥 같이 먹은 정은 못 빼앗는다!"`,combat:{enemies:[boss('이스카르',10,{hp:140,ac:16}),mob('복제인간 수호자',10,{hp:30})],win:'b2_end'}},
b2_end:{title:'에필로그',ending:'win',who:['sirdin'],text:f=>`이스카르가 무릎을 꿇는다. 금 간 은빛 가면이 둘로 쪼개져 떨어진다. 그 아래, 낙인이 새겨진 얼굴이 드러난다. 생각보다 젊고, 생각보다 슬픈 얼굴이다.

그의 몸에서 빛이 빠져나와 당신과 티오에게 돌아온다. 따뜻하다. 오래 잊고 있던 온기다.

그는 마지막으로 시르딘의 이름을 부르고, 어둠 속으로 끌려가듯 사라진다. 그가 계약한 지옥의 대가를 치르러.

생명의 나무가 다시 푸르게 빛난다. 시르딘 여왕이 엘프들 앞에서 당신의 이름을 부른다.${f.slayer?'\n\n하지만 학살자의 흔적은 쉽게 지워지지 않는다. 그날 이후로 당신은 가끔 손끝이 검게 변하는 꿈을 꾼다.':''}

모닥불 가에서 티오가 당신 어깨에 기댄다. "있잖아. 우리 둘 다 그 피를 갖고 있잖아. 근데 이번엔 우리가 이겼어." 윈이 작은 목소리로, 처음으로 소리 내어 말한다. "…이겼어요."

멀리서, 아직 남은 바알의 자식들이 당신을 향해 눈을 뜬다. 하지만 그건 또 다른 이야기다.

<b>— 발더스 게이트 2 완료 —</b>`}
}});

/* ===== BG2 확장: 사이드 퀘스트 + 야영지 대화 (오리지널 인물) ===== */
addNodes('bg2',{
/* 1장 · 라스와의 작별 */
b2_ras:{title:'감옥 복도',scene:'lab',who:['brenna'],text:`브렌나가 라스의 철창 앞에 무릎을 꿇는다. 자물쇠는 당신이 연다. 그녀는 한참 동안 아무 말도 하지 않는다.

그러다 라스의 땋은 수염에서 은 구슬 하나를 조심스럽게 풀어낸다. 드워프 전사가 첫 전투에서 받는 구슬이다.

"이 녀석, 첫 전투에서 무서워서 노래를 불렀지. 너무 크게 불러서 적들이 도망갔어. 그래서 이 구슬을 받았다." 그녀가 웃는다. 처음으로, 울면서.

"드워프는 죽은 자를 돌 아래 묻는다. 여기엔 돌이 많군." 그녀가 일어선다. "노래는 내가 못 하니… 네가 해 줄 수 있겠나?"`,
 choices:[{t:'라스가 부르던 행진곡을 부른다',bond:{brenna:1},set:{ras_farewell:1},go:'b2_ras2'},{t:'조용히 곁에 서 있는다',bond:{brenna:1},set:{ras_farewell:1},go:'b2_ras2'}]},
b2_ras2:{title:'감옥 복도',scene:'lab',who:['brenna'],onEnter:{heal:'2d8'},text:`돌을 하나씩 쌓아 작은 무덤을 만든다. 코르바가 가장 큰 돌을 올리고, 마지막 돌은 브렌나가 올린다.

브렌나가 은 구슬을 자기 땋은 머리에 엮는다. "이제 이 녀석은 나랑 같이 간다." 그녀가 안경을 다시 쓴다. 눈빛이 단단해졌다. "가자. 그 은가면에게 차 한 잔 대접해야겠다. 아주 쓴 걸로."`,choices:[{t:'정원으로 돌아간다',go:'b2_dryad'}]},
/* 2장 · 코르바의 마지막 경기 */
b2_arena:{title:'애스카틀라 대투기장',scene:'dungeon',who:['korva'],text:`코르바가 거리의 포스터 앞에서 걸음을 멈춘다. <i>"오늘 밤! 무패의 신예 '붉은 송곳니' 대 누구든!"</i> 포스터 속 신예는 앳된 하프오크 소년이다. 목에 노예 표식이 보인다.

"…칼비아 투기장 주인이 이 도시로 옮겨왔군. 저 아이, 열두 살 때의 나랑 똑같다." 코르바가 주먹을 쥔다. "주인 놈과 거래할 거다. 내가 이기면 저 아이를 풀어주는 조건으로."

투기장 주인이 코르바를 알아보고 웃는다. "전설의 코르바! 은퇴했다더니 배가 고팠나? 좋아. 네가 이기면 꼬맹이는 자유다. 지면… 네가 다시 내 거다."`,
 choices:[{t:'코르바와 함께 경기장에 선다',go:'b2_arena_fight'},{t:'"그 아이를 사겠다"며 협상한다',check:{skill:'설득',dc:16,ok:'b2_arena_buy',fail:'b2_arena_fight'}}]},
b2_arena_buy:{title:'애스카틀라 대투기장',scene:'dungeon',who:['korva'],onEnter:{gold:-150},text:`주인이 탐욕스럽게 금화를 센다. "좋아, 좋아. 장사는 장사지." 코르바가 소년의 족쇄를 직접 풀어준다.

하지만 그녀의 얼굴이 썩 개운하지 않다. "…돈으로 사람을 사는 건, 결국 저놈들 방식이다." 그녀가 소년의 머리를 쓰다듬는다. "그래도 넌 자유다. 그게 먼저다."`,choices:[{t:'일거리 목록으로',go:'b2_arena_end'}]},
b2_arena_fight:{title:'투기장 모래 위',scene:'dungeon',who:['korva'],text:`관중의 함성. 모래 냄새. 코르바가 눈을 감았다 뜬다. "열두 해 동안 이 소리가 싫었다. 오늘은… 나쁘지 않군."

주인이 약속을 어기고 철창을 연다. 소년 대신 투기장의 짐승 조련사들과 굶주린 맹수가 쏟아져 나온다!`,combat:{enemies:[elite('투기장 맹수',8,{hp:50}),mob('짐승 조련사',8,{n:2})],win:'b2_arena_win'}},
b2_arena_win:{title:'투기장 모래 위',scene:'dungeon',who:['korva'],onEnter:{gold:150,bond:{korva:1},loot:'t_ogre'},text:`관중이 일어나 함성을 지른다. 코르바의 이름을, 그리고 처음 듣는 당신의 이름을. 주인은 도망치고, 코르바가 소년의 족쇄를 직접 끊는다.

소년이 묻는다. "누나가… 그 코르바예요? 전설의?"

"전설은 무슨. 지금은 요리사다." 코르바가 자기 건틀릿을 벗어 소년에게 주려다, 생각을 바꿔 당신에게 내민다. "이건 네가 써라. 저 녀석은 이제 주먹 쓸 일 없이 살 테니까. …내 스튜 맛 볼래, 꼬맹이?"`,choices:[{t:'일거리 목록으로',go:'b2_arena_end'}]},
b2_arena_end:{title:'애스카틀라',scene:'city',onEnter:{set:{arena:1}},text:`소년은 코르바가 소개한 여관 주방에서 일하기로 했다. 코르바는 그날 밤 한마디도 하지 않았지만, 계속 흥얼거렸다.`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
/* 3장 · 깊은 노움의 마을 */
b2_gnomes:{title:'언더다크 깊은 노움 마을',scene:'underdark',who:['win'],text:`버섯 숲 사이로 가늘게 떨리는 목소리가 들린다. 회색 피부의 작은 노움 정찰병이 다리를 다친 채 숨어 있다. 깊은 노움, 스버프네블린이다.

윈이 그 앞에 쪼그려 앉아 허공에 빛 글씨를 쓴다. 노움 고어다. 정찰병의 눈이 커진다.

윈이 당신에게 통역한다. <i>마을이 드로우 노예 사냥꾼들에게 포위당했대요. 아이들이 잡혀갈 거래요. 도와줄 수 있어요?</i>`,
 choices:[{t:'마을을 구하러 간다',go:'b2_gnome_fight'},{t:'갈 길이 급하다',go:'b2_underdark'}]},
b2_gnome_fight:{title:'깊은 노움 마을',scene:'underdark',text:`돌로 만든 작은 마을 입구, 드로우 노예 사냥꾼들이 쇠사슬을 흔들며 웃고 있다. "작은 쥐들아, 나와라. 우스트 나사의 광산이 너희를 기다린다."`,combat:{enemies:[mob('드로우 노예 사냥꾼',9,{n:3})],win:'b2_gnome_win'}},
b2_gnome_win:{title:'깊은 노움 마을',scene:'underdark',who:['win'],onEnter:{set:{gnome_help:1},potions:2,bond:{win:1}},text:`노움들이 숨어 있던 바위틈에서 하나둘 나온다. 장로가 윈의 손을 잡고 오래 말한다.

윈이 빛 글씨를 띄운다. 글씨가 떨린다. <i>저보고 '먼 땅의 사촌'이래요. 노움들은 다 가족이래요. 저 서커스에서… 가족 같은 거 없는 줄 알았는데.</i>

장로가 버섯 물약 두 병과 함께 비밀을 알려준다. "우스트 나사 신전 아래로 우리 광부들이 판 굴이 있소. 드로우들은 모르지."`,choices:[{t:'길을 떠난다',go:'b2_underdark'}]},
b2_gnome_tunnel:{title:'노움의 비밀 굴',scene:'cave',text:`깊은 노움들이 알려준 좁은 굴을 기어간다. 코르바가 세 번 머리를 박는다. 마침내 신전 금고 바로 아래, 바닥 돌이 들리는 곳에 닿는다.`,choices:[{t:'금고로 올라간다',go:'b2_eggs'}]},
/* 4장 · 불타는 도시의 아이들 */
b2_kids:{title:'불타는 거리',scene:'elfcity',text:f=>`불붙은 나무 집 안에서 아이들 울음소리가 들린다. 무너진 들보가 문을 막고 있다. 엘프 어머니가 맨손으로 들보를 들어 올리려다 손이 데어 있다.${has('osric')?'\n\n오스릭이 갑옷 장갑을 고쳐 끼며 앞으로 나선다. "경비대장 시절에 이런 불은 많이 봤소. 나 혼자 들 순 없지만."':''}`,
 choices:[{t:'함께 들보를 들어 올린다',check:{skill:'운동',dc:14,ok:'b2_kids_ok',fail:'b2_kids_hurt'}},{t:'창문으로 기어 들어간다',check:{skill:'곡예',dc:14,ok:'b2_kids_ok',fail:'b2_kids_hurt'}}]},
b2_kids_hurt:{title:'불타는 거리',scene:'elfcity',onEnter:{dmg:'3d6'},text:`불길이 팔을 핥는다! 이를 악물고 버틴다. 동료들이 함께 밀어붙여 마침내 길이 열린다.`,choices:[{t:'아이들을 안고 나온다',go:'b2_kids_ok'}]},
b2_kids_ok:{title:'불타는 거리',scene:'elfcity',onEnter:{set:{kids:1},loot:'gpotion'},text:f=>`연기 속에서 엘프 아이 셋을 안고 나온다. 어머니가 아이들을 끌어안고 무너지듯 운다. 그녀가 품에 지니고 있던 귀한 치유 물약을 억지로 쥐여준다.${has('osric')?'\n\n오스릭이 숨을 몰아쉬며 그을린 수염을 턴다. "…십 년 전에도 이렇게 했어야 했는데." 그의 목소리가 처음으로 가볍다.':''}`,choices:[{t:'사원으로 서두른다',go:'b2_temple'}]}
});
link('b2_dryad',{t:'브렌나와 함께 라스를 수습한다',sub:'동료 이야기',req:['has:brenna'],not:['ras_farewell'],go:'b2_ras'},'first');
link('b2_jobs',{t:'코르바가 투기장 포스터 앞에서 멈춰 섰다',sub:'동료 이야기',req:['has:korva'],not:['arena'],go:'b2_arena'},1);
link('b2_underdark',{t:'버섯 숲에서 들리는 작은 목소리를 따라간다',sub:'사이드 퀘스트',not:['gnome_seen'],set:{gnome_seen:1},go:'b2_gnomes'},'first');
link('b2_ustnatha',{t:'깊은 노움의 비밀 굴로 숨어든다',req:['gnome_help'],go:'b2_gnome_tunnel'},'first');
link('b2_city',{t:'불길에 갇힌 엘프 아이들을 구한다',sub:'사이드 퀘스트',not:['kids'],go:'b2_kids'},'first');

talks('bg2',{
 0:{korva:`코르바가 감옥에서 지켜낸 요리책을 펼친다. 책장 사이에 마른 꽃잎이 끼워져 있다.

"간수한테 레시피 하나 알려주고 이 책을 지켰다고 했지? 사실 그놈한테 알려준 건 내 최악의 스튜였다. 지금쯤 배탈 났을 거다." 그녀가 처음으로 소리 내어 웃는다.

그러다 진지해진다. "라스는… 내 스튜를 맛있다고 한 유일한 녀석이었다. 거짓말인 거 알았지만. 그래도 좋았다."`,
  brenna:`브렌나는 차를 끓이지 않는다. 처음이다. 그냥 빈 찻잔을 손에 쥐고 있다.

"라스는 무서울 때 노래를 불렀다. 나는 무서울 때 차를 끓이지. 오늘은… 물을 올릴 힘도 없군."

그녀가 은 구슬을 만진다. "나는 하퍼다. 슬픔은 일이 끝난 뒤에. 그렇게 배웠다. 그러니까 끝낼 거다. 이스카르를. 그다음에… 그다음에 울 거다."`,
  ise:`이세가 칼을 손질하며 콧노래를 부른다. 동쪽 섬의 노래라고 한다.

"나? 현상금 사냥꾼이지. 고향엔 엄마랑 동생 셋. 돈 벌어서 보내는 중이야." 그녀가 씩 웃는다. "은가면한테 잡힌 건… 음, 일하다 실수한 거지."

그녀의 눈이 잠깐 흔들린다. 그리고 곧 다시 웃는다. "근데 너희 진짜 좋은 사람들이다. 이런 사람들이랑 다니는 건 처음이야. …그게 좀 무섭네."`},
 1:{korva:`코르바가 오늘 만든 스튜를 맛본다. 그리고 놀란 얼굴을 한다. "…맛있다."

"투기장 소년이 그러더군. 나를 보고 커서 챔피언이 되고 싶었다고." 그녀가 국자를 내려놓는다. "그래서 말해줬다. 챔피언 말고 요리사가 되라고. 아무도 안 다치는 직업이니까."`,
  brenna:`브렌나가 오랜만에 차를 끓인다. 찻잎을 세 숟가락. 그리고 잠깐 망설이다 하나 더.

"라스가 늘 너무 쓰다고 투덜댔지. 오늘은 그 녀석 몫까지 진하게 끓였다." 그녀가 당신에게 잔을 내민다. "마셔라. 그 녀석 대신."

"티오를 구하면… 그 애한테도 이 차를 끓여줘야겠다. 그 애도 너무 쓰다고 하겠지."`,
  ise:`이세가 평소보다 말이 많다. 너무 많다.

"스펠홀드 가는 거 무섭지 않아? 난 하나도 안 무서워. 정말이야. 그냥… 거기 가면 좋은 일만 있을 거야. 그렇지?"

그녀가 갑자기 당신 손을 잡는다. "만약에, 정말 만약에 내가 이상한 짓을 하면… 그건 내 진심이 아니야. 그것만 기억해 줘." 그리고 손을 놓고 웃는다. "아, 농담이야! 농담."`,
  win:`윈이 모닥불 위에 빛으로 작은 그림들을 띄운다. 춤추는 노움, 하늘을 나는 새, 웃는 얼굴.

<i>피피트 선생님도 처음엔 좋은 사람이었어요. 아무도 웃어주지 않아서 변한 거예요.</i> 글씨가 잠시 흐려진다. <i>그래서 저는 사람들을 웃게 하는 환술을 할 거예요.</i>

그녀가 입을 열어 아주 작게 소리를 낸다. "…티, 오." 그리고 빛 글씨. <i>그 사람 이름 연습 중이에요. 만나면 불러주려고요.</i>`,
  osric:`오스릭이 물잔을 든다. 그는 모닥불 가에서도 술을 마시지 않는다.

"삼 년 전, 술에 취해 순찰을 돌다가 한 아이를 놓쳤소. 노예 상인들에게 끌려가는 걸 봤는데, 다리가 말을 안 듣더군. 다음 날 아침 술을 끊었소."

그가 당신을 본다. "당신은 친구를 구하러 섬에 간다지. 나는 그때 못 한 걸, 이번엔 끝까지 하겠소. 늙은이라도 방패는 들 수 있으니."`},
 2:{tio:`티오가 고글을 만지작거린다. 렌즈에 새로 금이 하나 더 갔다.

"영혼을 뺏긴다는 게… 이상해. 아프진 않은데 추워. 지도를 그려도 선이 안 이어져. 손이 내 손이 아닌 것 같아."

그가 당신을 본다. "근데 너도 똑같이 춥지? 그럼 됐어. 혼자 추운 거 아니니까." 그가 억지로 웃는다. "그리고 나 그 은가면 지도 다 그려놨어. 그놈 미궁 구조, 하나도 안 빼고. 복수할 때 쓰려고."`,
  korva:`코르바가 티오에게 스튜를 억지로 먹인다. 티오가 얼굴을 찡그린다. "…여전히 맛없어." 코르바가 만족스럽게 웃는다. "다행이다. 아직 너다."

그녀가 당신 쪽으로 돌아앉는다. "이세 말이다. 마지막에 웃던 얼굴. 투기장에서 많이 봤다. 이길 수 없는 경기에 억지로 나온 녀석들이 그렇게 웃지." 그녀가 고개를 숙인다. "…좋은 녀석이었다."`,
  brenna:`브렌나가 티오에게 차를 끓여준다. 아주 진하게. 티오가 한 모금 마시고 혀를 내민다. "써!"

"그렇지. 라스도 그랬다." 브렌나가 처음으로 편안하게 웃는다.

그녀가 당신에게 목소리를 낮춘다. "영혼이 빠진 너희 둘, 내가 매일 살핀다. 체온이 조금씩 떨어지고 있어. 시간이 많지 않다. 이스카르를 서둘러 찾아야 한다."`,
  win:`윈이 목소리를 내어 말한다. 아직 쉬어 있고 작지만, 분명한 목소리다.

"…티오. 안녕." 티오가 깜짝 놀라 고글을 떨어뜨린다. 윈이 키득거린다. 소리 내어 웃는 것도 처음이다.

그녀가 빛 글씨로 덧붙인다. <i>노움 마을 사람들이 그랬어요. 목소리는 쓸수록 돌아온대요. 그러니까 이제 많이 말할 거예요. 각오하세요.</i>`,
  osric:`오스릭이 언더다크의 어둠을 오래 바라본다.

"경비대장 시절엔 도시 아래에 이런 세상이 있는 줄도 몰랐소. 드로우, 노움, 용… 세상은 내가 지키던 성벽보다 훨씬 넓군."

그가 당신에게 고개를 숙인다. "늙어서 이런 걸 보게 될 줄은 몰랐소. 데려와 줘서 고맙소. 술 마시던 시절이었으면 이 나이에 이미 죽었겠지."`},
 3:{tio:`모든 게 끝난 밤. 티오가 영혼이 돌아온 손으로 지도를 그린다. 선이 이어진다.

"따뜻해. 진짜 따뜻해." 그가 웃다가 울다가 한다. "있잖아, 나 결정했어. 바알의 피든 뭐든, 나는 지도 그리는 사람으로 살 거야. 세상 끝까지 다 그릴 거야."

그가 첫 장을 찢어 당신에게 준다. 엘프 숲 지도다. 구석에 작은 글씨. <i>여기서 우리가 이겼다.</i>`,
  korva:`코르바가 엘프들에게 스튜를 대접한다. 엘프들이 예의 바르게 웃는다. 아무도 두 그릇은 먹지 않는다.

"다음엔 엘프 요리를 배울 거다." 코르바가 진지하게 말한다. "그리고 시도 하나 썼다. '나무는 불타도 뿌리는 남는다.' …이번엔 셀렌이 없어서 평가해 줄 사람이 없군. 어때?"`,
  brenna:`브렌나가 마침내 운다. 조용히, 오래.

한참 뒤 그녀가 안경을 닦으며 말한다. "약속했지. 일이 끝나면 울겠다고. 끝났다."

그녀가 은 구슬을 만진다. "라스는 이제 쉴 수 있겠지. 나는… 산속 고향에 찻집을 열 거다. 언젠가 네가 찾아오면 제일 쓴 차를 대접하마. 드워프는 오래 사니까, 백 년 뒤에도 기다리고 있을 거다."`,
  win:`윈이 생명의 나무 아래에서 처음으로 노래를 부른다. 서툴고 작지만, 엘프들이 하나둘 귀를 기울인다.

노래가 끝나고 그녀가 당신에게 말한다. 목소리로. "피피트 선생님이 훔친 건 제 목소리였는데, 돌려준 건 여러분이었어요."

"저 이제 서커스를 열 거예요. 무서운 거 말고, 사람들이 웃는 거요. 첫 공연엔 꼭 와야 해요. 맨 앞자리예요."`,
  osric:`오스릭이 불타고 남은 엘프 도시를 바라본다. 아이들이 다시 다리 위를 뛰어다닌다.

"나는 앰으로 돌아가겠소. 경비대에 다시 들어갈 생각이오. 이번엔 눈감지 않는 대장으로."

그가 물잔을 든다. "당신 덕분에 늙은이가 한 번 더 쓸모 있어졌소. 건배하지. 물이지만."`}
});

addLine('b2_war',f=>f.p1_guild_pass?'그림자 길드원 하나가 지나가며 속삭인다. "발더스 게이트의 미라 누님이 안부 전하래. 고글 꼬마랑 그 친구 일이면 도우라고."':'');
addLine('b2_c3',f=>f.p1_tamoko_gone?`부두에서 검은 머리를 묶은 검사가 당신을 기다리고 있다. 린세다. 1년 전, 바알의 신전 앞에서 칼을 내려놓았던 그녀.

"모르데인을 너무 아프게 하지 말아 달라고 했었지. 너는 그 약속을 지켰어. 이번엔 내가 갚을게." 그녀가 지도를 건넨다. "스펠홀드 절벽에 해적들도 모르는 길이 있어."`:'');
link('b2_c3',{t:'린세가 알려준 절벽 길로 몰래 들어간다',req:['p1_tamoko_gone'],go:'b2_asylum'},'first');
addLine('b2_end',f=>f.carry1?'티오가 1년 전 완성한 발더스 게이트 지도 뒷면에 새 지도를 그리기 시작한다. "두 번째 장이야. 우리 이야기의."':'');

 comps:{

/* ---------- 1장: 노틸로이드와 숲 (Lv4) ---------- */
b3_start:{title:'노틸로이드',text:`살덩이로 된 벽이 숨을 쉰다. 당신은 끈적한 포드 안에서 눈을 뜬다.

기억나는 건 하나뿐이다. 촉수 달린 얼굴, 마인드 플레이어. 그리고 눈알 속으로 기어들던 작은 올챙이.

포드가 터지듯 열린다. 창밖으로 불타는 하늘과 날아다니는 용들이 보인다. 이 배는 지옥, 아베르누스를 날고 있다.

머릿속 깊은 곳에서 무언가가 꿈틀거린다. 며칠 뒤면 당신도 촉수 달린 괴물이 될 것이다.`,
 choices:[{t:'일어나서 복도를 나선다',go:'b3_laezel'}]},
b3_laezel:{title:'노틸로이드 복도',who:['torga'],text:`복도 끝에서 구릿빛 비늘의 드래곤본 여전사가 대장장이 망치 하나로 임프 무리를 상대하고 있다.

"거기. 서 있지만 말고." 그녀가 짧게 말한다. 목소리가 쇠를 두드리는 소리처럼 낮고 무겁다. "너도 머리에 벌레가 있나. 그럼 같은 편이다. 싸워라."`,combat:{enemies:[mob('임프',4,{hp:10,n:3})],allies:[{name:'토르가',hp:40,ac:17,atk:6,dmg:'1d10+3'}],win:'b3_pod'}},
b3_pod:{title:'노틸로이드',who:['torga'],onEnter:{join:'torga'},text:`임프들이 쓰러지자 여전사가 망치에 묻은 피를 털어낸다. "토르가. 대장장이다. 조타실로 간다. 배를 멈춘다."

말이 끝이다. 복도 벽의 포드 하나에서 누군가 두드린다. "거기 누구 있어요? 꺼내줘요! 저 작아요! 자리 많이 안 차지해요!" 아이 같은, 하지만 아이는 아닌 목소리다.

토르가가 고개를 젓는다. "시간 없다."`,
 choices:[{t:'포드를 연다',join:'olly',go:'b3_shadow'},{t:'토르가 말대로 지나친다',go:'b3_helm'}]},
b3_shadow:{title:'노틸로이드',who:['olly'],text:`포드가 열리고 곱슬머리 하플링이 굴러 나온다. 그는 가슴에 무언가를 꼭 안고 있다. 검은 원 문양이 새겨진 이상한 유물이다.

"아이고, 살았다! 올리예요! 약초꾼이고, 사제고, 요리도 좀 하고, 아 맞다, 치유 주문 써요! 쓸모 있어요, 진짜로!" 그가 숨도 안 쉬고 말한다. 그리고 유물을 재빨리 외투 안에 숨긴다. "이건… 별거 아니에요. 그냥 기념품."`,choices:[{t:'조타실로 서두른다',go:'b3_helm'}]},
b3_helm:{title:'조타실',who:['vark'],text:`조타실. 박쥐 날개에 뿔이 휘어진 붉은 악마, 캠비온 바르크가 마인드 플레이어와 싸우고 있다. 함선의 뇌에 연결된 신경 다발이 번쩍인다.

토르가가 망치로 신경 다발을 가리킨다. "저걸 부수면 떨어진다. 안 부수면 우린 다 끝이다."

바르크가 당신을 돌아본다. 노란 눈의 동공이 세로로 갈라져 있다. "벌레들이 기어왔군."`,
 choices:[{t:'신경 다발을 끊어 배를 추락시킨다',check:{skill:'비전',dc:12,ok:'b3_crash',fail:'b3_helm_fight'}},{t:'캠비온과 싸운다',go:'b3_helm_fight'}]},
b3_helm_fight:{title:'조타실',who:['vark'],text:`바르크가 불타는 대검을 휘두른다!`,combat:{enemies:[elite('캠비온 바르크',4,{hp:34})],win:'b3_crash'}},
b3_crash:{title:'추락',onEnter:{dmg:'1d6',loot:'u_zhalk'},text:`신경이 끊기는 순간 함선이 비명을 지르며 기운다. 지옥의 하늘이 소드 코스트의 하늘로 바뀌고, 땅이 빠르게 다가온다.

…눈을 뜨니 바닷가다. 사방에 함선의 잔해가 불타고 있다. 모래 위에 바르크의 불꽃 대검이 꽂혀 있다. 아직 불씨가 남아 있다.

머리가 아프다. 그런데 이상하다. 올챙이는 아직 그대로인데 변신이 시작되지 않는다.`,
 choices:[{t:'생존자를 찾는다',go:'b3_astarion'}]},
b3_astarion:{title:'해변',who:['sei'],text:`잔해 사이에서 은발 단발의 여자가 손을 흔든다. "이봐, 저기 마인드 플레이어가 아직 살아 있어! 도와줘!"

당신이 다가가는 순간, 그녀가 바람처럼 등 뒤로 돌아 목에 칼을 들이댄다. 곡예사의 몸놀림이다. "미안. 확인할 게 있어서. 너도 그 벌레 박혔지? …아니면 날 다시 잡으러 온 놈이야?"

그녀의 손목에 오래된 족쇄 자국이 보인다.`,
 choices:[{t:'몸을 비틀어 빠져나온다',check:{skill:'곡예',dc:12,ok:'b3_astar_ok',fail:'b3_astar_cut'}},{t:'"우린 같은 처지야. 아무도 널 잡으러 온 게 아니야."',check:{skill:'설득',dc:12,ok:'b3_astar_ok',fail:'b3_astar_cut'}}]},
b3_astar_cut:{title:'해변',onEnter:{dmg:'1d4+2'},text:`칼날이 목을 살짝 긋는다. 그 순간, 둘의 올챙이가 공명하며 서로의 머릿속이 섞인다. 사슬, 채찍, 곡예단 천막. 그녀는 당황해 칼을 거둔다.`,choices:[{t:'일어선다',go:'b3_astar_ok'}]},
b3_astar_ok:{title:'해변',who:['sei','aldor'],onEnter:{join:['sei','aldor']},text:`"세이야. 곡예단 출신. 줄타기, 칼 던지기, 남의 주머니 털기. 다 잘해." 그녀가 웃는다. 눈은 웃지 않는다. "같이 다니자. 혼자보단 낫겠지."

근처 잔해 더미에서 쇳소리와 함께 투덜거림이 들린다. 날개 달린 이상한 금속 기계가 뒤집혀 있고, 그 아래 흰 수염의 노움이 깔려 있다. 이마에는 고글.

"어, 실례지만! 누가 이것 좀 들어주겠소? 내 '하늘 다람쥐 3호'가 또… 아니, 4호였나?" 당신이 기계를 들어 올리자 노움이 엉덩방아를 찧는다.

"알도르요. 발명가이자 마법사. 그 벌레 동지들인가 보군. 들어보니 근처 숲에 드루이드 치유사가 있다던데. 어, 내가 그걸 어디서 들었더라…"

동료가 많아졌다. 함께 싸울 동료는 '동료 편성'에서 고를 수 있다.`,
 choices:[{t:'드루이드의 숲으로 간다',go:'b3_gate'}]},
b3_gate:{title:'에메랄드 숲 정문',who:['fiona'],text:`숲 속 드루이드 은신처의 정문. 고블린 떼가 화살을 퍼붓고 있다! 문 위에서 붉은 머리를 땋아 내린 하프엘프 사냥꾼이 혼자 활을 쏘며 고블린들을 막아내고 있다. 그녀의 뺨에 초록 덩굴 문신이 빛난다.

"지원군이야? 고마워! 왼쪽을 맡아줘!"`,combat:{enemies:[mob('고블린',4,{hp:12,n:3}),elite('워그 기수',4,{hp:28})],win:'b3_grove'}},
b3_grove:{title:'에메랄드 숲',who:['fiona','lion'],onEnter:{join:'fiona'},text:`고블린들이 퇴각한다. 붉은 머리 사냥꾼이 활을 내린다.

"피오나야. 이 숲 근처에서 사냥하며 살아. 숲에 피난 온 티플링 난민들을 지키는 중이었어." 그녀가 뺨의 덩굴 문신을 손등으로 가린다. "이거? 숲의 정령과 맺은 계약 표시야. 힘을 빌려주는 대신… 뭐, 대가가 있지."

숲 안은 어수선하다. 드루이드 리온이 의식을 준비하고, 난민들은 쫓겨날까 두려워한다. 그리고 꼬마 티나가 드루이드의 성물을 훔쳤다가 붙잡혀 있다. 리온이 날카롭게 말한다. "규칙은 규칙이다."`,
 choices:[{t:'티나를 변호한다',not:['arabella'],set:{arabella:1},check:{skill:'설득',dc:13,ok:'b3_ara_ok',fail:'b3_ara_fail'}},{t:'치유사를 찾는다',go:'b3_nettie'}]},
b3_ara_ok:{title:'에메랄드 숲',who:['lion'],onEnter:{set:{ara_saved:1},potions:1},text:`리온이 마지못해 아이를 풀어준다. "다음은 없다." 티나의 부모가 눈물을 흘리며 물약 하나를 건넨다.`,choices:[{t:'치유사를 찾는다',go:'b3_nettie'}]},
b3_ara_fail:{title:'에메랄드 숲',who:['lion'],text:`리온은 꿈쩍도 하지 않는다. 하지만 당신이 시간을 끄는 사이, 아이는 몰래 풀려나 달아난다. 리온이 당신을 노려본다.`,choices:[{t:'치유사를 찾는다',go:'b3_nettie'}]},
b3_nettie:{title:'치유사의 오두막',who:['mei'],text:`견습 치유사 메이가 당신의 눈을 들여다보다 얼굴이 굳는다.

"이런 건… 제 힘으로는 못 고쳐요. 우리 대 드루이드 오크하트님이라면 모를까. 그런데 오크하트님은 고블린 소굴을 정찰하러 가셨다가 돌아오지 않으셨어요."

그녀가 지도를 펼친다. "고블린들은 언덕 위 부서진 성소에 진을 쳤어요. 그들의 지도자들은 '절대자'라는 존재를 섬긴대요."`,
 choices:[{t:'티플링 행상인에게 들른다',go:'b3_shop1'},{t:'모두 모닥불 가에 모인다',go:'b3_c1_end'}]},
b3_shop1:{title:'티플링 행상인',who:['pete'],shop:'b3_grove',text:`난민 틈에 섞여 장사하는 하플링 행상인 피트가 수레를 펼친다. "피난길에 챙긴 것들이에요. 싸게 드릴게요. 우릴 지켜주셨으니까."`,choices:[{t:'돌아간다',go:'b3_nettie'}]},
b3_c1_end:{title:'1장 끝',chapterEnd:true,who:['dreamguide'],text:`첫날 밤. 숲 밖에 피운 모닥불 주위로 낯선 동료들이 둘러앉는다. 모두 머릿속에 같은 벌레를 품고 있다.

잠이 들자 꿈을 꾼다. 금빛으로 빛나는 형상이 손을 내민다. 얼굴은 보이지 않는다. 빛뿐이다.

<i>"두려워하지 마라. 나는 너를 지키고 있다. 올챙이의 힘을 써라. 그것이 너를 구할 것이다."</i>

깨어나니 동료들도 같은 꿈을 꿨다고 한다. 각자에게 다른 모습으로 나타난 '꿈의 인도자'.`}
,
/* ---------- 2장: 부서진 성소 (Lv5) ---------- */
b3_c2:{title:'강가',who:['bruno'],text:`성소로 가는 길, 강가에서 고함이 들린다. 오른팔이 통째로 쇠로 된 덩치 큰 남자가 갑옷 입은 기사 셋에게 둘러싸여 있다. 쇠팔에서 증기가 새어 나온다.

피오나의 얼굴이 굳는다. 그녀의 덩굴 문신이 붉게 달아오른다. "…숲의 정령이 속삭여. 저 남자가 '지옥의 낙인이 찍힌 자'래. 처단하라고. 그게 내 계약의 대가야."

남자가 쇠팔을 든다. "잠깐! 칼 내려! 난 악마가 아니라고! 지옥에서 겨우 도망친 거야!"`,
 choices:[{t:'그의 말을 들어본다',check:{skill:'통찰',dc:12,ok:'b3_karlach_talk',fail:'b3_paladins'}},{t:'기사들 편에 선다',go:'b3_paladins'}]},
b3_karlach_talk:{title:'강가',who:['bruno'],text:`그의 눈에서 거짓을 찾을 수 없다. "브루노다. 불꽃 주먹 대위였지. 십 년 전, 상관이 날 팔아넘겼어. 지옥의 전쟁터 노예로. 이 팔은 거기서 얻은 거다. 날 판 놈이 지금 발더스 게이트에 있어."

그 순간 기사들이 칼을 뽑는다. 그들의 갑옷 아래로 악마의 문양이 비친다. 피오나와 계약한 '숲의 정령'이 보낸 자들이다! 피오나가 이를 악문다. "…속았어. 그 정령, 정령이 아니었어."`,combat:{enemies:[mob('지옥의 기사',5,{n:3})],win:'b3_karlach'}},
b3_paladins:{title:'강가',who:['bruno'],text:`기사들과 함께 다가가자, 그들의 갑옷 아래로 악마의 문양이 비친다. 기사들이 당신에게도 칼을 겨눈다! "목격자는 모두 죽여라!"

쇠팔의 남자가 당신 옆에 선다. "어이, 일단 같이 싸우자고!"`,combat:{enemies:[mob('지옥의 기사',5,{n:3})],win:'b3_karlach'}},
b3_karlach:{title:'강가',who:['bruno','fiona'],onEnter:{join:'bruno'},text:`브루노가 크게 웃으며 당신의 어깨를 쇠팔로 툭 친다. 꽤 아프다.

"고마워, 친구! 나도 머리에 벌레 박혔어. 같이 다니자! 아, 날 지옥에 팔아넘긴 놈의 이름은 <b>하겐</b>이야. 내 옛 상관. 언젠가 이 쇠팔로 인사해 줄 거다."

피오나가 그에게 고개를 숙인다. "미안해. 나도 속은 거였어." 브루노가 손을 젓는다. "됐어. 악마한테 속는 건 나도 전문가야."`,
 choices:[{t:'부서진 성소로 향한다',go:'b3_village'}]},
b3_village:{title:'황폐한 마을',who:['greta'],text:`성소 가는 길의 폐허 마을. 마을 끝 찻집에서 볼이 발그레한 친절한 노파가 차를 권한다. "고생이 많지? 그 머리의 벌레도 고쳐줄 수 있단다."

세이가 속삭인다. "저 할머니, 냄새가 수상해. 너무 달콤해. 곡예단 주인도 이런 냄새가 났어."`,
 choices:[{t:'노파의 정체를 꿰뚫어 본다',check:{skill:'비전',dc:13,ok:'b3_hag',fail:'b3_hag_trick'}},{t:'무시하고 성소로 간다',go:'b3_sanctum'}]},
b3_hag_trick:{title:'찻집',who:['greta'],onEnter:{dmg:'2d6'},text:`차를 한 모금 마시자 속이 뒤집힌다! 노파의 피부가 초록빛으로 변하고 손톱이 길어진다. 마녀, 해그다!`,combat:{enemies:[elite('해그 그레타',5,{hp:45})],win:'b3_hag_win'}},
b3_hag:{title:'찻집',who:['greta'],text:`노파의 그림자가 사람의 것이 아니다. 당신이 꿰뚫어 보자 노파가 웃는다. "눈이 좋구나, 얘야." 그녀의 모습이 녹색 마녀로 변한다.`,combat:{enemies:[elite('해그 그레타',5,{hp:38})],win:'b3_hag_win'}},
b3_hag_win:{title:'찻집',onEnter:{potions:2,gold:60,loot:'u_hag'},text:`해그가 비명을 지르며 연기로 사라진다. 찻집 지하에서 그녀에게 납치됐던 마을 여인과 약초 물약들을 찾는다. 그리고 해그가 남긴 이끼 같은 머리카락 한 타래.`,choices:[{t:'부서진 성소로',go:'b3_sanctum'}]},
b3_sanctum:{title:'부서진 성소',text:`언덕 위 옛 사원. 고블린들이 우글거린다. 정문의 고블린 경비가 당신 눈을 보더니 멈칫한다.

"너… 너도 낙인이 있네? '진정한 영혼'이야?" 올챙이가 머릿속에서 꿈틀거린다. 그들은 당신을 동족으로 착각하고 있다.`,
 choices:[{t:'"그래. 절대자를 섬기는 진정한 영혼이다."',check:{skill:'기만',dc:12,ok:'b3_inside',fail:'b3_sanctum_fight'}},{t:'올챙이의 힘으로 그의 정신을 짓누른다',check:{skill:'위협',dc:13,ok:'b3_inside',fail:'b3_sanctum_fight'}},{t:'정면 돌파',go:'b3_sanctum_fight'}]},
b3_sanctum_fight:{title:'부서진 성소',text:`"가짜다! 죽여!" 고블린들이 몰려온다.`,combat:{enemies:[mob('고블린 전사',5,{n:3}),mob('고블린 궁수',5,{hp:16})],win:'b3_inside'}},
b3_inside:{title:'성소 내부',text:`성소 안에는 세 지도자가 있다. 홉고블린 사제 굴다, 고블린 두목 크룩, 그리고 드로우 사령관 벨린.

지하 감옥에서 거대한 짐승의 울음소리가 들린다. 큰 뿔사슴의 모습으로 변신한 채 갇힌 대 드루이드 오크하트다.`,
 choices:[{t:'몰래 지하 감옥의 오크하트를 풀어준다',not:['halsin'],set:{halsin:1},check:{skill:'은신',dc:14,ok:'b3_halsin',fail:'b3_halsin_fight'}},
  {t:'구석에서 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r32'],set:{r32:1},rest:1,go:'b3_inside'},
  {t:'두목 크룩의 왕좌로 쳐들어간다',go:'b3_dror'}]},
b3_halsin:{title:'지하 감옥',who:['oakheart'],onEnter:{set:{halsin_free:1}},text:`자물쇠가 풀리자 거대한 뿔사슴이 사람으로 변한다. 덥수룩한 수염에 머리에 꽃을 꽂은 인간 드루이드, 오크하트다.

"구해줘서 고맙네. 그 벌레들 말이네만… 내가 보기엔 이미 몇 번이고 변했어야 했어. 뭔가 너희를 지키고 있어. 무엇인지는 모르겠지만." 그가 주먹을 쥔다. "두목과 싸운다면 함께하겠네."`,choices:[{t:'두목의 왕좌로',go:'b3_dror'}]},
b3_halsin_fight:{title:'지하 감옥',text:`간수가 눈치챘다! "탈옥이다!"`,combat:{enemies:[mob('고블린 간수',5,{n:2})],win:'b3_halsin'}},
b3_dror:{title:'성소 왕좌',who:['krook'],text:f=>`부서진 신상 위 왕좌에서 녹슨 왕관을 쓴 거대한 고블린 크룩이 몸을 일으킨다. "진정한 영혼인 척하는 쥐새끼들이로군!"${f.halsin_free?'\n\n문을 부수고 거대한 뿔사슴이 뛰어든다. 오크하트다!':''}`,
 combat:f=>({enemies:[boss('두목 크룩',5,{hp:75,attacks:1}),mob('고블린 호위',5,{n:2})],allies:f.halsin_free?[{name:'오크하트 (뿔사슴)',hp:50,ac:14,atk:6,dmg:'2d6+3'}]:[],win:'b3_c2_after'})},
b3_c2_after:{title:'성소',onEnter:{gold:120,loot:'u_dror'},text:`크룩이 쓰러지자 고블린들이 흩어진다. 지도자들의 방에서 문서가 나온다.

<i>"절대자의 군대는 그림자 저주의 땅을 건너 발더스 게이트로 진군한다. 달오름 탑에서 마르케스 장군이 명령을 기다린다."</i>

그날 밤 꿈에서, 꿈의 인도자가 다시 나타난다. <i>"잘했다. 계속 나아가라. 해답은 남쪽 그림자 속에 있다."</i>`,
 choices:[{t:'숲으로 돌아가 승리를 알린다',go:'b3_c2_end'}]},
b3_c2_end:{title:'2장 끝',chapterEnd:true,text:`티플링 난민들과 드루이드들이 함께 축제를 연다. 처음으로 다 같이 웃는 밤이다. 브루노는 쇠팔로 장작을 패다 장작더미를 무너뜨리고, 알도르는 별자리를 잘못 가리키며 우기고, 세이는 줄 위에서 공중제비를 돈다. 토르가는 구석에서 말없이 웃는다. 처음 보는 웃음이다.

하지만 올챙이는 아직 머릿속에 있다. 그리고 절대자의 군대는 남쪽, 그림자 저주의 땅에서 기다리고 있다.`}
,
/* ---------- 3장: 그림자 저주의 땅 (Lv6) ---------- */
b3_c3:{title:'그림자 저주의 땅',text:`빛이 죽은 땅. 횃불을 들어도 어둠이 살갗을 파고든다. 이곳에서는 마법의 빛 없이 오래 버틸 수 없다.

멀리 희미한 빛이 보인다. 달의 여사제 루세가 지키는 여관, '마지막 빛'이다.`,
 choices:[{t:'마지막 빛 여관으로',go:'b3_lastlight'}]},
b3_lastlight:{title:'마지막 빛 여관',who:['brenna_old','luce'],text:`여관 안은 하퍼 요원들과 피난민들로 가득하다. 하퍼들을 지휘하는 이는 은발을 땋아 내린 늙은 드워프 여인이다. 둥근 안경, 땋은 머리 끝에 엮은 낡은 은 구슬 하나. 그녀는 전투 지도 옆에서 차를 끓이고 있다.

"브렌나다." 그녀가 당신을 훑어본다. "머리에 벌레를 품고도 멀쩡한 자들이라. 흥미롭군. 백 년 넘게 살다 보니 별일을 다 보는구나."

그 이름. 백 년 전 발더스 게이트를 구한 영웅들 곁에 있었다는, 전설 속 드워프 치유사다. 그녀가 찻잔을 내민다. "마셔라. 쓰다. 원래 쓴 거다."`,
 choices:[{t:'브렌나에게 함께 싸우자고 청한다',join:'brenna_old',go:'b3_raid'},{t:'정보만 얻고 떠날 채비를 한다',go:'b3_raid'}]},
b3_raid:{title:'마지막 빛 여관',who:['seraphin','luce'],text:`그날 밤, 여관을 감싼 빛이 흔들린다. 하얀 날개를 단 전사 세라핀이 루세를 납치하려고 쳐들어왔다! 그녀가 사라지면 여관의 빛도 꺼진다.`,combat:{enemies:[elite('날개 달린 세라핀',6),mob('절대자의 광신도',6,{n:2})],win:'b3_raid_win'}},
b3_raid_win:{title:'마지막 빛 여관',who:['brenna_old'],text:f=>`루세가 무사하다. 브렌나가 지도를 펼친다.

"마르케스. 달오름 탑의 장군이지. 놈은 죽지 않는다. 몇 번을 찔러도 일어나. 그 불사의 비밀은 '아스트리드'라는 존재에 있다. 놈은 샤르의 시험장 깊은 곳에 그녀를 가둬두었어."

${has('olly')?'올리의 얼굴이 하얘진다. 그가 품에 숨겨온 유물. 거기 새겨진 검은 원이 샤르의 문양과 똑같다. "…나 이 문양 알아. 어릴 때 살던 곳 벽에 있었어. 근데 왜 기억이 안 나지?"':'샤르. 어둠과 망각의 여신. 그 교단이 이 땅을 이렇게 만들었다.'}`,
 choices:[{t:'하퍼 보급관에게 장비를 받는다',go:'b3_shop2'},{t:'샤르의 시험장으로 간다',go:'b3_gauntlet'},{t:'먼저 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r33'],set:{r33:1},rest:1,go:'b3_raid_win'}]},
b3_shop2:{title:'하퍼 보급관',shop:'b3_harper',text:`하퍼 보급관이 상자를 연다. "브렌나 님 손님이라면 할인해 드리죠. 그래도 공짜는 아닙니다. 그분이 그런 거 싫어하셔서."`,choices:[{t:'돌아간다',go:'b3_raid_win'}]},
b3_gauntlet:{title:'샤르의 시험장',text:`완전한 어둠의 신전. 바닥은 보이지 않는 낭떠러지투성이다. 벽에 새겨진 글귀.

<i>"믿음 없는 눈은 길을 보지 못하리라."</i>`,
 choices:[{t:'샤르의 교리대로 눈을 감고 걷는다',check:{skill:'종교',dc:13,ok:'b3_g2',fail:'b3_g_fall'}},{t:'바닥의 미세한 바람을 느끼며 걷는다',check:{skill:'지각',dc:14,ok:'b3_g2',fail:'b3_g_fall'}}]},
b3_g_fall:{title:'샤르의 시험장',onEnter:{dmg:'2d8'},text:`발밑이 꺼진다! 한 층 아래로 굴러떨어진다. 다행히 길은 이어져 있다.`,choices:[{t:'일어나 계속 간다',go:'b3_g2'}]},
b3_g2:{title:'시험장 깊은 곳',text:`그림자 속에서 샤르의 그림자 전사들이 나타난다. "침입자에게 망각을."`,combat:{enemies:[mob('그림자 전사',6,{n:3})],win:'b3_nightsong'}},
b3_nightsong:{title:'갇힌 별',who:['astrid'],text:f=>`가장 깊은 곳, 빛나는 금발의 여인이 사슬에 묶여 공중에 떠 있다. 그녀가 바로 아스트리드. 마르케스 장군을 불사로 만드는 힘의 원천이다.

${has('olly')?'올리의 머릿속에 낯선 목소리가 속삭인다. 그가 어린 시절 들었던, 잊어버린 목소리. 샤르가 명령한다. "죽여라. 그것이 너를 길러준 자들에 대한 보답이다."\n\n올리의 손에 들린 유물이 검게 빛난다. 그가 떨면서 당신을 본다. 처음으로 아무 말도 하지 못한다.':'그녀를 풀어주면 마르케스는 불사의 힘을 잃는다.'}`,
 choices:[{t:'"올리, 네 마음이 원하는 대로 해."',req:['has:olly'],set:{shar_free:1,nightsong:1},go:'b3_aylin'},{t:'사슬을 끊는다',not:['has:olly'],set:{nightsong:1},go:'b3_aylin'}]},
b3_aylin:{title:'갇힌 별',who:['astrid'],onEnter:{loot:'u_aylin'},text:f=>`${f.shar_free?'올리가 유물을 바닥에 내던진다. 유물이 산산조각 난다. 그리고 그가 사슬을 끊는다. 순간 그의 텅 빈 기억 속으로 빛이 쏟아져 들어온다. 그가 울면서 웃는다. "…기억났어. 엄마가 불러주던 노래. 샤르 교단이 그걸 지웠던 거야. 이제 내 거야."\n\n':''}풀려난 여인이 빛나는 날개를 편다. "나는 아스트리드, 달의 딸. 백 년 동안 갇혀 있었다." 그녀의 눈이 분노로 타오른다. 그녀가 깃털 하나를 뽑아 당신에게 건넨다. "마르케스. 이제 그에게 대가를 치르게 하겠다. 함께 가자."`,
 choices:[{t:'달오름 탑으로',go:'b3_moonrise'}]},
b3_moonrise:{title:'달오름 탑',who:['markes'],text:`어둠 속에 우뚝 선 탑. 꼭대기에서 마르케스 장군이 의식을 진행하고 있다. 잿빛 피부에 녹색으로 빛나는 눈, 거대한 낫을 든 노장. 그의 몸에서 불사의 힘이 빠져나가는 것이 보인다.

"아스트리드… 네가 풀려났다고? 상관없다. 절대자께서 내게 새로운 힘을 주실 것이다!"`,combat:{enemies:[boss('장군 마르케스',6,{hp:95}),mob('죽음의 수호자',6,{hp:24})],allies:[{name:'아스트리드',hp:60,ac:17,atk:7,dmg:'2d6+4'}],win:'b3_reveal'}},
b3_reveal:{title:'달오름 탑',who:['dreamguide'],text:`마르케스가 무너지며 웃는다. "늦었다… 이미 <b>왕관</b>은 발더스 게이트에 있다. 세 명의 선택받은 자가…"

그의 품에서 검게 빛나는 돌, '네더스톤'이 굴러 나온다. 그 순간 머릿속에 꿈의 인도자의 목소리가 울린다. 그리고 처음으로 그 정체가 드러난다.

꿈의 인도자는… 마인드 플레이어였다. 일족을 배신한 마인드 플레이어. 처음부터 당신의 올챙이를 막아준 존재.

<i>"속인 것은 미안하다. 하지만 내가 없었다면 너는 이미 괴물이 되었을 것이다. 우리 목표는 같다. 이 왕관을 쥔 자들을 막는 것."</i>`,
 choices:[{t:'마르케스의 네더스톤을 챙긴다',item:'마르케스의 네더스톤',go:'b3_c3_end'}]},
b3_c3_end:{title:'3장 끝',chapterEnd:true,text:`마르케스의 마지막 말과 꿈의 인도자의 고백. 퍼즐이 맞춰진다.

절대자는 신이 아니다. 죽은 세 신, 바알, 미르쿨, 바인의 선택받은 자들이 조종하는 가짜다. 그들은 '네더스톤' 세 개로 거대한 '엘더 브레인'을 조종해, 올챙이 박힌 모든 이를 노예로 만들려 한다.

이제 남은 두 명. 발더스 게이트의 새 대공 <b>하겐</b>, 그리고 바알의 선택받은 자 <b>붉은 이브</b>.

브루노가 쇠팔을 쥔다. 증기가 뿜어져 나온다. "하겐. 드디어 만나겠네."`}
,
/* ---------- 4장: 왕관의 세 주인 (Lv7) ---------- */
b3_c4:{title:'발더스 게이트',who:['selen_old'],text:`한 세기가 흘렀지만 발더스 게이트는 여전히 시끄럽고, 붐비고, 위험하다. 거리를 쇳덩이 병사들, 강철 감시자들이 순찰한다. 새 대공 하겐의 군대다.

하층 도시 골목, 점성술사의 천막에서 은발의 엘프가 당신을 부른다. 이마의 은빛 서클릿, 별을 담은 듯한 보랏빛 눈.

"오늘 붉은 별 하나가 이 골목을 지날 거라고 했죠. 백 년 전에도 같은 별을 본 적이 있습니다." 그가 웃는다. "셀렌이라고 합니다. 오래된 친구의 찻잔 냄새가 나는군요."

브렌나가 천막 입구에서 멈춰 선다. 둘이 서로를 오래 바라본다. "…늙었군, 별쟁이." "당신은 그대로군요, 차쟁이."`,
 choices:[{t:'셀렌을 맞이한다',join:'selen_old',go:'b3_plan'}]},
b3_plan:{title:'하퍼 은신처',who:['brenna_old','selen_old'],text:`하퍼 은신처. 지도 위에 두 개의 점이 찍힌다.

"하겐은 철의 요새 '용의 바위'에. 이브는 지하 도시의 바알 신전에. 둘의 네더스톤을 모두 빼앗아야 엘더 브레인의 고삐를 끊을 수 있다."

바알 신전. 백 년 전, 늑대 가면의 모르데인이 최후를 맞았던 바로 그곳이다. 브렌나와 셀렌이 동시에 눈을 감는다.`,
 choices:[{t:'발더스 게이트 대시장에 들른다',go:'b3_shop3'},{t:'하겐의 요새로 간다',not:['gortash_done'],go:'b3_gortash'},{t:'이브의 바알 신전으로 간다',not:['orin_done'],go:'b3_orin'},{t:'두 네더스톤을 들고 엘더 브레인에게 간다',req:['gortash_done','orin_done'],go:'b3_brain'}]},
b3_shop3:{title:'발더스 게이트 대시장',shop:'b3_city',text:`항구 옆 대시장. 강철 감시자들이 순찰하는 와중에도 상인들은 목청을 높인다. 깊은 골목엔 진짜 귀한 물건을 파는 가게들이 있다.`,choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]},
b3_gortash:{title:'용의 바위',who:['hagen','bruno'],text:`강철 감시자들이 지키는 요새. 대공 하겐은 왕좌에서 당신을 기다리고 있었다. 검은 머리를 단정히 빗어 넘긴, 웃는 얼굴의 남자.

"드디어 왔군. 우리 거래를 하자고. 이브는 미치광이다. 나와 손잡으면 이 도시를 함께 다스릴 수 있지." 그가 브루노의 쇠팔을 보고 웃는다. "오, 브루노 대위. 지옥 여행은 즐거웠나?"

브루노의 쇠팔에서 증기가 터져 나온다.`,
 choices:[{t:'"거절한다."',go:'b3_gortash_fight'},{t:'거래하는 척 그의 방어 장치를 알아낸다',check:{skill:'기만',dc:15,ok:'b3_gortash_weak',fail:'b3_gortash_fight'}}]},
b3_gortash_weak:{title:'용의 바위',who:['hagen'],text:`거래를 받아들이는 척하며 강철 감시자들의 제어 장치 위치를 알아낸다. 그리고 그것을 부순다! 하겐이 경악한다. "이 배신자가!"`,combat:{enemies:[boss('대공 하겐',7,{hp:95,dmg:'2d6+4'})],win:'b3_gortash_win'}},
b3_gortash_fight:{title:'용의 바위',who:['hagen'],text:`하겐이 손가락을 튕기자 강철 감시자가 일어선다. "아깝군. 쓸모 있는 장난감이 될 수 있었는데."`,combat:{enemies:[boss('대공 하겐',7,{hp:95,dmg:'2d6+4'}),elite('강철 감시자',7,{ac:18})],win:'b3_gortash_win'}},
b3_gortash_win:{title:'용의 바위',onEnter:{set:{gortash_done:1},item:'하겐의 네더스톤'},text:f=>`하겐이 쓰러진다. 그의 손에서 두 번째 네더스톤이 빠져나온다.${has('bruno')?'\n\n브루노가 그의 앞에 서서 한참을 말이 없다. 쇠팔의 증기가 천천히 잦아든다. "…생각보다 시원하지 않네." 그가 웃는다. 눈가가 젖어 있다. "십 년을 이 순간만 기다렸는데."':''}`,
 choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]},
b3_orin:{title:'바알의 신전',who:['eve'],text:`해골과 붉은 돌로 장식된 신전. 백 년 전과 똑같다. 제단 위의 붉은 머리 여인이 계속 모습을 바꾼다. 당신의 얼굴, 동료의 얼굴, 그리고 다시 당신.

"반가워, 반가워." 변신자 붉은 이브가 킥킥댄다. 얼굴의 붉은 문신이 꿈틀거린다. "아버지 바알이 너를 아주 좋아할 거야. 피를 바치면."`,
 choices:[{t:'그녀의 진짜 위치를 찾아낸다',check:{skill:'통찰',dc:14,ok:'b3_orin_fight',fail:'b3_orin_trick'}},{t:'제단으로 돌진한다',go:'b3_orin_trick'}]},
b3_orin_trick:{title:'바알의 신전',who:['eve'],onEnter:{dmg:'2d8'},text:`당신이 벤 것은 분신이었다! 진짜 이브가 등 뒤에서 단검을 꽂는다. "느려, 느려!"`,combat:{enemies:[boss('붉은 이브',7,{hp:90,dmg:'2d6+4'}),mob('바알 광신도',7,{n:2})],win:'b3_orin_win'}},
b3_orin_fight:{title:'바알의 신전',who:['eve'],text:`그림자의 흔들림, 그것이 진짜다. 당신의 칼끝이 그녀를 향하자 이브가 처음으로 웃음을 멈춘다.`,combat:{enemies:[boss('붉은 이브',7,{hp:80,dmg:'2d6+4'}),mob('바알 광신도',7)],win:'b3_orin_win'}},
b3_orin_win:{title:'바알의 신전',onEnter:{set:{orin_done:1},item:'이브의 네더스톤'},text:`이브의 몸이 핏빛 웅덩이로 녹아내린다. 세 번째 네더스톤.

신전 벽에 오래된 낙서가 있다. 백 년 전 누군가 새긴 것이다. 고글 모양의 작은 그림과 함께. <i>"피가 아니라 선택이 우리를 정의한다. — 티오"</i>

브렌나가 그 낙서를 오래 바라본다. 손가락으로 고글 그림을 쓸어본다.`,
 choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]},
b3_brain:{title:'상층 도시',who:['dreamguide','kael'],text:`세 개의 네더스톤이 공명한다. 도시 하늘 위로 거대한 뇌, 엘더 브레인이 떠오른다. 수천의 올챙이 박힌 사람들이 멍한 눈으로 하늘을 올려다본다.

머릿속의 꿈의 인도자가 말한다. <i>"이제 네더스톤으로 브레인을 지배하자. 내가 그것을 다스리면 모두 자유로워질 것이다."</i>

하지만 마음 깊은 곳, 꿈의 인도자가 숨겨두었던 감옥에서 다른 목소리가 들린다. 은발을 묶은 젊은 전사, 꿈의 인도자가 오랫동안 가둬둔 기스 일족의 왕자 케일이다. <i>"믿지 마라! 저 존재는 결국 자기 일족의 길을 갈 것이다. 나를 풀어라. 함께 싸우겠다."</i>`,
 choices:[{t:'꿈의 인도자를 믿는다',set:{emperor:1},go:'b3_final_rest'},{t:'케일 왕자를 풀어준다',check:{skill:'설득',dc:14,ok:'b3_orpheus',fail:'b3_final_rest'}}]},
b3_orpheus:{title:'상층 도시',who:['kael'],onEnter:{set:{orpheus:1}},text:`마음속 감옥의 문이 열린다. 은빛 갑옷의 젊은 왕자가 걸어 나온다. 뺨의 오래된 흉터 위로 처음 보는 햇빛이 비친다. 꿈의 인도자의 분노한 목소리가 사라진다.

케일이 검을 뽑는다. "백 년 만의 자유다. 이 검은 너를 위해 쓰겠다."`,choices:[{t:'최후의 결전으로',go:'b3_final_rest'}]},
b3_final_rest:{title:'최후의 전야',text:`엘더 브레인이 있는 하늘의 신경 다리 앞. 동료들이 모인다.

세이가 칼을 공중에 던졌다 받으며 농담을 하고, 알도르가 고글을 닦으며 계산을 중얼거리고, 브루노가 쇠팔을 두드린다. 올리가 모두에게 약초 차를 돌리고, 브렌나가 "너무 묽다"고 한다. 토르가가 처음으로 먼저 당신에게 말을 건다. "…좋은 쇠다, 너는."`,
 choices:[{t:'모두 함께 숨을 고른다',sub:'짧은 휴식 · 한 번만',not:['r34'],set:{r34:1},rest:1,go:'b3_final_rest'},{t:'엘더 브레인에게 간다',go:'b3_final'}]},
b3_final:{title:'네더브레인',who:['dreamguide','kael'],text:f=>`거대한 뇌가 촉수를 휘두르며 마인드 플레이어들을 불러낸다. 도시 전체가 그것의 숨결로 떨린다.

${f.orpheus?'케일 왕자가 칼을 들고 앞장선다.':'꿈의 인도자가 당신 곁에 빛나는 실체로 나타난다.'}`,
 combat:f=>({enemies:[boss('네더브레인',7,{hp:150,ac:15,dmg:'2d6+4'}),mob('마인드 플레이어',7,{hp:30})],allies:[f.orpheus?{name:'케일 왕자',hp:80,ac:18,atk:8,dmg:'2d6+5'}:{name:'꿈의 인도자',hp:70,ac:15,atk:8,dmg:'2d8+3'}],win:'b3_end'})},
b3_end:{title:'에필로그',ending:'win',text:f=>`엘더 브레인이 비명을 지르며 무너진다. 그 순간 수천 명의 머릿속에서 올챙이가 죽어간다. 당신의 머릿속에서도.

조용하다. 처음으로, 머릿속이 오롯이 당신 것이다.

${f.orpheus?'케일 왕자는 자신의 일족에게 돌아가 폭군 여왕에 맞서겠다고 맹세한다. 토르가가 그의 검을 다시 벼려주겠다고 한다.':'꿈의 인도자는 빛을 거두고 떠난다. "약속은 지켰다. 이제 우리는 각자의 길을 간다." 그가 정말 선한 존재였는지는, 아무도 모른다.'}

며칠 뒤, 동료들이 저마다의 길로 흩어지기 전 마지막 밤. 다 같이 마지막 모닥불에 둘러앉는다. 브루노가 크게 웃고, 세이가 줄타기를 하고, 알도르가 '하늘 다람쥐 5호' 설계도를 펼친다. 올리가 처음으로 엄마의 노래를 부른다.

브렌나가 당신에게만 들리게 말한다. 찻잔을 내밀며. "백 년 전에도 이런 밤이 있었지. 시끄러운 녀석들이랑. 이 도시는 늘 영웅을 낳는구나."

셀렌이 하늘을 가리킨다. "보세요. 붉은 별 옆에 작은 별들이 모였습니다. 백 년 전과 똑같이."

<b>— 발더스 게이트 3 완료 · 모든 이야기가 끝났습니다 —</b>`}
}});

addNodes('bg3',{
/* 1장 · 알도르의 태엽 부엉이 */
b3_owl:{title:'추락한 잔해',scene:'beach',who:['aldor'],text:`알도르가 갑자기 주머니를 뒤지며 허둥댄다. "틱! 틱이 없어! 내 태엽 부엉이! 마흔 해 동안 만든 거라고!"

그가 손가락으로 해안 너머를 가리킨다. 모래 위에 작은 발자국들. 고블린 셋이 반짝이는 무언가를 자루에 넣고 숲 쪽으로 끌고 가고 있다. 자루 안에서 "삐-익, 삐-익" 소리가 난다.

"틱은 내 기억을 저장해 둔 장치요. 내가 건망증이 심해서… 그게 없으면 내가 뭘 발명했는지도 다 잊어버린단 말이오!"`,
 choices:[{t:'고블린들을 쫓는다',go:'b3_owl_fight'},{t:'몰래 따라가 자루만 훔친다',check:{skill:'손재주',dc:13,ok:'b3_owl_ok',fail:'b3_owl_fight'}}]},
b3_owl_fight:{title:'해안 숲',scene:'forest',text:`고블린들이 자루를 내던지고 녹슨 칼을 뽑는다. "반짝이는 건 우리 거다!"`,combat:{enemies:[mob('고블린 약탈꾼',4,{hp:11,n:3})],win:'b3_owl_ok'}},
b3_owl_ok:{title:'해안 숲',scene:'forest',who:['aldor'],onEnter:{set:{owl:1},bond:{aldor:1},loot:'t_focus'},text:`자루에서 손바닥만 한 놋쇠 부엉이가 튀어나와 알도르의 머리 위로 날아간다. 알도르가 그것을 품에 안고 한참 쓰다듬는다.

"틱, 틱. 다행이다." 부엉이의 눈이 깜빡이며 작은 목소리로 녹음된 말을 재생한다. <i>"알도르, 오늘 할 일: 비행 기계 날개 고치기. 점심 먹기. 그리고 잊지 마. 너는 좋은 사람이야."</i>

알도르가 헛기침을 한다. "어, 그 마지막 건… 아내가 녹음해 둔 거요. 오래전에 떠났지만." 그가 주머니에서 작은 수정을 꺼낸다. "이건 고마움의 표시요. 틱 예비 부품인데, 마법 집중에도 좋소."`,choices:[{t:'숲으로 향한다',go:'b3_gate'}]},
/* 2장 · 브루노의 쇠팔 */
b3_arm:{title:'황폐한 마을 대장간',scene:'ruins',who:['bruno','torga'],text:f=>`마을에 들어서자 브루노가 비틀거린다. 쇠팔에서 검은 연기가 뿜어져 나오고, 관절이 끼익거리며 굳는다. "젠장… 지옥 쇠는 이 세상 공기가 안 맞나 봐. 이러다 팔이 통째로 굳어버리겠어."

폐허 한가운데 무너진 대장간이 있다. 화덕은 아직 쓸 만해 보인다.${has('torga')?'\n\n토르가가 말없이 대장간으로 걸어간다. 망치를 집어 들고, 화덕에 불을 지핀다. 그녀가 브루노를 본다. "팔. 이리."':''}`,
 choices:[{t:'토르가에게 맡긴다',req:['has:torga'],go:'b3_arm_torga'},{t:'직접 고쳐본다',check:{skill:'조사',dc:13,ok:'b3_arm_ok',fail:'b3_arm_fail'}},{t:'나중에 한다',go:'b3_village'}]},
b3_arm_torga:{title:'대장간',scene:'ruins',who:['torga','bruno'],onEnter:{set:{arm:1},bond:{torga:1,bruno:1}},text:`토르가가 지옥 쇠를 화덕에 넣는다. 그녀의 비늘이 불빛에 붉게 빛난다. 망치 소리가 일정하게 울린다. 땅, 땅, 땅.

한참 뒤 그녀가 처음으로 길게 말한다. "우리 가문은 대장장이였다. 마을이 불탔을 때 다 잃었다. 망치 하나만 남았지. 그래서 아무것도 안 만들었다. 만들면 또 잃을 테니까."

그녀가 수리한 쇠팔을 브루노에게 끼워준다. 증기가 깨끗하게 뿜어져 나온다. "오늘 처음으로 다시 만들었다. 나쁘지 않군."

브루노가 쇠팔로 그녀의 어깨를 조심스럽게 두드린다. "…최고다, 대장장이."`,choices:[{t:'마을을 둘러본다',go:'b3_village'}]},
b3_arm_ok:{title:'대장간',scene:'ruins',who:['bruno'],onEnter:{set:{arm:1},bond:{bruno:1}},text:`화덕의 열로 굳은 관절을 달구고, 녹을 긁어낸다. 손이 데었지만 쇠팔이 다시 움직인다. 브루노가 손가락을 하나씩 접어본다.

"지옥에서 이 팔을 단 놈은 날 물건 취급했지. 근데 넌 사람 팔 고치듯 고쳐주네." 그가 크게 웃는다. "이거 평생 갚아야겠는데?"`,choices:[{t:'마을을 둘러본다',go:'b3_village'}]},
b3_arm_fail:{title:'대장간',scene:'ruins',onEnter:{dmg:'1d6'},text:`불꽃이 튀어 손등을 덴다. 쇠팔은 여전히 끼익거린다. 브루노가 웃는다. "괜찮아. 마음만 받을게. 아직 주먹은 쥐어지니까."`,choices:[{t:'마을을 둘러본다',go:'b3_village'}]},
/* 3장 · 세이의 옛 주인 */
b3_sei:{title:'그림자 속 야영지',scene:'shadow',who:['sei'],text:`마지막 빛 여관으로 끌려온 절대자 광신도 포로들 사이에서, 세이가 한 남자를 보고 얼어붙는다. 살찐 얼굴, 손가락마다 반지. 그는 세이를 보고 이를 드러낸다.

"이게 누구야, 우리 곡예단의 꼬마 새 아닌가? 줄 위에서 떨어질 때마다 밥을 굶겼던." 그가 낄낄댄다. "벌레 박혀서 돌아왔구나. 절대자께서 너도 다시 내 소유로 돌려주실 거다."

세이의 웃음이 사라진다. 그녀의 손이 칼자루로 간다. 손이 떨린다.`,
 choices:[{t:'"세이, 너는 이제 누구의 소유도 아니야."',check:{skill:'설득',dc:13,ok:'b3_sei_free',fail:'b3_sei_rage'}},{t:'세이가 원하는 대로 하게 둔다',go:'b3_sei_rage'}]},
b3_sei_free:{title:'그림자 속 야영지',scene:'shadow',who:['sei'],onEnter:{set:{sei_free:1},bond:{sei:2},loot:'t_shadow'},text:`세이가 칼을 뽑는다. 그리고 남자의 목 대신, 그의 손가락에서 반지를 하나씩 베어 떨어뜨린다. 곡예단 아이들에게서 빼앗은 돈으로 산 반지들이다.

"이거, 곡예단 애들 몫이야. 내가 찾아서 돌려줄 거야." 그녀가 남자를 하퍼들에게 넘긴다. "재판받아. 나는 너처럼 안 해."

그날 밤, 세이가 당신에게 낡은 가죽 장갑을 건넨다. "줄 탈 때 끼던 거야. 이제 필요 없어. 이제 땅 위를 걸을 거니까." 처음으로, 눈까지 웃고 있다.`,choices:[{t:'여관으로 돌아간다',go:'b3_raid_win'}]},
b3_sei_rage:{title:'그림자 속 야영지',scene:'shadow',who:['sei'],onEnter:{set:{sei_free:1},bond:{sei:1}},text:`세이의 칼이 남자의 목 앞에서 멈춘다. 한참을 그대로 있다가, 그녀가 칼을 거둔다.

"…안 돼. 이러면 나도 저놈이랑 똑같아져." 그녀가 주저앉는다. 당신이 곁에 앉자, 그녀가 어깨에 머리를 기댄다. "조금만 이러고 있자. 조금만."`,choices:[{t:'여관으로 돌아간다',go:'b3_raid_win'}]},
/* 4장 · 피오나의 계약 */
b3_pact:{title:'하퍼 은신처 뒷마당',scene:'city',who:['fiona'],text:`밤. 피오나의 덩굴 문신이 붉게 타오르며 그녀의 목을 조여든다. 그녀가 숨을 헐떡이며 무릎을 꿇는다.

허공에 가시덤불 왕관을 쓴 형체가 나타난다. 그녀가 '숲의 정령'이라 믿었던 존재, 그 정체는 가시의 군주라는 이름의 악마다.

<i>"계약을 잊었느냐, 사냥꾼. 쇠팔의 사내를 죽이지 않았지. 대가는 네 영혼이다. 아니면… 지금 네 동료 하나를 바쳐라."</i>`,
 choices:[{t:'계약서의 허점을 찾아 따진다',check:{skill:'비전',dc:14,ok:'b3_pact_break',fail:'b3_pact_fight'}},{t:'"그녀는 너를 정령이라 믿고 계약했다. 거짓 계약은 무효다!"',check:{skill:'설득',dc:14,ok:'b3_pact_break',fail:'b3_pact_fight'}},{t:'가시의 군주에게 칼을 겨눈다',go:'b3_pact_fight'}]},
b3_pact_fight:{title:'가시의 군주',scene:'city',text:`가시의 군주가 웃는다. "그럼 힘으로 빼앗아 보거라." 바닥에서 가시덤불 하수인들이 솟아오른다.`,combat:{enemies:[elite('가시의 군주의 그림자',7),mob('가시덤불 하수인',7,{n:2})],win:'b3_pact_break'}},
b3_pact_break:{title:'하퍼 은신처 뒷마당',scene:'city',who:['fiona'],onEnter:{set:{pact_free:1},bond:{fiona:2}},text:`가시덤불 왕관이 비명을 지르며 흩어진다. 피오나의 뺨에서 덩굴 문신이 마른 잎처럼 바스러져 떨어진다.

그녀가 맨 뺨을 만져본다. 그리고 웃는다. 울면서. "…힘이 다 빠져나갔어. 이제 그냥 활 쏘는 하프엘프야."

그녀가 활을 고쳐 잡는다. "근데 이상하지. 계약 있을 때보다 지금이 더 잘 쏠 것 같아. 내 손으로 쏘는 거니까."`,choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]}
});

talks('bg3',{
 0:{torga:`토르가는 모닥불 가에서 망치 손잡이를 천으로 닦고 있다. 한참 아무 말이 없다.

"…불은 좋다." 그녀가 마침내 말한다. "쇠를 부드럽게 한다. 사람도."

그녀가 망치를 내려놓는다. "이 망치. 아버지 것이다. 마을이 불탔을 때 이것만 남았다. 너도 뭔가 잃었나." 당신이 대답하기 전에 그녀가 고개를 끄덕인다. "그래. 그럼 우린 같은 쇠다."`,
  olly:`올리가 약초를 다듬으며 쉬지 않고 떠든다. 이 풀은 배탈에 좋고, 저 풀은 불면증에, 그리고 이건 그냥 맛있어서.

그러다 갑자기 조용해진다. "있잖아요. 저 어릴 때 기억이 없어요. 일곱 살 전부. 눈 떠보니 약초원 할머니 집이었어요. 할머니는 제가 길에 쓰러져 있었대요."

그가 외투 안의 유물을 만진다. "이것만 쥐고 있었대요. 이게 뭔지 모르겠어요. 근데 이상하게… 버릴 수가 없어요."`,
  sei:`세이가 단검 세 개로 저글링을 한다. 칼날이 불빛에 반짝인다.

"곡예단에서 자랐어. 줄타기, 공중제비, 칼 던지기. 관객들은 늘 웃었지. 나도 웃었고. 웃어야 밥을 줬거든."

칼 하나가 손에서 미끄러진다. 그녀가 그걸 바닥에 떨어지기 전에 받는다. "…그 버릇이 아직 안 없어져. 아무 때나 웃는 거. 이상하면 말해 줘."`,
  aldor:`알도르가 고글을 이마에 올리고 별을 올려다본다. "저건 큰곰자리고, 저건… 음, 저것도 큰곰자리인가?"

"나는 노움치고도 건망증이 심하오. 아내가 그래서 틱을 만들어 줬지. 내 기억을 대신 들고 다니라고." 그가 놋쇠 부엉이를 쓰다듬는다.

"아내가 떠난 지 스무 해요. 근데 틱 덕분에 아내 목소리는 안 잊어버렸소. 발명이란 그런 거요. 잃어버릴 것들을 붙잡아 두는 거."`,
  fiona:`피오나가 화살촉을 갈고 있다. 뺨의 덩굴 문신이 모닥불에 희미하게 빛난다.

"어릴 때 숲에서 길을 잃었어. 사흘 동안. 굶어 죽기 직전에 목소리가 들렸지. 살려줄 테니 계약하자고. 그게 숲의 정령이었어."

그녀가 문신을 손가락으로 쓸어본다. "그 뒤로 활을 쏘면 절대 안 빗나가. 근데 가끔… 그 목소리가 너무 다정해서 무서워."`},
 1:{torga:`토르가가 모닥불 앞에서 작은 쇳조각을 두드리고 있다. 무언가를 만들고 있다.

"브루노의 팔을 고치고 나서. 손이 근질거린다. 다시 만들고 싶다." 그녀가 완성된 작은 쇠 장미를 당신에게 내민다. "연습이다. 받아라."

그녀가 잠깐 망설인다. "…다시 만들기 시작한 건 너희 덕이다. 말은 못 하겠으니 쇠로 한다."`,
  olly:`올리가 축제에서 얻어온 과자를 모두에게 나눠준다. 자기 몫은 없다.

"저는 괜찮아요! 사제는 나누는 사람이니까요!" 그가 웃다가, 목소리를 낮춘다. "근데요… 요즘 꿈에서 누가 자꾸 불러요. '귀여운 아이야, 돌아오렴.' 엄청 다정한 목소리인데 소름이 끼쳐요."

"그 유물 때문일까요? 그래도 못 버리겠어요. 이게 제 과거의 유일한 조각이니까."`,
  sei:`세이가 줄 위에서 내려와 당신 옆에 앉는다. 숨이 차 있다.

"오늘 축제에서 공중제비 돌았잖아. 다들 박수 쳐줬지. 근데 이번엔 밥 때문에 돈 게 아니야. 그냥 하고 싶어서 했어." 그녀가 손목의 족쇄 자국을 만진다.

"이게 처음이야. 하고 싶어서 재주를 부린 거. 기분 이상하다. 좋은 쪽으로."`,
  aldor:`알도르가 무언가를 열심히 그리고 있다. '하늘 다람쥐 5호' 설계도다.

"이번엔 날개를 네 개로 하겠소. 3호는 두 개라 떨어졌고, 4호는 세 개라 마인드 플레이어한테 잡혔지." 그가 진지하게 고개를 끄덕인다. "네 개면 완벽하오."

"다 만들면 제일 먼저 태워주겠소. 물론 떨어질 수도 있지만, 그건 과학의 영광이오!"`,
  fiona:`피오나가 브루노 쪽을 힐끔 본다. 브루노는 장작을 패다 또 장작더미를 무너뜨렸다.

"내 계약 정령이 저 사람을 죽이라고 했어. 근데 저 사람, 아까 티플링 애들한테 쇠팔로 그네 태워주고 있더라. 악마가 저렇게 웃을 리가 없잖아."

그녀가 문신을 손톱으로 긁는다. "내가 믿어온 게 뭐였는지 모르겠어. 십 년 넘게 그 목소리를 믿었는데."`,
  bruno:`브루노가 쇠팔을 모닥불에 대고 손바닥을 데운다. 쇠팔은 아무것도 못 느끼지만, 버릇이라고 한다.

"지옥 전쟁터에서 십 년. 거기선 불이 다 적이었지. 근데 이 불은 따뜻하네." 그가 크게 웃는다. 웃음이 조금 떨린다.

"하겐. 내 상관이었어. 날 믿었던 부하들까지 같이 팔아넘겼지. 나만 살아 돌아왔어." 그가 주먹을 쥔다. 쇠가 삐걱거린다. "그 녀석들 몫까지 갚아줄 거야."`},
 2:{torga:`토르가가 마르케스의 낫 조각을 들어 살핀다. "좋은 쇠다. 나쁜 손에 있었을 뿐."

그녀가 당신을 본다. "쇠는 탓하지 않는다. 쥔 손을 탓한다. 너의 머리 벌레도 마찬가지다. 그것이 너를 만들지 않는다. 네 손이 만든다."

그 말을 하고 그녀는 망치질로 돌아간다. 오늘 그녀가 한 말 중 가장 길다.`,
  olly:f=>f.shar_free?`올리가 엄마의 노래를 흥얼거린다. 서툴지만 계속.

"기억이 다 돌아왔어요. 샤르 교단이 저를 데려가서 기억을 지웠어요. 그 유물로 저를 첩자로 키우려고. 근데 일곱 살에 도망쳤대요. 그 기억까지 지워버렸던 거고."

그가 당신 손을 잡는다. "그때 '네 마음대로 해'라고 해줘서 고마워요. 처음으로 누가 제 마음을 물어봐 줬어요."`:`올리가 시험장에서 돌아온 뒤로 말수가 줄었다. 유물은 아직 그의 외투 안에 있다.

"그 목소리가 '보답하라'고 했어요. 저를 길러준 자들한테. 근데 저를 길러준 건 약초원 할머니인데…" 그가 고개를 흔든다. "생각할 시간이 필요해요."`,
  sei:`세이가 하퍼들에게 넘겨진 옛 주인 쪽을 보지 않는다.

"생각보다 작더라. 그 남자. 어릴 땐 산만 하게 보였는데." 그녀가 웃는다. 이번엔 진짜 웃음이다.

"곡예단 애들 찾을 거야. 반지 팔아서. 다 끝나면. 같이 찾아줄래? 넌 사람 찾는 데 소질 있잖아. 날 찾았으니까."`,
  aldor:`알도르가 틱을 무릎에 올려놓고 무언가를 녹음하고 있다.

"오늘 일을 녹음해 두는 거요. 잊어버리기 전에. '마지막 빛 여관에서 브렌나라는 드워프가 너무 쓴 차를 줬음. 근데 맛있었음.'"

그가 틱을 당신 쪽으로 돌린다. "당신도 한마디 해 주시오. 나중에 내가 잊어버려도, 틱은 기억할 테니까."`,
  fiona:`피오나가 숲 쪽을 오래 바라본다. 문신이 요즘 자주 아프다고 한다.

"그림자 저주 땅에 오니까 목소리가 더 커졌어. 쇠팔 사내를 죽이라고, 죽이라고." 그녀가 귀를 막는다. "안 할 거야. 근데 언젠가 대가를 치러야겠지."

"그때 옆에 있어 줄래? 혼자는 좀… 무서워서."`,
  bruno:`브루노가 마르케스의 탑을 돌아본다. "저놈도 결국 누군가한테 이용당한 거 아닐까. 불사의 힘이라는 미끼에."

"나도 지옥에서 그런 놈들 많이 봤어. 처음엔 다 영웅이 되고 싶었지." 그가 쇠팔을 쥐었다 편다.

"고마워. 너희랑 다니면서 이 팔이 무기만은 아니라는 걸 알았어. 애들 그네도 태우고, 장작도 패고." 그가 웃는다. "장작은 망가뜨렸지만."`,
  brenna_old:`브렌나가 찻잔 두 개를 꺼낸다. 하나는 당신 것, 하나는 빈자리에 놓는다.

"백 년 전, 나는 발더스 게이트를 구한 녀석들과 다녔다. 고글 쓴 수다쟁이 꼬마, 시 쓰는 하프오크, 별쟁이 엘프. 그리고…" 그녀가 머리의 은 구슬을 만진다. "내 동생. 노래를 크게 부르던."

"인간은 금방 늙더군. 그 꼬마도 오래전에 갔다. 드워프는 남겨지는 종족이야." 그녀가 빈 잔에 차를 따른다. "그래도 이렇게 다시 시끄러운 녀석들을 만나는군. 나쁘지 않다."`},
 3:{torga:`토르가가 마지막 밤, 모두에게 작은 쇠 조각을 하나씩 나눠준다. 당신 것은 작은 별 모양이다.

"다시 대장간을 연다. 내 마을이 있던 자리에." 그녀가 당신을 본다. 드래곤본의 얼굴로는 표정을 읽기 어렵지만, 지금은 분명히 웃고 있다. "찾아와라. 무기는 공짜다. 수리비는 받는다."`,
  olly:`올리가 모두를 위해 마지막 요리를 한다. 이번엔 자기 몫도 챙겼다.

"약초원으로 돌아갈 거예요. 할머니한테 다 말할 거예요. 기억이 돌아왔다고." 그가 웃는다. "그리고 샤르 교단에서 도망친 다른 아이들도 찾을 거예요. 저 같은 애들 많을 거예요."

"사제는 나누는 사람이니까요. 이번엔 기억도 나눠줄 거예요."`,
  sei:`세이가 모닥불 위로 마지막 공중제비를 돈다. 박수가 쏟아진다. 그녀가 착지해서 고개를 숙인다.

"곡예단을 만들 거야. 내 곡예단. 아무도 굶기지 않고, 아무도 사슬에 묶이지 않는." 그녀가 당신에게 첫 공연 표를 내민다. 손으로 그린 표다.

"맨 앞자리야. 꼭 와야 해. 안 오면 찾아갈 거야. 나 사람 찾는 데도 소질 있거든."`,
  aldor:`알도르가 '하늘 다람쥐 5호' 설계도를 완성했다. 날개가 다섯 개다. 네 개에서 하나가 늘었다.

"오늘 일은 틱에 다 녹음했소. 하나도 안 잊을 거요." 그가 틱의 버튼을 누른다. 녹음된 당신의 목소리가 흘러나온다. 언젠가 했던 말이다.

알도르가 웃는다. "봤소? 발명이란 이런 거요. 좋은 순간을 붙잡아 두는 것."`,
  fiona:f=>f.pact_free?`피오나가 맨 뺨에 바람을 맞으며 눈을 감는다.

"계약 없이 쏘는 활, 생각보다 자주 빗나가." 그녀가 웃는다. "근데 맞으면 진짜 내가 맞힌 거야. 그게 좋아."

function makeTrials(cid,hook,tag){const nodes={};
 Object.entries(TRIALS).forEach(([cls,T])=>{const p=`tr_${tag}_${cls}`;
  nodes[p+'_a']={title:T.place,who:[T.who],scene:'trial',text:T.intro+'\n\n<small class="muted">시험관이 먼저 상처를 돌봐 준다. (HP·능력 회복)</small>',onEnter:{heal:'full',rest:1},choices:[
   {t:'시험을 받는다',go:p+'_b',tone:'curious'},{t:'지금은 아니다 (돌아간다)',go:hook}]};
  nodes[p+'_b']={title:T.place,who:[T.who],scene:'trial',text:T.ch,choices:[
   {t:`도전한다 (${T.skill})`,check:{skill:T.skill,dc:()=>10+fl((S.char?S.char.level:10)/2),ok:p+'_ok',fail:p+'_fail'}}]};
  nodes[p+'_ok']={title:T.place,who:[T.who],scene:'trial',text:T.ok,choices:[{t:'싸운다',go:p+'_c'}]};
  nodes[p+'_fail']={title:T.place,who:[T.who],scene:'trial',text:T.fail,onEnter:{dmg:'3d6'},choices:[{t:'싸운다',go:p+'_c'}]};
  nodes[p+'_c']={title:T.place,scene:'trial',text:'시험의 상대가 앞으로 나선다. 동료들이 한 걸음 물러선다. "이건 네 시험이야. 우린 여기서 볼게."',
   combat:()=>({enemies:T.foes(Math.max(1,(S.char?S.char.level:10)-foeDelta())),win:p+'_d',noParty:true})};
  nodes[p+'_d']={title:T.place,who:[T.who],scene:'trial',text:T.pass+JOB_WARN,onEnter:{set:{trial_done:1},heal:'full'},
   choices:subsOf(cls).map(s=>({t:`${SUBS[s].icon} ${SUBS[s].name} — ${SUBS[s].desc}`,sub:SUBS[s].perks.join(' · '),job:s,go:hook})).concat([{t:'조금 더 생각해 본다 (나중에 다시 와서 고를 수 있어요)',go:hook}])};
 });
 addNodes(cid,nodes);
 const n=NODES[hook];const at=n.choices.length;
 Object.keys(TRIALS).forEach(cls=>{
  n.choices.push({t:`🌟 2차 전직의 시험 (${CLASSES[cls].name} · 10레벨 이상)`,req:['class:'+cls,'lv:10'],not:['trial_done'],go:`tr_${tag}_${cls}_a`});
  n.choices.push({t:'🌟 2차 전직 고르기',req:['class:'+cls,'trial_done'],not:['sub:any'],go:`tr_${tag}_${cls}_d`});});}

"토마스? 어제 봤지. 창고 앞에서 인부들한테 이래라저래라 하더군. 평생 남한테 싫은 소리 한 번 못 하던 놈이… 그리고 이 더운 날 <b>왼손에만 장갑</b>을 끼고 있더라고. 이상하지?"`,choices:[{t:'고맙다고 하고 돌아선다',go:'docks'}]},
docks_window:{title:'창고 골목',text:`창고 옆 좁은 골목, 높은 곳에 반쯤 열린 환기창이 보인다. 빈 상자를 밟고 올라 소리 없이 안으로 미끄러져 들어간다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},
docks_bluffed:{title:'창고 정문',text:`덩치 하나가 당신을 위아래로 훑더니 턱짓한다. "늦었잖아. 안에 들어가서 소금 포대나 날라."

문이 열린다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},
docks_spotted:{title:'창고 거리',text:`너무 티가 났다. "거기 너! 뭘 기웃거려?" 깡패 둘이 몽둥이를 휘두르며 달려온다!`,combat:{enemies:[F('thug'),F('punk')],win:'docks_won'}},
docks_fight:{title:'창고 거리',text:`덩치들이 낄낄대며 다가온다. "여기 볼일 없을 텐데, 친구?"

docks_won:{title:'창고 거리',onEnter:{gold:8},text:`한 놈은 쓰러지고 다른 놈은 꽁지 빠지게 도망쳤다. 쓰러진 놈의 주머니에서 은화 8닢이 나온다.

fist:{title:'불꽃 주먹 초소',onEnter:{set:{fist_done:1}},text:`붉은 망토를 두른 경비대의 초소. 반 하사가 서류 더미 너머로 귀찮다는 듯 당신을 본다.

"하층 도시에서 사람 사라지는 게 하루 이틀 일인 줄 아나? 용건이 그거면 나가."`,
 choices:[
  {t:'"변신자를 직접 봤소." 회색 살덩이 이야기를 한다',req:['saw_doppel'],go:'fist_help'},
  {t:'사라진 사람들과 수상한 창고 이야기로 설득한다',not:['saw_doppel'],check:{skill:'설득',dc:f=>f.rumor?12:14,ok:'fist_help',fail:'fist_dismiss'}},

fist_help:{title:'불꽃 주먹 초소',onEnter:{set:{flare:1,pw:1},item:'붉은 신호탄'},text:`하사의 표정이 굳는다. "…소금 창고라. 요즘 그쪽 순찰 보고서가 이상하게 깨끗하더군."

그가 서랍에서 붉은 원통을 꺼낸다. <b>"신호탄이다. 지하에서 뭔가 찾으면 이걸 터뜨려. 우리 애들을 하수도 입구에 대기시키지."</b>

그리고 목소리를 낮춘다. "놈들 수문 암호가 <b>'썰물'</b>이라는 첩보가 있다. 믿을진 모르겠지만."`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'}]},
fist_dismiss:{title:'초소 밖',onEnter:{set:{pw:1}},text:`쫓겨나듯 초소를 나서는데, 앳된 신병 하나가 뒤따라와 소매를 잡는다.

"하사님은 안 믿으시지만… 저 하수도 수문 앞에서 밀수꾼들이 <b>'썰물'</b>이라고 말하는 걸 들었어요. 조심하세요."

신병은 그 말만 남기고 급히 돌아간다.`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'}]},

warehouse_in:{title:'소금 창고',text:`천장까지 쌓인 소금 포대와 상자들 사이로 어둠이 고여 있다.

그때 등 뒤에서 낯익은 목소리가 들린다. "…너구나! 정말 와 줬구나!"

토마스다. 수척하지만 멀쩡해 보인다. 그는 <b>왼손을 외투 주머니에 찔러 넣은 채</b> 반갑게 웃는다. "여긴 위험해. 안전한 길을 아니까 날 따라와."`,
 choices:[
  {t:'"반갑다. 왼손 좀 보여줘."',req:['scar'],go:'fake_reveal'},
  {t:'그의 말투와 몸짓을 유심히 살핀다',check:{skill:'통찰',dc:f=>f.tomas_seen?11:14,ok:'fake_reveal',fail:'fake_follow'}},
  {t:'안도하며 그를 따라간다',go:'fake_follow'}]},
fake_reveal:{title:'소금 창고',text:`'토마스'의 미소가 굳는다. 주머니에서 마지못해 빠져나온 왼손바닥은 매끈하다. 흉터 하나 없이.

"…눈치가 빠르네." 말이 끝나기도 전에 그의 얼굴이 흐물흐물 녹아내린다. 가짜다!`,combat:{enemies:[F('doppel',{name:'변신자 (토마스의 얼굴)'})],win:'warehouse_main'}},
fake_follow:{title:'함정',text:`그는 당신을 창고 뒤편 함정문으로 이끈다. 사다리를 내려가자마자 <b>철컥</b>—머리 위에서 문이 잠긴다.

어둠 속에서 '토마스'가 낄낄 웃는다. 그 얼굴이 촛농처럼 흘러내리고, 그림자에서 깡패 하나가 몽둥이를 들고 걸어 나온다.`,combat:{enemies:[F('doppel',{name:'변신자 (토마스의 얼굴)'}),F('punk',{name:'하수도 깡패'})],win:'fake_follow_win'}},
fake_follow_win:{title:'하수도 입구',text:`숨을 고른다. 함정문은 위에서 잠겼지만, 하수도는 어둠 속으로 계속 이어진다. 진짜 토마스는 어딘가 더 깊은 곳에 있을 것이다.`,
 choices:[{t:'벽에 기대 잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만 가능',not:['r1'],set:{r1:1},rest:1,go:'fake_follow_win'},{t:'하수도 깊이 들어간다',go:'sewer'}]},
warehouse_main:{title:'창고 안쪽',text:`창고는 다시 조용해졌다. 구석에는 밧줄에 묶인 채 정신을 잃은 남자가 있고, 훔친 화물 상자가 쌓여 있다. 바닥에는 쇠고리가 달린 함정문이 보인다.`,
 choices:[
  {t:'상자들을 뒤진다',not:['crates'],set:{crates:1},check:{skill:'조사',dc:11,ok:'crate_loot',fail:'crate_meh'}},
  {t:'묶인 남자를 깨운다',not:['captive'],go:'captive'},
  {t:'상자에 기대 잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만 가능',not:['r1'],set:{r1:1},rest:1,go:'warehouse_main'},
  {t:'함정문을 열고 하수도로 내려간다',go:'sewer'}]},
crate_loot:{title:'창고 안쪽',onEnter:{set:{ledger:1},gold:15,potions:1,item:'밀수 장부'},text:`훔친 화물 사이에서 <b>치유 물약</b> 하나와 은화 15닢, 그리고 가죽 장부를 찾는다.

장부에는 '바꿔치기'한 사람들의 이름과 날짜가 빼곡하다. 항만 관리관, 불꽃 주먹 장교 둘… 그리고 내일 날짜 옆에는 단 한 단어: <b>'항만장'</b>.`,choices:[{t:'장부를 챙긴다',go:'warehouse_main'}]},
crate_meh:{title:'창고 안쪽',onEnter:{gold:4},text:`소금, 소금, 또 소금. 상자 틈에 굴러다니던 은화 4닢이 전부다.`,choices:[{t:'돌아선다',go:'warehouse_main'}]},
captive:{title:'창고 안쪽',onEnter:{set:{captive:1}},text:`찬물을 끼얹자 남자가 콜록이며 눈을 뜬다. 하역꾼 데인이다.

"그놈들이… 토마스를 아래로 끌고 갔어. 지하 저수조로. 두목은 <b>'회색 부인'</b>이라 불리는 여자야. 토마스 얼굴로 뭔가 큰일을 꾸민다고 했어…"

밧줄을 풀어주자 그는 비틀거리며 창고 밖으로 달아난다.`,choices:[{t:'돌아선다',go:'warehouse_main'}]},

sewer:{title:'하수도',text:`무릎까지 차오르는 오물 냄새가 코를 찌른다. 어둠 저편에서 찍찍거리는 소리와 함께 붉은 눈 여러 쌍이 번득인다. 개만 한 쥐들이다.`,
 choices:[
  {t:'벽에 바짝 붙어 소리 없이 지나간다',check:{skill:'은신',dc:12,ok:'sewer_gate',fail:'sewer_rats'}},
  {t:'횃불을 휘둘러 쥐떼를 쫓아낸다',check:{skill:'생존',dc:12,ok:'sewer_gate',fail:'sewer_rats'}},
  {t:'먼저 공격한다',go:'sewer_rats'}]},
sewer_rats:{title:'하수도',text:`굶주린 거대 쥐들이 이빨을 드러내며 덮쳐온다!`,combat:{enemies:[F('rat'),F('rat')],win:'sewer_gate'}},
sewer_gate:{title:'수문',text:`녹슨 철창 수문이 길을 막는다. 너머로 횃불 빛이 일렁인다. 철창 틈새로 쉰 목소리가 흘러나온다.

"…암호."`,
 choices:[
  {t:'"썰물."',req:['pw'],go:'gate_pass'},
  {t:'"…밀물?" 그럴듯하게 둘러댄다',not:['pw','gtry'],set:{gtry:1},check:{skill:'기만',dc:15,ok:'gate_pass',fail:'gate_fight'}},
  {t:'문지기가 한눈판 사이 자물쇠를 딴다',not:['gtry'],set:{gtry:1},check:{skill:'손재주',dc:14,ok:'gate_sneak',fail:'gate_fight'}},
  {t:'철창을 힘으로 비틀어 연다',not:['gtry'],set:{gtry:1},check:{skill:'운동',dc:15,ok:'gate_sneak',fail:'gate_fight'}},
  {t:'"열어라!" 하고 문지기에게 덤빈다',go:'gate_fight'}]},
gate_pass:{title:'수문',text:`수문이 삐걱이며 열린다. 문지기는 당신을 힐끗 보더니 관심을 끈다.

"회색 부인께서 기다리신다. 늦었어."`,choices:[{t:'안으로 들어간다',go:'cistern'}]},
gate_sneak:{title:'수문',text:`철창이 소리 없이 열린다. 문지기는 벽에 기대 꾸벅꾸벅 졸고 있다. 그 옆을 숨죽여 지나간다.`,choices:[{t:'안으로 들어간다',go:'cistern'}]},
gate_fight:{title:'수문',text:`"침입자다!" 문지기가 갈고리 칼을 뽑아 들고 철창을 밀어젖힌다!`,combat:{enemies:[F('gate')],win:'cistern'}},

cistern:{title:'지하 저수조',text:`거대한 돌 아치 아래 검은 물이 고요하다. 물 한가운데 섬처럼 솟은 단 위에 <b>토마스가 기둥에 묶여 있다</b>. 진짜 토마스다. 왼손바닥의 흉터가 횃불에 비친다.

그 앞의 잿빛 로브 여인, <b>회색 부인</b>이 토마스의 얼굴을 손끝으로 더듬으며 자기 얼굴을 천천히 그의 모습으로 빚고 있다. 곁에선 변신자 졸개 하나가 칼을 갈고 있다.

"내일 아침, 항만장은 '친구 토마스'를 반갑게 맞아 금고 문을 열어주겠지…"

아직 당신을 못 봤다.`,
 choices:[
  {t:'붉은 신호탄을 터뜨린다',req:['flare'],go:'final_backup'},
  {t:'장부를 치켜들고 외친다: "사본은 이미 불꽃 주먹에 넘어갔다!"',req:['ledger'],check:{skill:'위협',dc:13,ok:'final_bluff',fail:'final_full'}},
  {t:'그림자를 따라 몰래 다가가 토마스를 풀어준다',check:{skill:'은신',dc:14,ok:'final_freed',fail:'final_full'}},
  {t:'숨어서 잠시 숨을 고른다',sub:'짧은 휴식 · 한 번만 가능',not:['r2'],set:{r2:1},rest:1,go:'cistern'},
  {t:'무기를 뽑고 돌격한다',go:'final_full'},
  {t:'…감당할 수 없다. 돌아서 도망친다',go:'ending_flee'}]},
final_full:{title:'지하 저수조',text:`회색 부인이 고개를 돌린다. 반쯤 토마스가 된 얼굴이 기괴하게 웃는다.

"손님이 왔네. 마침 얼굴 하나가 더 필요했는데."

졸개가 칼을 들고 물을 가르며 달려온다!`,combat:{enemies:[F('boss'),F('doppel',{name:'변신자 졸개',hp:14,max:14})],win:'ending_win'}},
final_backup:{title:'지하 저수조',onEnter:{set:{backup:1}},text:`붉은 빛이 아치 천장을 핏빛으로 물들인다. 잠시 후 수로 저편에서 군화 소리와 함성—<b>불꽃 주먹이다!</b>

병사들이 졸개를 덮쳐 물속에 처박는다. 회색 부인이 날카롭게 비명을 지르며 당신에게 달려든다.`,combat:{enemies:[F('boss')],allies:[{name:'불꽃 주먹 병사들',atk:4,dmg:'1d6+2',hp:30,ac:15}],win:'ending_win'}},
final_bluff:{title:'지하 저수조',text:`졸개의 얼굴이 하얗게 질린다. "끝났어, 다 끝났다고!" 놈은 칼을 버리고 검은 물속으로 뛰어들어 달아난다.

회색 부인이 이를 간다. "겁쟁이 같으니. 그럼 너라도 데려가야지."`,combat:{enemies:[F('boss')],win:'ending_win'}},
final_freed:{onEnter:{set:{freed:1}},title:'지하 저수조',text:`기둥 뒤로 숨어든 당신이 밧줄을 끊는다. 토마스가 눈을 번쩍 뜬다.

그 순간 들킨다! 하지만 토마스가 풀린 쇠사슬을 휘둘러 달려오던 졸개를 물속으로 처박는다.

"이 녀석은 내가 맡을게! 저 여자를 막아!"`,combat:{enemies:[F('boss')],allies:[{name:'토마스',atk:3,dmg:'1d6+1',hp:30,ac:15}],win:'ending_win'}},

ending_win:{title:'에필로그',ending:'win',onEnter:{gold:100},text:f=>`회색 부인의 몸이 잿빛 밀랍처럼 무너져 내린다. 저수조에 정적이 내려앉는다.

${f.freed?'토마스가 거친 숨을 몰아쉬며 당신 어깨를 붙잡는다.':'당신은 기둥으로 달려가 토마스의 밧줄을 끊는다.'} "올 줄 알았어. 정말 올 줄 알았다고."

${f.ledger?'당신이 건넨 장부 덕분에 불꽃 주먹은 그날 밤 바꿔치기된 관리들을 하나하나 찾아냈다. 항만장은 무사했고, 시의회는 당신에게 감사장과 함께 금화 100닢을 보냈다.':'회색 부인은 쓰러졌지만, 그녀가 누구누구의 얼굴을 훔쳤는지는 알 길이 없다. 그래도 항만장은 무사했고, 그의 사례금으로 금화 100닢이 손에 들어왔다.'}

며칠 뒤 부서진 닻 여관. 마르다가 공짜 맥주를 내려놓으며 말한다. "이 도시엔 아직 남의 얼굴을 쓴 놈들이 남아 있을 거야."

토마스가 잔을 든다. "그럼 다음에도 도와줄 거지?"

<b>— 모험 완료 —</b>`},
ending_flee:{title:'에필로그',ending:'flee',text:`당신은 수로를 거슬러 정신없이 달린다. 등 뒤에서 회색 부인의 웃음소리가 메아리친다.

다음 날 아침, 항만장이 오랜 친구 토마스를 반갑게 맞아들였다는 소문이 하층 도시에 돈다. 그날 오후 항만 금고는 텅 비어 있었다.

그리고 그 뒤로 아무도 진짜 토마스를 보지 못했다.

<b>— 씁쓸한 결말 —</b>`}
}});

function paras(t){return t.trim().split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');}
function statbar(){const c=S.char;if(!c||S.menu&&S.tab==='adv')return'';const k=K();
 return`<div class="hpbar"><i style="width:${Math.round(c.hp/c.maxhp*100)}%"></i><span>❤️ ${c.hp} / ${c.maxhp}</span></div>
 <span class="chip">Lv ${c.level}</span><span class="chip">🛡️ ${c.ac}</span>${k.maxSlots?`<span class="chip">✨ ${c.slots}/${c.maxSlots}</span>`:''}<span class="chip">🧪 ${c.potions}</span><span class="chip">💰 ${c.gold}</span>`;}
function vMenu(){

 CAMPS.map(cp=>{const sv=cur===cp.id?{adv:S.adv}:S.saves[cp.id];const ch=sv?sv.adv.chapter:-1;
  return`<div class="card camp">${sceneArt({scene:{bg1:'keep',bg2:'lab',bg3:'hell',faceless:'sea'}[cp.id]||'road'})}<div class="scene-title">${esc(cp.sub)}${S.done[cp.id]?' · ✅ 완료':''}</div><h2>${esc(cp.title)}</h2><p class="muted">${esc(cp.desc)}</p>${legacyHint(cp.id)}
  <div>${cp.chapters.map((c,i)=>{const reached=sv&&sv.adv.chSnap[i];return`<div class="chap ${reached?'':'lock'}"><span>${i+1}장. ${esc(c.title)} <span class="muted" style="font-size:12px">Lv ${cp.startLevel+i}</span></span>${reached?`<button class="btn ghost sm" data-rch="${cp.id}:${i}">${i===ch?'이 장 다시':'다시 하기'}</button>`:'<span>🔒</span>'}</div>`;}).join('')}</div>
  <div class="row" style="margin-top:12px">${sv?`<button class="btn" data-resume="${cp.id}">▶ 이어하기 (${ch+1}장)</button><button class="btn ghost" data-newc="${cp.id}">처음부터</button>`:`<button class="btn" data-newc="${cp.id}">▶ 시작하기</button>`}</div></div>`;}).join('');}
function vAdv(){if(S.menu||!S.adv)return vMenu();
 const A=S.adv,cp=camp(A.camp),n=NODES[A.node];const text=typeof n.text==='function'?n.text(A.flags):n.text;
 let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost sm" data-a="menu">← 모험 목록</button><span class="muted" style="font-size:13px">${esc(cp.short||cp.title)} · ${A.chapter+1}장</span></div>`;

 if(A.roster.length)h+=`${A.party.map(id=>`<span class="chip">${portrait(id,'mini')} ${esc(cp.comps[id].name)}${hearts(bondOf(id))}<span class="rel r${relKey(bondOf(id))}">${relName(bondOf(id))}</span></span>`).join('')}${A.party.length?'':'<span class="muted" style="font-size:13px">함께 싸우는 동료 없음</span>'}${!A.combat?`<button class="btn ghost sm" data-a="party">동료 편성${A.roster.length>A.party.length?` (+${A.roster.length-A.party.length})`:''}</button>`:''}`;
 h+=`</div>`;
 h+=`<div class="card">${sceneArt(n)}${n.who&&n.who.length?`<div class="who">${n.who.map(id=>`<div class="whoc">${portrait(id)}<small>${esc((CAST[id]||{}).n||'')}</small></div>`).join('')}</div>`:''}<div class="scene-title">${esc(n.title||'')}</div>${A.fx.length?`<div class="fx">${A.fx.join('<br>')}</div>`:''}<div class="story">${paras(text)}</div>`;
 if(n.shop&&!A.combat)h+=`</div>${vShop(n.shop)}<div class="card">`;
 if(A.combat)h+=vCombat();
 else if(n.chapterEnd)h+=vTalks()+`<hr><div style="text-align:center"><div class="scene-title">— ${A.chapter+1}장 완료 —</div><button class="btn" style="margin-top:8px" data-a="nextch">레벨 업하고 ${A.chapter+2}장으로 →</button></div>`;
 else if(A.ended)h+=vTalks()+`<hr><div class="row"><button class="btn" data-a="menu">모험 목록으로</button><button class="btn ghost" data-go-tab="oracle">자유 모험 이어가기</button></div>`;
 else h+=`<div class="choices">${visible(n).map(({c:ch,i})=>{const dis=ch.gold<0&&S.char.gold<-ch.gold;let tag='';
   if(ch.check){const k=ch.check;tag+=`<span class="tag">${ABIL[SKILL[k.skill]]}(${k.skill}) DC ${dcOf(k)} · ${sgn(skillBonus(k.skill))}</span> `;}
   if(ch.gold<0)tag+=`<span class="tag">금화 ${-ch.gold}</span> `;if(ch.sub)tag+=`<span class="tag">${ch.sub}</span>`;
   const lk=bondLock(ch);if(lk)tag+=`<span class="tag lock">${esc(lk)}</span>`;
   return`<button class="choice" data-ch="${i}" ${dis||lk?'disabled':''}>${esc(ch.t)}${tag?'<br>'+tag:''}</button>`;}).join('')}</div>`;
 h+=`</div>`;return h;}
function vCombat(){const cb=S.adv.combat,c=S.char,k=K();
 let h=`<hr><div class="scene-title">⚔️ 전투 · ${cb.round}라운드</div>`;
 h+=cb.enemies.map((e,i)=>`<button class="enemy ${e.hp<=0?'dead':''} ${i===cb.target&&e.hp>0&&!cb.done?'tg':''}" data-tg="${i}"><span class="nm"><b>${esc(e.name)}</b> <span class="muted">AC ${e.ac}</span><div class="bar"><i style="width:${Math.round(e.hp/e.max*100)}%"></i></div></span><span>${e.hp}/${e.max}</span></button>`).join('');
 if(cb.allies.length)h+=`<div style="margin:8px 0 10px">${cb.allies.map(a=>`<div class="ally ${a.hp<=0?'down':''}" data-al="${cb.allies.indexOf(a)}">${a.key?portrait(a.key,'mini'):'🤝'} <b>${esc(a.name)}</b><span class="bar"><i style="width:${Math.round(a.hp/a.max*100)}%"></i></span><span>${a.hp>0?a.hp+'/'+a.max:'쓰러짐'}</span></div>`).join('')}</div>`;
 if(cb.done)h+=`<button class="btn" style="width:100%;margin-top:8px" data-a="won">승리! 계속하기 →</button>`;
 else{if(alive().length>1)h+=`<div class="muted" style="margin:-2px 0 8px">적을 눌러 목표를 바꿀 수 있어요.</div>`;
  h+=`<div class="grid2">`;
  k.attacks.forEach(a=>{h+=`<button class="act" data-act="${a.id}"><b>${a.name}</b><small>${a.desc}</small></button>`;});
  k.feats.forEach(a=>{const off=a.slot?c.slots<a.slot:a.max?!c.uses[a.id]:false;const offFree=a.free&&cb.free;
   h+=`<button class="act ${a.free?'free':''}" data-act="${a.id}" ${off||offFree?'disabled':''}><b>${a.name}${a.max?` (${c.uses[a.id]||0})`:''}</b><small>${a.desc}</small></button>`;});
  h+=`<button class="act free" data-act="potion" ${cb.potion||c.potions<1?'disabled':''}><b>🧪 치유 물약 (${c.potions})</b><small>추가 행동 · HP 회복 (턴마다 1회)</small></button>`;
  const nUse=Object.entries(inv(c).bag).filter(([id,n])=>n>0&&ITEMS[id]&&ITEMS[id].use).reduce((a,[,n])=>a+n,0);
  h+=`<button class="act" data-a="cbag" ${nUse?'':'disabled'}><b>🎒 아이템 (${nUse})</b><small>폭탄·물약·두루마리 사용</small></button></div>`;}
 h+=`<div class="log">${cb.log.slice(0,40).join('')||'<div class="muted">당신의 차례입니다.</div>'}</div>`;
 return h;}
