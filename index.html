<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="기내 D&amp;D">
<meta name="theme-color" content="#141118">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>기내 D&amp;D</title>
<style>
:root{
  --bg:#141118; --surface:#1e1a24; --surface2:#29232f; --line:#3a3242;
  --text:#ece4d4; --muted:#a99f90; --gold:#d9a441; --gold2:#f0c46a;
  --red:#d0573e; --green:#6fae6a; --blue:#6f9fd8;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.55}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
header.top{position:sticky;top:0;z-index:5;background:rgba(20,17,24,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:17px;letter-spacing:.02em;color:var(--gold2);font-weight:700}
.brand small{color:var(--muted);font-size:12px}
#statbar{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;flex-wrap:wrap}
#statbar:empty{display:none}
.hpbar{flex:1 1 120px;min-width:120px;height:20px;border-radius:10px;background:var(--surface2);position:relative;overflow:hidden;border:1px solid var(--line)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8f2c22,var(--red));transition:width .3s}
.hpbar span{position:relative;display:block;text-align:center;font-size:12px;line-height:18px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
main{padding:16px 16px calc(96px + var(--safe-b));max-width:680px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(24,20,29,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav.tabs button b{font-size:21px;line-height:1;font-weight:400}
nav.tabs button.on{color:var(--gold2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:19px;color:var(--gold2)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
.muted{color:var(--muted);font-size:14px}
.story{font-size:17px;line-height:1.75}
.story p{margin:0 0 12px}
.story i{color:#d8c9a8}
.scene-title{font-size:13px;letter-spacing:.12em;color:var(--gold);margin-bottom:4px}
.fx{background:var(--surface2);border-left:3px solid var(--gold);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;line-height:1.45;transition:transform .08s,border-color .15s}
.choice:active{transform:scale(.98);border-color:var(--gold)}
.choice[disabled]{opacity:.4}
.tag{display:inline-block;margin-top:5px;font-size:12px;color:var(--gold);background:rgba(217,164,65,.12);border-radius:6px;padding:1px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#1a140c;font-weight:700;border-radius:12px;padding:12px 16px;font-size:16px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cls{text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px}
.cls.on{border-color:var(--gold)}
.cls b{display:block;font-size:17px}
.cls small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:4px}
.abil{text-align:center;background:var(--surface2);border-radius:10px;padding:8px 2px}
.abil small{display:block;color:var(--muted);font-size:12px}
.abil b{display:block;font-size:20px}
.abil span{font-size:13px;color:var(--gold)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px}
.skills div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.skills .p{color:var(--gold2);font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:18px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.enemy{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.enemy.tg{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.enemy.dead{opacity:.35}
.enemy .nm{flex:1}
.enemy .bar{height:6px;background:#3a2a2a;border-radius:3px;overflow:hidden;margin-top:5px}
.enemy .bar i{display:block;height:100%;background:var(--red)}
.act{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act small{color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.act[disabled]{opacity:.35}
.act.free{border-style:dashed}
.log{font-size:14px;max-height:220px;overflow:auto;background:#17131b;border-radius:10px;padding:8px 10px;margin-top:10px}
.log div{padding:3px 0;border-bottom:1px solid #251f2b}
.log .hit{color:var(--gold2)} .log .hurt{color:#ff8f78} .log .ok{color:var(--green)}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1.1;color:var(--gold2);margin:6px 0}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.die{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 0;font-weight:700;font-size:17px}
.die:active{border-color:var(--gold);transform:scale(.96)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1a140c;font-weight:700}
.res{background:var(--surface2);border-radius:12px;padding:12px;margin-top:10px}
.res .k{font-size:22px;font-weight:800;color:var(--gold2)}
#overlay{position:fixed;inset:0;z-index:20;background:rgba(8,6,10,.78);display:none;align-items:center;justify-content:center;padding:24px}
#overlay.show{display:flex}
#overlay .card{width:100%;max-width:420px;text-align:center;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.ok-c{color:var(--green)} .bad-c{color:var(--red)}
.banner{background:#2a2012;border:1px solid #6b5124;color:#f3dcae;border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.party{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ally{display:flex;align-items:center;gap:8px;font-size:13px;background:#1b2420;border:1px solid #2e4238;border-radius:10px;padding:6px 10px;margin-bottom:6px}
.ally .bar{flex:1;height:5px;background:#26332c;border-radius:3px;overflow:hidden}
.ally .bar i{display:block;height:100%;background:var(--green)}
.ally.down{opacity:.4}
.camp{border-left:4px solid var(--gold)}
.chap{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.chap.lock{color:var(--muted)}
.lvl{display:inline-block;background:var(--gold);color:#1a140c;font-weight:800;border-radius:6px;padding:0 6px;font-size:12px;margin-left:4px}
.btn[disabled]{opacity:.35;filter:grayscale(.6)}
.btn.sm{white-space:nowrap;flex-shrink:0}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tog.on{border-color:var(--green)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>⚅ 기내 D&amp;D</h1><small id="offline"></small></div>
  <div id="statbar"></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="adv"><b>📜</b>모험</button>
  <button data-tab="char"><b>🛡️</b>캐릭터</button>
  <button data-tab="dice"><b>🎲</b>주사위</button>
  <button data-tab="oracle"><b>🔮</b>오라클</button>
  <button data-tab="journal"><b>✒️</b>기록</button>
</nav>
<div id="overlay"></div>

<script>
'use strict';
/* ================= 기본 도구 ================= */
const KEY='dnd-offline-v2';
const $=s=>document.querySelector(s);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1;};
const pick=a=>a[rnd(a.length)-1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod=v=>Math.floor((v-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
const fl=Math.floor;
function parseDice(e){const m=String(e).replace(/\s/g,'').match(/^(\d*)d(\d+)([+-]\d+)?$/i);return m?{n:+(m[1]||1),s:+m[2],b:+(m[3]||0)}:null;}
function roll(e,crit){const p=parseDice(e);const n=crit?p.n*2:p.n;const r=[];for(let i=0;i<n;i++)r.push(rnd(p.s));return{t:Math.max(0,r.reduce((a,b)=>a+b,0)+p.b),r,b:p.b};}
function d20(mode){const a=rnd(20),b=rnd(20);if(mode==='adv')return{v:Math.max(a,b),txt:`[${a}, ${b}]`};if(mode==='dis')return{v:Math.min(a,b),txt:`[${a}, ${b}]`};return{v:a,txt:`${a}`};}

/* ================= 규칙 ================= */
const ABIL={str:'근력',dex:'민첩',con:'건강',int:'지능',wis:'지혜',cha:'매력'};
const SKILL={'운동':'str','곡예':'dex','은신':'dex','손재주':'dex','조사':'int','비전':'int','역사':'int','종교':'int','통찰':'wis','지각':'wis','의학':'wis','생존':'wis','설득':'cha','기만':'cha','위협':'cha'};
const PB=L=>L>=9?4:L>=5?3:2;
const CLASSES={
 fighter:{name:'파이터',icon:'⚔️',diff:'쉬움',hp0:28,blurb:'두꺼운 갑옷과 롱소드. 가장 튼튼해서 처음 하기 좋아요.',abil:{str:16,dex:13,con:15,int:10,wis:12,cha:8},prof:['운동','위협','지각','생존'],gear:['체인 메일','방패','롱소드','밧줄 15m','횃불 3개']},
 rogue:{name:'로그',icon:'🗡️',diff:'보통',hp0:21,blurb:'숨어서 급소를 노리는 기술자. 기술 판정에 아주 강해요.',abil:{str:10,dex:16,con:14,int:12,wis:13,cha:12},prof:['은신','손재주','기만','지각','조사','통찰','곡예'],gear:['가죽 갑옷','레이피어','단검 2개','도둑 도구','갈고리 밧줄']},
 wizard:{name:'위저드',icon:'🔮',diff:'어려움',hp0:20,blurb:'강력한 주문을 쓰지만 몸이 약해요. 주문 슬롯 관리가 핵심.',abil:{str:8,dex:14,con:14,int:16,wis:12,cha:10},prof:['비전','조사','역사','통찰'],gear:['마법사 로브 (마법 갑옷 상시)','지팡이','주문서','잉크와 깃펜']},
 cleric:{name:'클레릭',icon:'✨',diff:'보통',hp0:24,blurb:'철퇴와 치유 주문. 튼튼하고 회복도 되는 균형형.',abil:{str:14,dex:10,con:14,int:10,wis:16,cha:12},prof:['통찰','설득','의학','종교'],gear:['체인 메일','방패','철퇴','성표','기도서']}
};
/* 레벨별 능력 계산 */
function kit(cls,L){const k=CLASSES[cls],p=PB(L),r={abil:k.abil,prof:k.prof,p,apa:1,attacks:[],feats:[],passive:[],sneak:null,dc:8+p+3};
 if(cls==='fighter'){Object.assign(r,{maxhp:k.hp0+8*(L-3),ac:L>=8?19:18,maxSlots:0,apa:L>=11?3:L>=5?2:1});
  r.attacks=[{id:'sword',name:'롱소드 공격',type:'attack',weapon:1,atk:p+3,dmg:'1d8+3',desc:`명중 ${sgn(p+3)} · 1d8+3${r.apa>1?` · ${r.apa}회 공격`:''}`}];
  r.feats=[{id:'secondwind',name:'재기의 바람',desc:`추가 행동 · HP 1d10+${L} 회복 (휴식마다 1회)`,max:1,type:'heal',heal:`1d10+${L}`,free:true},
   {id:'surge',name:'행동 연쇄',desc:'이번 턴 공격 횟수 두 배 (휴식마다 1회)',max:1,type:'multi'}];
  if(L>=5)r.passive.push(['추가 공격','공격할 때 '+r.apa+'번 휘두릅니다.']);}
 if(cls==='rogue'){const sn=Math.ceil(L/2);Object.assign(r,{maxhp:k.hp0+7*(L-3),ac:L>=6?15:14,maxSlots:0,sneak:`${sn}d6`});
  r.attacks=[{id:'rapier',name:'레이피어 공격',type:'attack',weapon:1,atk:p+3,dmg:'1d8+3',sneakR1:true,desc:`명중 ${sgn(p+3)} · 1d8+3 (첫 라운드엔 급소 +${sn}d6)`},
   {id:'hide',name:'숨었다가 급소 찌르기',type:'hide',weapon:1,atk:p+3,dmg:'1d8+3',dc:12,desc:`은신 DC 12 성공 시 이점 + 급소 ${sn}d6`}];
  if(L>=5)r.passive.push(['불가사의한 회피','매 라운드 처음 맞는 공격의 피해가 절반이 됩니다.']);}
 if(cls==='wizard'){Object.assign(r,{maxhp:k.hp0+5*(L-3),ac:15,maxSlots:L+3});
  r.attacks=[{id:'firebolt',name:'화염살',type:'attack',atk:p+3,dmg:L>=11?'3d10':L>=5?'2d10':'1d10',desc:`소마법 · 명중 ${sgn(p+3)} · ${L>=11?'3d10':L>=5?'2d10':'1d10'}`}];
  const mm=L>=9?'5d4+5':L>=5?'4d4+4':'3d4+3';
  r.feats=[{id:'missile',name:'마법 화살',desc:`슬롯 1 · 반드시 명중 ${mm}`,slot:1,type:'auto',dmg:mm},
   {id:'thunder',name:'천둥파',desc:`슬롯 1 · 모든 적 2d8 (내성 DC ${r.dc} 성공 시 절반)`,slot:1,type:'aoe',dmg:'2d8'}];
  if(L>=5)r.feats.push({id:'fireball',name:'화염구',desc:`슬롯 2 · 모든 적 8d6 (내성 DC ${r.dc} 성공 시 절반)`,slot:2,type:'aoe',dmg:'8d6'});
  if(L>=9)r.feats.push({id:'cone',name:'냉기 원뿔',desc:`슬롯 3 · 모든 적 8d8 (내성 성공 시 절반)`,slot:3,type:'aoe',dmg:'8d8'});}
 if(cls==='cleric'){Object.assign(r,{maxhp:k.hp0+7*(L-3),ac:L>=8?19:18,maxSlots:L+2});
  const sf=L>=11?'3d8':L>=5?'2d8':'1d8';
  r.attacks=[{id:'mace',name:'철퇴 공격',type:'attack',weapon:1,atk:p+2,dmg:L>=8?'2d6+2':'1d6+2',desc:`명중 ${sgn(p+2)} · ${L>=8?'2d6+2 (신성한 일격)':'1d6+2'}`},
   {id:'flame',name:'성스러운 불꽃',type:'save',dmg:sf,desc:`소마법 · 민첩 내성 DC ${r.dc} 실패 시 ${sf}`}];
  const cw=L>=9?'3d8+4':L>=5?'2d8+3':'1d8+3';
  r.feats=[{id:'cure',name:'치유의 손길',desc:`슬롯 1 · HP ${cw} 회복`,slot:1,type:'heal',heal:cw},
   {id:'bolt',name:'인도하는 화살',desc:`슬롯 1 · 명중 ${sgn(p+3)} · ${L>=9?'5d6':'4d6'}`,slot:1,type:'attack',atk:p+3,dmg:L>=9?'5d6':'4d6'}];
  if(L>=5)r.feats.push({id:'guard',name:'수호령',desc:`슬롯 2 · 모든 적 3d8 (내성 성공 시 절반)`,slot:2,type:'aoe',dmg:'3d8'});}
 return r;}

/* ================= 적·동료 생성 도우미 (스토리에서 사용) ================= */
function mob(name,L,o){return Object.assign({name,hp:4+3*L,ac:12+fl(L/3),atk:3+fl(L/2),dmg:`1d6+${1+fl(L/2)}`,save:1+fl(L/3)},o||{});}
function elite(name,L,o){return Object.assign({name,hp:10+5*L,ac:13+fl(L/3),atk:4+fl(L/2),dmg:`1d10+${2+fl(L/2)}`,save:2+fl(L/3)},o||{});}
function boss(name,L,o){return Object.assign({name,hp:30+12*L,ac:14+fl(L/3),atk:5+fl(L/2),dmg:`2d8+${2+fl(L/2)}`,save:3+fl(L/3),attacks:L>=6?2:1},o||{});}
function compStats(c,L){const R={
  tank:{hp:12+7*L,ac:17,atk:4+fl(L/2),dmg:`1d10+${2+fl(L/3)}`},
  striker:{hp:8+5*L,ac:15,atk:4+fl(L/2),dmg:`1d8+${3+fl(L/3)}`},
  caster:{hp:6+4*L,ac:12,atk:4+fl(L/2),dmg:`2d6+${fl(L/2)}`},
  healer:{hp:10+6*L,ac:16,atk:3+fl(L/2),dmg:`1d6+${2+fl(L/3)}`,heals:2,heal:`1d8+${2+fl(L/2)}`}}[c.role];
 return Object.assign({name:c.name,role:c.role,max:R.hp},R);}
const ROLE={tank:'탱커',striker:'공격수',caster:'마법사',healer:'치유사'};

/* ================= 캠페인 등록 ================= */
const CAMPS=[];const NODES={};
function CAMP(c){CAMPS.push(c);Object.entries(c.nodes).forEach(([id,n])=>{n.camp=c.id;NODES[id]=n;});}
const camp=id=>CAMPS.find(c=>c.id===id);

/* ================= 상태 ================= */
function fresh(){return{tab:'adv',hero:null,char:null,adv:null,saves:{},done:{},dice:{hist:[],count:1,mod:0,mode:'norm',last:null},chaos:5,like:2,journal:'',olast:null,draft:{cls:'fighter',name:''},menu:true};}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){S=null;}
if(!S){S=fresh();try{const old=JSON.parse(localStorage.getItem('dnd-offline-v1'));if(old&&old.char){S.hero={cls:old.char.cls,name:old.char.name};S.journal=old.journal||'';}}catch(e){}}
S=Object.assign(fresh(),S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const K=()=>S.char?applyGear(kit(S.char.cls,S.char.level),inv(S.char)):null;
const has=id=>!!(S.adv&&S.adv.roster.includes(id));
function skillBonus(sk,c){c=c||S.char||(S.hero&&makeChar(S.hero.cls,S.hero.name,3));const k=kit(c.cls,c.level),m=gearMods(c);return mod(k.abil[SKILL[sk]])+(k.prof.includes(sk)?k.p:0)+(m.skills[sk]||0)+(m.skills.all||0);}
function makeChar(cls,name,L){const k=kit(cls,L);const c={cls,name:name||CLASSES[cls].name,level:L,hp:k.maxhp,maxhp:k.maxhp,ac:k.ac,slots:k.maxSlots,maxSlots:k.maxSlots,uses:{},potions:3,gold:20,items:[...CLASSES[cls].gear],eq:{},bag:{}};k.feats.forEach(f=>{if(f.max)c.uses[f.id]=f.max;});return c;}
function syncChar(full){const c=S.char,k=K();const gain=k.maxhp-c.maxhp;c.maxhp=k.maxhp;c.ac=k.ac;c.maxSlots=k.maxSlots;c.hp=full?c.maxhp:Math.min(c.maxhp,c.hp+Math.max(0,gain));if(full)c.slots=c.maxSlots;c.slots=Math.min(c.slots,c.maxSlots);k.feats.forEach(f=>{if(f.max&&(full||c.uses[f.id]===undefined))c.uses[f.id]=f.max;});}

/* ================= 오버레이 ================= */
function modal(html,btns){const o=$('#overlay');o.innerHTML=`<div class="card">${html}<div class="row" style="justify-content:center;margin-top:16px">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-mb="${i}">${b.t}</button>`).join('')}</div></div>`;o.classList.add('show');o.onclick=e=>{const b=e.target.closest('[data-mb]');if(!b)return;o.classList.remove('show');o.onclick=null;btns[+b.dataset.mb].fn&&btns[+b.dataset.mb].fn();};}

/* ================= 모험 진행 ================= */
function fxApply(fx){const A=S.adv,c=S.char;const out=[];const cp=camp(A.camp);
 if(fx.set)Object.assign(A.flags,fx.set);
 if(fx.gold){const g=fx.gold<0?Math.max(fx.gold,-c.gold):fx.gold;if(g){c.gold+=g;out.push(`💰 금화 ${sgn(g)}`);}}
 if(fx.potions){c.potions=Math.max(0,c.potions+fx.potions);out.push(`🧪 치유 물약 ${sgn(fx.potions)}`);}
 if(fx.item&&!c.items.includes(fx.item)){c.items.push(fx.item);out.push(`🎒 '${fx.item}' 획득`);}
 if(fx.lose){const i=c.items.indexOf(fx.lose);if(i>=0){c.items.splice(i,1);out.push(`🎒 '${fx.lose}' 잃음`);}}
 if(fx.dmg){const r=roll(fx.dmg);c.hp=Math.max(0,c.hp-r.t);out.push(`💥 피해 ${r.t}`);}
 if(fx.heal){const b=c.hp;c.hp=fx.heal==='full'?c.maxhp:Math.min(c.maxhp,c.hp+roll(fx.heal).t);out.push(`💚 HP +${c.hp-b}`);}
 if(fx.leave)[].concat(fx.leave).forEach(id=>{if(A.roster.includes(id)){A.roster=A.roster.filter(x=>x!==id);A.party=A.party.filter(x=>x!==id);out.push(`👋 ${cp.comps[id].name}이(가) 일행을 떠났다`);}});
 if(fx.join)[].concat(fx.join).forEach(id=>{if(!A.roster.includes(id)){A.roster.push(id);if(A.party.length<3){A.party.push(id);out.push(`🤝 ${cp.comps[id].name} 합류!`);}else out.push(`🤝 ${cp.comps[id].name} 합류! (파티가 꽉 차서 대기 중 · '동료 편성'에서 바꿀 수 있어요)`);}});
 if(fx.loot)[].concat(fx.loot).forEach(id=>out.push(gainItem(id)));
 if(fx.rest)out.push(doRest(false));
 A.fx.push(...out);}
function doRest(full){const c=S.char,k=K();const before=c.hp;
 if(full){c.hp=c.maxhp;c.slots=c.maxSlots;}else{c.hp=Math.min(c.maxhp,c.hp+Math.ceil(c.maxhp/2));c.slots=Math.min(c.maxSlots,c.slots+Math.max(2,fl(c.maxSlots/3)));}
 k.feats.forEach(f=>{if(f.max)c.uses[f.id]=f.max;});
 return `😮‍💨 휴식: HP +${c.hp-before}${k.maxSlots?`, 주문 슬롯 ${c.slots}/${c.maxSlots}`:''}, 특수 능력 회복`;}
function snapshot(){const A=S.adv;return JSON.parse(JSON.stringify({char:S.char,flags:A.flags,roster:A.roster,party:A.party}));}
function stashCurrent(){if(S.adv)S.saves[S.adv.camp]={adv:S.adv,char:S.char};}
function startCamp(id){stashCurrent();const cp=camp(id);
 S.char=makeChar(S.hero.cls,S.hero.name,cp.startLevel);S.char.gold=cp.startGold||20;
 S.adv={camp:id,chapter:0,node:null,flags:{},roster:[],party:[],fx:[],cp:null,combat:null,ended:null,chSnap:{}};
 S.adv.chSnap[0]=snapshot();S.menu=false;enterNode(cp.chapters[0].start);}
function resumeCamp(id){if(S.adv&&S.adv.camp===id){S.menu=false;save();render();return;}stashCurrent();const sv=S.saves[id];S.adv=sv.adv;S.char=sv.char;delete S.saves[id];S.menu=false;save();render();window.scrollTo(0,0);}
function restartChapter(id,ch){if(!(S.adv&&S.adv.camp===id)){stashCurrent();const sv=S.saves[id];S.adv=sv.adv;S.char=sv.char;delete S.saves[id];}
 const A=S.adv,sn=JSON.parse(JSON.stringify(A.chSnap[ch]));S.char=sn.char;A.flags=sn.flags;A.roster=sn.roster;A.party=sn.party;A.chapter=ch;
 Object.keys(A.chSnap).forEach(k=>{if(+k>ch)delete A.chSnap[k];});S.menu=false;enterNode(camp(id).chapters[ch].start);}
function nextChapter(){const A=S.adv,cp=camp(A.camp);const c=S.char;const L0=c.level;
 c.level=Math.min(12,c.level+1);syncChar(true);A.chapter++;A.chSnap[A.chapter]=snapshot();
 modal(`<div style="font-size:44px">⬆️</div><h2>레벨 업! ${L0} → ${c.level}</h2><p class="muted">HP가 ${c.maxhp}(으)로 늘고, 완전히 회복했어요.${levelNote(c.cls,c.level)}</p>`,[{t:'다음 장으로',fn:()=>enterNode(cp.chapters[A.chapter].start)}]);save();}
function levelNote(cls,L){const n={fighter:{5:'추가 공격: 한 번에 두 번 휘둘러요!',8:'갑옷 강화: AC 19',11:'추가 공격 3회!'},rogue:{5:'불가사의한 회피: 매 라운드 첫 피해 절반!',6:'AC 15'},wizard:{5:'새 주문: 화염구! 화염살 강화',9:'새 주문: 냉기 원뿔! 마법 화살 강화'},cleric:{5:'새 주문: 수호령! 치유 강화',8:'신성한 일격: 철퇴 강화',9:'치유·인도하는 화살 강화'}}[cls][L];return n?`<br><b style="color:var(--gold2)">새 능력: ${n}</b>`:'';}
function enterNode(id){const A=S.adv,n=NODES[id];A.node=id;A.combat=null;A.fx=[];A.ended=null;
 A.cp=snapshot();
 if(n.onEnter&&!A.flags['_v_'+id])fxApply(n.onEnter);
 A.flags['_v_'+id]=1;
 if(n.combat)A.combat=setupCombat(typeof n.combat==='function'?n.combat(A.flags):n.combat);
 if(n.ending){A.ended=n.ending;S.done[A.camp]=true;}
 if(S.char.hp<=0)tryRevive();
 save();render();window.scrollTo(0,0);
 if(S.char.hp<=0)death();}
function reqOk(x){const f=S.adv.flags;if(x.startsWith('has:'))return has(x.slice(4));if(x.startsWith('party:'))return S.adv.party.includes(x.slice(6));if(x.startsWith('item:'))return S.char.items.includes(x.slice(5));if(x.startsWith('class:'))return S.char.cls===x.slice(6);return!!f[x];}
function visible(n){return(n.choices||[]).map((c,i)=>({c,i})).filter(({c})=>(!c.req||c.req.every(reqOk))&&(!c.not||!c.not.some(reqOk)));}
function dcOf(ch){return typeof ch.dc==='function'?ch.dc(S.adv.flags):ch.dc;}
function choose(i){const A=S.adv,n=NODES[A.node],ch=n.choices[i];if(S.char.hp<=0)return death();
 if(ch.gold<0&&S.char.gold<-ch.gold)return;
 A.fx=[];const pre=Object.assign({},ch);delete pre.check;delete pre.go;
 fxApply(pre);const keep=A.fx;
 const go=to=>{enterNode(to);if(keep.length){A.fx=keep.concat(A.fx);save();render();}};
 if(ch.check){const k=ch.check,dc=dcOf(k),b=skillBonus(k.skill),r=rnd(20),tot=r+b;
  const ok=r===20||(r!==1&&tot>=dc);save();
  modal(`<div class="scene-title">${ABIL[SKILL[k.skill]]}(${k.skill}) 판정 · DC ${dc}</div>
   <div class="big">${tot}</div><div class="muted">🎲 ${r} ${sgn(b)}${r===20?' · 대성공!':r===1?' · 대실패!':''}</div>
   <h2 class="${ok?'ok-c':'bad-c'}" style="margin-top:10px">${ok?'성공':'실패'}</h2>`,[{t:'계속',fn:()=>go(ok?k.ok:k.fail)}]);return;}
 go(ch.go);}

/* ---- 전투 ---- */
function expandFoes(list){const out=[];list.forEach(e=>{const n=e.n||1;for(let i=0;i<n;i++){const o=Object.assign({},e);delete o.n;if(n>1)o.name=`${e.name} ${i+1}`;o.max=o.max||o.hp;out.push(o);}});return out;}
function setupCombat(cfg){const A=S.adv,cp=camp(A.camp),L=S.char.level;
 const allies=[];if(!cfg.noParty)A.party.forEach(id=>{const c=cp.comps[id];if(c)allies.push(compStats(c,L));});
 (cfg.allies||[]).forEach(a=>allies.push(Object.assign({max:a.hp},a)));
 const mul=cp.hpMul||1;const en=expandFoes(cfg.enemies).map(e=>Object.assign(e,{hp:Math.round(e.hp*mul),max:Math.round(e.max*mul)}));
 return{enemies:en,allies,win:cfg.win,round:1,log:[],target:0,potion:false,free:false,done:false,dodged:false};}
function alive(){return S.adv.combat.enemies.filter(e=>e.hp>0);}
function tgt(){const cb=S.adv.combat;if(cb.enemies[cb.target]&&cb.enemies[cb.target].hp>0)return cb.enemies[cb.target];const a=alive()[0];cb.target=cb.enemies.indexOf(a);return a;}
function L(s,c){S.adv.combat.log.unshift(`<div class="${c||''}">${s}</div>`);}
function hitDmg(e,dmg,src){e.hp=Math.max(0,e.hp-dmg);L(`${src} → <b>${esc(e.name)}</b>에게 ${dmg} 피해${e.hp<=0?' · <b>쓰러짐!</b>':''}`,'hit');}
function weaponAttack(a,opts){opts=opts||{};const e=tgt();if(!e)return;const cb=S.adv.combat,k=K();
 const g=k.gear||{onhit:[]},bf=cb.buff||{atk:0,dmg:0};const atk=a.atk+(a.weapon?bf.atk:0);
 const dr=d20(opts.adv?'adv':'norm');const crit=dr.v===20||(a.weapon&&g.crit19&&dr.v===19);const tot=dr.v+atk;
 if(dr.v!==1&&(crit||tot>=e.ac)){let d=roll(a.dmg,crit).t+(a.weapon?bf.dmg:0),extra='';
  if(a.weapon)g.onhit.forEach(o=>{const x=roll(o,crit).t;d+=x;extra+=` (+${x})`;});
  if(k.sneak&&!cb.sneakUsed&&(opts.sneak||(a.sneakR1&&cb.round===1))){const s=roll(k.sneak,crit);d+=s.t;extra=` (급소 +${s.t})`;cb.sneakUsed=true;}
  hitDmg(e,d,`${a.name} 🎲${dr.txt}${sgn(atk)}=${tot}${crit?' 치명타!':''}${extra}`);}
 else L(`${a.name} 🎲${dr.txt}${sgn(atk)}=${tot} → ${esc(e.name)}(AC ${e.ac}) 빗나감`);}
function act(kind,id){const cb=S.adv.combat,c=S.char,k=K();if(!cb||cb.done||c.hp<=0)return;
 if(kind==='potion'){if(cb.potion||c.potions<1)return;c.potions--;cb.potion=true;const r=roll(`2d4+${2+fl(c.level/2)*2}`);const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+r.t);L(`🧪 치유 물약 → HP +${c.hp-b}`,'ok');save();render();return;}
 const a=[...k.attacks,...k.feats].find(x=>x.id===id);if(!a)return;
 if(a.free){if(cb.free||!c.uses[a.id])return;c.uses[a.id]--;cb.free=true;const r=roll(a.heal);const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+r.t);L(`${a.name} → HP +${c.hp-b}`,'ok');save();render();return;}
 if(a.slot){if(c.slots<a.slot)return;c.slots-=a.slot;}
 if(a.max){if(!c.uses[a.id])return;c.uses[a.id]--;}
 cb.sneakUsed=false;
 if(a.type==='attack'){const times=a.id===k.attacks[0].id&&c.cls==='fighter'?k.apa:1;for(let i=0;i<times;i++)if(alive().length)weaponAttack(a);}
 else if(a.type==='hide'){const r=rnd(20),b=skillBonus('은신');if(r+b>=a.dc){L(`그림자 속으로 숨는다 (은신 ${r}${sgn(b)}=${r+b}) ✔`,'ok');weaponAttack(a,{adv:true,sneak:true});}else{L(`숨기 실패 (은신 ${r}${sgn(b)}=${r+b}) — 그냥 찌른다`);weaponAttack(a);}}
 else if(a.type==='multi'){L(`<b>${a.name}!</b>`,'ok');for(let i=0;i<k.apa*2;i++)if(alive().length)weaponAttack(k.attacks[0]);}
 else if(a.type==='auto'){const e=tgt();hitDmg(e,roll(a.dmg).t,`✨ ${a.name}`);}
 else if(a.type==='aoe'){alive().forEach(e=>{const s=rnd(20)+e.save;let d=roll(a.dmg).t;if(s>=k.dc)d=fl(d/2);hitDmg(e,d,`💥 ${a.name}${s>=k.dc?' (내성, 절반)':''}`);});}
 else if(a.type==='save'){const e=tgt();const s=rnd(20)+e.save;if(s>=k.dc)L(`${a.name} → ${esc(e.name)}이(가) 피함 (내성 ${s})`);else hitDmg(e,roll(a.dmg).t,`🔥 ${a.name}`);}
 else if(a.type==='heal'){const r=roll(a.heal);const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+r.t);L(`${a.name} → HP +${c.hp-b}`,'ok');}
 endTurn();}
function endTurn(){const cb=S.adv.combat,c=S.char;
 cb.allies.forEach(al=>{if(al.hp<=0||!alive().length)return;
  if(al.role==='healer'&&al.heals>0&&c.hp<c.maxhp*0.45){al.heals--;const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+roll(al.heal).t);L(`💚 ${al.name}의 치유 → 당신 HP +${c.hp-b}`,'ok');return;}
  const e=tgt();const r=rnd(20);if(r!==1&&(r===20||r+al.atk>=e.ac))hitDmg(e,roll(al.dmg,r===20).t,`🤝 ${al.name}`);else L(`🤝 ${al.name}의 공격이 빗나감`);});
 if(!alive().length)return win();
 cb.dodged=false;const dodge=c.cls==='rogue'&&c.level>=5;const gm=K().gear,bac=(cb.buff&&cb.buff.ac)||0;
 alive().forEach(e=>{for(let i=0;i<(e.attacks||1);i++){if(c.hp<=0)return;
  const pool=[{me:1},{me:1},...cb.allies.filter(a=>a.hp>0)];const t=pool[rnd(pool.length)-1];
  const ac=t.me?c.ac+bac:t.ac;const r=rnd(20),tot=r+e.atk;
  if(r!==1&&(r===20||tot>=ac)){let d=roll(e.dmg,r===20).t;
   if(t.me){let note='';if(dodge&&!cb.dodged){cb.dodged=true;d=Math.ceil(d/2);note=' (회피로 절반)';}if(gm.resist){d=Math.max(1,d-gm.resist);}c.hp=Math.max(0,c.hp-d);if(c.hp<=0)tryRevive();L(`${esc(e.name)} 🎲${r}${sgn(e.atk)}=${tot}${r===20?' 치명타!':''} → 당신에게 ${d} 피해${note}`,'hurt');}
   else{t.hp=Math.max(0,t.hp-d);L(`${esc(e.name)} → ${esc(t.name)}에게 ${d} 피해${t.hp<=0?' · 쓰러짐!':''}`,'hurt');}}
  else L(`${esc(e.name)}의 공격 🎲${r}${sgn(e.atk)}=${tot} → ${t.me?'막아냈다':esc(t.name)+'이(가) 막아냄'}`);}});
 if(gm.regen&&c.hp>0&&c.hp<c.maxhp){const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+gm.regen);L(`💚 재생 +${c.hp-b}`,'ok');}
 cb.round++;cb.potion=false;cb.free=false;save();render();
 if(c.hp<=0)death();}
function win(){const cb=S.adv.combat,c=S.char;cb.done=true;const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+Math.ceil(c.maxhp/4));cb.loot=combatLoot(cb);L(`🏆 <b>승리!</b> 숨을 고른다 (HP +${c.hp-b})<br>${cb.loot.join('<br>')}`,'ok');save();render();}
function death(){modal(`<div style="font-size:48px">💀</div><h2 class="bad-c">쓰러졌다…</h2><p class="muted">눈앞이 캄캄해진다. 하지만 이야기는 여기서 끝나지 않는다. 이 장면이 시작된 순간으로 돌아갈 수 있다.</p>`,
 [{t:'이 장면 다시',fn:()=>{const A=S.adv,sn=A.cp;S.char=sn.char;A.flags=sn.flags;A.roster=sn.roster;A.party=sn.party;enterNode(A.node);}},{t:'이 장 처음부터',cls:'ghost',fn:()=>restartChapter(S.adv.camp,S.adv.chapter)}]);}
function partyModal(){const A=S.adv,cp=camp(A.camp),L=S.char.level;
 const body=()=>`<h2>동료 편성</h2><p class="muted">전투에 함께할 동료를 최대 3명 고르세요.</p>${A.roster.map(id=>{const c=cp.comps[id],st=compStats(c,L),on=A.party.includes(id);return`<button class="tog ${on?'on':''}" data-pt="${id}"><span><b>${esc(c.name)}</b> <span class="muted">${ROLE[c.role]} · HP ${st.hp}</span><br><small class="muted">${esc(c.desc||'')}</small></span><span>${on?'✅':'⬜'}</span></button>`;}).join('')}`;
 modal(body(),[{t:'완료',fn:()=>{save();render();}}]);
 $('#overlay').onclick=e=>{const t=e.target.closest('[data-pt]');if(t){const id=t.dataset.pt;if(A.party.includes(id))A.party=A.party.filter(x=>x!==id);else if(A.party.length<3)A.party.push(id);partyModal();return;}const b=e.target.closest('[data-mb]');if(b){$('#overlay').classList.remove('show');save();render();}};}

 /* 소모품 */

 gpotion:{name:'상급 치유 물약',type:'use',price:40,desc:'HP 4d4+4 (+레벨) 회복 · 추가 행동',use:{heal:'4d4+4'},free:true},
 bomb:{name:'화염 폭탄',type:'use',price:35,desc:'모든 적에게 3d6 (+레벨) 화염 피해 · 행동',use:{aoe:'3d6'},combatOnly:true},
 might:{name:'거인의 힘 물약',type:'use',price:30,desc:'이번 전투 동안 명중 +2, 무기 피해 +3 · 추가 행동',use:{buff:{atk:2,dmg:3}},free:true,combatOnly:true},

const SLOTN={weapon:'무기',armor:'갑옷',t1:'장신구 1',t2:'장신구 2'};
const TYPEN={weapon:'무기',armor:'갑옷',trinket:'장신구',use:'소모품'};
const isGear=id=>ITEMS[id]&&ITEMS[id].type!=='use';
function inv(c){c=c||S.char;if(c){c.eq=c.eq||{};c.bag=c.bag||{};}return c;}
function canUse(id,c){const it=ITEMS[id];c=c||S.char;return!it.cls||it.cls.includes(c.cls);}
function owned(id,c){c=inv(c||S.char);return(c.bag[id]||0)>0||Object.values(c.eq).includes(id);}
function gearMods(c){const m={atk:0,dmg:0,satk:0,ac:0,maxhp:0,dc:0,regen:0,resist:0,heal:0,slots:0,onhit:[],crit19:false,skills:{}};
 Object.values((c&&c.eq)||{}).forEach(id=>{const it=ITEMS[id];if(!it||!it.mods)return;const o=it.mods;
  ['atk','dmg','satk','ac','maxhp','dc','regen','resist','heal','slots'].forEach(k=>{if(o[k])m[k]+=o[k];});
  if(o.onhit)m.onhit.push(o.onhit);if(o.crit19)m.crit19=true;
  if(o.skills)Object.entries(o.skills).forEach(([s,v])=>m.skills[s]=(m.skills[s]||0)+v);});
 return m;}
function addFlat(d,n){if(!n)return d;const p=parseDice(d);const b=p.b+n;return`${p.n}d${p.s}${b?sgn(b):''}`;}
function applyGear(k,c){const m=gearMods(c);k=Object.assign({},k,{gear:m});
 k.maxhp+=m.maxhp;k.ac+=m.ac;if(k.maxSlots)k.maxSlots+=m.slots;k.dc+=m.dc;
 const note=(a,b)=>a||b?` · 장비 ${[a?'명중'+sgn(a):'',b?'피해'+sgn(b):''].filter(Boolean).join(' ')}`:'';
 const mapA=a=>{if(a.type!=='attack'&&a.type!=='hide'&&a.type!=='heal')return a;a=Object.assign({},a);
  if(a.type==='heal'){if(m.heal){a.heal=addFlat(a.heal,m.heal);a.desc+=` · 장비 치유+${m.heal}`;}return a;}
  if(a.weapon){a.atk+=m.atk;a.dmg=addFlat(a.dmg,m.dmg);a.desc+=note(m.atk,m.dmg)+(m.onhit.length?` · 추가 ${m.onhit.join('+')}`:'');}
  else if(m.satk){a.atk+=m.satk;a.desc+=note(m.satk,0);}
  return a;};
 k.attacks=k.attacks.map(mapA);k.feats=k.feats.map(mapA);return k;}
function addBag(id,n,c){c=inv(c||S.char);c.bag[id]=(c.bag[id]||0)+(n||1);}
function slotFor(id,c){const t=ITEMS[id].type;if(t==='weapon'||t==='armor')return t;c=inv(c);return!c.eq.t1?'t1':!c.eq.t2?'t2':'t2';}
function equip(id){const c=inv(S.char);if(!canUse(id)||!c.bag[id])return;const sl=slotFor(id,c);
 if(c.eq[sl])addBag(c.eq[sl]);c.eq[sl]=id;c.bag[id]--;if(!c.bag[id])delete c.bag[id];syncChar(false);}
function unequip(sl){const c=inv(S.char);if(!c.eq[sl])return;addBag(c.eq[sl]);delete c.eq[sl];syncChar(false);}
/* 획득: 빈 칸이면 자동 장착 */
function gainItem(id){const c=inv(S.char),it=ITEMS[id];if(!it)return'';
 if(id==='potion'){c.potions++;return`🧪 '${it.name}' 획득`;}
 addBag(id);
 if(isGear(id)&&canUse(id)){const sl=it.type==='trinket'?(!c.eq.t1?'t1':!c.eq.t2?'t2':null):(!c.eq[it.type]?it.type:null);
  if(sl){c.bag[id]--;if(!c.bag[id])delete c.bag[id];c.eq[sl]=id;syncChar(false);return`🎁 '${it.name}' 획득 · 자동 장착!`;}}
 return`🎁 '${it.name}' 획득${isGear(id)?(canUse(id)?' · 가방에서 장착할 수 있어요':' · 내 직업은 못 써요 (팔 수 있어요)'):''}`;}
function tierFor(L){return L<=5?1:L<=8?2:3;}
function randomGear(L){const c=S.char,t=tierFor(L);const pool=Object.keys(ITEMS).filter(id=>{const it=ITEMS[id];return isGear(id)&&!it.uniq&&it.tier===t&&canUse(id)&&!owned(id);});return pool.length?pick(pool):null;}
function combatLoot(cb){const c=S.char,cp=camp(S.adv.camp),out=[];
 let g=0;cb.enemies.forEach(e=>g+=rnd(Math.max(2,Math.round(e.max/5))));g=Math.max(1,Math.round(g*(cp.goldMul||1)));c.gold+=g;out.push(`💰 금화 +${g}`);
 if(rnd(100)<=30){const pool=['gpotion','bomb','might','stone'];if(c.maxSlots)pool.push('scroll');out.push(gainItem(pick(pool)));}
 const big=cb.enemies.some(e=>e.max>=60);if(big&&rnd(100)<=60){const id=randomGear(c.level);if(id)out.push(gainItem(id));}
 return out;}
/* 사용 */
function useItem(id,inCombat){const c=inv(S.char),it=ITEMS[id],cb=S.adv&&S.adv.combat;if(!it||!c.bag[id]||!it.use)return;const u=it.use;let msg='';
 if(u.heal){const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+roll(u.heal).t+c.level);msg=`${it.name} → HP +${c.hp-b}`;}
 if(u.slots){const b=c.slots;c.slots=Math.min(c.maxSlots,c.slots+u.slots);msg=`${it.name} → 주문 슬롯 +${c.slots-b}`;}
 if(u.buff){cb.buff=cb.buff||{atk:0,dmg:0,ac:0};Object.entries(u.buff).forEach(([k,v])=>cb.buff[k]+=v);msg=`${it.name} → ${u.buff.ac?'AC +'+u.buff.ac:'명중 +'+u.buff.atk+', 피해 +'+u.buff.dmg} (이번 전투)`;}
 c.bag[id]--;if(!c.bag[id])delete c.bag[id];
 if(u.aoe){L(`💣 ${it.name}!`,'ok');alive().forEach(e=>hitDmg(e,roll(u.aoe).t+c.level,'🔥 폭발'));save();endTurn();return;}
 if(inCombat){L(msg,'ok');if(it.free)cb.potion=true;save();render();}else{save();render();modal(`<p>${msg}</p>`,[{t:'확인'}]);}}
function tryRevive(){const c=inv(S.char);if(c.hp>0||!c.bag.phoenix)return false;c.bag.phoenix--;if(!c.bag.phoenix)delete c.bag.phoenix;c.hp=Math.ceil(c.maxhp/2);
 if(S.adv&&S.adv.combat)L('🔥 <b>불사조 깃털이 타오르며 당신을 일으킨다!</b>','ok');else if(S.adv)S.adv.fx.push('🔥 불사조 깃털이 당신을 일으켰다!');return true;}
/* 가방 화면 */
function bagModal(mode){const c=inv(S.char),inC=mode==='combat';const cb=S.adv&&S.adv.combat;
 const row=(id,n)=>{const it=ITEMS[id];let btn='';
  if(it.type==='use'){const ok=it.use&&!(it.combatOnly&&!inC)&&!(it.caster&&!c.maxSlots)&&!(inC&&it.free&&cb.potion);btn=it.use?`<button class="btn sm" data-bu="${id}" ${ok?'':'disabled'}>사용</button>`:'<span class="chip">자동</span>';}
  else if(!inC)btn=canUse(id)?`<button class="btn sm" data-be="${id}">장착</button>`:'<span class="chip">직업 불가</span>';
  return`<li style="text-align:left"><span><b>${esc(it.name)}</b>${n>1?` ×${n}`:''} <span class="muted" style="font-size:12px">${TYPEN[it.type]}</span><br><small class="muted">${esc(it.desc)}</small></span>${btn}</li>`;};
 const items=Object.entries(c.bag).filter(([id,n])=>n>0&&ITEMS[id]&&(!inC||ITEMS[id].type==='use'));
 const eq=inC?'':`<h3 style="text-align:left">장착 중</h3><ul class="list">${Object.keys(SLOTN).map(sl=>{const id=c.eq[sl];return`<li style="text-align:left"><span><span class="muted" style="font-size:12px">${SLOTN[sl]}</span><br>${id?`<b>${esc(ITEMS[id].name)}</b><br><small class="muted">${esc(ITEMS[id].desc)}</small>`:'<span class="muted">비어 있음</span>'}</span>${id?`<button class="btn ghost sm" data-bx="${sl}">해제</button>`:''}</li>`;}).join('')}</ul>`;
 modal(`<h2>🎒 가방</h2><div style="max-height:60vh;overflow:auto">${eq}<h3 style="text-align:left;margin-top:12px">${inC?'전투에서 쓸 수 있는 아이템':'가방'}</h3><ul class="list">${items.map(([id,n])=>row(id,n)).join('')||'<li class="muted">비어 있어요</li>'}</ul></div>`,[{t:'닫기'}]);
 $('#overlay').onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.bu){$('#overlay').classList.remove('show');useItem(d.bu,inC);return;}
  if(d.be){equip(d.be);save();render();bagModal(mode);return;}
  if(d.bx){unequip(d.bx);save();render();bagModal(mode);return;}
  if(d.mb!==undefined){$('#overlay').classList.remove('show');save();render();}};}

function priceOf(id){return ITEMS[id].price||0;}
function vShop(key){const sh=SHOPS[key],c=inv(S.char);
 const buy=sh.stock.map(id=>{const it=ITEMS[id],p=priceOf(id),own=isGear(id)&&owned(id),no=!canUse(id);
  return`<li><span><b>${esc(it.name)}</b> <span class="muted" style="font-size:12px">${TYPEN[it.type]}</span><br><small class="muted">${esc(it.desc)}</small></span><span style="text-align:right;white-space:nowrap"><span class="chip">💰 ${p}</span><br><button class="btn sm" style="margin-top:4px" data-buy="${id}" ${c.gold<p||own||no?'disabled':''}>${own?'보유':no?'직업 불가':'구매'}</button></span></li>`;}).join('');
 const sellable=Object.entries(c.bag).filter(([id,n])=>n>0&&ITEMS[id]);
 const sell=sellable.map(([id,n])=>`<li><span>${esc(ITEMS[id].name)}${n>1?` ×${n}`:''}</span><button class="btn ghost sm" data-sell="${id}">💰 ${fl(priceOf(id)/2)}에 팔기</button></li>`).join('');
 return`<div class="card"><div class="scene-title">🛒 ${esc(sh.name)}</div><div class="row" style="justify-content:space-between"><span>내 금화</span><b style="color:var(--gold2)">💰 ${c.gold}</b></div><ul class="list" style="margin-top:6px">${buy}</ul>
  ${sell?`<h3 style="margin-top:14px">팔기 <span class="muted" style="font-size:12px">(반값 · 장착한 것은 해제 후 팔 수 있어요)</span></h3><ul class="list">${sell}</ul>`:''}</div>`;}
function buy(id){const c=inv(S.char),p=priceOf(id);if(c.gold<p)return;c.gold-=p;const m=gainItem(id);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);}
function sell(id){const c=inv(S.char);if(!c.bag[id])return;c.bag[id]--;if(!c.bag[id])delete c.bag[id];c.gold+=fl(priceOf(id)/2);save();render();}

b1_start:{title:'캔들킵',text:`바다를 내려다보는 절벽 위, 지식의 성채 캔들킵. 당신은 이곳 서가 사이에서 자랐다. 양아버지 고리온은 이 성채에서 가장 존경받는 마법사다.

<i>"짐을 꾸려라. 오늘 밤 이곳을 떠난다. 이유는… 길 위에서 말해주마. 지금은 묻지 말고, 서둘러라."</i>

  {t:'고리온에게 간다. 떠날 시간이다',go:'b1_depart'}]},
b1_imoen:{title:'캔들킵 안뜰',onEnter:{set:{imoen_talk:1}},text:`분홍 머리 이모엔이 지붕 위에서 사과를 베어 물다 당신을 보고 뛰어내린다.

"들었어! 아니, 엿들었다고 하는 게 맞겠다. 너 떠난다며? 나한테 한마디도 없이?" 그녀가 볼을 부풀린다. "고리온 아저씨가 안 된대도 난 따라갈 거야. 두고 봐."

당신이 뭐라 하기도 전에 그녀는 다시 지붕 위로 사라진다.`,choices:[{t:'안뜰로 돌아간다',go:'b1_start'}]},
b1_shop:{title:'윈스롭의 여관',shop:'b1_early',onEnter:{set:{shop:1},potions:1},text:`늙은 윈스롭이 카운터 너머로 당신을 오래 바라본다.

"떠난다고? 그래, 언젠간 그럴 줄 알았지." 그가 먼지 쌓인 선반에서 붉은 병 하나를 꺼내 내민다. "<b>치유 물약</b>이다. 돈은 됐어. 네가 꼬맹이일 때 훔쳐 먹은 꿀과자 값이라 치자."

"다른 것도 필요하면 골라 봐. 길 위에선 뭐든 쓸모가 있을 거다."`,
 choices:[{t:'고맙다고 인사하고 나간다',go:'b1_start'}]},
b1_prophecy:{title:'예언의 서고',onEnter:{set:{prophecy:1}},text:`먼지 낀 두루마리 사이에서 위대한 예언자 알라운도의 구절을 찾아낸다. 몇몇 줄에는 누군가 최근에 손가락으로 짚은 자국이 있다.

<i>살인의 군주가 쓰러질 때, 그는 자신의 피를 대지에 흩뿌리리라. 그 씨앗들은 자라나 혼돈을 거두리라.</i>

등줄기가 서늘해진다. 고리온은 왜 이 구절을 몇 번이고 읽었을까?`,choices:[{t:'서고를 나선다',go:'b1_start'}]},
b1_library_fail:{title:'예언의 서고',text:`수천 권의 책 사이에서 무엇을 찾아야 할지조차 모르겠다. 사서 하나가 촛불을 끄며 나가라고 손짓한다.`,choices:[{t:'서고를 나선다',go:'b1_start'}]},
b1_depart:{title:'캔들킵 정문',text:`해가 지고, 고리온과 함께 성문을 나선다. 그는 아무 말 없이 걷기만 한다. 등 뒤로 캔들킵의 불빛이 멀어진다.

한 시간쯤 걸었을까. 숲길에 들어서자 고리온이 걸음을 멈춘다.

"조용히. …우리 말고 누가 있다."

어둠 속에서 거대한 그림자가 걸어 나온다. 뿔 달린 투구에 시커먼 판금 갑옷을 두른 거인. 그 뒤로 용병 넷과 오우거 하나가 따라온다.

<i>"늙은이. 그 아이를 넘겨라. 그러면 너는 살려주지."</i>`,
 choices:[{t:'고리온 곁에 남아 함께 싸운다',go:'b1_stand'},{t:'고리온의 외침대로 달아난다',go:'b1_flee'}]},
b1_stand:{title:'숲길의 밤',text:`"어리석은 녀석! 달아나라고 했는데…!" 고리온이 마법 화살을 쏘아 거인을 밀어낸다. "그럼 저 용병들이라도 막아라!"

용병 둘이 칼을 뽑고 당신에게 달려든다.`,combat:{enemies:[mob('용병',3,{hp:12,n:2})],win:'b1_gorion_falls'}},
b1_gorion_falls:{title:'숲길의 밤',onEnter:{set:{stood:1}},text:`용병들이 쓰러진 순간, 고리온의 비명이 숲을 찢는다.

돌아보니 거인의 검이 고리온의 가슴을 꿰뚫고 있다. 고리온은 마지막 힘으로 당신을 향해 손을 뻗는다. 입모양만이 보인다. <i>달아나라.</i>

거인이 당신 쪽으로 투구를 돌린다. 그 순간 고리온의 몸에서 마지막 마법이 터져 나와 숲 전체를 눈부신 빛으로 덮는다. 당신은 정신없이 달린다.`,choices:[{t:'어둠 속으로…',go:'b1_dawn'}]},
b1_flee:{title:'숲길의 밤',text:`"가라! 뒤돌아보지 마라!"

당신은 덤불을 헤치고 달린다. 등 뒤에서 마법이 터지는 섬광, 강철이 부딪히는 소리, 그리고… 고리온의 비명. 그리고 정적.

나뭇가지에 얼굴을 긁히며 한참을 달리다 쓰러진다.`,choices:[{t:'정신을 잃는다…',go:'b1_dawn'}]},
b1_dawn:{title:'새벽',onEnter:{join:'imoen',item:'고리온의 편지',loot:'u_gorion'},text:`누군가 당신을 흔든다. 이모엔이다. 진흙투성이 얼굴로 숨을 몰아쉬고 있다.

둘은 숲길로 돌아가 고리온의 몸을 찾는다. 그의 품에서 봉인된 편지가 나온다. 당신에게 쓴 것이다.

 choices:[{t:'고리온을 묻어주고 기도한다',not:['buried'],set:{buried:1},go:'b1_bury'},{t:'북쪽 길로 떠난다',go:'b1_road'}]},
b1_bury:{title:'새벽',onEnter:{heal:'1d6+2'},text:`이모엔과 함께 맨손으로 흙을 판다. 해가 떠오를 무렵, 작은 돌무덤 위에 고리온의 지팡이를 꽂는다.

b1_road:{title:'북쪽 길',text:`해안을 따라 난 길을 걷는다. 정오쯤, 언덕 너머로 검은 연기가 피어오르는 게 보인다. 농가 쪽이다. 희미하게 비명도 들린다.`,
 choices:[{t:'농가로 달려간다',go:'b1_farm'},{t:'갈 길이 급하다. 여관으로 곧장 간다',go:'b1_inn'}]},
b1_farm:{title:'불타는 농가',text:`헛간이 불타고 있다. 하이에나 머리를 한 놀 약탈자들이 가축을 끌어내며 낄낄거린다. 집 안에는 농부 가족이 갇혀 있다.

b1_farm_ambush:{title:'불타는 농가',text:`그림자를 따라 다가가 첫 놈의 등을 덮친다! 놈들이 허둥대며 무기를 집어 든다.`,combat:{enemies:[mob('놀 약탈자',3,{hp:9}),mob('놀 약탈자',3)],win:'b1_farm_win'}},
b1_farm_fight:{title:'불타는 농가',text:`놀들이 일제히 고개를 돌린다. "고기다! 신선한 고기!" 컹컹 짖으며 달려든다.`,combat:{enemies:[mob('놀 약탈자',3,{n:3})],win:'b1_farm_win'}},
b1_farm_win:{title:'불타는 농가',onEnter:{gold:20,potions:1,set:{farm:1}},text:`농부 가족이 울면서 고마워한다. 농부가 숨겨둔 금화와 물약을 억지로 쥐여준다.

"요즘 세상이 미쳤어요. 쇠가 썩어서 쟁기날이 부러지고, 대장간 칼도 휘어진다더군요. 남쪽 <b>나시켈 광산</b>에서 나오는 철이 이상하대요. 그래서 다들 굶주리고, 굶주린 놈들이 약탈을 하고…"

 choices:[{t:'그의 손과 눈을 주시한다',check:{skill:'통찰',dc:12,ok:'b1_tarnesh_spot',fail:'b1_tarnesh_hit'}},{t:'"누구시죠?" 하고 다가간다',go:'b1_tarnesh_hit'}]},
b1_tarnesh_spot:{title:'우정의 팔 여관',text:`소매 속에서 주문 구성요소가 반짝이는 걸 놓치지 않는다. 그가 주문을 외기 전에 당신이 먼저 덤벼든다!`,combat:{enemies:[elite('현상금 사냥꾼 마법사',3,{hp:20,ac:12})],win:'b1_tarnesh_win'}},
b1_tarnesh_hit:{title:'우정의 팔 여관',onEnter:{dmg:'2d4+2'},text:`그의 손끝에서 마법 화살이 터져 나와 가슴에 꽂힌다! "미안하네, 자네 목에 걸린 금화가 꽤 두둑해서 말이야."`,combat:{enemies:[elite('현상금 사냥꾼 마법사',3,{ac:12})],win:'b1_tarnesh_win'}},
b1_tarnesh_win:{title:'우정의 팔 여관',onEnter:{set:{bounty:1},item:'현상금 쪽지'},text:`쓰러진 마법사의 품에서 구겨진 쪽지가 나온다.

<i>"고리온의 피후견인. 캔들킵 출신. 죽여서 가져오면 금화 200닢."</i>

서명 대신 한 글자만 적혀 있다. <b>'S'</b>.

누군가 당신을 죽이려고 돈을 걸었다. 왜?`,choices:[{t:'여관 안으로 들어간다',go:'b1_jaheira'}]},
b1_jaheira:{title:'우정의 팔 여관',onEnter:{join:['jaheira','khalid']},text:`구석 테이블의 하프엘프 둘이 당신을 알아본다. 날카로운 눈매의 여자와 사람 좋아 보이는 남자.

"고리온의… 아이로군." 여자가 일어선다. "자헤이라다. 이쪽은 내 남편 칼리드. 고리온이 오지 않은 걸 보니… 그렇게 된 건가."

칼리드가 당신 손을 꼭 잡는다. "그, 그는 좋은 사람이었어. 이제 우리가 너, 너를 지킬게."

자헤이라가 지도를 펼친다. "애도는 나중이다. 고리온은 우리에게 한 가지 일을 맡겼었지. 남쪽 나시켈 광산에서 철이 오염되고 있다. 소드 코스트 전체가 무너지기 직전이야. 그 배후에 너를 노리는 자들과 같은 이가 있을지도 모른다."`,
 choices:[{t:'하퍼에 대해 묻는다',not:['harper'],set:{harper:1},go:'b1_harper'},{t:'여관에서 하룻밤 묵는다',sub:'금화 5 · 휴식',not:['inn_rest'],set:{inn_rest:1},gold:-5,rest:1,go:'b1_jaheira'},{t:'나시켈로 가자',go:'b1_c1_end'}]},
b1_harper:{title:'우정의 팔 여관',text:`"하퍼." 자헤이라가 목소리를 낮춘다. "폭정을 막고 균형을 지키는 비밀 결사다. 고리온도 한때 우리 중 하나였지."

칼리드가 덧붙인다. "고, 고리온은 너를 아주 특별하게 여겼어. 이유는 말해주지 않았지만."`,choices:[{t:'고개를 끄덕인다',go:'b1_jaheira'}]},
b1_c1_end:{title:'1장 끝',chapterEnd:true,text:`다음 날 새벽, 넷이 된 일행은 남쪽으로 향한다.

고리온을 죽인 판금 갑옷의 거인. 당신 목에 걸린 현상금. 썩어가는 철. 아직은 아무것도 이어지지 않는다.

하지만 이모엔이 걸음을 맞추며 속삭인다. "있잖아, 무섭긴 한데… 솔직히 조금 신나기도 해."`}
,
/* ---------- 2장: 나시켈의 피 묻은 철 (Lv4) ---------- */
b1_c2:{title:'남쪽 길',text:`나시켈로 가는 길목, 다리 위를 덩치 셋이 막아선다. 팔에는 녹슨 쇠사슬을 감았다.

"통행세다. 1인당 금화 다섯 닢. 철값이 오르니 우리도 먹고 살아야지."`,
 choices:[{t:'금화 20닢을 던져준다',gold:-20,go:'b1_nashkel'},{t:'"비켜라. 다치기 싫으면."',check:{skill:'위협',dc:13,ok:'b1_bridge_scare',fail:'b1_bridge_fight'}},{t:'무기를 뽑는다',go:'b1_bridge_fight'}]},
b1_bridge_scare:{title:'남쪽 길',text:`당신의 눈빛에 덩치들이 주춤하더니, 침을 뱉고 길을 비킨다. "흥, 오늘은 운 좋은 줄 알아."`,choices:[{t:'나시켈로',go:'b1_nashkel'}]},
b1_bridge_fight:{title:'남쪽 길',text:`"좋아, 그럼 몸으로 내라!" 도적들이 몽둥이를 휘두르며 달려든다.`,combat:{enemies:[mob('통행세 도적',4,{n:3})],win:'b1_bridge_win'}},
b1_bridge_win:{title:'남쪽 길',onEnter:{gold:15},text:`도적들의 주머니에서 금화와 함께 이상한 화살촉이 나온다. 쇠가 아니라 거친 돌을 깎아 만든 것이다. 철이 그만큼 귀해졌다는 뜻이다.`,choices:[{t:'나시켈로',go:'b1_nashkel'}]},
b1_nashkel:{title:'나시켈 마을',text:f=>`광산 마을 나시켈은 활기를 잃었다. 광부들은 술집에 모여 앉아 웅성거린다. 광산 깊은 곳에서 동료들이 하나둘 사라지고, 악마를 봤다는 소문까지 돈다.

${f.minsc_met?'':'여관 앞에서 거구의 남자가 하늘을 향해 울부짖고 있다. "부! 우리가 늦었어! 마녀님이 놀들에게 붙잡혔단 말이다!" 그의 어깨 위에서 작은 햄스터가 찍찍댄다.'}`,
 choices:[{t:'울부짖는 거구에게 말을 건다',not:['minsc_met'],go:'b1_minsc'},
  {t:'다이나헤어를 구하러 놀 요새로 간다',req:['minsc_met'],not:['dyna'],go:'b1_gnoll'},
  {t:'촌장 베룬을 찾아간다',not:['mayor'],go:'b1_mayor'},
  {t:'마을 축제 천막을 둘러본다',not:['carnival'],go:'b1_carnival'},
  {t:'광산으로 간다',req:['mayor'],go:'b1_mine'}]},
b1_minsc:{title:'나시켈 마을',onEnter:{set:{minsc_met:1},join:'minsc'},text:`"나는 민스크! 그리고 이쪽은 부. 부는 우주에서 온 소형 거대 햄스터다!" 그가 당신 손을 부서져라 흔든다.

"나는 라쉬멘의 마녀 다이나헤어님의 호위다. 그런데 놀들이 그분을 납치해 서쪽 절벽 요새에 가둬버렸다! 부가 그러는데, 너는 정의로운 냄새가 난다고 한다. 함께 가자!"

칼리드가 웃음을 참으며 속삭인다. "가, 강한 건 확실해 보이네."`,choices:[{t:'"좋아, 함께 가자."',go:'b1_nashkel'}]},
b1_gnoll:{title:'놀 요새',text:`서쪽 절벽 위, 뼈와 가죽으로 엮은 놀들의 요새. 정문에는 파수꾼이 셋, 절벽 쪽은 경비가 허술해 보인다.

민스크가 이를 간다. "부가 말한다. 정문을 부숴버리자고!"`,
 choices:[{t:'절벽을 타고 몰래 오른다',check:{skill:'운동',dc:13,ok:'b1_gnoll_in',fail:'b1_gnoll_gate'}},{t:'민스크와 함께 정문을 부순다',go:'b1_gnoll_gate'}]},
b1_gnoll_in:{title:'놀 요새',text:`절벽을 오르니 바로 족장의 천막 뒤편이다. 안에서 사슬에 묶인 마녀가 보인다. 족장이 눈치채고 울부짖는다!`,combat:{enemies:[elite('놀 족장',4),mob('놀 호위',4)],win:'b1_dyna'}},
b1_gnoll_gate:{title:'놀 요새',text:`"부! 공격이다!!" 민스크가 정문을 걷어차 부순다. 놀 떼가 사방에서 쏟아져 나온다!`,combat:{enemies:[elite('놀 족장',4),mob('놀 전사',4,{n:2})],win:'b1_dyna'}},
b1_dyna:{title:'놀 요새',onEnter:{join:'dynaheir',set:{dyna:1},gold:30},text:`사슬을 끊자 검은 머리의 마녀가 위엄 있게 일어선다.

"늦었구나, 민스크." 그녀는 엄격하게 말하지만 입가엔 미소가 있다. 민스크가 엉엉 운다. "부도 걱정했습니다, 마녀님!"

다이나헤어가 당신을 오래 바라본다. "너에게서… 이상한 기운이 느껴지는구나. 이 은혜는 잊지 않으마."`,choices:[{t:'나시켈로 돌아간다',go:'b1_nashkel'}]},
b1_mayor:{title:'촌장의 집',onEnter:{set:{mayor:1}},text:`촌장 베룬이 지친 얼굴로 맞는다.

"광산 아래층에서 광부가 열둘이나 사라졌소. 살아 나온 자들은 코볼드 떼와 '푸른 불꽃을 부리는 악마'를 봤다더군. 더 큰 문제는 철이오. 캐낸 철광석이 제련만 하면 썩은 나무처럼 부서져버려요."

그가 금화 자루를 흔든다. "광산의 진상을 밝혀주면 사례하겠소."`,choices:[{t:'광산으로 간다',go:'b1_mine'},{t:'마을을 더 둘러본다',go:'b1_nashkel'}]},
b1_carnival:{title:'나시켈 축제',shop:'b1_nashkel',onEnter:{set:{carnival:1}},text:`우울한 마을을 달래려 열린 작은 축제. 천막 사이로 점쟁이 노파가 손짓한다.

노파는 당신 손바닥을 보자마자 얼굴이 하얗게 질린다. "피… 아주 오래된 신의 피가 흐르는구나. 그 신은 죽었지만, 자식들은 살아 있어. 그리고 자식들끼리… 서로를 사냥하지."

노파가 서둘러 천막을 닫는다. 옆으로는 떠돌이 상인들의 노점이 줄지어 있다. 광산에 가기 전에 장비를 갖추기 좋겠다.`,
 choices:[{t:'마을로 돌아간다',go:'b1_nashkel'}]},
b1_market:{title:'상층 도시 상점가',shop:'b1_city',text:`대리석 기둥 사이로 고급 상점들이 늘어서 있다. 현상수배 전단의 얼굴과 당신을 번갈아 보던 상인이 어깨를 으쓱한다. "금화만 있으면 누구든 손님이지."`,
 choices:[{t:'상점가를 나선다',go:'b1_c4'}]},
b1_mine:{title:'나시켈 광산',text:`광산 입구의 감독관 에머슨이 횃불을 건넨다. "아래 4층부터는 아무도 안 내려갑니다. 행운을 빌어요."

갱도는 아래로, 더 아래로 이어진다. 3층쯤 내려가자 바닥에 가는 실이 반짝인다.`,
 choices:[{t:'실을 살핀다',check:{skill:'지각',dc:13,ok:'b1_mine_trap_ok',fail:'b1_mine_trap'}},{t:'그냥 넘어간다',go:'b1_mine_trap'}]},
b1_mine_trap_ok:{title:'광산 3층',text:`철사 함정이다. 천장의 바위 더미와 연결돼 있다. 조심스럽게 끊어낸다.

이모엔이 휘파람을 분다. "코볼드 솜씨치곤 꽤 정교한데?"`,choices:[{t:'더 깊이 내려간다',go:'b1_kobolds'}]},
b1_mine_trap:{title:'광산 3층',onEnter:{dmg:'2d6'},text:`발목에 뭔가 걸리는 순간, 천장에서 돌덩이가 쏟아진다! 간신히 피했지만 어깨가 욱신거린다.`,choices:[{t:'더 깊이 내려간다',go:'b1_kobolds'}]},
b1_kobolds:{title:'광산 4층',text:`좁은 갱도가 넓은 동굴로 열린다. 그리고 수십 개의 붉은 눈. 코볼드들이 활을 겨누고 있다.

"인간이다! 주인님께 바쳐라!"`,combat:{enemies:[mob('코볼드 특공대',4,{hp:10,n:3}),mob('코볼드 궁수',4,{hp:8,ac:12})],win:'b1_deep'}},
b1_deep:{title:'광산 깊은 곳',text:`코볼드 시체 사이에서 광부들의 곡괭이와 헬멧이 발견된다. 갱도 벽에는 푸른 광택이 도는 이상한 가루가 발라져 있다. 철광석을 오염시키는 무언가다.

자헤이라가 가루를 문질러본다. "자연의 것이 아니야. 누군가 일부러 철을 썩게 만들고 있다."`,
 choices:[{t:'잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r2'],set:{r2:1},rest:1,go:'b1_deep'},{t:'푸른 불빛이 새어 나오는 동굴로 간다',go:'b1_mulahey'}]},
b1_mulahey:{title:'광산 최하층',text:`푸른 불꽃이 일렁이는 동굴. 해골 문양 로브를 입은 하프오크가 제단 앞에 서 있다. 사이릭의 사제, 물라헤이다.

당신을 본 그가 양손을 번쩍 든다. "자, 잠깐! 항복하겠다! 나는 그저 시키는 대로 했을 뿐이야! 다 말해주지!"`,
 choices:[{t:'항복을 받아들이되 눈을 떼지 않는다',check:{skill:'통찰',dc:13,ok:'b1_mula_spot',fail:'b1_mula_trick'}},{t:'"말은 무덤에서 하라"며 공격한다',go:'b1_mula_fight'}]},
b1_mula_spot:{title:'광산 최하층',text:`그의 손가락이 미세하게 꼬이는 걸 본다. 주문이다! "거짓말쟁이!" 당신이 먼저 내리친다.`,combat:{enemies:[boss('물라헤이',4,{hp:45,attacks:1}),mob('해골 병사',4,{hp:10})],win:'b1_mula_win'}},
b1_mula_trick:{title:'광산 최하층',onEnter:{dmg:'2d6+2'},text:`당신이 다가가는 순간, 그가 낄낄대며 손을 비튼다. 검은 번개가 가슴을 때린다! "멍청하긴! 일어나라, 나의 종들이여!"

바닥에서 해골들이 기어 나온다.`,combat:{enemies:[boss('물라헤이',4,{hp:55,attacks:1}),mob('해골 병사',4,{hp:10,n:2})],win:'b1_mula_win'}},
b1_mula_fight:{title:'광산 최하층',text:`"좋다, 그럼 죽어라!" 물라헤이의 외침에 바닥에서 해골들이 기어 나온다.`,combat:{enemies:[boss('물라헤이',4,{hp:55,attacks:1}),mob('해골 병사',4,{hp:10,n:2})],win:'b1_mula_win'}},
b1_mula_win:{title:'광산 최하층',onEnter:{gold:100,item:'물라헤이의 편지',loot:'u_cyric'},text:`물라헤이가 쓰러지자 푸른 불꽃이 꺼진다. 제단 아래에서 편지 꾸러미가 나온다.

<i>"광석 오염을 계속하라. 철값이 오를수록 우리 주인의 계획은 가까워진다. 고리온의 피후견인이 나타나면 죽여라. — 타조크"</i>

또 다른 편지에는 숲속 <b>도적 소굴</b>의 위치가 그려져 있다.

자헤이라가 이를 악문다. "철을 썩히고, 도적을 풀어 상인을 털고… 누군가 소드 코스트를 일부러 굶기고 있어. 그리고 너를 노리는 것도 같은 놈들이다."`,
 choices:[{t:'나시켈로 돌아가 보고한다',go:'b1_c2_end'}]},
b1_c2_end:{title:'2장 끝',chapterEnd:true,text:`광산이 다시 열리고, 나시켈에 오랜만에 웃음이 돈다. 촌장 베룬은 당신의 이름을 외치며 술잔을 든다.

하지만 당신 일행은 축배 대신 지도를 펼친다. 타조크라는 이름, 숲속 도적 소굴. 그리고 그 위에 있는 '주인'.

민스크가 부를 어깨에 올린다. "부가 말한다. 악당의 소굴은 부수라고 있는 거라고!"`}
,
/* ---------- 3장: 도적 소굴과 클록우드 (Lv5) ---------- */
b1_c3:{title:'도적 소굴',text:`숲 깊은 곳, 목책으로 둘러싸인 거대한 도적 야영지. 모닥불 사이로 수십 명이 오간다. 새 단원을 뽑는다는 공고가 정문에 붙어 있다.`,
 choices:[{t:'신입 단원인 척 들어간다',check:{skill:'기만',dc:13,ok:'b1_recruit',fail:'b1_camp_fight'}},{t:'밤을 틈타 두목의 천막으로 숨어든다',check:{skill:'은신',dc:14,ok:'b1_tent_sneak',fail:'b1_camp_fight'}},{t:'정면으로 쳐들어간다',go:'b1_camp_fight'}]},
b1_recruit:{title:'도적 소굴',text:`"신입이라고? 좋아, 실력부터 보자." 털보 부두목이 히죽 웃으며 결투장으로 끌고 간다. 도적들이 둘러서서 환호한다.`,
 choices:[{t:'맨손 씨름으로 이긴다',check:{skill:'운동',dc:13,ok:'b1_recruit_win',fail:'b1_recruit_duel'}},{t:'무기로 겨룬다',go:'b1_recruit_duel'}]},
b1_recruit_duel:{title:'결투장',text:`부두목이 도끼를 빙글 돌린다. "죽지만 마라, 신입!"`,combat:{noParty:true,enemies:[elite('도적 부두목',5,{hp:30})],win:'b1_recruit_win'}},
b1_recruit_win:{title:'도적 소굴',text:`도적들이 환호성을 지른다. "괜찮은 놈이 왔네!" 부두목이 어깨를 툭 친다. "두목 타조크님이 보자신다. 천막으로 가 봐."`,choices:[{t:'두목의 천막으로',go:'b1_tent'}]},
b1_camp_fight:{title:'도적 소굴',text:`"침입자다!" 종이 울리고 도적들이 몰려나온다.`,combat:{enemies:[mob('도적',5,{n:3}),mob('도적 궁수',5,{hp:15})],win:'b1_tent'}},
b1_tent:{title:'타조크의 천막',text:`천막 안, 어깨가 문틀만 한 반오우거 타조크가 지도 위에 단검을 꽂고 있다. 그가 당신을 보고 이빨을 드러낸다.

"고리온의 꼬맹이로군. 네 목에 걸린 돈이 얼마인지 아나? 주인님이 아주 좋아하시겠어."`,combat:{enemies:[boss('타조크',5,{hp:70}),mob('천막 호위',5)],win:'b1_docs'}},
b1_tent_sneak:{title:'타조크의 천막',text:`코 고는 소리가 천막을 울린다. 거대한 반오우거 타조크가 잠들어 있다. 책상 위에 서류 상자가 놓여 있다.`,
 choices:[{t:'서류 상자를 소리 없이 연다',check:{skill:'손재주',dc:13,ok:'b1_docs',fail:'b1_tent_wake'}},{t:'잠든 타조크를 덮친다',go:'b1_tent_wake'}]},
b1_tent_wake:{title:'타조크의 천막',text:`타조크의 눈이 번쩍 뜨인다! "쥐새끼가 들어왔군!" 그가 거대한 도끼를 집어 든다.`,combat:{enemies:[boss('타조크',5,{hp:60})],win:'b1_docs'}},
b1_docs:{title:'타조크의 천막',onEnter:{set:{docs:1},item:'철의 왕좌 문서',gold:60,loot:'u_tazok'},text:`서류 상자 속 편지들이 퍼즐 조각처럼 맞춰진다.

도적단, 광산 오염, 상인 습격. 모두 <b>'철의 왕좌'</b>라는 상인 조합의 명령이다. 그리고 그들은 클록우드 숲 깊은 곳에 비밀 광산을 운영하며 철을 몰래 쌓아두고 있다.

마지막 편지에는 처음 보는 이름이 서명돼 있다. <b>사레복</b>.

<i>"고리온의 피후견인은 반드시 내 손으로. 다른 놈들은 손대지 마라."</i>

칼리드가 중얼거린다. "고, 고리온을 죽인 그 거인… 혹시…"`,
 choices:[{t:'클록우드 숲으로 간다',go:'b1_cloak'}]},
b1_cloak:{title:'클록우드 숲',text:`빛조차 잘 들지 않는 고목의 숲. 나뭇가지에 굵은 거미줄이 늘어져 있다.

덤불 속에서 상처 입은 엘프 드루이드가 기어 나온다. "도와주시오… 거미 괴물 에터캡들이 내 숲을 갉아먹고 있소. 놈들의 둥지를 없애주면 광산으로 가는 지름길을 알려주겠소."

자헤이라가 당신을 본다. "숲의 균형이 깨지고 있다. 나는 돕고 싶군."`,
 choices:[{t:'드루이드를 돕는다',go:'b1_spiders'},{t:'갈 길이 급하다. 광산으로 곧장 간다',go:'b1_cloak_road'}]},
b1_spiders:{title:'거미 둥지',text:`둥지 한가운데, 거미와 사람을 반쯤 섞은 듯한 에터캡이 실을 뽑고 있다. 그 주위로 개만 한 거미들이 기어 다닌다.`,combat:{enemies:[elite('에터캡',5),mob('거대 거미',5,{hp:14,n:2})],win:'b1_spiders_win'}},
b1_spiders_win:{title:'클록우드 숲',onEnter:{set:{druid:1},potions:2},text:`드루이드가 감사의 표시로 약초 물약 두 병을 건넨다.

"광산 뒤편 계곡에 낡은 배수로가 있소. 그곳으로 들어가면 경비를 피할 수 있을 거요. 그리고… 광산 꼭대기의 수문을 조심하시오. 열리면 광산 전체가 물에 잠길 테니."`,choices:[{t:'배수로로 광산에 숨어든다',go:'b1_mine_in'}]},
b1_cloak_road:{title:'클록우드 광산 입구',text:`광산 입구를 철의 왕좌 용병들이 지키고 있다. 그 너머로 사슬에 묶인 노예들이 광석을 나르는 모습이 보인다.`,
 choices:[{t:'철의 왕좌 문서를 내밀며 감찰관 행세를 한다',req:['docs'],check:{skill:'기만',dc:12,ok:'b1_mine_in',fail:'b1_gate_fight'}},{t:'경비를 쓰러뜨린다',go:'b1_gate_fight'}]},
b1_gate_fight:{title:'클록우드 광산 입구',text:`"침입자다! 노예들을 지하로 몰아넣어!" 용병들이 달려든다.`,combat:{enemies:[mob('철의 왕좌 용병',5,{n:3})],win:'b1_mine_in'}},
b1_mine_in:{title:'클록우드 광산',text:`광산 안은 지옥이다. 앙상한 노예들이 채찍질 아래 광석을 캔다. 노예 우두머리인 늙은 드워프 릴이 몰래 다가온다.

"당신들, 감독관 패거리가 아니군. 맨 아래층에 다바에오른이라는 마법사가 있소. 놈만 쓰러뜨리면 우리가 들고일어나겠소."`,
 choices:[{t:'노예들에게 함께 싸우자고 설득한다',not:['riot_try'],set:{riot_try:1},check:{skill:'설득',dc:13,ok:'b1_riot',fail:'b1_mine_in2'}},
  {t:'몰래 숨어 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r3'],set:{r3:1},rest:1,go:'b1_mine_in'},
  {t:'맨 아래층으로 내려간다',go:'b1_davaeorn'}]},
b1_riot:{title:'클록우드 광산',onEnter:{set:{riot:1}},text:`릴이 낡은 곡괭이를 치켜든다. "들었나, 형제들! 오늘이다!"

노예들이 하나둘 사슬을 끊고 일어선다. 그들이 감독관들을 맡는 사이, 당신은 최하층으로 향한다.`,choices:[{t:'맨 아래층으로',go:'b1_davaeorn'}]},
b1_mine_in2:{title:'클록우드 광산',text:`노예들은 겁에 질려 고개를 젓는다. "희망 따위로 사슬이 끊어지진 않소…"`,choices:[{t:'맨 아래층으로 내려간다',go:'b1_davaeorn'}]},
b1_davaeorn:{title:'광산 최하층',text:f=>`최하층의 서재. 창백한 마법사 다바에오른이 책을 덮으며 일어선다.

"사레복 님이 경고하셨지. 고리온의 아이가 쥐새끼처럼 기어들어 올 거라고." 그의 등 뒤에서 텅 빈 갑옷이 일어난다. 영혼 없는 전투 공포다.${f.riot?'\n\n위층에서 노예들의 함성이 들려온다. 감독관들은 이리로 오지 못할 것이다.':''}`,
 combat:{enemies:[boss('다바에오른',5,{hp:60,ac:13,attacks:1}),elite('전투 공포',5,{hp:30})],win:'b1_flood'}},
b1_flood:{title:'광산 최하층',onEnter:{item:'다바에오른의 일지',loot:'u_davaeorn'},text:`다바에오른이 재가 되어 흩어진다. 그의 책상 위 일지에 모든 계획이 적혀 있다. 철을 독점해 소드 코스트를 굶기고, 이웃 나라 앰과의 전쟁을 일으킨다. 그리고 그 혼란 속에서 발더스 게이트를 손에 넣는다. 계획의 주인은 사레복이다.

벽에 커다란 수문 레버가 있다. 이걸 당기면 광산은 물에 잠기고, 철의 왕좌의 비밀 광산은 끝장난다.`,
 choices:[{t:'노예들에게 탈출하라고 외치고 레버를 당긴다',check:{skill:'곡예',dc:12,ok:'b1_flood_ok',fail:'b1_flood_hurt'}}]},
b1_flood_ok:{title:'수몰',text:`굉음과 함께 물이 쏟아져 들어온다. 노예들과 함께 갱도를 달려 올라간다. 마지막 사람이 빠져나오는 순간, 입구가 물보라에 잠긴다.`,choices:[{t:'숲으로 나온다',go:'b1_c3_end'}]},
b1_flood_hurt:{title:'수몰',onEnter:{dmg:'2d6'},text:`물살에 휩쓸려 바위에 부딪힌다! 민스크가 당신의 멱살을 잡아 끌어올린다. "부가 말한다. 수영은 다음에 배우라고!"`,choices:[{t:'숲으로 나온다',go:'b1_c3_end'}]},
b1_c3_end:{title:'3장 끝',chapterEnd:true,text:`해방된 노예들이 당신의 이름을 부르며 흩어진다. 비밀 광산이 사라지자 철값이 내려가기 시작한다.

다바에오른의 일지는 한 곳을 가리킨다. <b>발더스 게이트</b>, 철의 왕좌 본부.

그리고 일지 마지막 장에는 이런 문장이 있다.

<i>"그 아이와 나는 같은 피를 나눴다. 그 피를 모두 차지하는 자만이 아버지의 자리에 오를 것이다."</i>`}
,
/* ---------- 4장: 바알의 아들 (Lv6) ---------- */
b1_c4:{title:'발더스 게이트',text:`거대한 성문을 지나 소드 코스트 최대의 도시로 들어선다. 항구의 소금 냄새, 끝없는 인파, 그리고 곳곳에 걸린 현상수배 전단. 다행히 아직 당신 얼굴은 아니다.

철의 왕좌 본부는 상층 도시의 높은 석조 건물이다. 정문은 무장한 경비들이 지킨다.`,
 choices:[{t:'상층 도시 상점가에 들른다',go:'b1_market'},{t:'불꽃 주먹 경비대에 다바에오른의 일지를 보여준다',req:['item:다바에오른의 일지'],check:{skill:'설득',dc:13,ok:'b1_fist',fail:'b1_throne_front'}},{t:'옆 건물 지붕을 타고 넘어간다',check:{skill:'곡예',dc:13,ok:'b1_throne_roof',fail:'b1_throne_front'}},{t:'정문을 돌파한다',go:'b1_throne_front'}]},
b1_fist:{title:'불꽃 주먹 본부',onEnter:{set:{eltan:1}},text:`불꽃 주먹 사령관 엘탄 공작이 직접 일지를 읽는다. 그의 얼굴이 굳는다.

"사레복… 철의 왕좌 주인 리엘타의 양아들이로군. 공개적으로 움직이면 놈들이 눈치챌 거다. 뒷문을 열어줄 테니 조용히 처리해라."

엘탄 공작이 기침을 한다. 손수건에 피가 묻어난다. "요즘 몸이… 신경 쓰지 마라."`,choices:[{t:'뒷문으로 잠입한다',go:'b1_throne_roof'}]},
b1_throne_roof:{title:'철의 왕좌 본부',text:`조용히 건물 안으로 들어선다. 꼭대기 층 회의실에는 아무도 없다. 책상 위에 남은 메모 하나.

<i>"리엘타와 상인 지도자들은 캔들킵 회의로 출발. 사레복 님은 남는다."</i>

캔들킵. 당신의 고향이다.`,choices:[{t:'캔들킵으로 향한다',go:'b1_keep'}]},
b1_throne_front:{title:'철의 왕좌 본부',text:`경비들이 칼을 뽑는다. "철의 왕좌에 쳐들어오다니, 미쳤군!"`,combat:{enemies:[mob('철의 왕좌 경비',6,{n:3}),elite('경비 대장',6,{hp:30})],win:'b1_throne_roof'}},
b1_keep:{title:'캔들킵',text:`몇 달 만에 돌아온 캔들킵. 문지기가 당신을 알아보고 반갑게 문을 연다.

서고 깊은 곳 고리온의 방은 그대로다. 책상 서랍에서 고리온이 남긴 두 번째 편지를 찾는다.

<i>"네 아버지는 바알, 죽은 살인의 신이다. 그는 자신의 죽음을 예견하고 필멸자들 사이에 자식을 남겼다. 너도 그중 하나다. 다른 자식들은 서로를 죽여 아버지의 힘을 되찾으려 할 것이다. 나는 너를 그런 운명에서 지키고 싶었다. 너는 네 피가 아니라 네 선택으로 정의된다는 걸 잊지 마라."</i>

손이 떨린다. 이모엔이 말없이 당신 손을 잡는다.`,
 choices:[{t:'회의장으로 가서 사레복의 음모를 알린다',go:'b1_keep_murder'}]},
b1_keep_murder:{title:'캔들킵 회의장',text:`회의장 문을 연 순간, 피 냄새가 코를 찌른다. 리엘타와 상인 지도자들이 모두 죽어 있다.

등 뒤에서 수도사들이 외친다. "살인자다! 고리온의 피후견인이 지도자들을 죽였다!"

당신은 순식간에 포위된다. 성채의 수호자 울라운트가 차갑게 명령한다. "가둬라."`,
 choices:[{t:'저항하지 않고 끌려간다',go:'b1_cell'},{t:'"이건 함정이다!" 하고 수도사들의 얼굴을 살핀다',check:{skill:'통찰',dc:14,ok:'b1_dopple_spot',fail:'b1_cell'}}]},
b1_dopple_spot:{title:'캔들킵 회의장',text:`소리치는 수도사들의 눈동자가 잿빛으로 일렁인다. 변신자들이다! 당신이 외치자 가짜 수도사들이 정체를 드러내며 덤벼든다.`,combat:{enemies:[mob('변신자',6,{n:3})],win:'b1_catacomb'}},
b1_cell:{title:'캔들킵 감옥',text:`어둑한 감옥. 밤이 깊자 늙은 수도사 테스토릴이 몰래 찾아온다.

"나는 네가 하지 않았다는 걸 안다. 고리온이 너를 어떻게 키웠는지 봤으니까." 그가 문을 연다. "지하 묘지로 나가는 길이 있다. 조심해라. 그 아래엔 산 자도, 죽은 자도 아닌 것들이 있다."`,choices:[{t:'지하 묘지로',go:'b1_catacomb'}]},
b1_catacomb:{title:'캔들킵 지하 묘지',text:`촛불 하나에 의지해 오래된 묘지를 지난다. 그때 앞쪽에서 익숙한 목소리가 들린다.

"…얘야, 나다."

고리온이 서 있다. 살아 있는 모습 그대로. 그가 팔을 벌린다. "이리 오너라. 다 설명해주마."`,
 choices:[{t:'"…당신은 고리온이 아니야."',check:{skill:'통찰',dc:12,ok:'b1_fake_gorion',fail:'b1_fake_hug'}},{t:'고리온에게 달려간다',go:'b1_fake_hug'}]},
b1_fake_hug:{title:'지하 묘지',onEnter:{dmg:'2d8'},text:`품에 안기는 순간 등에 칼날이 박힌다. "고리온"의 얼굴이 녹아내린다. 변신자다!`,combat:{enemies:[elite('변신자 (고리온의 얼굴)',6),mob('변신자',6,{n:2})],win:'b1_escape'}},
b1_fake_gorion:{title:'지하 묘지',text:`"고리온은 나를 '얘야'라고 부른 적이 없어." 당신의 말에 가짜 고리온의 얼굴이 일그러지며 녹아내린다. 어둠 속에서 다른 변신자들도 기어 나온다.`,combat:{enemies:[elite('변신자 (고리온의 얼굴)',6,{hp:30}),mob('변신자',6)],win:'b1_escape'}},
b1_escape:{title:'발더스 게이트',text:`묘지를 빠져나와 밤새 걸어 발더스 게이트로 돌아온다. 이제 도시 곳곳에 당신의 얼굴이 그려진 현상수배 전단이 붙어 있다. '캔들킵 학살자'.

그리고 거리마다 같은 소식이 울려 퍼진다. 엘탄 공작이 독에 쓰러졌고, 내일 <b>사레복이 새 대공작으로 즉위한다.</b>

자헤이라가 이를 간다. "놈이 도시를 통째로 삼키려 해. 증거가 필요하다. 놈이 직접 쓴 것."`,
 choices:[{t:'사레복의 저택에 숨어든다',check:{skill:'은신',dc:13,ok:'b1_diary',fail:'b1_manor_fight'}},{t:'증거 없이 바로 대공 궁전으로 간다',go:'b1_palace'}]},
b1_manor_fight:{title:'사레복의 저택',text:`경비견이 짖는다! 저택 경비들이 몰려온다.`,combat:{enemies:[mob('저택 경비',6,{n:2}),mob('경비견',6,{hp:16})],win:'b1_diary'}},
b1_diary:{title:'사레복의 저택',onEnter:{set:{diary:1},item:'사레복의 일기'},text:`사레복의 침실, 검은 장정의 일기장. 그 안에는 모든 것이 적혀 있다. 고리온 살해, 철의 위기, 지도자 암살, 엘탄 공작 독살. 그리고 마지막 장.

<i>"대공작이 되면 앰과 전쟁을 일으킨다. 수많은 죽음이 아버지 바알의 힘을 내게 모아줄 것이다. 그리고 나는 신이 된다."</i>`,
 choices:[{t:'대공 궁전으로',go:'b1_palace'}]},
b1_palace:{title:'대공 궁전',text:f=>`대관식장. 귀족들 사이로 검은 판금 갑옷의 거인이 걸어 나온다. 이제 투구를 벗은 그의 얼굴. 사레복이다. 고리온을 죽인 그 거인.

당신이 홀 한가운데로 걸어 나가자 사람들이 술렁인다.${f.diary?'\n\n품속에 사레복의 일기가 있다.':''}`,
 choices:[{t:'일기를 펼쳐 귀족들 앞에서 낭독한다',req:['diary'],check:{skill:'설득',dc:11,ok:'b1_expose',fail:'b1_palace_fight'}},{t:'"이자가 진짜 살인자다!" 하고 외친다',not:['diary'],check:{skill:'설득',dc:16,ok:'b1_expose',fail:'b1_palace_fight'}},{t:'곧장 사레복에게 달려든다',go:'b1_palace_fight'}]},
b1_expose:{title:'대공 궁전',onEnter:{set:{exposed:1}},text:`일기의 문장들이 홀에 울려 퍼질수록 귀족들의 얼굴이 하얗게 질린다. 벨트 공작이 일어선다. "경비대! 저자를 체포하라!"

사레복이 처음으로 웃는다. "형제여. 결국 여기까지 왔구나." 그의 부하들이 연막을 터뜨린다. 연기가 걷히자 사레복은 사라지고 없다. 바닥에 하수도로 이어지는 비밀 문이 열려 있다.`,choices:[{t:'사레복을 쫓는다',go:'b1_undercity'}]},
b1_palace_fight:{title:'대공 궁전',text:`"저 살인자를 잡아라!" 사레복의 외침에 그의 부하들이 덤벼든다. 혼란 속에서 사레복은 비밀 문으로 사라진다.`,combat:{enemies:[mob('사레복의 부하',6,{n:3})],win:'b1_undercity'}},
b1_undercity:{title:'지하 도시',text:`도시 아래, 잊혀진 옛 거리. 그 끝에 바알의 신전이 있다. 해골과 피로 장식된 거대한 홀.

신전 입구에서 날렵한 여인이 길을 막는다. 사레복의 연인이자 부하인 타모코다.

"돌아가라. 그는… 그는 원래 이런 사람이 아니었어. 피가 그를 미치게 만들었을 뿐이야."`,
 choices:[{t:'"그는 너를 버릴 거다. 일기에 그렇게 적혀 있었다."',req:['diary'],check:{skill:'설득',dc:12,ok:'b1_tamoko_go',fail:'b1_final_rest'}},{t:'"비켜라."',go:'b1_final_rest'}]},
b1_tamoko_go:{title:'지하 도시',onEnter:{set:{tamoko_gone:1}},text:`타모코의 손이 떨린다. 일기의 한 구절을 보여주자, 그녀는 눈을 감고 칼을 내려놓는다.

"…알고 있었어. 처음부터." 그녀는 어둠 속으로 사라진다.`,choices:[{t:'신전으로 들어간다',go:'b1_final_rest'}]},
b1_final_rest:{title:'바알의 신전 앞',text:`신전 문 너머에서 의식의 노래가 들린다. 마지막 싸움이다.

민스크가 부를 쓰다듬는다. 이모엔이 단검을 고쳐 쥔다. 자헤이라가 고개를 끄덕인다.`,
 choices:[{t:'모두 함께 숨을 고른다',sub:'짧은 휴식 · 한 번만',not:['r4'],set:{r4:1},rest:1,go:'b1_final_rest'},{t:'신전으로 들어간다',go:'b1_sarevok'}]},
b1_sarevok:{title:'바알의 신전',text:f=>`피의 제단 위에 사레복이 서 있다. 그가 거대한 검을 들어 올린다.

"고리온은 너를 숨겼지. 나는 버려졌다. 같은 피, 다른 운명. 오늘 그 피를 하나로 합치겠다, 형제여."${f.tamoko_gone?'':'\n\n그의 곁에 타모코가 칼을 뽑아 든다.'}`,
 combat:f=>({enemies:[boss('사레복',6,{hp:95,ac:17,dmg:'2d6+4'}),elite('사레복의 마법사 세마이',6,{hp:30,ac:12})].concat(f.tamoko_gone?[]:[elite('타모코',6,{hp:35,ac:15})]),win:'b1_end'})},
b1_end:{title:'에필로그',ending:'win',onEnter:{gold:500},text:`사레복이 무릎을 꿇는다. 그의 몸에서 검붉은 기운이 빠져나와 신전 바닥으로 스며든다. 마지막 순간 그는 웃는 것도 우는 것도 아닌 얼굴로 중얼거린다.

<i>"…이것이 끝이 아니다, 형제여."</i>

며칠 뒤, 발더스 게이트는 당신을 영웅으로 맞는다. 엘탄 공작은 해독제로 회복하고, 앰과의 전쟁은 없던 일이 된다. 사람들은 당신의 이름을 노래한다. 당신 핏속의 비밀을 아는 이는 몇 되지 않는다.

그날 밤, 축하연이 끝나고 일행과 함께 여관으로 돌아가는 길. 골목의 그림자가 이상하게 짙다. 누군가 당신의 이름을 부른다. 그리고 세상이 어두워진다.

<b>— 발더스 게이트 1 완료 · 이야기는 2편 「앰의 그림자」로 이어집니다 —</b>`}
}});

/* ===== 발더스 게이트 2: 앰의 그림자 (게임 줄거리를 바탕으로 새로 쓴 축약판 + 오리지널 외전 장면) ===== */
CAMP({id:'bg2',title:'발더스 게이트 2: 앰의 그림자',short:'BG2 앰의 그림자',sub:'게임 2편 줄거리 · 4장',
 desc:'사레복을 쓰러뜨린 영웅은 어둠 속에서 납치된다. 눈을 뜬 곳은 정체불명의 마법사 이레니쿠스의 실험실. 그는 당신 핏속의 무언가를 원한다.',

  jaheira:{name:'자헤이라',role:'healer',desc:'칼리드를 잃은 슬픔을 분노로 버티는 드루이드.'},

 nodes:{
/* ---------- 1장: 이레니쿠스의 던전 (Lv7) ---------- */
b2_start:{title:'???',text:`차가운 쇠창살. 몸 곳곳에 남은 바늘 자국. 당신은 철창 안에서 눈을 뜬다.

어둠 속에서 낮은 목소리가 들린다. 창백한 얼굴, 차가운 눈의 마법사가 당신을 내려다본다.

<i>"아직 버티는군. 좋아. 네 안의 힘은… 생각보다 깊어. 조금만 더 들여다보자꾸나."</i>

그가 손을 드는 순간, 천장 너머로 폭음이 울린다. 누군가 이곳을 습격하고 있다. 마법사는 혀를 차며 사라진다.

잠시 뒤, 익숙한 분홍 머리가 창살 앞에 나타난다. "일어나! 지금이 기회야!" 이모엔이다. 그녀가 자물쇠를 딴다.`,
 choices:[{t:'이모엔과 함께 감방을 나선다',go:'b2_cells'}]},
b2_cells:{title:'감옥 복도',onEnter:{join:['imoen','minsc','jaheira']},text:`복도의 다른 철창들에서 민스크와 자헤이라를 찾아낸다. 민스크는 부를 품에 안고 있다. "부도 무사하다! 부는 굶었지만 용감했다!"

자헤이라는 말이 없다. 그녀의 시선이 복도 끝 철창에 고정돼 있다. 그 안에 칼리드가 누워 있다. 움직이지 않는다.

"…그 마법사가 실험했어. 칼리드에게." 자헤이라의 목소리가 갈라진다. "울 시간은 나중이다. 지금은 나가야 해."

복도 끝의 다른 감방에서 동양풍 옷차림의 남자가 손을 흔든다. "이봐, 나도 좀 꺼내주지 않겠나? 요시모라고 하네. 나도 그 미친 마법사한테 잡혀왔지."`,
 choices:[{t:'요시모를 꺼내준다',join:'yoshimo',go:'b2_lab'},{t:'믿을 수 없다. 그냥 간다',go:'b2_lab'}]},
b2_lab:{title:'이레니쿠스의 실험실',text:`유리병 속에 무언가 떠다니는 실험실. 원소 정령 메피트들이 날아다니고, 구석에서 살덩이로 빚은 골렘이 몸을 일으킨다.

벽의 제어 문양이 골렘을 조종하는 것 같다.`,
 choices:[{t:'제어 문양을 해석해 골렘을 멈춘다',check:{skill:'비전',dc:15,ok:'b2_lab_half',fail:'b2_lab_fight'}},{t:'싸워서 뚫는다',go:'b2_lab_fight'}]},
b2_lab_half:{title:'이레니쿠스의 실험실',text:`문양 하나를 손끝으로 지우자 골렘이 그대로 굳는다. 하지만 메피트들이 키득거리며 덤벼든다.`,combat:{enemies:[mob('불꽃 메피트',7,{n:3})],win:'b2_dryad'}},
b2_lab_fight:{title:'이레니쿠스의 실험실',text:`골렘이 비틀거리며 다가오고, 메피트들이 불꽃을 뿜는다!`,combat:{enemies:[elite('살덩이 골렘',7),mob('불꽃 메피트',7,{n:2})],win:'b2_dryad'}},
b2_dryad:{title:'갇힌 정원',text:`실험실 안쪽, 마법으로 만든 작은 숲. 나무 정령 드라이어드 셋이 유리 벽 안에 갇혀 있다.

"부탁이에요… 저 마법사가 우리 도토리를 빼앗아 갔어요. 도토리가 없으면 숲으로 돌아갈 수 없어요. 저 옆방 상자에 있어요."

옆방에는 병 속에 갇힌 지니도 있다. "나를 풀어주면 보답하지, 필멸자."`,
 choices:[{t:'도토리를 찾아 드라이어드를 풀어준다',not:['dryad'],set:{dryad:1},go:'b2_dryad_free'},{t:'지니의 병을 연다',not:['genie'],set:{genie:1},go:'b2_genie'},{t:'출구를 찾는다',go:'b2_exit'}]},
b2_dryad_free:{title:'갇힌 정원',onEnter:{heal:'3d8',loot:'u_acorn'},text:`도토리를 돌려주자 드라이어드들이 노래하며 빛 속으로 사라진다. 그 빛이 당신의 상처를 감싸 아물게 한다.

자헤이라가 오랜만에 희미하게 웃는다.`,choices:[{t:'돌아선다',go:'b2_dryad'}]},
b2_genie:{title:'병 속의 지니',onEnter:{potions:2},text:`병에서 푸른 연기가 솟구쳐 거대한 지니가 된다. "자유다! 약속대로." 그가 손가락을 튕기자 물약 두 병이 나타난다.

"한 가지 더 알려주지. 너를 가둔 자의 이름은 이레니쿠스. 그는 엘프였지만, 엘프이길 버린 자다."`,choices:[{t:'돌아선다',go:'b2_dryad'}]},
b2_exit:{title:'던전 출구',text:`계단을 오르자 그림자 도적단 암살자들이 쓰러져 있다. 이들이 습격한 자들이다. 하지만 출구 앞에 아직 살아 있는 이레니쿠스의 하수인들이 버티고 있다.`,combat:{enemies:[mob('복제인간 경비',7,{n:2}),elite('던전 관리인',7)],win:'b2_street'}},
b2_street:{title:'애스카틀라 거리',text:`햇빛. 몇 달 만의 햇빛이다. 그곳은 앰의 수도, 애스카틀라였다.

광장에서 이레니쿠스가 그림자 도적단 암살자들을 마법으로 날려버리고 있다. 그때 이모엔이 앞으로 뛰쳐나간다.

"너 이 자식! 우리한테 무슨 짓을 한 거야!" 그녀의 손끝에서 마법 화살이 날아간다.

순간, 공기가 찢어지며 두건 쓴 마법사들이 나타난다. <b>두건 쓴 마법사단</b>. 이 나라에서 허가 없이 마법을 쓰는 자를 잡아가는 자들이다.

"허가 없는 마법 사용. 둘 다 연행한다." 이레니쿠스가 비웃는다. "좋아, 데려가라. 단, 이 아이도 함께라면." 이모엔과 이레니쿠스가 빛 속으로 사라진다.`,
 choices:[{t:'"이모엔!!"',go:'b2_c1_end'}]},
b2_c1_end:{title:'1장 끝',chapterEnd:true,onEnter:{leave:'imoen'},text:`광장에 정적이 내려앉는다. 이모엔이 사라졌다.

망토 두른 남자가 다가온다. "가엘란 베일이오. 친구분이 끌려간 곳은 <b>스펠홀드</b>. 마법 범죄자들을 가두는 섬의 정신병원이지. 그곳에 가는 배편을 구하려면… 금화 2만 닢쯤 필요할 거요. 일거리를 소개해 드릴 수 있소만."

자헤이라가 당신의 어깨를 잡는다. "칼리드를 잃었다. 이모엔까지 잃을 순 없어."`}
,
/* ---------- 2장: 애스카틀라의 거래 (Lv8) ---------- */
b2_c2:{title:'애스카틀라 빈민가',text:`가엘란 베일의 은신처. 그가 두 가지 제안을 늘어놓는다.

"그림자 도적단의 수장 아란 린베일 님이 돈을 대주겠다고 하시오. 대가로 그분의 전쟁을 도와야 하지. 요즘 도시에 흡혈귀 길드가 들어와서 도적단과 전쟁 중이거든."

그날 밤, 여관 창밖에 창백한 여인이 나타난다. "나는 보디. 도적단보다 더 빨리, 더 많이 주지. 대신 내 편에 서."

어느 쪽이든 먼저 돈을 모아야 한다. 도시에는 일거리가 넘친다.`,
 choices:[{t:'그림자 도적단과 손을 잡는다',not:['side'],set:{side:1,thieves:1},go:'b2_jobs'},{t:'창백한 여인 보디와 손을 잡는다',not:['side'],set:{side:1,vamp:1},go:'b2_jobs'}]},
b2_jobs:{title:'애스카틀라',text:f=>`금화 2만 닢. 큰돈이다. 도시 곳곳에서 일거리를 모은다.${(f.job_circus?1:0)+(f.job_pit?1:0)+(f.job_keep?1:0)>=2?'\n\n<b>충분한 돈이 모였다!</b>':''}`,
 choices:[
  {t:'와우킨 광장 시장에서 장비를 산다',go:'b2_market'},
  {t:'와우킨 광장의 이상한 서커스 천막 조사',not:['job_circus'],go:'b2_circus'},
  {t:'구리 왕관 주점 지하의 노예 투기장 소탕',not:['job_pit'],go:'b2_pit'},
  {t:'트롤에게 점령당한 드아르니스 성 탈환',not:['job_keep'],go:'b2_keep'},
  {t:'모은 돈을 들고 결판을 지으러 간다',req:['job_circus','job_pit'],go:'b2_war'},
  {t:'모은 돈을 들고 결판을 지으러 간다',req:['job_circus','job_keep'],not:['job_pit'],go:'b2_war'},
  {t:'모은 돈을 들고 결판을 지으러 간다',req:['job_pit','job_keep'],not:['job_circus'],go:'b2_war'}]},
b2_circus:{title:'와우킨 광장',text:`광장 한복판의 서커스 천막. 들어가자마자 세상이 일그러진다. 관객은 인형이 되고, 광대들은 이빨을 드러낸다. 환영이다.

천막 깊은 곳에서 날개 없는 엘프 소녀의 울음소리가 들린다.`,
 choices:[{t:'환영의 틈을 찾는다',check:{skill:'비전',dc:15,ok:'b2_circus_boss',fail:'b2_circus_fight'}},{t:'환영 따위 베어버린다',go:'b2_circus_fight'}]},
b2_circus_fight:{title:'뒤틀린 서커스',text:`광대 인형들이 칼날 같은 손가락을 세우고 달려든다!`,combat:{enemies:[mob('환영 광대',8,{n:3})],win:'b2_circus_boss'}},
b2_circus_boss:{title:'서커스 무대',text:`무대 위의 작은 노움 칼라가 지팡이를 휘두른다. "다들 나를 비웃었지! 이제 내 쇼에서 영원히 박수나 쳐라!"

그 옆, 새장에 갇힌 엘프 소녀가 등에 남은 날개 흉터를 감싸 안고 있다.`,combat:{enemies:[elite('환술사 칼라',8,{ac:13}),mob('환영 분신',8,{hp:14,n:2})],win:'b2_aerie'}},
b2_aerie:{title:'와우킨 광장',onEnter:{set:{job_circus:1},join:'aerie',gold:250,loot:'u_kalah'},text:`환영이 걷히자 광장 상인들이 사례금을 들고 몰려온다.

새장에서 풀려난 엘프 소녀가 수줍게 고개를 숙인다. "아에리예요. 저는… 하늘을 날던 아바리엘이었어요. 노예 상인들이 제 날개를 잘랐죠. 서커스에서 구경거리가 되던 날들도 끝이네요."

그녀가 작게 웃는다. "따라가도 될까요? 마법이랑 치유 주문을 조금 할 줄 알아요."`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
b2_pit:{title:'구리 왕관 주점',text:`싸구려 술과 비명이 뒤섞인 주점. 지하 투기장에서는 노예들이 짐승과 싸우고, 귀족들이 돈을 건다.

주점 구석에서 은빛 갑옷의 노기사가 술잔을 내려놓는다. "켈도른이오. 래디언트 하트 기사단. 이 짓을 끝내러 왔소만, 혼자서는 버겁군. 함께하겠소?"`,
 choices:[{t:'켈도른과 함께 투기장으로 쳐들어간다',join:'keldorn',go:'b2_pit_fight'},{t:'우리끼리 간다',go:'b2_pit_fight'}]},
b2_pit_fight:{title:'노예 투기장',text:`투기장 감독관 레흐티난이 노예 검투사들의 쇠사슬을 풀며 웃는다. "새 손님이군! 오늘 쇼의 주인공이 되어주시오!"`,combat:{enemies:[elite('투기장 감독관',8),mob('노예 사냥꾼',8,{n:2})],win:'b2_pit_win'}},
b2_pit_win:{title:'노예 투기장',onEnter:{set:{job_pit:1},gold:250},text:`쇠사슬이 끊어지고, 노예들이 햇빛 속으로 나간다. 감독관의 금고는 꽤 두둑했다.

켈도른이 고개를 끄덕인다. "선한 일이었소. 이 도시엔 이런 곳이 아직 많지."`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
b2_keep:{title:'드아르니스 성',text:`도시 북쪽 귀족 가문의 성채. 성주의 딸 날리아가 애원한다. "트롤과 이상한 괴물들이 성을 점령했어요. 아버지가 아직 안에 계세요!"

트롤은 불이나 산으로 태워야 완전히 죽는다.`,
 choices:[{t:'하인용 통로로 몰래 들어간다',check:{skill:'은신',dc:14,ok:'b2_keep_boss',fail:'b2_keep_fight'}},{t:'성문을 부수고 들어간다',go:'b2_keep_fight'}]},
b2_keep_fight:{title:'드아르니스 성',text:`홀에 트롤들이 득실거린다. 잘린 팔이 다시 자라는 놈들이다!`,combat:{enemies:[mob('트롤',8,{hp:32,n:2})],win:'b2_keep_boss'}},
b2_keep_boss:{title:'드아르니스 성 지하',text:`지하실, 트롤들을 부리던 존재가 몸을 일으킨다. 거대한 갑각 괴물, 엄버 헐크다. 놈의 눈을 보면 정신이 흐려진다.`,combat:{enemies:[boss('엄버 헐크',8,{hp:90,attacks:1})],win:'b2_keep_win'}},
b2_keep_win:{title:'드아르니스 성',onEnter:{set:{job_keep:1},gold:250,loot:'u_hulk'},text:`성주를 구출하자 날리아가 눈물을 흘리며 감사한다. 성주는 큰 사례금을 내놓는다. "가문의 은인이오."`,choices:[{t:'일거리 목록으로',go:'b2_jobs'}]},
b2_war:{title:'묘지 구역',text:f=>f.thieves?`아란 린베일이 지도를 펼친다. "보디의 은신처는 묘지 구역 지하다. 놈을 쳐주면 약속대로 배편을 대주지."

밤의 묘지. 납골당 문을 열자 냉기가 쏟아져 나온다. 흡혈귀 하수인들이 붉은 눈을 번뜩인다.`:`보디가 미소 짓는다. "아란 린베일의 본부를 쳐. 그럼 배를 대주지."

하지만 도적단 본부를 습격한 순간, 보디의 하수인들이 등 뒤에서 덮친다. "주인님이 그러시더군. 쓸모가 다했다고."`,
 combat:{enemies:[elite('흡혈귀 하수인',8,{n:2}),mob('구울',8)],win:'b2_war_win'}},
b2_war_win:{title:'묘지 구역',text:f=>`어둠 속에서 보디가 웃는다. 창백한 얼굴, 이레니쿠스와 똑같이 차가운 눈.

"오라버니가 말한 대로구나. 재미있는 장난감이야." <b>오라버니</b>. 그녀는 이레니쿠스의 누이였다.

"스펠홀드에서 기다릴게. 오라버니가 너를 아주 보고 싶어 하거든." 그녀는 박쥐 떼가 되어 흩어진다.${f.vamp?'\n\n배신당했지만, 뜻밖에도 아란 린베일의 사람들이 다가온다. "적의 적은 친구지. 배는 우리가 대주겠소."':'\n\n아란 린베일이 약속을 지킨다. 해적 선장 사이몬의 배가 항구에서 기다린다.'}`,
 choices:[{t:'출항 준비를 한다',go:'b2_c2_end'}]},
b2_c2_end:{title:'2장 끝',chapterEnd:true,text:`밀수꾼 선장 사이몬 하바리안의 배가 어둠 속에서 닻을 올린다.

목적지는 해적의 섬 브린로. 그리고 그 섬 절벽 위의 정신병원, 스펠홀드.

뱃전에서 아에리가 하늘을 올려다본다. 요시모는 이상하게 말이 없다. 민스크가 부에게 속삭인다. "곧 이모엔을 만날 거다. 부, 떨지 마라. 아니, 떨어도 괜찮다."`}
,
/* ---------- 3장: 스펠홀드와 언더다크 (Lv9) ---------- */
b2_c3:{title:'브린로 섬',text:`해적과 밀수꾼의 섬 브린로. 절벽 위 회색 성채가 스펠홀드다. 정문은 굳게 닫혀 있다.

사이몬이 계획을 속삭인다. "가장 확실한 방법은… 환자로 들어가는 거요. 내가 당신을 미친 마법사라고 신고하겠소."`,
 choices:[{t:'환자로 위장해 들어간다',go:'b2_asylum'},{t:'해적 영주를 협박해 방문 허가증을 받는다',check:{skill:'위협',dc:15,ok:'b2_asylum',fail:'b2_pirates'}}]},
b2_pirates:{title:'해적 영주의 저택',text:`해적 영주가 코웃음 친다. "협박? 내 섬에서?" 해적들이 칼을 뽑는다.`,combat:{enemies:[mob('해적',9,{n:3})],win:'b2_asylum'}},
b2_asylum:{title:'스펠홀드',text:`병원 안은 기묘하게 고요하다. 환자들이 허공을 보며 중얼거린다. 복도 끝에서 원장이 당신을 맞는다.

…이레니쿠스다. 그는 처음부터 이곳의 주인이었다.

"어서 오너라. 기다리고 있었다. 네 친구 이모엔도 함께지. 너희 둘에겐 같은 피가 흐른다는 걸 알고 있었나?"

이모엔도… 바알의 자식이었다.`,
 choices:[{t:'달려든다',req:['has:yoshimo'],set:{yoshi:1},leave:'yoshimo',go:'b2_betray_y'},{t:'달려든다',not:['has:yoshimo'],go:'b2_betray_n'}]},
b2_betray_y:{title:'스펠홀드',text:`당신이 움직이려는 순간, 요시모가 당신의 팔을 붙잡는다. 그의 눈이 텅 비어 있다.

"미안하네, 친구… 정말 미안해. 이레니쿠스가 내게 맹약의 저주를 걸었어. 거역하면 내 심장이 멎는다고."

요시모가 칼을 뽑는다.`,combat:{enemies:[elite('맹약에 묶인 요시모',9,{ac:16,dmg:'1d8+7'})],win:'b2_soul'}},
b2_betray_n:{title:'스펠홀드',text:`이레니쿠스가 손가락을 튕기자 간수들이 사방에서 달려든다.`,combat:{enemies:[mob('스펠홀드 간수',9,{n:2})],win:'b2_soul'}},
b2_soul:{title:'의식의 방',text:f=>`${f.yoshi?'요시모는 쓰러지며 웃는다. "…고맙네. 이제야 자유롭군."\n\n':''}이레니쿠스의 마법이 당신을 제단에 묶는다. 옆 제단엔 이모엔이 누워 있다.

"너희 안의 신성한 정수, 바알의 힘. 그걸 내가 가져가겠다. 영원히 살기 위해서." 그의 손이 당신 가슴 위에 놓인다.

무언가가 뜯겨나간다. 영혼의 일부가. 비명조차 나오지 않는다.

눈을 떴을 때 이레니쿠스는 사라졌고, 당신은 텅 빈 껍데기처럼 차갑다. 이모엔도 마찬가지다.`,
 choices:[{t:'이모엔을 일으킨다',go:'b2_dream'}]},
b2_dream:{title:'악몽',onEnter:{join:'imoen'},text:`그날 밤 꿈속. 당신은 거울 앞에 서 있다. 거울 속 당신은 뿔과 발톱이 돋은 괴물, <b>학살자</b>다. 바알의 피가 빚어낸 모습.

<i>"그 엘프가 네 영혼을 가져갔지. 빈자리엔 내가 들어왔다. 날 받아들여라. 그러면 아무도 너를 막지 못해."</i>

깨어나니 식은땀이 흐른다. 이모엔이 당신을 보고 있다. "…너도 그 꿈 꿨구나."`,
 choices:[{t:'"함께 빠져나가자."',go:'b2_trials'}]},
b2_trials:{title:'스펠홀드 지하 미궁',text:`이레니쿠스는 섬 지하의 시험 미궁을 지나 도망쳤다. 미궁 입구 석판에 글이 새겨져 있다.

<i>"진실을 아는 자만 지나가리라. 문은 둘. 하나는 거짓만 말하는 수호자가, 하나는 진실만 말하는 수호자가 지킨다."</i>

두 석상이 동시에 입을 연다. "내 문이 출구다."`,
 choices:[{t:'석상 하나에게 "저쪽 석상은 어느 문을 출구라 하겠나?" 묻는다',check:{skill:'조사',dc:14,ok:'b2_trial2',fail:'b2_trial_fail'}},{t:'느낌대로 왼쪽 문을 연다',go:'b2_trial_fail'}]},
b2_trial_fail:{title:'미궁',onEnter:{dmg:'3d8'},text:`문을 연 순간 화염이 쏟아진다! 연기 속에서 반대편 문이 열린다.`,choices:[{t:'반대편 문으로',go:'b2_trial2'}]},
b2_trial2:{title:'미궁 최심부',text:`미궁 끝, 이레니쿠스가 차원문 앞에 서 있다. 그의 몸에서 당신의 영혼 빛이 넘실거린다.

"끈질기군. 하지만 네 힘은 이제 내 것이다." 그가 손을 휘두르자 간수들이 일어선다.`,
 choices:[{t:'숨을 고르고 싸운다',sub:'짧은 휴식 후 전투',not:['r_sh'],set:{r_sh:1},rest:1,go:'b2_irenicus1'},{t:'곧장 싸운다',go:'b2_irenicus1'}]},
b2_irenicus1:{title:'미궁 최심부',text:`"맛보거라, 네 아버지의 힘을!"`,combat:{enemies:[boss('이레니쿠스',9,{hp:110,ac:15}),mob('스펠홀드 간수',9,{hp:28})],win:'b2_underdark'}},
b2_underdark:{title:'언더다크',text:`이레니쿠스는 쓰러지기 직전 차원문으로 몸을 던진다. 그를 쫓아 뛰어든 곳은… 끝없는 어둠의 지하 세계, 언더다크였다.

버섯이 빛나는 동굴. 그곳에서 거대한 은빛 용이 당신을 내려다본다.

"나는 아달론. 드로우들이 내 알을 훔쳐갔다. 알을 되찾아준다면 너희를 지상으로 보내주마. 내 마법으로 너희를 드로우의 모습으로 바꿔주겠다. 그래야 그들의 도시 우스트 나사에 들어갈 수 있을 테니."`,
 choices:[{t:'드로우로 변장하고 우스트 나사로 간다',go:'b2_ustnatha'}]},
b2_ustnatha:{title:'우스트 나사',text:`거미줄 모양의 탑들, 보랏빛 마법등. 드로우 도시는 아름답고 잔혹하다.

알을 숨긴 곳은 여사제 파에레의 신전. 그녀는 당신이 새로 온 용병인 줄 안다. "마침 잘 왔다. 날 위해 일해라."`,
 choices:[{t:'파에레를 속이고 신전 깊숙이 들어간다',check:{skill:'기만',dc:15,ok:'b2_eggs',fail:'b2_drow_fight'}},{t:'경비가 바뀌는 틈에 몰래 들어간다',check:{skill:'은신',dc:15,ok:'b2_eggs',fail:'b2_drow_fight'}}]},
b2_drow_fight:{title:'우스트 나사 신전',text:`"가짜다! 지상인이다!" 드로우 전사들이 독 묻은 칼날을 뽑는다.`,combat:{enemies:[mob('드로우 전사',9,{n:2}),elite('드로우 여사제',9,{ac:15})],win:'b2_eggs'}},
b2_eggs:{title:'신전 금고',text:`은빛으로 빛나는 용의 알 두 개. 조심스럽게 감싸 들고 도시를 빠져나온다.

아달론이 알을 품고 깊은 숨을 내쉰다. "약속을 지켰구나. 이제 내 차례다." 은빛 바람이 일행을 감싸 위로, 위로 올린다.`,
 choices:[{t:'지상으로',go:'b2_c3_end'}]},
b2_c3_end:{title:'3장 끝',chapterEnd:true,text:`햇빛이 눈을 찌른다. 숲속, 엘프 수비대가 활을 겨눈 채 당신을 둘러싼다.

"지상으로 올라온 자들이군. 이레니쿠스를 쫓는다고?" 수비대장 엘한이 활을 내린다. "그자는 우리 엘프들의 숨겨진 도시 술다네셀라르를 노리고 있다. 그 도시의 '생명의 나무'를 삼키면 그는 신이 된다."

영혼을 잃은 몸이 시리다. 하지만 이모엔이 곁에 있다. "이번엔 우리가 쫓아가는 거야."`}
,
/* ---------- 4장: 생명의 나무 (Lv10) ---------- */
b2_c4:{title:'엘프 숲',text:`엘한이 설명한다. "술다네셀라르는 마법으로 숨겨져 있다. 길을 여는 유일한 열쇠는 '린 란턴'. 그런데 그 란턴을… 보디가 훔쳐갔다."

보디. 이레니쿠스의 누이, 흡혈귀 여왕. 그녀의 둥지는 애스카틀라 묘지 지하다.`,
 choices:[{t:'엘프 장인의 노점에 들른다',go:'b2_elfshop'},{t:'애스카틀라로 돌아간다',go:'b2_bodhi'}]},
b2_market:{title:'와우킨 광장 시장',shop:'b2_market',text:`세상의 온갖 물건이 모이는 앰의 시장. 마법 물품 상인이 당신의 텅 빈 눈을 보고 잠시 멈칫하더니, 이내 장사꾼의 미소를 짓는다.`,choices:[{t:'시장을 나선다',go:'b2_jobs'}]},
b2_elfshop:{title:'엘프 장인의 노점',shop:'b2_elf',text:`피난 중인 엘프 장인이 귀한 물건들을 펼쳐 보인다. "술다네셀라르를 구해주신다면, 이것들도 제 몫을 하겠지요."`,choices:[{t:'노점을 나선다',go:'b2_c4'}]},
b2_bodhi:{title:'보디의 둥지',text:`지하 무덤 가장 깊은 곳. 관들이 줄지어 열려 있고, 보디가 왕좌에 걸터앉아 있다.

"돌아왔구나, 영혼 없는 아이야. 그 텅 빈 눈이 마음에 들어."

천장의 틈으로 한 줄기 햇빛이 새어 든다. 흡혈귀가 가장 두려워하는 것.`,
 choices:[{t:'천장 틈을 넓혀 햇빛을 쏟아붓는다',check:{skill:'운동',dc:16,ok:'b2_bodhi_sun',fail:'b2_bodhi_fight'}},{t:'성스러운 기도로 빛을 부른다',req:['class:cleric'],go:'b2_bodhi_sun'},{t:'정면으로 맞선다',go:'b2_bodhi_fight'}]},
b2_bodhi_sun:{title:'보디의 둥지',text:`햇빛이 무덤 안을 가르자 흡혈귀들이 비명을 지르며 타들어 간다. 보디가 그림자 속으로 물러나며 이를 드러낸다.`,combat:{enemies:[boss('보디',10,{hp:85,ac:16,attacks:1})],win:'b2_lanthorn'}},
b2_bodhi_fight:{title:'보디의 둥지',text:`보디가 손짓하자 관에서 흡혈귀들이 일어난다. "내 아이들아, 저녁 식사 시간이다."`,combat:{enemies:[boss('보디',10,{hp:110,ac:16}),mob('흡혈귀',10,{hp:30})],win:'b2_lanthorn'}},
b2_lanthorn:{title:'보디의 둥지',onEnter:{item:'린 란턴',loot:'u_bodhi'},text:`보디의 몸이 재가 되어 무너진다. 그녀가 쥐고 있던 은빛 등불, 린 란턴이 바닥을 굴러 당신 발치에 멈춘다.

자헤이라가 등불을 비춘다. 빛 속에 숲의 길이 떠오른다. "가자. 엘프들이 버티고 있을 때."`,choices:[{t:'술다네셀라르로',go:'b2_city'}]},
b2_city:{title:'술다네셀라르',text:`나무 위에 지어진 엘프의 도시는 불타고 있다. 이레니쿠스가 부른 락샤사들과 골렘들이 거리를 휩쓴다.

엘프 병사가 쓰러지며 외친다. "여왕 엘레시메님이… 사원에 붙잡혀 계십니다! 그자는 생명의 나무로 가고 있어요!"`,
 choices:[{t:'불타는 다리를 뛰어넘어 지름길로 간다',check:{skill:'곡예',dc:14,ok:'b2_temple',fail:'b2_city_fight'}},{t:'거리의 락샤사들을 쓸어버린다',go:'b2_city_fight'}]},
b2_city_fight:{title:'불타는 거리',text:`호랑이 머리의 락샤사들이 손을 거꾸로 뒤집으며 웃는다. "엘프의 도시에 손님이라니."`,combat:{enemies:[elite('락샤사',10,{n:2})],win:'b2_temple'}},
b2_temple:{title:'라일리파네 사원',text:`사원 안에서 엘프 여왕 엘레시메가 마법 사슬에 묶여 있다. 그녀가 당신을 보고 슬프게 웃는다.

"이레니쿠스, 아니 '요본'은 원래 우리 백성이었다. 그는… 내가 사랑했던 사람이었지. 힘을 탐하다 추방당했고, 이제 이렇게 돌아왔구나."

그녀가 숨을 고른다. "생명의 나무에서 그를 막아다오. 그리고 네 영혼도 되찾아라. 그의 몸 안에 아직 남아 있으니."`,
 choices:[{t:'사슬을 풀고 여왕의 축복을 받는다',loot:'u_ellesime',heal:'full',potions:2,set:{blessed:1},go:'b2_tree'}]},
b2_tree:{title:'생명의 나무',text:`하늘에 닿을 듯한 거목. 그 뿌리에서 이레니쿠스가 나무의 생명력을 들이켜고 있다. 그의 몸이 빛나고, 나무는 시들어간다.

그가 돌아선다. "영혼 없는 껍데기가 여기까지 오다니. 감탄스럽군."

가슴 깊은 곳에서 학살자의 목소리가 속삭인다. <i>날 써라. 저놈을 찢어버려라.</i>`,
 choices:[{t:'학살자의 힘을 받아들인다',sub:'강력하지만 대가가 있다',set:{slayer:1},heal:'full',go:'b2_final_slayer'},{t:'내 힘으로, 동료들과 함께 싸운다',go:'b2_final'}]},
b2_final_slayer:{title:'생명의 나무',onEnter:{dmg:'2d6'},text:`뼈가 비틀리고 발톱이 돋는다. 학살자의 형상으로 이레니쿠스에게 달려든다! 분노가 고통을 삼킨다. 하지만 동료들이 두려운 눈으로 당신을 본다.`,combat:{enemies:[boss('이레니쿠스',10,{hp:120,ac:16})],win:'b2_end'}},
b2_final:{title:'생명의 나무',text:`동료들이 당신 곁에 선다. 민스크가 외친다. "부가 말한다! 영혼은 빼앗겨도 우정은 못 빼앗는다고!"`,combat:{enemies:[boss('이레니쿠스',10,{hp:140,ac:16}),mob('복제인간 수호자',10,{hp:30})],win:'b2_end'}},
b2_end:{title:'에필로그',ending:'win',text:f=>`이레니쿠스가 무릎을 꿇는다. 그의 몸에서 빛이 빠져나와 당신과 이모엔에게 돌아온다. 따뜻하다. 오래 잊고 있던 온기다.

그는 마지막으로 엘레시메의 이름을 부르고, 어둠 속으로 끌려가듯 사라진다. 그가 계약한 지옥의 대가를 치르러.

생명의 나무가 다시 푸르게 빛난다. 엘레시메 여왕이 엘프들 앞에서 당신의 이름을 부른다.${f.slayer?'\n\n하지만 학살자의 흔적은 쉽게 지워지지 않는다. 그날 이후로 당신은 가끔 손끝이 검게 변하는 꿈을 꾼다.':''}

모닥불 가에서 이모엔이 당신 어깨에 기댄다. "있잖아. 우리 둘 다 그 피를 갖고 있잖아. 근데 이번엔 우리가 이겼어."

멀리서, 아직 남은 바알의 자식들이 당신을 향해 눈을 뜬다. 하지만 그건 또 다른 이야기다.

<b>— 발더스 게이트 2 완료 —</b>`}
}});

/* ===== 발더스 게이트 3: 마인드 플레이어의 씨앗 (게임 줄거리를 바탕으로 새로 쓴 축약판 + 오리지널 외전 장면) ===== */
CAMP({id:'bg3',title:'발더스 게이트 3: 마인드 플레이어의 씨앗',short:'BG3 마인드 플레이어의 씨앗',sub:'게임 3편 줄거리 · 4장',
 desc:'100여 년 뒤. 마인드 플레이어의 함선에 납치되어 눈에 올챙이가 심어진 당신. 며칠 안에 괴물이 될 운명을 피하려는 기묘한 동료들의 여정.',
 startLevel:4,startGold:20,
 comps:{

  astarion:{name:'아스타리온',role:'striker',desc:'능글맞은 하이엘프 귀족. 햇빛을 피하는 이유가 있다.'},

  karlach:{name:'칼라크',role:'tank',desc:'아베르누스에서 탈출한 티플링 바바리안. 심장이 불타고 있다.'},
  jaheira:{name:'자헤이라',role:'healer',desc:'백 년을 넘게 산 하퍼의 전설. 여전히 날카롭다.'},
