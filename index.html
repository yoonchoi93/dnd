<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>기내 D&amp;D</title>
<style>
:root{
  --bg:#141118; --surface:#1e1a24; --surface2:#29232f; --line:#3a3242;
  --text:#ece4d4; --muted:#a99f90; --gold:#d9a441; --gold2:#f0c46a;
  --red:#d0573e; --green:#6fae6a; --blue:#6f9fd8;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.55}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
header.top{position:sticky;top:0;z-index:5;background:rgba(20,17,24,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:17px;letter-spacing:.02em;color:var(--gold2);font-weight:700}
.brand small{color:var(--muted);font-size:12px}
#statbar{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;flex-wrap:wrap}
#statbar:empty{display:none}
.hpbar{flex:1 1 120px;min-width:120px;height:20px;border-radius:10px;background:var(--surface2);position:relative;overflow:hidden;border:1px solid var(--line)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8f2c22,var(--red));transition:width .3s}
.hpbar span{position:relative;display:block;text-align:center;font-size:12px;line-height:18px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
main{padding:16px 16px calc(96px + var(--safe-b));max-width:680px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(24,20,29,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav.tabs button b{font-size:21px;line-height:1;font-weight:400}
nav.tabs button.on{color:var(--gold2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:19px;color:var(--gold2)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
.muted{color:var(--muted);font-size:14px}
.story{font-size:17px;line-height:1.75}
.story p{margin:0 0 12px}
.story i{color:#d8c9a8}
.scene-title{font-size:13px;letter-spacing:.12em;color:var(--gold);margin-bottom:4px}
.fx{background:var(--surface2);border-left:3px solid var(--gold);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;line-height:1.45;transition:transform .08s,border-color .15s}
.choice:active{transform:scale(.98);border-color:var(--gold)}
.choice[disabled]{opacity:.4}
.tag{display:inline-block;margin-top:5px;font-size:12px;color:var(--gold);background:rgba(217,164,65,.12);border-radius:6px;padding:1px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#1a140c;font-weight:700;border-radius:12px;padding:12px 16px;font-size:16px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cls{text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px}
.cls.on{border-color:var(--gold)}
.cls b{display:block;font-size:17px}
.cls small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:4px}

.skills{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px}

.list{list-style:none;margin:0;padding:0}

.enemy{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.enemy.tg{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}

.act{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act small{color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.act[disabled]{opacity:.35}
.act.free{border-style:dashed}
.log{font-size:14px;max-height:220px;overflow:auto;background:#17131b;border-radius:10px;padding:8px 10px;margin-top:10px}
.log div{padding:3px 0;border-bottom:1px solid #251f2b}
.log .hit{color:var(--gold2)} .log .hurt{color:#ff8f78} .log .ok{color:var(--green)}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1.1;color:var(--gold2);margin:6px 0}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.die{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 0;font-weight:700;font-size:17px}
.die:active{border-color:var(--gold);transform:scale(.96)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1a140c;font-weight:700}
.res{background:var(--surface2);border-radius:12px;padding:12px;margin-top:10px}
.res .k{font-size:22px;font-weight:800;color:var(--gold2)}
#overlay{position:fixed;inset:0;z-index:20;background:rgba(8,6,10,.78);display:none;align-items:center;justify-content:center;padding:24px}
#overlay.show{display:flex}
#overlay .card{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:center;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.ok-c{color:var(--green)} .bad-c{color:var(--red)}
.banner{background:#2a2012;border:1px solid #6b5124;color:#f3dcae;border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.party{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ally{display:flex;align-items:center;gap:8px;font-size:13px;background:#1b2420;border:1px solid #2e4238;border-radius:10px;padding:6px 10px;margin-bottom:6px}
.ally .bar{flex:1;height:5px;background:#26332c;border-radius:3px;overflow:hidden}
.ally .bar i{display:block;height:100%;background:var(--green)}
.ally.down{opacity:.4}
.camp{border-left:4px solid var(--gold)}
.chap{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.chap.lock{color:var(--muted)}
.lvl{display:inline-block;background:var(--gold);color:#1a140c;font-weight:800;border-radius:6px;padding:0 6px;font-size:12px;margin-left:4px}
.btn[disabled]{opacity:.35;filter:grayscale(.6)}
.btn.sm{white-space:nowrap;flex-shrink:0}
.dicebox{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.dicebox .big{margin:0;min-width:70px}
.d20{width:56px;height:56px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.rolling .d20{animation:tumble .28s linear infinite}
.rolling .num{color:var(--muted)}
.landed .d20{animation:land .4s ease-out}
.landed .num{animation:pop .3s ease-out}
@keyframes tumble{0%{transform:rotate(0) scale(1) translateY(0)}50%{transform:rotate(180deg) scale(.82) translateY(-6px)}100%{transform:rotate(360deg) scale(1) translateY(0)}}
@keyframes land{0%{transform:scale(1.35) rotate(-25deg)}60%{transform:scale(.92) rotate(6deg)}100%{transform:none}}
.wait [data-mb]{visibility:hidden}
.log div:first-child{animation:flash .7s ease-out}
@keyframes flash{from{background:rgba(217,164,65,.28)}to{background:transparent}}
.scene{display:block;width:calc(100% + 32px);height:auto;margin:-16px -16px 12px;border-radius:16px 16px 0 0}
.ico{width:42px;height:42px;flex-shrink:0;display:inline-block}
.ico.slot{border:1.5px dashed var(--line);border-radius:12px}
.itemrow{display:flex;gap:10px;align-items:center}
.emb,.pt{width:46px;height:46px;flex-shrink:0;display:inline-block;vertical-align:middle}
.pt{border-radius:12px;object-fit:cover;border:2px solid var(--gold)}
.mini{width:20px!important;height:20px!important;border-width:1px!important;border-radius:5px!important;vertical-align:-5px}
.ptmid{width:72px!important;height:72px!important}
.ptbig{width:110px;height:110px;margin:0 auto 6px;display:block}
.ptbig .pt,.ptbig .emb,.ptbig svg,.ptbig img{width:110px!important;height:110px!important}
.who{display:flex;gap:12px;margin:-2px 0 10px}
.whoc{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.whoc .pt{width:58px;height:58px;border-width:1.5px}
.floatn{position:fixed;z-index:30;transform:translate(-50%,0);font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.8);animation:floatup 1s ease-out forwards}
.floatn.dmg{color:#ff8f78}.floatn.crit{color:#ffd34d;font-size:30px}.floatn.heal{color:#7fe08a}.floatn.miss{color:#c8c0d0;font-size:16px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.hitfx{animation:hitshake .42s ease-out}
@keyframes hitshake{0%{transform:translateX(0);filter:brightness(2.2)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}100%{transform:none;filter:none}}
.killfx{animation:killfx .6s ease-out}
@keyframes killfx{0%{transform:scale(1)}30%{transform:scale(1.04);background:#5a1a1a}100%{transform:scale(.97)}}
.shakefx{animation:screenshake .38s ease-out}
@keyframes screenshake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.healfx{animation:healfx .6s ease-out}
@keyframes healfx{0%{box-shadow:0 0 0 0 rgba(111,224,138,.9)}100%{box-shadow:0 0 0 14px rgba(111,224,138,0)}}
.winfx{animation:winfx .9s ease-out}
@keyframes winfx{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.06);opacity:1}100%{transform:none}}
.slashfx{position:fixed;z-index:29;pointer-events:none;overflow:hidden;border-radius:12px}
.slashfx::after{content:'';position:absolute;left:-30%;top:45%;width:160%;height:4px;background:linear-gradient(90deg,transparent,#fff,#ffd34d,transparent);transform:rotate(-14deg);box-shadow:0 0 12px #fff;animation:slash .4s ease-out forwards}
.slashfx.big::after{height:7px;background:linear-gradient(90deg,transparent,#fff,#ff6a1f,transparent)}
@keyframes slash{0%{transform:translateX(-60%) rotate(-14deg);opacity:0}30%{opacity:1}100%{transform:translateX(40%) rotate(-14deg);opacity:0}}
.vig{position:fixed;inset:0;z-index:28;pointer-events:none;animation:vig .55s ease-out forwards}
@keyframes vig{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.rx{display:block;margin:2px 0}.rx.like{color:#bfe8c4}.rx.dis{color:#f0b8ac}
.rel{font-size:11px;border-radius:6px;padding:0 5px;margin-left:4px;background:#3a3440;color:#d8d0e0;vertical-align:1px}
.rel.r0{background:#5a1a1a;color:#ffb0a0}.rel.r1{background:#4a2a2a;color:#f0b8ac}.rel.r3{background:#24402a;color:#a8e0b0}.rel.r4{background:#2a4a5a;color:#a8d8f0}.rel.r5{background:#5a4a1a;color:#ffe08a}
.tag.lock{color:#f0b8ac;background:rgba(208,87,62,.15)}
.talk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.talk.done{opacity:.6}
div.tog{cursor:pointer}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tog.on{border-color:var(--green)}
.crh{display:flex;align-items:center;gap:8px;margin-top:0}.crn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1a140c;font-size:13px;font-weight:800}
.crinfo{margin-top:10px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}.crinfo ul{margin:6px 0 0;padding-left:18px}
.cls small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rolls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}.rollc{background:var(--surface2);border-radius:10px;text-align:center;padding:6px 2px}.rollc b{display:block;font-size:20px;color:var(--gold2)}.rollc small{font-size:11px;color:var(--muted)}.rollc s{opacity:.5}
.abt{width:100%;border-collapse:collapse;font-size:14px}.abt th{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding:4px}.abt td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}.abt td:first-child{text-align:left}.abt tr[data-cr]{cursor:pointer}.abt tr.sel td{background:rgba(217,164,65,.22)}.abt tr.prime td:first-child b{color:var(--gold2)}
.sw{display:flex;flex-wrap:wrap;gap:6px}.swb{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}.swb.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}.chipsel button{padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--muted)}.chipsel button.on{background:var(--gold);color:#1a140c;font-weight:700;border-color:var(--gold)}
.lk{margin:10px 0}.lk>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.abil.pr{outline:2px solid var(--gold)}
.grid3 .cls{padding:9px}
.ally.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2a2516}.ally.hero{background:#1d1d2a;border-color:#34344a}.ally.hero.turn{background:#2a2516;border-color:var(--gold)}
.turnhd{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:15px;color:var(--gold2)}
.pcard{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;text-align:left}.pcard.on{border-color:var(--gold)}
.pskills{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pslot{display:flex;gap:6px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;min-width:0}.pslot span{min-width:0;overflow:hidden}.pslot .ico{flex:0 0 auto;width:28px;height:28px}
.linkbtn{background:none;border:none;color:var(--gold2);font-size:12px;padding:6px 0 0}
.rmap{width:100%;display:block;border-radius:12px;margin:6px 0 10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.places{display:grid;gap:8px}.place{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.place.done{opacity:.6}.place .pi{font-size:24px}.mainq{color:var(--gold2)}
.bookg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bookc{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}.bookc.boss{border-color:var(--gold)}.bookc b{font-size:12px;line-height:1.3}.mon{width:48px;height:48px;background:radial-gradient(circle,#3a3428,#1e1b16);border-radius:10px}

<body>
<header class="top">
  <div class="brand"><h1>⚅ 기내 D&amp;D</h1><small id="offline"></small></div>
  <div id="statbar"></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="adv"><b>📜</b>모험</button>
  <button data-tab="char"><b>🛡️</b>캐릭터</button>
  <button data-tab="dice"><b>🎲</b>주사위</button>
  <button data-tab="oracle"><b>🔮</b>오라클</button>
  <button data-tab="journal"><b>✒️</b>기록</button>
</nav>
<div id="overlay"></div>

<script>
'use strict';
/* ================= 기본 도구 ================= */
const KEY='dnd-offline-v2';
const $=s=>document.querySelector(s);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1;};
const pick=a=>a[rnd(a.length)-1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod=v=>Math.floor((v-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
const fl=Math.floor;
function parseDice(e){const m=String(e).replace(/\s/g,'').match(/^(\d*)d(\d+)([+-]\d+)?$/i);return m?{n:+(m[1]||1),s:+m[2],b:+(m[3]||0)}:null;}
function roll(e,crit){const p=parseDice(e);const n=crit?p.n*2:p.n;const r=[];for(let i=0;i<n;i++)r.push(rnd(p.s));return{t:Math.max(0,r.reduce((a,b)=>a+b,0)+p.b),r,b:p.b};}
function d20(mode){const a=rnd(20),b=rnd(20);if(mode==='adv')return{v:Math.max(a,b),txt:`[${a}, ${b}]`};if(mode==='dis')return{v:Math.min(a,b),txt:`[${a}, ${b}]`};return{v:a,txt:`${a}`};}

const ROLE={tank:'탱커',striker:'공격수',caster:'마법사',healer:'치유사'};

/* ================= 캠페인 등록 ================= */
const CAMPS=[];const NODES={};
function CAMP(c){CAMPS.push(c);Object.entries(c.nodes).forEach(([id,n])=>{n.camp=c.id;NODES[id]=n;});}
const camp=id=>CAMPS.find(c=>c.id===id);

/* ================= 상태 ================= */

function fxApply(fx){const A=S.adv,c=S.char;const out=[];const cp=camp(A.camp);
 if(fx.set)Object.assign(A.flags,fx.set);
 if(fx.gold){const g=fx.gold<0?Math.max(fx.gold,-c.gold):fx.gold;if(g){c.gold+=g;out.push(`💰 금화 ${sgn(g)}`);}}
 if(fx.potions){c.potions=Math.max(0,c.potions+fx.potions);out.push(`🧪 치유 물약 ${sgn(fx.potions)}`);}
 if(fx.item&&!c.items.includes(fx.item)){c.items.push(fx.item);out.push(`🎒 '${fx.item}' 획득`);}
 if(fx.lose){const i=c.items.indexOf(fx.lose);if(i>=0){c.items.splice(i,1);out.push(`🎒 '${fx.lose}' 잃음`);}}
 if(fx.dmg){const r=roll(fx.dmg);c.hp=Math.max(0,c.hp-r.t);out.push(`💥 피해 ${r.t}`);}
 if(fx.heal){const b=c.hp;c.hp=fx.heal==='full'?c.maxhp:Math.min(c.maxhp,c.hp+roll(fx.heal).t);if(c.hp>b)out.push(`💚 HP +${c.hp-b}`);}
 if(fx.leave)[].concat(fx.leave).forEach(id=>{if(A.roster.includes(id)){const g=compStripGear(id,c);if(g)out.push(`🎒 ${cp.comps[id].name}이(가) 입던 장비 ${g}개를 돌려받았다`);A.roster=A.roster.filter(x=>x!==id);A.party=A.party.filter(x=>x!==id);out.push(`👋 ${cp.comps[id].name}이(가) 일행을 떠났다`);}});
 if(fx.join)[].concat(fx.join).forEach(id=>{if(!A.roster.includes(id)){A.roster.push(id);if(A.party.length<3){A.party.push(id);out.push(`🤝 ${cp.comps[id].name} 합류!`);}else out.push(`🤝 ${cp.comps[id].name} 합류! (파티가 꽉 차서 대기 중 · '동료 편성'에서 바꿀 수 있어요)`);}});
 if(fx.bond)Object.entries(fx.bond).forEach(([id,v])=>{if(!A.roster.includes(id))return;A.bond=A.bond||{};A.bond[id]=(A.bond[id]||0)+v;if(cp.comps[id])out.push(`❤ ${cp.comps[id].name}와(과)의 유대 +${v}`);});
 if(fx.takeGear){const ids=Object.keys(inv(c).bag).filter(id=>isGear(id)&&c.bag[id]>0);if(ids.length){const id=ids.sort((a,b)=>priceOf(a)-priceOf(b))[ids.length-1];c.bag[id]--;if(!c.bag[id])delete c.bag[id];out.push(`🎒 '${ITEMS[id].name}'을(를) 건넸다`);}}
 if(fx.loot)[].concat(fx.loot).forEach(id=>out.push(gainItem(id)));
 if(fx.use){const b=inv(c).bag;if(b[fx.use]){b[fx.use]--;if(!b[fx.use])delete b[fx.use];out.push(`🎒 '${ITEMS[fx.use].name}' 사용`);}}
 if(fx.rest)out.push(doRest(false));
 if(fx.job&&SUBS[fx.job]&&!c.sub){c.sub=fx.job;syncChar(false);out.push(`🌟 2차 전직: ${SUBS[fx.job].icon} ${SUBS[fx.job].name}! (${ABIL[CLASSES[c.cls].prime]} +2 · HP +10) — 이제 적들도 더 강해집니다`);}
 A.fx.push(...out);}

 return `😮‍💨 휴식: HP +${c.hp-before}${k.maxSlots?`, 주문 슬롯 ${c.slots}/${c.maxSlots}`:''}, 특수 능력 회복`;}

function levelNote(c,L0){const a=kit(Object.assign({},c,{level:L0})),b=kit(c);const old=new Set([...a.attacks,...a.feats].map(x=>x.name).concat(a.passive.map(p=>p[0])));
 const nw=[...b.attacks,...b.feats].filter(x=>!old.has(x.name)).map(x=>x.name).concat(b.passive.filter(p=>!old.has(p[0])).map(p=>p[0]));
 const ex=[];if(b.apa>a.apa)ex.push(`공격 ${b.apa}회`);if(b.ac>a.ac)ex.push(`AC ${b.ac}`);if(b.maxSlots>a.maxSlots)ex.push(`주문 슬롯 ${b.maxSlots}`);if(b.p>a.p)ex.push(`숙련 +${b.p}`);

function reqOk(x){const f=S.adv.flags;if(x==='potion')return S.char.potions>0;if(x.startsWith('has:'))return has(x.slice(4));if(x.startsWith('party:'))return S.adv.party.includes(x.slice(6));if(x.startsWith('item:'))return S.char.items.includes(x.slice(5));if(x.startsWith('class:'))return S.char.cls===x.slice(6);if(x.startsWith('bg:'))return S.char.bg===x.slice(3);if(x.startsWith('race:'))return S.char.race===x.slice(5);if(x.startsWith('align:'))return(S.char.align||'neutral')===x.slice(6);if(x.startsWith('trait:'))return S.char.trait===x.slice(6);if(x.startsWith('sub:'))return x==='sub:any'?!!S.char.sub:S.char.sub===x.slice(4);if(x.startsWith('lv:'))return S.char.level>=+x.slice(3);if(x.startsWith('bag:')&&x!=='bag:gear')return(inv(S.char).bag[x.slice(4)]||0)>0;if(x==='bag:gear')return Object.keys(inv(S.char).bag).some(id=>isGear(id)&&S.char.bag[id]>0);return!!f[x];}

function expandFoes(list){const out=[];list.forEach(e=>{const n=e.n||1;for(let i=0;i<n;i++){const o=Object.assign({},e);delete o.n;if(n>1)o.name=`${e.name} ${i+1}`;out.push(o);}});return out;}
function setupCombat(cfg){const A=S.adv,cp=camp(A.camp),c=S.char;
 if(cfg.final&&A.camp==='bg2'&&c.level<MAXLV){c.level=MAXLV;syncChar(false);A.fx.push('⬆️ 마지막 결전을 앞두고 힘이 끓어오른다 — 레벨 20!');}

 (cfg.allies||[]).forEach(a=>allies.push(scaleAlly(a,d)));
 const mul=(cp.hpMul||1)*(1+0.07*A.chapter);const list=expandFoes(cfg.enemies);

 let extra=allies.filter(a=>a.key).length>=2?1:0;if(allies.filter(a=>a.key).length>=3&&A.chapter>=2)extra++;

 else{L(`${a.name} 🎲${dr.txt}${sgn(atk)}=${tot} → ${esc(e.name)}(AC ${e.ac}) 빗나감`);fxEv({k:'miss',i:cb.enemies.indexOf(e)});}}
function healMe(n,label){const c=S.char;const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+n);L(`${label} → HP +${c.hp-b}`,'ok');}
function act(kind,id){const cb=S.adv.combat,c=S.char,k=K();if(!cb||cb.done||c.hp<=0||cb.turn!=='me')return;
 if(kind==='potion'){if(cb.potion||c.potions<1)return;c.potions--;cb.potion=true;healMe(roll(potionHeal(c.level)).t,'🧪 치유 물약');save();render();return;}
 const a=[...k.attacks,...k.feats].find(x=>x.id===id);if(!a)return;
 if(a.once&&cb.once[a.id])return;
 if(a.free){if(cb.free||(a.max&&!c.uses[a.id])||(a.slot&&c.slots<a.slot))return;if(a.max)c.uses[a.id]--;if(a.slot)c.slots-=a.slot;cb.free=true;if(a.once)cb.once[a.id]=1;
  if(a.type==='heal')healMe(roll(a.heal).t,a.name);
  if(a.type==='buff'){cb.buff=cb.buff||{atk:0,dmg:0,ac:0};Object.entries(a.buff).forEach(([x,v])=>cb.buff[x]=(cb.buff[x]||0)+v);L(`🛡️ ${a.name} → 이번 전투 AC +${a.buff.ac}`,'ok');}
  if(a.type==='mirror'){cb.mirror=3;L(`🪞 ${a.name} — 분신 3개가 나타났다`,'ok');}
  save();render();return;}
 if(a.slot){if(c.slots<a.slot)return;c.slots-=a.slot;}
 if(a.max){if(!c.uses[a.id])return;c.uses[a.id]--;}
 if(a.once)cb.once[a.id]=1;
 cb.sneakUsed=false;
 if(a.type==='attack'){const times=a.multi?k.apa:1;for(let i=0;i<times;i++)if(alive().length)weaponAttack(a);}
 else if(a.type==='hide'){const r=pd20().v,b=skillBonus('은신');if(r+b>=a.dc){L(`그림자 속으로 숨는다 (은신 ${r}${sgn(b)}=${r+b}) ✔`,'ok');weaponAttack(a,{adv:true,sneak:true});}else{L(`숨기 실패 (은신 ${r}${sgn(b)}=${r+b}) — 그냥 찌른다`);weaponAttack(a);}}
 else if(a.type==='multi'){L(`<b>${a.name}!</b>`,'ok');const w=k.attacks[0];for(let i=0;i<k.apa*2;i++)if(alive().length)weaponAttack(w);}
 else if(a.type==='auto'){const e=tgt();hitDmg(e,roll(a.dmg).t,`✨ ${a.name}`,1);}
 else if(a.type==='aoe'){const dc=a.dc||k.dc;alive().forEach(e=>{const s=rnd(20)+e.save;let d=roll(a.dmg).t;if(s>=dc)d=fl(d/2);hitDmg(e,d,`💥 ${a.name}${s>=dc?' (내성, 절반)':''}`,1);});}
 else if(a.type==='save'){const e=tgt();const s=rnd(20)+e.save;if(s>=k.dc){L(`${a.name} → ${esc(e.name)}이(가) 피함 (내성 ${s})`);fxEv({k:'miss',i:S.adv.combat.enemies.indexOf(e)});}else hitDmg(e,roll(a.dmg).t,`🔥 ${a.name}`,1);}
 else if(a.type==='heal')healMe(roll(a.heal).t,a.name);
 else if(a.type==='summon'){const Lv=c.level,hp=10+4*Lv;cb.allies.push({name:'해골 전사',hp,max:hp,ac:13+fl(Lv/4),atk:k.p+k.M.int,dmg:`1d8+${fl(Lv/3)+Math.max(0,k.M.int)}`,summon:1});L('💀 땅이 갈라지며 <b>해골 전사</b>가 일어선다!','ok');}
 endTurn();}
function endTurn(){if(!alive().length)return win();nextTurn(-1);}
/* 차례: 나 → 동료(직접 조작) → 임시 동료(자동) → 적 */
function nextTurn(from){const cb=S.adv.combat,c=S.char;
 for(let i=from+1;i<cb.allies.length;i++){const a=cb.allies[i];if(a.key&&a.hp>0){cb.turn=i;save();render();if(window._autoAllies)allyAuto(i);return;}}
 cb.allies.forEach((a,i)=>{if(!a.key&&a.hp>0&&alive().length)allyAuto(i);});
 if(!alive().length)return win();
 cb.turn='enemy';enemyAttacks();
 const k=K(),gm=k.gear;if(gm.regen&&c.hp>0&&c.hp<c.maxhp){healMe(gm.regen,'💚 재생');}
 if(cb.mealRegen&&c.hp>0){c.hp=Math.min(c.maxhp,c.hp+cb.mealRegen);cb.allies.forEach(a=>{if(a.hp>0)a.hp=Math.min(a.max,a.hp+cb.mealRegen);});}
 cb.allies.forEach(a=>{if(a.hp>0&&a.regen)a.hp=Math.min(a.max,a.hp+a.regen);a.defend=false;});
 cb.round++;cb.turn='me';cb.potion=false;cb.free=false;cb.taunt=null;cb.guard=null;save();render();
 if(c.hp<=0)death();}
function enemyAttacks(){const cb=S.adv.combat,c=S.char,k=K();
 cb.dodged=false;const gm=k.gear,bac=((cb.buff&&cb.buff.ac)||0)+(c.trait==='careful'&&cb.round===1?2:0),res=(k.resist||0)+(gm.resist||0);
 const pickT=()=>{const live=cb.allies.map((a,i)=>({a,i})).filter(x=>x.a.hp>0);
  if(cb.taunt!=null&&cb.allies[cb.taunt]&&cb.allies[cb.taunt].hp>0&&rnd(100)<=75)return{a:cb.allies[cb.taunt]};
  const pool=[{me:1},{me:1}];live.forEach(x=>{pool.push({a:x.a});if(x.a.role==='tank')pool.push({a:x.a});});let t=pool[rnd(pool.length)-1];
  if(t.me&&cb.guard!=null&&cb.allies[cb.guard]&&cb.allies[cb.guard].hp>0)t={a:cb.allies[cb.guard],guarded:1};return t;};
 alive().forEach(e=>{if(e.stun){e.stun=0;L(`💫 ${esc(e.name)}은(는) 정신을 못 차린다`);return;}
  if(e._k==='boss'&&cb.round%3===0&&!e.hard0){L(`💥 <b>${esc(e.name)}의 광역 공격!</b> 모두를 휩쓴다`,'hurt');
   const hitOne=(t)=>{const ac=t.me?c.ac+bac:t.a.ac+(t.a.defend?4:0);const r=rnd(20);if(r===1||(r!==20&&r+e.atk<ac)){L(`　${t.me?'당신':esc(t.a.name)}은(는) 피했다`);return;}let d=Math.ceil(roll(e.dmg).t*0.75);
    if(t.me){if(res)d=Math.max(1,d-res);if(cb.ward>0){const w=Math.min(cb.ward,d);cb.ward-=w;d-=w;}c.hp=Math.max(0,c.hp-d);fxEv({k:'hurt',dmg:d});if(c.hp<=0&&cb.relent){cb.relent=false;c.hp=1;}if(c.hp<=0)tryRevive();L(`　당신에게 ${d} 피해`,'hurt');}
    else{if(t.a.resist)d=Math.max(1,d-t.a.resist);t.a.hp=Math.max(0,t.a.hp-d);fxEv({k:'ahurt',i:cb.allies.indexOf(t.a),dmg:d});L(`　${esc(t.a.name)}에게 ${d} 피해${t.a.hp<=0?' · 쓰러짐!':''}`,'hurt');}};
   hitOne({me:1});cb.allies.forEach(a=>{if(a.hp>0)hitOne({a});});return;}
  for(let i=0;i<(e.attacks||1);i++){if(c.hp<=0)return;const t=pickT();
  if(t.me&&cb.mirror>0&&rnd(20)>=9){cb.mirror--;L(`🪞 ${esc(e.name)}의 공격이 분신을 베었다 (남은 분신 ${cb.mirror})`);fxEv({k:'block'});continue;}
  const al=t.a,ac=t.me?c.ac+bac:al.ac+(al.defend?4:0);const r=rnd(20),tot=r+e.atk;
  if(r!==1&&(r===20||tot>=ac)){let d=roll(e.dmg,r===20).t;const smash=e._k==='elite'&&rnd(100)<=25;if(smash)d+=roll(e.dmg).t-parseDice(e.dmg).b;
   if(t.me){let note=smash?' (강타!)':'';if(k.dodge&&!cb.dodged){cb.dodged=true;d=Math.ceil(d/2);note=' (회피로 절반)';}if(res)d=Math.max(1,d-res);
    if(cb.ward>0){const w=Math.min(cb.ward,d);cb.ward-=w;d-=w;note+=` (보호막 -${w}${cb.ward?`, 남음 ${cb.ward}`:', 깨짐'})`;}
    c.hp=Math.max(0,c.hp-d);fxEv({k:'hurt',dmg:d,crit:r===20});
    if(c.hp<=0&&cb.relent){cb.relent=false;c.hp=1;note+=' — <b>불굴의 인내로 버텼다!</b>';}
    if(c.hp<=0)tryRevive();L(`${esc(e.name)} 🎲${r}${sgn(e.atk)}=${tot}${r===20?' 치명타!':''} → 당신에게 ${d} 피해${note}`,'hurt');}
   else{if(al.resist)d=Math.max(1,d-al.resist);al.hp=Math.max(0,al.hp-d);fxEv({k:'ahurt',i:cb.allies.indexOf(al),dmg:d});L(`${esc(e.name)} → ${esc(al.name)}에게 ${d} 피해${smash?' (강타!)':''}${t.guarded?' (당신을 감싸며)':''}${al.hp<=0?' · 쓰러짐!':''}`,'hurt');}}
  else{L(`${esc(e.name)}의 공격 🎲${r}${sgn(e.atk)}=${tot} → ${t.me?'막아냈다':esc(al.name)+'이(가) 막아냄'}`);fxEv(t.me?{k:'block'}:{k:'ablock',i:cb.allies.indexOf(al)});}}});}
/* 전투가 끝나면 동료 HP를 기록 (쓰러진 동료는 HP 1로 일어남) */
function saveAllies(){const cb=S.adv.combat;if(!cb)return;cb.allies.forEach(a=>{if(a.key&&S.adv.cs&&S.adv.cs[a.key])S.adv.cs[a.key].hp=Math.max(1,a.hp);});}
function win(){const cb=S.adv.combat,c=S.char;cb.done=true;cb.turn='me';cb.allies.forEach(a=>{if(a.hp>0)a.hp=Math.min(a.max,a.hp+Math.ceil(a.max/4));});saveAllies();const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+Math.ceil(c.maxhp/4));cb.loot=combatLoot(cb);fxEv({k:'win'});L(`🏆 <b>승리!</b> 숨을 고른다 (HP +${c.hp-b})<br>${cb.loot.join('<br>')}`,'ok');save();render();}
function death(){modal(`<div style="font-size:48px">💀</div><h2 class="bad-c">쓰러졌다…</h2><p class="muted">눈앞이 캄캄해진다. 하지만 이야기는 여기서 끝나지 않는다. 이 장면이 시작된 순간으로 돌아갈 수 있다.</p>`,
 [{t:'이 장면 다시',fn:()=>{const A=S.adv,sn=A.cp;S.char=sn.char;A.flags=sn.flags;A.roster=sn.roster;A.party=sn.party;A.cs=sn.cs||{};enterNode(A.node);}},{t:'이 장 처음부터',cls:'ghost',fn:()=>restartChapter(S.adv.camp,S.adv.chapter)}]);}

/* 휴식: 짧은 휴식은 장마다 2번, 긴 휴식(야영)은 야영 보급품 1개 */
function restModal(){const A=S.adv,c=inv(S.char);if(!A||A.combat&&!A.combat.done)return;const sr=A.shortRest==null?2:A.shortRest,sup=c.bag.camp||0;
 modal(`<div style="font-size:40px">🏕️</div><h2>휴식</h2><p class="muted" style="font-size:14px"><b>짧은 휴식</b> (이번 장에 ${sr}번 남음): HP 절반 회복 · 주문 일부 · 기술 회복 · 동료도 절반 회복<br><b>긴 휴식 · 야영</b> (야영 보급품 ${sup}개): 모두 완전 회복<br><small>야영 보급품은 상점에서 사거나 전리품으로 얻고, 장이 시작될 때 1개 받아요.</small></p>`,
  [{t:`짧은 휴식 (${sr})`,fn:()=>{if(sr<=0)return restModal();A.shortRest=sr-1;const m=doRest(false);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);}},
   {t:`야영 (보급품 ${sup})`,fn:()=>{if(sup<=0)return restModal();c.bag.camp--;if(!c.bag.camp)delete c.bag.camp;const m=doRest(true);save();render();modal(`<p>🔥 모닥불을 피우고 하룻밤 쉬었다.<br>${m}</p>`,[{t:'요리하기 🍲',fn:mealModal},{t:'확인',cls:'ghost'}]);}},{t:'닫기',cls:'ghost'}]);}

function ridge(y,amp,seed,col,step){srand(seed);let d=`M0 150L0 ${y}`;let cur=y;for(let x=0;x<=400;x+=step||25){cur=y+(sr()-.5)*amp*2;d+=`L${x} ${cur.toFixed(1)}`;}return`<path d="${d}L400 150Z" fill="${col}"/>`;}
function pines(y,n,h,seed,col){srand(seed);let s='';for(let i=0;i<n;i++){const x=sr()*410-5,hh=h*(.6+sr()*.6);s+=`<path d="M${x} ${y-hh}l${hh*.32} ${hh}h-${hh*.64}z" fill="${col}"/>`;}return s+`<rect x="0" y="${y}" width="400" height="${150-y}" fill="${col}"/>`;}
function stars(n,seed,maxY){srand(seed);let s='';for(let i=0;i<n;i++)s+=`<circle cx="${(sr()*400).toFixed(0)}" cy="${(sr()*(maxY||80)).toFixed(0)}" r="${(sr()*1.2+.3).toFixed(1)}" fill="#fff" opacity="${(sr()*.6+.3).toFixed(2)}"/>`;return s;}
function sky(a,b,c){const g=gid();return`<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="${c?.6:1}" stop-color="${b}"/>${c?`<stop offset="1" stop-color="${c}"/>`:''}</linearGradient></defs><rect width="400" height="150" fill="url(#${g})"/>`;}
function glow(x,y,r,col,op){const g=gid();return`<defs><radialGradient id="${g}"><stop offset="0" stop-color="${col}" stop-opacity="${op||.9}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient></defs><circle cx="${x}" cy="${y}" r="${r}" fill="url(#${g})"/>`;}

 s+=`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${col}"/>`+(ruined?`<path d="M${x-2} ${y-h}l${w*.4} -${8+sr()*6} ${w*.2} 7 ${w*.4} -3 V${y-h}z" fill="${col}"/>`:`<path d="M${x-3} ${y-h}l${w/2+3} -${10+sr()*6} ${w/2+3} ${10+sr()*6}z" fill="${col}"/>`);

function backupFile(){const d=new Date(),p=n=>String(n).padStart(2,'0');const name=`기내DnD_백업_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
 return new File([JSON.stringify({app:'dnd-offline',v:2,saved:d.toISOString(),state:S})],name,{type:'application/json'});}
function saveBackupFile(){const f=backupFile();const done=()=>{S.lastBackup=Date.now();save();render();};
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'기내 D&D 백업'}).then(done).catch(()=>{});return;}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);done();}
function loadBackupFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';

  modal(`<h2>백업을 불러올까요?</h2><p class="muted">${o.saved?new Date(o.saved).toLocaleString('ko-KR')+'에 저장한 백업이에요.<br>':''}지금 진행 상황은 이 백업으로 바뀌어요.</p>`,[{t:'불러오기',fn:()=>{const lb=S.lastBackup;S=Object.assign(fresh(),st);S.lastBackup=lb;save();render();modal('<p>백업을 불러왔어요.</p>',[{t:'확인'}]);}},{t:'취소',cls:'ghost'}]);}
  catch(e){modal('<p>올바른 백업 파일이 아니에요.</p>',[{t:'확인'}]);}};rd.readAsText(f);};inp.click();}

 const en=i=>document.querySelector(`[data-tg="${i}"]`),al=i=>document.querySelector(`[data-al="${i}"]`),me=()=>document.querySelector('#statbar .hpbar');

function toneOf(ch){if(ch.tone)return ch.tone;if(ch.rest)return null;const t=ch.t||'';
 if(/(도망|달아난)/.test(t))return'flee';
 if(/(무시하고|지나친|갈 길이 급|그냥 간다|믿을 수 없다|관두고)/.test(t))return'callous';
 if(/(금화|은화).*(내밀|던져|밀어|건넨)/.test(t)||(ch.gold<0&&!/(산다|상점|시장|노점)/.test(t)))return'bribe';
 if(/(구한|구하러|돕는|도와|풀어|살린|변호|묻어|수습|깨운|치료|맞이|꺼내준|포드를 연다|함께하|받아들이되)/.test(t))return'mercy';
 if(ch.check&&TONE_SKILL[ch.check.skill])return TONE_SKILL[ch.check.skill];
 if(/(덤빈|돌격|돌진|공격한|정면|부수|부순|무기를 뽑|쳐들어|힘으로|베어버린|쓸어버린|맞선다|달려든다|싸운다)/.test(t))return'violent';
 if(/(몰래|숨어|숨어든)/.test(t))return'sneaky';
 return null;}

function skillsOf(id){const A=S.adv;return SK[(A?A.camp:'')+':'+id]||SK[id]||[];}

function compFull(id){const A=S.adv,c=camp(A.camp).comps[id],L=S.char.level,b=bondOf(id);const s=compStats(c,L,b);const cs=csOf(id);
 const m=gearMods({eq:cs.eq});const ab=m.abil||{},pr=ab[ROLEPR[c.role]]||0,martial=c.role==='tank'||c.role==='striker';
 s.max=s.hp=s.hp+m.maxhp+3*(ab.con||0);s.ac+=m.ac;s.atk+=(martial?m.atk:m.satk)+pr;s.dmg=addFlat(s.dmg,(martial?m.dmg:0)+pr);
 s.onhit=martial?m.onhit.slice():[];s.resist=m.resist;s.regen=m.regen;s.dc=8+PB(L)+3+m.dc+(c.role==='caster'||c.role==='healer'?pr:0);s.healB=m.heal+(c.role==='healer'?pr:0);
 if(s.heal)s.heal=addFlat(s.heal,s.healB);s.key=id;s.skills=skillsOf(id);
 if(cs.hp==null||cs.hp>s.max)cs.hp=cs.hp==null?s.max:Math.min(cs.hp,s.max);s.hp=cs.hp;return s;}
function compRest(full){const A=S.adv;if(!A)return;A.roster.forEach(id=>{const s=compFull(id),cs=csOf(id);cs.hp=full?s.max:Math.min(s.max,cs.hp+Math.ceil(s.max/2));cs.uses={};});}
function compUses(id,sk){const u=csOf(id).uses;return sk.max-(u[sk.id]||0);}
function compStripGear(id,c){const cs=S.adv.cs&&S.adv.cs[id];if(!cs)return 0;let n=0;Object.values(cs.eq||{}).forEach(it=>{if(it){addBag(it,1,c);n++;}});cs.eq={};return n;}
function equipComp(id,item){const c=inv(S.char),cs=csOf(id),it=ITEMS[item];if(!it||!c.bag[item]||!canUse(item,compUser(id)))return;
 const sl=it.type==='trinket'?'t1':it.type;if(cs.eq[sl])addBag(cs.eq[sl]);cs.eq[sl]=item;c.bag[item]--;if(!c.bag[item])delete c.bag[item];const s=compFull(id);cs.hp=Math.min(s.max,cs.hp);}
function unequipComp(id,sl){const cs=csOf(id);if(!cs.eq[sl])return;addBag(cs.eq[sl]);delete cs.eq[sl];const s=compFull(id);cs.hp=Math.min(s.max,cs.hp);}

function partyTargets(){const cb=S.adv.combat,c=S.char;const t=[{me:1,hp:c.hp,max:c.maxhp}];cb.allies.forEach((a,i)=>{if(a.hp>0)t.push({i,hp:a.hp,max:a.max});});return t;}
function healLowest(n,label){const cb=S.adv.combat,c=S.char;const t=partyTargets().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];

 else{const a=cb.allies[t.i],b=a.hp;a.hp=Math.min(a.max,a.hp+n);L(`${label} → ${esc(a.name)} HP +${a.hp-b}`,'ok');fxEv({k:'aheal',i:t.i,amt:a.hp-b});}}

 L(`🤝 ${esc(al.name)}${label?' · '+label:''} 🎲${r}${sgn(atk)}=${tot} → ${esc(e.name)} 빗나감`);fxEv({k:'miss',i:cb.enemies.indexOf(e)});return false;}
function allyAct(i,kind){const cb=S.adv.combat,al=cb.allies[i],c=S.char,Lv=c.level;if(!cb||cb.done||!al||al.hp<=0||cb.turn!==i)return;

 else if(kind==='defend'){al.defend=true;L(`🛡️ ${esc(al.name)}이(가) 방어 자세를 취한다 (AC +4)`,'ok');}
 else if(kind==='potion'){if(c.potions<1)return;c.potions--;const b=al.hp;al.hp=Math.min(al.max,al.hp+roll(`2d4+${2+fl(Lv/2)*2}`).t);L(`🧪 ${esc(al.name)}이(가) 물약을 마신다 → HP +${al.hp-b}`,'ok');}
 else{const k=al.skills.find(x=>x.id===kind);if(!k||compUses(al.key,k)<=0)return;const u=csOf(al.key).uses;
  if(k.type==='revive'&&!cb.allies.some(a=>a.hp<=0&&a.key))return;
  u[k.id]=(u[k.id]||0)+1;const e=tgt(),lab=`<b>${k.name}</b>`;
  if(k.type==='atk')allyHit(al,e,k.bonus(Lv),lab);
  else if(k.type==='multi'){L(`🤝 ${esc(al.name)}의 ${lab}!`,'ok');for(let n=0;n<k.n;n++){const t=tgt();if(t)allyHit(al,t,null);}}
  else if(k.type==='aoe'){alive().forEach(x=>{const s=rnd(20)+x.save;let d=roll(k.dmg(Lv)).t;if(s>=al.dc)d=fl(d/2);hitDmg(x,d,`💥 ${esc(al.name)} · ${lab}${s>=al.dc?' (내성, 절반)':''}`);});}
  else if(k.type==='auto')hitDmg(e,roll(k.dmg(Lv)).t,`✨ ${esc(al.name)} · ${lab}`);
  else if(k.type==='stun'){if(k.dmg&&!allyHit(al,e,k.dmg(Lv),lab))return allyDone(i);
   if(e.hp>0){const s=rnd(20)+e.save;if(s>=al.dc)L(`${esc(e.name)}이(가) 버텼다 (내성 ${s})`);else{e.stun=1;L(`💫 ${esc(e.name)} 기절! (내성 ${s}) 다음 차례를 쉰다`,'ok');}}}
  else if(k.type==='expose'){e.ac-=k.v;L(`🎯 ${esc(al.name)} · ${lab} → ${esc(e.name)} AC -${k.v}`,'ok');}
  else if(k.type==='weakAll'){alive().forEach(x=>x.atk-=k.v);L(`🌫️ ${esc(al.name)} · ${lab} → 모든 적 명중 -${k.v}`,'ok');}

  else if(k.type==='healAll'){const n=roll(k.heal(Lv)).t+(al.healB||0);const b=c.hp;c.hp=Math.min(c.maxhp,c.hp+n);L(`💚 ${esc(al.name)} · ${lab} → 당신 HP +${c.hp-b}`,'ok');cb.allies.forEach(a=>{if(a.hp>0)a.hp=Math.min(a.max,a.hp+n);});}
  else if(k.type==='bless'){cb.abuff=cb.abuff||{atk:0,dmg:0};cb.abuff.atk+=2;cb.buff=cb.buff||{atk:0,dmg:0,ac:0};cb.buff.atk=(cb.buff.atk||0)+2;L(`✨ ${esc(al.name)} · ${lab} → 아군 모두 명중 +2`,'ok');}
  else if(k.type==='rally'){cb.abuff=cb.abuff||{atk:0,dmg:0};cb.abuff.dmg+=2;cb.buff=cb.buff||{atk:0,dmg:0,ac:0};cb.buff.dmg=(cb.buff.dmg||0)+2;L(`📣 ${esc(al.name)} · ${lab} → 아군 모두 피해 +2`,'ok');}
  else if(k.type==='revive'){const d=cb.allies.find(a=>a.hp<=0&&a.key);d.hp=Math.ceil(d.max/2);L(`🙏 ${esc(al.name)} · ${lab} → ${esc(d.name)}이(가) 다시 일어선다!`,'ok');}}
 allyDone(i);}

function allyAuto(i){const cb=S.adv.combat,al=cb.allies[i],c=S.char;if(!al||al.hp<=0||!alive().length)return;

/* 새 장 전투는 위협도 예산 안으로 (잡병 0.5 · 정예 1 · 보스 2.5) */
const THREAT={mob:.5,elite:1,boss:2.5};
function trimFoes(list,budget){list=list.map(e=>Object.assign({},e));const tot=()=>list.reduce((a,e)=>a+(THREAT[e._k]||1)*(e.n||1),0);
 if(budget==null)budget=list.some(e=>e._k==='boss')?3:2.5;let g=0;
 while(tot()>budget&&g++<20){const m=list.filter(e=>e._k==='mob');const el=list.filter(e=>e._k==='elite');
  const mm=m.find(e=>(e.n||1)>1);if(mm){mm.n--;continue;}if(m.length){list.splice(list.indexOf(m[m.length-1]),1);continue;}
  const ee=el.find(e=>(e.n||1)>1);if(ee){ee.n--;continue;}if(el.length&&list.some(e=>e._k==='boss')){list.splice(list.indexOf(el[el.length-1]),1);continue;}break;}

function miniQuest(nodes,id,hub,o){const d=o.done||id+'_done';

/* ---------- 1장: 캔들킵의 밤 (Lv3) ---------- */
b1_start:{title:'캔들킵',who:['orven'],text:`바다를 내려다보는 절벽 위, 지식의 성채 캔들킵. 당신은 이곳 서가 사이에서 자랐다. 양아버지 오르벤은 이 성채에서 가장 오래된 서고를 지키는 노마법사다. 잉크 냄새와 그의 파이프 담배 냄새가 당신에게는 집의 냄새였다.

그런데 오늘 오르벤의 얼굴이 낯설다. 그는 당신을 서재로 불러 창문을 닫고, 커튼까지 친 뒤에야 입을 연다.

<i>"짐을 꾸려라. 오늘 밤 이곳을 떠난다. 이유는… 길 위에서 말해주마. 지금은 묻지 말고, 서둘러라."</i>

그의 손이 떨리고 있다. 당신은 그가 떠는 걸 처음 본다. 창밖의 해가 기운다. 떠나기 전에 할 수 있는 일이 몇 가지 있다.`,
 choices:[{t:'친구 티오를 찾아간다',not:['tio_talk'],go:'b1_imoen'},
  {t:'할든 영감의 여관 겸 상점에 들른다',not:['shop'],go:'b1_shop'},
  {t:'서고 꼭대기, 오래된 예언서를 찾아본다',not:['library'],set:{library:1},check:{skill:'역사',dc:12,ok:'b1_prophecy',fail:'b1_library_fail'}},
  {t:'오르벤에게 간다. 떠날 시간이다',go:'b1_depart'}]},
b1_imoen:{title:'캔들킵 안뜰',who:['tio'],onEnter:{set:{tio_talk:1}},text:`서고 지붕 위, 고글을 이마에 올린 소년이 깃펜을 귀에 꽂은 채 해안선을 스케치하고 있다. 티오다. 당신을 보자 그가 미끄러지듯 내려온다.

"들었어! 아니, 엿들은 거지만. 너 오늘 밤 떠난다며? 나한테 한마디도 없이?" 그가 둘둘 만 양피지를 흔든다. "이거 봐. 캔들킵에서 발더스 게이트까지 가는 길, 내가 직접 그린 지도야. 길 잃으면 어쩌려고?"

그가 목소리를 낮춘다. "오르벤 할아버지가 안 된대도 나 따라갈 거야. 넌 지도도 못 읽잖아."

당신이 뭐라 하기도 전에, 그는 지도를 품에 넣고 서고 쪽으로 뛰어간다.`,choices:[{t:'안뜰로 돌아간다',go:'b1_start'}]},
b1_shop:{title:'할든 영감의 여관',who:['halden'],shop:'b1_early',onEnter:{set:{shop:1},potions:1},text:`늙은 할든이 카운터 너머로 당신을 오래 바라본다. 그가 닦던 잔을 내려놓는다.

"떠난다고? 그래, 언젠간 그럴 줄 알았지. 오르벤이 요즘 밤마다 성벽에 올라 길을 내려다보더라고." 그가 먼지 쌓인 선반에서 붉은 병 하나를 꺼내 내민다. "<b>치유 물약</b>이다. 돈은 됐어. 네가 꼬맹이일 때 몰래 퍼먹은 꿀단지 값이라 치자."

"다른 것도 필요하면 골라 봐. 길 위에선 뭐든 쓸모가 있을 거다."`,
 choices:[{t:'고맙다고 인사하고 나간다',go:'b1_start'}]},
b1_prophecy:{title:'예언의 서고',onEnter:{set:{prophecy:1}},text:`먼지 낀 두루마리 사이에서 수백 년 전 예언자 세바르가 남긴 구절을 찾아낸다. 몇몇 줄에는 누군가 최근에 손가락으로 짚은 자국이 있다. 오르벤의 잉크 묻은 지문이다.

<i>살인의 군주가 쓰러질 때, 그는 자신의 피를 대지에 흩뿌리리라. 그 씨앗들은 자라나 혼돈을 거두리라.</i>

여백에 오르벤의 글씨로 작은 메모가 있다. <i>"그 아이는 씨앗이 아니라 사람이다."</i>

등줄기가 서늘해진다.`,choices:[{t:'서고를 나선다',go:'b1_start'}]},
b1_library_fail:{title:'예언의 서고',text:`수천 권의 책 사이에서 무엇을 찾아야 할지조차 모르겠다. 늙은 사서가 촛불을 끄며 나가라고 손짓한다.`,choices:[{t:'서고를 나선다',go:'b1_start'}]},
b1_depart:{title:'캔들킵 정문',who:['orven'],text:`해가 지고, 오르벤과 함께 성문을 나선다. 그는 아무 말 없이 걷기만 한다. 등 뒤로 캔들킵의 등대 불빛이 멀어진다.

한 시간쯤 걸었을까. 숲길에 들어서자 오르벤이 걸음을 멈추고 지팡이를 고쳐 쥔다.

"조용히. …우리 말고 누가 있다."

어둠 속에서 거대한 그림자가 걸어 나온다. 검붉은 사슬 갑옷, 얼굴 전체를 덮은 강철 늑대 가면. 그 뒤로 용병 넷과 오우거 하나가 따라온다.

<i>"늙은이. 그 아이를 넘겨라. 그러면 너는 살려주지."</i>

오르벤이 당신 앞을 막아선다. 그의 지팡이 끝에서 푸른 불꽃이 피어오른다.`,
 choices:[{t:'오르벤 곁에 남아 함께 싸운다',go:'b1_stand'},{t:'오르벤의 외침대로 달아난다',go:'b1_flee'}]},
b1_stand:{title:'숲길의 밤',who:['orven'],text:`"고집쟁이 녀석! 달아나라고 했는데…!" 오르벤이 마법 화살을 쏘아 가면의 거인을 밀어낸다. "그럼 저 용병들이라도 막아라! 등을 보이지 마라!"

용병 둘이 칼을 뽑고 당신에게 달려든다.`,combat:{enemies:[mob('용병',3,{hp:12,n:2})],win:'b1_gorion_falls'}},
b1_gorion_falls:{title:'숲길의 밤',onEnter:{set:{stood:1}},text:`용병들이 쓰러진 순간, 오르벤의 비명이 숲을 찢는다.

돌아보니 가면 쓴 거인의 검이 오르벤의 가슴을 꿰뚫고 있다. 오르벤은 마지막 힘으로 당신을 향해 손을 뻗는다. 입모양만이 보인다. <i>달아나라.</i>

거인이 늑대 가면을 당신 쪽으로 돌린다. 그 순간 오르벤의 몸에서 마지막 마법이 터져 나와 숲 전체를 눈부신 빛으로 덮는다. 당신은 정신없이 달린다.`,choices:[{t:'어둠 속으로…',go:'b1_dawn'}]},
b1_flee:{title:'숲길의 밤',text:`"가라! 뒤돌아보지 마라!"

당신은 덤불을 헤치고 달린다. 등 뒤에서 마법이 터지는 섬광, 강철이 부딪히는 소리, 그리고… 오르벤의 비명. 그리고 정적.

나뭇가지에 얼굴을 긁히며 한참을 달리다 쓰러진다.`,choices:[{t:'정신을 잃는다…',go:'b1_dawn'}]},
b1_dawn:{title:'새벽',who:['tio'],onEnter:{join:'tio',item:'오르벤의 편지',loot:'u_gorion'},text:`누군가 당신을 흔든다. 티오다. 진흙투성이 얼굴, 고글엔 금이 가 있다.

"내가 따라온다고 했잖아… 나무 위에서 다 봤어. 오르벤 할아버지는…" 그가 말을 잇지 못하고 고글을 내려 눈을 가린다.

둘은 숲길로 돌아가 오르벤을 찾는다. 그의 손가락에서 자수정 반지를 빼내자, 품에서 봉인된 편지가 나온다. 당신에게 쓴 것이다.

<i>"…만약 내게 무슨 일이 생기면, 북쪽 '우정의 팔 여관'으로 가거라. 내 오랜 벗 브렌나와 라스가 너를 도울 것이다. 네가 누구인지는… 그들이 아니라 시간이 알려줄 것이다. 그리고 기억해라. 너는 내 서고에서 가장 소중한 책이었다."</i>`,
 choices:[{t:'오르벤을 묻어주고 기도한다',not:['buried'],set:{buried:1},go:'b1_bury'},{t:'북쪽 길로 떠난다',go:'b1_road'}]},
b1_bury:{title:'새벽',who:['tio'],onEnter:{heal:'1d6+2'},text:`티오와 함께 맨손으로 흙을 판다. 해가 떠오를 무렵, 작은 돌무덤 위에 오르벤의 지팡이를 꽂는다.

티오가 품에서 지도를 꺼내 무덤 위치를 꼼꼼히 그려 넣는다. "언젠가 돌아와서 제대로 된 비석 세워드리자. 내가 위치 절대 안 잊어버리게 할게."

슬픔 속에서도 이상하게 힘이 난다.`,choices:[{t:'북쪽 길로 떠난다',go:'b1_road'}]},
b1_road:{title:'북쪽 길',who:['tio'],text:`해안을 따라 난 길을 걷는다. 티오는 걸으면서도 지도에 무언가를 계속 그려 넣는다.

정오쯤, 언덕 너머로 검은 연기가 피어오른다. 농가 쪽이다. 희미하게 비명도 들린다.

"저거… 우리 지도엔 없는 마을인데." 티오가 침을 삼킨다.`,
 choices:[{t:'농가로 달려간다',go:'b1_farm'},{t:'갈 길이 급하다. 여관으로 곧장 간다',go:'b1_inn'}]},
b1_farm:{title:'불타는 농가',text:`헛간이 불타고 있다. 하이에나 머리를 한 놀 약탈자들이 가축을 끌어내며 낄낄거린다. 집 안에는 농부 가족이 갇혀 있다.

"저 녀석들, 아직 우릴 못 봤어." 티오가 속삭인다. "나 저쪽 울타리 뒤로 돌아갈게. 신호 주면 덮치자."`,
 choices:[{t:'몰래 다가가 기습한다',check:{skill:'은신',dc:12,ok:'b1_farm_ambush',fail:'b1_farm_fight'}},{t:'소리쳐 주의를 끈다',go:'b1_farm_fight'}]},
b1_farm_ambush:{title:'불타는 농가',text:`그림자를 따라 다가가 첫 놈의 등을 덮친다! 울타리 뒤에서 티오의 단검이 번쩍인다. 놈들이 허둥대며 무기를 집어 든다.`,combat:{enemies:[mob('놀 약탈자',3,{hp:9}),mob('놀 약탈자',3)],win:'b1_farm_win'}},
b1_farm_fight:{title:'불타는 농가',text:`놀들이 일제히 고개를 돌린다. "고기다! 신선한 고기!" 컹컹 짖으며 달려든다.`,combat:{enemies:[mob('놀 약탈자',3,{n:3})],win:'b1_farm_win'}},
b1_farm_win:{title:'불타는 농가',onEnter:{gold:20,potions:1,set:{farm:1}},text:`농부 가족이 울면서 고마워한다. 막내딸이 티오의 고글을 신기한 듯 만져본다. 농부가 숨겨둔 금화와 물약을 억지로 쥐여준다.

"요즘 세상이 미쳤어요. 쇠가 썩어서 쟁기날이 부러지고, 대장간 칼도 휘어진다더군요. 남쪽 <b>나시켈 광산</b>에서 나오는 철이 이상하대요. 그래서 다들 굶주리고, 굶주린 놈들이 약탈을 하고…"

철이 썩는다? 마음 한구석에 걸린다.`,choices:[{t:'여관으로 향한다',go:'b1_inn'}]},
b1_inn:{title:'우정의 팔 여관',text:`언덕 위 성벽으로 둘러싸인 여관. 계단을 오르는데, 붉은 로브를 입은 남자가 반갑게 다가온다.

"아, 오르벤의 피후견인! 드디어 만났군. 자네를 기다리고 있었네." 그의 손이 소매 속으로 들어간다.`,
 choices:[{t:'그의 손과 눈을 주시한다',check:{skill:'통찰',dc:12,ok:'b1_tarnesh_spot',fail:'b1_tarnesh_hit'}},{t:'"누구시죠?" 하고 다가간다',go:'b1_tarnesh_hit'}]},
b1_tarnesh_spot:{title:'우정의 팔 여관',text:`소매 속에서 주문 구성요소가 반짝이는 걸 놓치지 않는다. 그가 주문을 외기 전에 당신이 먼저 덤벼든다!`,combat:{enemies:[elite('현상금 사냥꾼 마법사',3,{hp:20,ac:12})],win:'b1_tarnesh_win'}},
b1_tarnesh_hit:{title:'우정의 팔 여관',onEnter:{dmg:'2d4+2'},text:`그의 손끝에서 마법 화살이 터져 나와 가슴에 꽂힌다! "미안하네, 자네 목에 걸린 금화가 꽤 두둑해서 말이야."`,combat:{enemies:[elite('현상금 사냥꾼 마법사',3,{ac:12})],win:'b1_tarnesh_win'}},
b1_tarnesh_win:{title:'우정의 팔 여관',onEnter:{set:{bounty:1},item:'현상금 쪽지'},text:`쓰러진 마법사의 품에서 구겨진 쪽지가 나온다.

<i>"오르벤의 피후견인. 캔들킵 출신. 죽여서 가져오면 금화 200닢."</i>

서명 대신 늑대 발자국 모양의 인장이 찍혀 있다.

누군가 당신을 죽이려고 돈을 걸었다. 왜?`,choices:[{t:'여관 안으로 들어간다',go:'b1_jaheira'}]},
b1_jaheira:{title:'우정의 팔 여관',who:['brenna','ras'],onEnter:{join:['brenna','ras']},text:`구석 테이블의 드워프 둘이 당신을 알아본다. 은발을 땋아 내린 안경 쓴 여자, 그리고 붉은 수염을 세 갈래로 땋은 덩치 큰 남자.

"오르벤의 아이로군." 여자가 찻잔을 내려놓는다. "브렌나다. 이쪽은 내 동생 라스. 오르벤이 함께 오지 않은 걸 보니… 그렇게 된 건가."

라스가 벌떡 일어나 당신을 와락 끌어안는다. 갑옷이 부딪혀 쨍그랑 소리가 난다. "이런, 이런! 그 고집쟁이 영감탱이… 걱정 마라, 꼬맹이. 이제 이 라스 님의 방패 뒤에 숨으면 된다!"

브렌나가 동생을 떼어내고 지도를 펼친다. "애도는 나중이다. 오르벤은 우리 하퍼에게 한 가지 일을 맡겼었지. 남쪽 나시켈 광산에서 철이 오염되고 있다. 소드 코스트 전체가 무너지기 직전이야. 그 배후에 너를 노리는 자들과 같은 이가 있을지도 모른다."`,
 choices:[{t:'하퍼에 대해 묻는다',not:['harper'],set:{harper:1},go:'b1_harper'},{t:'여관에서 하룻밤 묵는다',sub:'금화 5 · 휴식',not:['inn_rest'],set:{inn_rest:1},gold:-5,rest:1,go:'b1_jaheira'},{t:'나시켈로 가자',go:'b1_c1_end'}]},
b1_harper:{title:'우정의 팔 여관',who:['brenna','ras'],text:`"하퍼." 브렌나가 목소리를 낮춘다. "폭정을 막고 균형을 지키는 비밀 결사다. 오르벤도 젊을 땐 우리 중 하나였지. 나에게 처음으로 치유 주문을 가르친 것도 그였다."

라스가 맥주를 들이켠다. "그리고 나한테 처음으로 '입 좀 다물어라'고 가르친 것도 그 영감이었지! 하하! …못 배웠지만."`,choices:[{t:'고개를 끄덕인다',go:'b1_jaheira'}]},
b1_c1_end:{title:'1장 끝',chapterEnd:true,text:`다음 날 새벽, 넷이 된 일행은 남쪽으로 향한다.

오르벤을 죽인 늑대 가면의 거인. 당신 목에 걸린 현상금. 썩어가는 철. 아직은 아무것도 이어지지 않는다.

라스가 앞장서서 행진곡을 흥얼거리고, 브렌나가 "조용히 해"라고 세 번째 말한다. 티오가 걸음을 맞추며 속삭인다. "있잖아, 무섭긴 한데… 솔직히 조금 신나기도 해."`}
,
/* ---------- 2장: 나시켈의 피 묻은 철 (Lv4) ---------- */
b1_c2:{title:'남쪽 길',text:`나시켈로 가는 길목, 돌다리 위를 덩치 셋이 막아선다. 팔에는 녹슨 쇠사슬을 감았다.

"통행세다. 1인당 금화 다섯 닢. 철값이 오르니 우리도 먹고 살아야지."

라스가 방패를 고쳐 잡는다. "흥, 내 방패로 다섯 대씩 내주면 되겠나?"`,
 choices:[{t:'금화 20닢을 던져준다',gold:-20,go:'b1_nashkel'},{t:'"비켜라. 다치기 싫으면."',check:{skill:'위협',dc:13,ok:'b1_bridge_scare',fail:'b1_bridge_fight'}},{t:'무기를 뽑는다',go:'b1_bridge_fight'}]},
b1_bridge_scare:{title:'남쪽 길',text:`당신의 눈빛에 덩치들이 주춤하더니, 침을 뱉고 길을 비킨다. "흥, 오늘은 운 좋은 줄 알아."

라스가 실망한 얼굴로 방패를 내린다. "에이, 한 판 하려고 했는데."`,choices:[{t:'나시켈로',go:'b1_nashkel'}]},
b1_bridge_fight:{title:'남쪽 길',text:`"좋아, 그럼 몸으로 내라!" 도적들이 몽둥이를 휘두르며 달려든다.`,combat:{enemies:[mob('통행세 도적',4,{n:3})],win:'b1_bridge_win'}},
b1_bridge_win:{title:'남쪽 길',onEnter:{gold:15},text:`도적들의 주머니에서 금화와 함께 이상한 화살촉이 나온다. 쇠가 아니라 거친 돌을 깎아 만든 것이다. 철이 그만큼 귀해졌다는 뜻이다.

브렌나가 화살촉을 굴려본다. "돌 화살촉이라… 백 년 전으로 돌아간 셈이군."`,choices:[{t:'나시켈로',go:'b1_nashkel'}]},
b1_nashkel:{title:'나시켈 마을',text:f=>`광산 마을 나시켈은 활기를 잃었다. 광부들은 술집에 모여 앉아 웅성거린다. 광산 깊은 곳에서 동료들이 하나둘 사라지고, 푸른 불꽃을 부리는 악마를 봤다는 소문까지 돈다.

${f.minsc_met?'':'여관 앞 노천 화덕에서 거구의 하프오크 여인이 국자를 휘두르며 소리친다. "이 냄비에 넣을 고기는 있어도, 놀 놈들 상대할 사람은 없다는 거냐! 셀렌이 잡혀갔단 말이다!" 그녀의 앞치마에는 시 한 구절이 수놓아져 있다.'}`,
 choices:[{t:'국자를 든 하프오크에게 말을 건다',not:['minsc_met'],go:'b1_minsc'},
  {t:'셀렌을 구하러 놀 요새로 간다',req:['minsc_met'],not:['dyna'],go:'b1_gnoll'},
  {t:'촌장 올리크를 찾아간다',not:['mayor'],go:'b1_mayor'},
  {t:'마을 축제 천막을 둘러본다',not:['carnival'],go:'b1_carnival'},
  {t:'광산으로 간다',req:['mayor'],go:'b1_mine'}]},
b1_minsc:{title:'나시켈 마을',who:['korva'],onEnter:{set:{minsc_met:1},join:'korva'},text:`하프오크가 국자를 내리고 당신을 위아래로 훑는다. 송곳니 사이로 씩 웃는다.

"코르바다. 칼비아 투기장에서 열두 해 동안 챔피언이었지. 지금은 은퇴하고 요리를 하고 시를 쓴다. 둘 다 아직 서툴지만."

그녀의 얼굴이 굳는다. "삼 년 전, 투기장에서 거의 죽을 뻔한 날, 지나가던 엘프 점성술사가 날 치료해줬다. 셀렌이라는 녀석이지. 그 뒤로 빚을 갚으려고 따라다니는데… 어제 놀 놈들이 그를 납치해서 서쪽 절벽 요새로 끌고 갔다."

그녀가 앞치마를 벗어 던진다. "도와주면 평생 밥은 내가 책임지지. 맛은 책임 못 지지만."`,choices:[{t:'"좋아, 함께 가자."',go:'b1_nashkel'}]},
b1_gnoll:{title:'놀 요새',who:['korva'],text:`서쪽 절벽 위, 뼈와 가죽으로 엮은 놀들의 요새. 정문에는 파수꾼이 셋, 절벽 쪽은 경비가 허술해 보인다.

코르바가 손가락 마디를 꺾는다. "투기장에선 늘 정문으로 들어갔다. 관중들이 좋아하거든."`,
 choices:[{t:'절벽을 타고 몰래 오른다',check:{skill:'운동',dc:13,ok:'b1_gnoll_in',fail:'b1_gnoll_gate'}},{t:'코르바와 함께 정문을 부순다',go:'b1_gnoll_gate'}]},
b1_gnoll_in:{title:'놀 요새',text:`절벽을 오르니 바로 족장의 천막 뒤편이다. 안에서 사슬에 묶인 엘프가 보인다. 족장이 눈치채고 울부짖는다!`,combat:{enemies:[elite('놀 족장',4),mob('놀 호위',4)],win:'b1_dyna'}},
b1_gnoll_gate:{title:'놀 요새',text:`코르바가 투기장의 함성 같은 고함을 지르며 정문을 어깨로 부순다. 놀 떼가 사방에서 쏟아져 나온다!`,combat:{enemies:[elite('놀 족장',4),mob('놀 전사',4,{n:2})],win:'b1_dyna'}},
b1_dyna:{title:'놀 요새',who:['selen','korva'],onEnter:{join:'selen',set:{dyna:1},gold:30},text:`사슬을 끊자 은발의 엘프가 먼지를 털며 천천히 일어선다. 놀랍게도 그는 웃고 있다.

"별자리가 그러더군. 오늘 붉은 별 하나가 나를 구하러 올 거라고." 그가 당신을 본다. "그게 당신이었군요. 셀렌이라고 합니다."

코르바가 그의 머리를 콱 쥐어박는다. "점이나 치다 잡혀간 주제에!" 하지만 그녀의 눈가가 젖어 있다.

셀렌이 당신의 손을 잡고 오래 들여다본다. "당신의 별은… 핏빛이군요. 흥미롭습니다. 이 은혜는 잊지 않겠습니다."`,choices:[{t:'나시켈로 돌아간다',go:'b1_nashkel'}]},
b1_mayor:{title:'촌장의 집',who:['olric'],onEnter:{set:{mayor:1}},text:`촌장 올리크가 지친 얼굴로 맞는다. 책상 위에는 실종된 광부들의 이름이 빼곡히 적힌 명단이 놓여 있다.

"광산 아래층에서 광부가 열둘이나 사라졌소. 살아 나온 자들은 코볼드 떼와 '푸른 불꽃을 부리는 악마'를 봤다더군. 더 큰 문제는 철이오. 캐낸 철광석이 제련만 하면 썩은 나무처럼 부서져버려요."

그가 금화 자루를 흔든다. "광산의 진상을 밝혀주면 사례하겠소. 이 마을이 철 말고는 가진 게 없거든."`,choices:[{t:'광산으로 간다',go:'b1_mine'},{t:'마을을 더 둘러본다',go:'b1_nashkel'}]},
b1_carnival:{title:'나시켈 축제',shop:'b1_nashkel',onEnter:{set:{carnival:1}},text:`우울한 마을을 달래려 열린 작은 축제. 천막 사이로 점쟁이 노파가 손짓한다.

노파는 당신 손바닥을 보자마자 얼굴이 하얗게 질린다. "피… 아주 오래된 신의 피가 흐르는구나. 그 신은 죽었지만, 자식들은 살아 있어. 그리고 자식들끼리… 서로를 사냥하지."

노파가 서둘러 천막을 닫는다. 옆으로는 떠돌이 상인들의 노점이 줄지어 있다. 광산에 가기 전에 장비를 갖추기 좋겠다.`,
 choices:[{t:'마을로 돌아간다',go:'b1_nashkel'}]},
b1_mine:{title:'나시켈 광산',text:`광산 입구의 감독관 뎁이 횃불을 건넨다. "아래 4층부터는 아무도 안 내려갑니다. 행운을 빌어요."

갱도는 아래로, 더 아래로 이어진다. 3층쯤 내려가자 바닥에 가는 실이 반짝인다. 티오가 고글을 내려쓴다. "어… 저거 그냥 실 아닌 것 같은데."`,
 choices:[{t:'실을 살핀다',check:{skill:'지각',dc:13,ok:'b1_mine_trap_ok',fail:'b1_mine_trap'}},{t:'그냥 넘어간다',go:'b1_mine_trap'}]},
b1_mine_trap_ok:{title:'광산 3층',text:`철사 함정이다. 천장의 바위 더미와 연결돼 있다. 조심스럽게 끊어낸다.

티오가 감탄하며 지도에 표시를 한다. "코볼드 솜씨치곤 꽤 정교한데? 누가 가르쳐준 거 아냐?"`,choices:[{t:'더 깊이 내려간다',go:'b1_kobolds'}]},
b1_mine_trap:{title:'광산 3층',onEnter:{dmg:'2d6'},text:`발목에 뭔가 걸리는 순간, 천장에서 돌덩이가 쏟아진다! 간신히 피했지만 어깨가 욱신거린다.`,choices:[{t:'더 깊이 내려간다',go:'b1_kobolds'}]},
b1_kobolds:{title:'광산 4층',text:`좁은 갱도가 넓은 동굴로 열린다. 그리고 수십 개의 붉은 눈. 코볼드들이 활을 겨누고 있다.

"인간이다! 주인님께 바쳐라!"`,combat:{enemies:[mob('코볼드 특공대',4,{hp:10,n:3}),mob('코볼드 궁수',4,{hp:8,ac:12})],win:'b1_deep'}},
b1_deep:{title:'광산 깊은 곳',text:`코볼드 시체 사이에서 광부들의 곡괭이와 헬멧이 발견된다. 갱도 벽에는 푸른 광택이 도는 이상한 가루가 발라져 있다. 철광석을 오염시키는 무언가다.

브렌나가 가루를 손끝에 묻혀 냄새를 맡는다. "자연의 것이 아니야. 누군가 일부러 철을 썩게 만들고 있다."`,
 choices:[{t:'잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r2'],set:{r2:1},rest:1,go:'b1_deep'},{t:'푸른 불빛이 새어 나오는 동굴로 간다',go:'b1_mulahey'}]},
b1_mulahey:{title:'광산 최하층',who:['malkor'],text:`푸른 불꽃이 일렁이는 동굴. 해골 문양 로브를 입은 남자가 제단 앞에 서 있다. 오른손이 녹슨 쇠로 된 의수다. 사이릭의 사제, 말코르.

당신을 본 그가 멀쩡한 왼손을 번쩍 든다. "자, 잠깐! 항복하겠다! 나는 그저 시키는 대로 했을 뿐이야! 다 말해주지!"`,
 choices:[{t:'항복을 받아들이되 눈을 떼지 않는다',check:{skill:'통찰',dc:13,ok:'b1_mula_spot',fail:'b1_mula_trick'}},{t:'"말은 무덤에서 하라"며 공격한다',go:'b1_mula_fight'}]},
b1_mula_spot:{title:'광산 최하층',who:['malkor'],text:`녹슨 의수의 손가락이 미세하게 꼬이는 걸 본다. 주문이다! "거짓말쟁이!" 당신이 먼저 내리친다.`,combat:{enemies:[boss('말코르',4,{hp:45,attacks:1}),mob('해골 병사',4,{hp:10})],win:'b1_mula_win'}},
b1_mula_trick:{title:'광산 최하층',who:['malkor'],onEnter:{dmg:'2d6+2'},text:`당신이 다가가는 순간, 그가 낄낄대며 녹슨 의수를 비튼다. 검은 번개가 가슴을 때린다! "멍청하긴! 일어나라, 나의 종들이여!"

바닥에서 해골들이 기어 나온다.`,combat:{enemies:[boss('말코르',4,{hp:55,attacks:1}),mob('해골 병사',4,{hp:10,n:2})],win:'b1_mula_win'}},
b1_mula_fight:{title:'광산 최하층',who:['malkor'],text:`"좋다, 그럼 죽어라!" 말코르의 외침에 바닥에서 해골들이 기어 나온다.`,combat:{enemies:[boss('말코르',4,{hp:55,attacks:1}),mob('해골 병사',4,{hp:10,n:2})],win:'b1_mula_win'}},
b1_mula_win:{title:'광산 최하층',onEnter:{gold:100,item:'말코르의 편지',loot:'u_cyric'},text:`말코르가 쓰러지자 푸른 불꽃이 꺼진다. 제단 아래에서 편지 꾸러미가 나온다.

<i>"광석 오염을 계속하라. 철값이 오를수록 우리 주인의 계획은 가까워진다. 오르벤의 피후견인이 나타나면 죽여라. — 그락쉬"</i>

또 다른 편지에는 숲속 <b>도적 소굴</b>의 위치가 그려져 있다.

브렌나가 이를 악문다. "철을 썩히고, 도적을 풀어 상인을 털고… 누군가 소드 코스트를 일부러 굶기고 있어. 그리고 너를 노리는 것도 같은 놈들이다."`,
 choices:[{t:'나시켈로 돌아가 보고한다',go:'b1_c2_end'}]},
b1_c2_end:{title:'2장 끝',chapterEnd:true,text:`광산이 다시 열리고, 나시켈에 오랜만에 웃음이 돈다. 촌장 올리크는 당신의 이름을 외치며 술잔을 든다.

하지만 당신 일행은 축배 대신 지도를 펼친다. 그락쉬라는 이름, 숲속 도적 소굴. 그리고 그 위에 있는 '주인'.

코르바가 커다란 솥에 정체불명의 스튜를 끓이며 말한다. "악당의 소굴은 부수라고 있는 거다. 먹고 가자. 오늘은 실패작 아니다. …아마도."`}
,
/* ---------- 3장: 도적 소굴과 클록우드 (Lv5) ---------- */
b1_c3:{title:'도적 소굴',text:`숲 깊은 곳, 목책으로 둘러싸인 거대한 도적 야영지. 모닥불 사이로 수십 명이 오간다. 새 단원을 뽑는다는 공고가 정문에 붙어 있다.

셀렌이 별이 뜨기 시작한 하늘을 본다. "오늘 밤은 기만의 별이 밝습니다. 거짓말이 잘 통하는 밤이죠."`,
 choices:[{t:'신입 단원인 척 들어간다',check:{skill:'기만',dc:13,ok:'b1_recruit',fail:'b1_camp_fight'}},{t:'밤을 틈타 두목의 천막으로 숨어든다',check:{skill:'은신',dc:14,ok:'b1_tent_sneak',fail:'b1_camp_fight'}},{t:'정면으로 쳐들어간다',go:'b1_camp_fight'}]},
b1_recruit:{title:'도적 소굴',text:`"신입이라고? 좋아, 실력부터 보자." 털보 부두목이 히죽 웃으며 결투장으로 끌고 간다. 도적들이 둘러서서 환호한다.`,
 choices:[{t:'맨손 씨름으로 이긴다',check:{skill:'운동',dc:13,ok:'b1_recruit_win',fail:'b1_recruit_duel'}},{t:'무기로 겨룬다',go:'b1_recruit_duel'}]},
b1_recruit_duel:{title:'결투장',text:`부두목이 도끼를 빙글 돌린다. "죽지만 마라, 신입!" 관중 사이에서 코르바가 투기장 시절 버릇대로 고함친다. "왼쪽이 비었다!"`,combat:{noParty:true,enemies:[elite('도적 부두목',5,{hp:30})],win:'b1_recruit_win'}},
b1_recruit_win:{title:'도적 소굴',text:`도적들이 환호성을 지른다. "괜찮은 놈이 왔네!" 부두목이 어깨를 툭 친다. "두목 그락쉬님이 보자신다. 천막으로 가 봐."`,choices:[{t:'두목의 천막으로',go:'b1_tent'}]},
b1_camp_fight:{title:'도적 소굴',text:`"침입자다!" 종이 울리고 도적들이 몰려나온다.`,combat:{enemies:[mob('도적',5,{n:3}),mob('도적 궁수',5,{hp:15})],win:'b1_tent'}},
b1_tent:{title:'그락쉬의 천막',who:['grakk'],text:`천막 안, 어깨가 문틀만 한 반오우거 그락쉬가 지도 위에 단검을 꽂고 있다. 볏처럼 세운 머리, 이빨 하나가 금니다. 그가 당신을 보고 금니를 드러낸다.

"오르벤의 꼬맹이로군. 네 목에 걸린 돈이 얼마인지 아나? 주인님이 아주 좋아하시겠어."`,combat:{enemies:[boss('그락쉬',5,{hp:70}),mob('천막 호위',5)],win:'b1_docs'}},
b1_tent_sneak:{title:'그락쉬의 천막',who:['grakk'],text:`코 고는 소리가 천막을 울린다. 거대한 반오우거 그락쉬가 잠들어 있다. 책상 위에 서류 상자가 놓여 있다.

티오가 입모양으로 말한다. <i>내가 할까?</i>`,
 choices:[{t:'서류 상자를 소리 없이 연다',check:{skill:'손재주',dc:13,ok:'b1_docs',fail:'b1_tent_wake'}},{t:'잠든 그락쉬를 덮친다',go:'b1_tent_wake'}]},
b1_tent_wake:{title:'그락쉬의 천막',who:['grakk'],text:`그락쉬의 눈이 번쩍 뜨인다! "쥐새끼가 들어왔군!" 그가 거대한 도끼를 집어 든다.`,combat:{enemies:[boss('그락쉬',5,{hp:60})],win:'b1_docs'}},
b1_docs:{title:'그락쉬의 천막',onEnter:{set:{docs:1},item:'철의 왕좌 문서',gold:60,loot:'u_tazok'},text:`서류 상자 속 편지들이 퍼즐 조각처럼 맞춰진다.

도적단, 광산 오염, 상인 습격. 모두 <b>'철의 왕좌'</b>라는 상인 조합의 명령이다. 그 수장은 베일란 크로스. 그리고 그들은 클록우드 숲 깊은 곳에 비밀 광산을 운영하며 철을 몰래 쌓아두고 있다.

마지막 편지에는 처음 보는 이름이 서명돼 있다. <b>모르데인</b>. 봉인은 늑대 발자국이다.

<i>"오르벤의 피후견인은 반드시 내 손으로. 다른 놈들은 손대지 마라."</i>

라스가 처음으로 웃음기 없이 중얼거린다. "늑대 가면의 거인… 그놈이었군."`,
 choices:[{t:'클록우드 숲으로 간다',go:'b1_cloak'}]},
b1_cloak:{title:'클록우드 숲',text:`빛조차 잘 들지 않는 고목의 숲. 나뭇가지에 굵은 거미줄이 늘어져 있다.

덤불 속에서 상처 입은 엘프 드루이드가 기어 나온다. "도와주시오… 거미 괴물 에터캡들이 내 숲을 갉아먹고 있소. 놈들의 둥지를 없애주면 광산으로 가는 지름길을 알려주겠소."

브렌나가 이미 붕대를 꺼내고 있다. "다친 자를 두고 갈 순 없지."`,
 choices:[{t:'드루이드를 돕는다',go:'b1_spiders'},{t:'갈 길이 급하다. 광산으로 곧장 간다',go:'b1_cloak_road'}]},
b1_spiders:{title:'거미 둥지',text:`둥지 한가운데, 거미와 사람을 반쯤 섞은 듯한 에터캡이 실을 뽑고 있다. 그 주위로 개만 한 거미들이 기어 다닌다. 티오가 비명을 삼킨다. "난… 거미는… 진짜 싫어…"`,combat:{enemies:[elite('에터캡',5),mob('거대 거미',5,{hp:14,n:2})],win:'b1_spiders_win'}},
b1_spiders_win:{title:'클록우드 숲',onEnter:{set:{druid:1},potions:2},text:`드루이드가 감사의 표시로 약초 물약 두 병을 건넨다.

"광산 뒤편 계곡에 낡은 배수로가 있소. 그곳으로 들어가면 경비를 피할 수 있을 거요. 그리고… 광산 꼭대기의 수문을 조심하시오. 열리면 광산 전체가 물에 잠길 테니."`,choices:[{t:'배수로로 광산에 숨어든다',go:'b1_mine_in'}]},
b1_cloak_road:{title:'클록우드 광산 입구',text:`광산 입구를 철의 왕좌 용병들이 지키고 있다. 그 너머로 사슬에 묶인 노예들이 광석을 나르는 모습이 보인다.`,
 choices:[{t:'철의 왕좌 문서를 내밀며 감찰관 행세를 한다',req:['docs'],check:{skill:'기만',dc:12,ok:'b1_mine_in',fail:'b1_gate_fight'}},{t:'경비를 쓰러뜨린다',go:'b1_gate_fight'}]},
b1_gate_fight:{title:'클록우드 광산 입구',text:`"침입자다! 노예들을 지하로 몰아넣어!" 용병들이 달려든다.`,combat:{enemies:[mob('철의 왕좌 용병',5,{n:3})],win:'b1_mine_in'}},
b1_mine_in:{title:'클록우드 광산',text:`광산 안은 지옥이다. 앙상한 노예들이 채찍질 아래 광석을 캔다. 노예 우두머리인 늙은 드워프 릴이 몰래 다가온다. 그는 브렌나와 라스를 보고 눈을 크게 뜬다. "드워프 형제들이 여기까지…!"

"맨 아래층에 이바르 녹이라는 마법사가 있소. 놈만 쓰러뜨리면 우리가 들고일어나겠소."`,
 choices:[{t:'노예들에게 함께 싸우자고 설득한다',not:['riot_try'],set:{riot_try:1},check:{skill:'설득',dc:13,ok:'b1_riot',fail:'b1_mine_in2'}},
  {t:'몰래 숨어 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r3'],set:{r3:1},rest:1,go:'b1_mine_in'},
  {t:'맨 아래층으로 내려간다',go:'b1_davaeorn'}]},
b1_riot:{title:'클록우드 광산',onEnter:{set:{riot:1}},text:`라스가 노예들 앞에서 드워프 전투가를 부르기 시작한다. 처음엔 혼자, 그다음엔 릴이, 그다음엔 모두가.

릴이 낡은 곡괭이를 치켜든다. "오늘이다, 형제들!" 노예들이 하나둘 사슬을 끊고 일어선다. 그들이 감독관들을 맡는 사이, 당신은 최하층으로 향한다.`,choices:[{t:'맨 아래층으로',go:'b1_davaeorn'}]},
b1_mine_in2:{title:'클록우드 광산',text:`노예들은 겁에 질려 고개를 젓는다. "희망 따위로 사슬이 끊어지진 않소…"`,choices:[{t:'맨 아래층으로 내려간다',go:'b1_davaeorn'}]},
b1_davaeorn:{title:'광산 최하층',who:['ivar'],text:f=>`최하층의 서재. 보라색 긴 머리를 늘어뜨린 창백한 마법사 이바르 녹이 책을 덮으며 일어선다. 그의 이마의 보석이 초록빛으로 맥박친다.

"모르데인 님이 경고하셨지. 오르벤의 아이가 쥐새끼처럼 기어들어 올 거라고." 그의 등 뒤에서 텅 빈 갑옷이 일어난다. 영혼 없는 전투 공포다.${f.riot?'\n\n위층에서 노예들의 함성이 들려온다. 감독관들은 이리로 오지 못할 것이다.':''}`,
 combat:{enemies:[boss('이바르 녹',5,{hp:60,ac:13,attacks:1}),elite('전투 공포',5,{hp:30})],win:'b1_flood'}},
b1_flood:{title:'광산 최하층',onEnter:{item:'이바르의 일지',loot:'u_davaeorn'},text:`이바르가 재가 되어 흩어진다. 그의 책상 위 일지에 모든 계획이 적혀 있다. 철을 독점해 소드 코스트를 굶기고, 이웃 나라 앰과의 전쟁을 일으킨다. 그리고 그 혼란 속에서 발더스 게이트를 손에 넣는다. 계획의 주인은 모르데인이다.

벽에 커다란 수문 레버가 있다. 이걸 당기면 광산은 물에 잠기고, 철의 왕좌의 비밀 광산은 끝장난다.`,
 choices:[{t:'노예들에게 탈출하라고 외치고 레버를 당긴다',check:{skill:'곡예',dc:12,ok:'b1_flood_ok',fail:'b1_flood_hurt'}}]},
b1_flood_ok:{title:'수몰',text:`굉음과 함께 물이 쏟아져 들어온다. 노예들과 함께 갱도를 달려 올라간다. 마지막 사람이 빠져나오는 순간, 입구가 물보라에 잠긴다.`,choices:[{t:'숲으로 나온다',go:'b1_c3_end'}]},
b1_flood_hurt:{title:'수몰',onEnter:{dmg:'2d6'},text:`물살에 휩쓸려 바위에 부딪힌다! 코르바가 당신의 멱살을 잡아 한 손으로 끌어올린다. "수영은 다음에 가르쳐주마. 투기장 수중전 챔피언이었거든. 거짓말이다."`,choices:[{t:'숲으로 나온다',go:'b1_c3_end'}]},
b1_c3_end:{title:'3장 끝',chapterEnd:true,text:`해방된 노예들이 당신의 이름을 부르며 흩어진다. 릴은 브렌나와 라스의 손을 오래 잡고 놓지 않는다. 비밀 광산이 사라지자 철값이 내려가기 시작한다.

이바르의 일지는 한 곳을 가리킨다. <b>발더스 게이트</b>, 철의 왕좌 본부.

그리고 일지 마지막 장에는 모르데인의 문장이 옮겨 적혀 있다.

<i>"그 아이와 나는 같은 피를 나눴다. 그 피를 모두 차지하는 자만이 아버지의 자리에 오를 것이다."</i>`}
,
/* ---------- 4장: 바알의 아들 (Lv6) ---------- */
b1_c4:{title:'발더스 게이트',text:`거대한 성문을 지나 소드 코스트 최대의 도시로 들어선다. 항구의 소금 냄새, 끝없는 인파, 그리고 곳곳에 걸린 현상수배 전단. 다행히 아직 당신 얼굴은 아니다.

티오가 입을 떡 벌리고 첨탑들을 올려다본다. "이 도시 지도 그리려면 일 년은 걸리겠다…"

철의 왕좌 본부는 상층 도시의 높은 석조 건물이다. 정문은 무장한 경비들이 지킨다.`,
 choices:[{t:'상층 도시 상점가에 들른다',go:'b1_market'},{t:'불꽃 주먹 경비대에 이바르의 일지를 보여준다',req:['item:이바르의 일지'],check:{skill:'설득',dc:13,ok:'b1_fist',fail:'b1_throne_front'}},{t:'옆 건물 지붕을 타고 넘어간다',check:{skill:'곡예',dc:13,ok:'b1_throne_roof',fail:'b1_throne_front'}},{t:'정문을 돌파한다',go:'b1_throne_front'}]},
b1_market:{title:'상층 도시 상점가',shop:'b1_city',text:`대리석 기둥 사이로 고급 상점들이 늘어서 있다. 현상수배 전단의 얼굴과 당신을 번갈아 보던 상인이 어깨를 으쓱한다. "금화만 있으면 누구든 손님이지."`,
 choices:[{t:'상점가를 나선다',go:'b1_c4'}]},
b1_fist:{title:'불꽃 주먹 본부',who:['eleanor'],onEnter:{set:{eltan:1}},text:`불꽃 주먹 사령관 엘레노어 공작이 직접 일지를 읽는다. 은발을 단단히 틀어 올린 노장이다. 그녀의 얼굴이 굳는다.

"모르데인… 철의 왕좌 수장 베일란 크로스의 양아들이로군. 공개적으로 움직이면 놈들이 눈치챌 거다. 뒷문을 열어줄 테니 조용히 처리해라."

엘레노어가 기침을 한다. 손수건에 피가 묻어난다. "요즘 몸이… 신경 쓰지 마라. 가라."`,choices:[{t:'뒷문으로 잠입한다',go:'b1_throne_roof'}]},
b1_throne_roof:{title:'철의 왕좌 본부',text:`조용히 건물 안으로 들어선다. 꼭대기 층 회의실에는 아무도 없다. 책상 위에 남은 메모 하나.

<i>"베일란 님과 상인 지도자들은 캔들킵 회의로 출발. 모르데인 님은 남는다."</i>

캔들킵. 당신의 고향이다.`,choices:[{t:'캔들킵으로 향한다',go:'b1_keep'}]},
b1_throne_front:{title:'철의 왕좌 본부',text:`경비들이 칼을 뽑는다. "철의 왕좌에 쳐들어오다니, 미쳤군!"`,combat:{enemies:[mob('철의 왕좌 경비',6,{n:3}),elite('경비 대장',6,{hp:30})],win:'b1_throne_roof'}},
b1_keep:{title:'캔들킵',text:`몇 달 만에 돌아온 캔들킵. 문지기가 당신을 알아보고 반갑게 문을 연다.

서고 깊은 곳 오르벤의 방은 그대로다. 식은 파이프, 반쯤 읽다 덮은 책. 책상 서랍에서 오르벤이 남긴 두 번째 편지를 찾는다.

<i>"네 아버지는 바알, 죽은 살인의 신이다. 그는 자신의 죽음을 예견하고 필멸자들 사이에 자식을 남겼다. 너도 그중 하나다. 다른 자식들은 서로를 죽여 아버지의 힘을 되찾으려 할 것이다. 나는 너를 그런 운명에서 지키고 싶었다. 너는 네 피가 아니라 네 선택으로 정의된다는 걸 잊지 마라."</i>

손이 떨린다. 티오가 말없이 고글을 벗어 당신 손에 쥐여준다. 그가 아끼는 유일한 물건이다.`,
 choices:[{t:'회의장으로 가서 모르데인의 음모를 알린다',go:'b1_keep_murder'}]},
b1_keep_murder:{title:'캔들킵 회의장',text:`회의장 문을 연 순간, 피 냄새가 코를 찌른다. 베일란 크로스와 상인 지도자들이 모두 죽어 있다.

등 뒤에서 수도사들이 외친다. "살인자다! 오르벤의 피후견인이 지도자들을 죽였다!"

당신은 순식간에 포위된다. 성채의 수호자 마그누스가 차갑게 명령한다. "가둬라."`,
 choices:[{t:'저항하지 않고 끌려간다',go:'b1_cell'},{t:'"이건 함정이다!" 하고 수도사들의 얼굴을 살핀다',check:{skill:'통찰',dc:14,ok:'b1_dopple_spot',fail:'b1_cell'}}]},
b1_dopple_spot:{title:'캔들킵 회의장',text:`소리치는 수도사들의 눈동자가 잿빛으로 일렁인다. 변신자들이다! 당신이 외치자 가짜 수도사들이 정체를 드러내며 덤벼든다.`,combat:{enemies:[mob('변신자',6,{n:3})],win:'b1_catacomb'}},
b1_cell:{title:'캔들킵 감옥',who:['abel'],text:`어둑한 감옥. 밤이 깊자 늙은 수도사 아벨이 몰래 찾아온다. 어릴 적 당신에게 글자를 가르쳐준 사람이다.

"나는 네가 하지 않았다는 걸 안다. 오르벤이 너를 어떻게 키웠는지 봤으니까." 그가 문을 연다. "지하 묘지로 나가는 길이 있다. 조심해라. 그 아래엔 산 자도, 죽은 자도 아닌 것들이 있다."`,choices:[{t:'지하 묘지로',go:'b1_catacomb'}]},
b1_catacomb:{title:'캔들킵 지하 묘지',who:['orven'],text:`촛불 하나에 의지해 오래된 묘지를 지난다. 그때 앞쪽에서 익숙한 목소리가 들린다.

"…얘야, 나다."

오르벤이 서 있다. 살아 있는 모습 그대로. 그가 팔을 벌린다. "이리 오너라. 다 설명해주마."`,
 choices:[{t:'"…당신은 오르벤이 아니야."',check:{skill:'통찰',dc:12,ok:'b1_fake_gorion',fail:'b1_fake_hug'}},{t:'오르벤에게 달려간다',go:'b1_fake_hug'}]},
b1_fake_hug:{title:'지하 묘지',onEnter:{dmg:'2d8'},text:`품에 안기는 순간 등에 칼날이 박힌다. "오르벤"의 얼굴이 녹아내린다. 변신자다!`,combat:{enemies:[elite('변신자 (오르벤의 얼굴)',6),mob('변신자',6,{n:2})],win:'b1_escape'}},
b1_fake_gorion:{title:'지하 묘지',text:`"오르벤은 담배 냄새가 났어. 너한테선 아무 냄새도 안 나." 당신의 말에 가짜 오르벤의 얼굴이 일그러지며 녹아내린다. 어둠 속에서 다른 변신자들도 기어 나온다.`,combat:{enemies:[elite('변신자 (오르벤의 얼굴)',6,{hp:30}),mob('변신자',6)],win:'b1_escape'}},
b1_escape:{title:'발더스 게이트',text:`묘지를 빠져나와 밤새 걸어 발더스 게이트로 돌아온다. 이제 도시 곳곳에 당신의 얼굴이 그려진 현상수배 전단이 붙어 있다. '캔들킵 학살자'.

그리고 거리마다 같은 소식이 울려 퍼진다. 엘레노어 공작이 독에 쓰러졌고, 내일 <b>모르데인이 새 대공작으로 즉위한다.</b>

브렌나가 찻잔을 내려놓는다. 손이 떨려 차가 넘친다. "놈이 도시를 통째로 삼키려 해. 증거가 필요하다. 놈이 직접 쓴 것."`,
 choices:[{t:'모르데인의 저택에 숨어든다',check:{skill:'은신',dc:13,ok:'b1_diary',fail:'b1_manor_fight'}},{t:'증거 없이 바로 대공 궁전으로 간다',go:'b1_palace'}]},
b1_manor_fight:{title:'모르데인의 저택',text:`경비견이 짖는다! 저택 경비들이 몰려온다.`,combat:{enemies:[mob('저택 경비',6,{n:2}),mob('경비견',6,{hp:16})],win:'b1_diary'}},
b1_diary:{title:'모르데인의 저택',onEnter:{set:{diary:1},item:'모르데인의 일기'},text:`모르데인의 침실. 벽에는 늑대 가면이 걸려 있고, 그 아래 검은 장정의 일기장이 놓여 있다. 그 안에는 모든 것이 적혀 있다. 오르벤 살해, 철의 위기, 지도자 암살, 엘레노어 공작 독살.

그리고 앞쪽 몇 장. 어린아이의 삐뚤빼뚤한 글씨다. <i>"오늘도 아버지는 날 보지 않았다. 더 강해지면 봐주실까."</i>

마지막 장.

<i>"대공작이 되면 앰과 전쟁을 일으킨다. 수많은 죽음이 아버지 바알의 힘을 내게 모아줄 것이다. 그리고 나는 신이 된다. 그러면 누구도 나를 외면하지 못한다."</i>`,
 choices:[{t:'대공 궁전으로',go:'b1_palace'}]},
b1_palace:{title:'대공 궁전',who:['mordain'],text:f=>`대관식장. 귀족들 사이로 검붉은 갑옷의 거한이 걸어 나온다. 이제 늑대 가면을 벗은 그의 얼굴. 은빛 짧은 머리, 얼굴 반쪽을 덮은 오래된 화상 흉터, 핏빛 눈. 모르데인이다.

당신이 홀 한가운데로 걸어 나가자 사람들이 술렁인다.${f.diary?'\n\n품속에 모르데인의 일기가 있다.':''}`,
 choices:[{t:'일기를 펼쳐 귀족들 앞에서 낭독한다',req:['diary'],check:{skill:'설득',dc:11,ok:'b1_expose',fail:'b1_palace_fight'}},{t:'"이자가 진짜 살인자다!" 하고 외친다',not:['diary'],check:{skill:'설득',dc:16,ok:'b1_expose',fail:'b1_palace_fight'}},{t:'곧장 모르데인에게 달려든다',go:'b1_palace_fight'}]},
b1_expose:{title:'대공 궁전',who:['mordain'],onEnter:{set:{exposed:1}},text:`일기의 문장들이 홀에 울려 퍼질수록 귀족들의 얼굴이 하얗게 질린다. 하로운 공작이 일어선다. "경비대! 저자를 체포하라!"

모르데인이 처음으로 웃는다. 흉터 진 얼굴이 기묘하게 일그러진다. "형제여. 결국 여기까지 왔구나." 그의 부하들이 연막을 터뜨린다. 연기가 걷히자 모르데인은 사라지고 없다. 바닥에 하수도로 이어지는 비밀 문이 열려 있다.`,choices:[{t:'모르데인을 쫓는다',go:'b1_undercity'}]},
b1_palace_fight:{title:'대공 궁전',who:['mordain'],text:`"저 살인자를 잡아라!" 모르데인의 외침에 그의 부하들이 덤벼든다. 혼란 속에서 모르데인은 비밀 문으로 사라진다.`,combat:{enemies:[mob('모르데인의 부하',6,{n:3})],win:'b1_undercity'}},
b1_undercity:{title:'지하 도시',who:['linse'],text:`도시 아래, 잊혀진 옛 거리. 그 끝에 바알의 신전이 있다. 해골과 붉은 돌로 장식된 거대한 홀.

신전 입구에서 검은 머리를 묶은 검사가 길을 막는다. 모르데인의 오랜 동료이자 연인, 린세다.

"돌아가. 그는… 그는 원래 이런 사람이 아니었어. 피가 그를 미치게 만들었을 뿐이야. 어릴 땐 길고양이한테 밥을 주던 애였다고."`,
 choices:[{t:'"그는 너를 버릴 거다. 일기에 그렇게 적혀 있었다."',req:['diary'],check:{skill:'설득',dc:12,ok:'b1_tamoko_go',fail:'b1_final_rest'}},{t:'"비켜라."',go:'b1_final_rest'}]},
b1_tamoko_go:{title:'지하 도시',who:['linse'],onEnter:{set:{tamoko_gone:1}},text:`린세의 손이 떨린다. 일기의 한 구절을 보여주자, 그녀는 눈을 감고 칼을 내려놓는다.

"…알고 있었어. 처음부터." 그녀는 어둠 속으로 사라진다. 사라지기 직전, 돌아보지 않은 채 말한다. "그를… 너무 아프게 하진 마."`,choices:[{t:'신전으로 들어간다',go:'b1_final_rest'}]},
b1_final_rest:{title:'바알의 신전 앞',text:`신전 문 너머에서 의식의 노래가 들린다. 마지막 싸움이다.

라스가 방패를 두드리며 낮게 노래를 시작한다. 코르바가 손가락 마디를 꺾는다. 티오가 고글을 내려쓴다. 브렌나가 고개를 끄덕인다.`,
 choices:[{t:'모두 함께 숨을 고른다',sub:'짧은 휴식 · 한 번만',not:['r4'],set:{r4:1},rest:1,go:'b1_final_rest'},{t:'신전으로 들어간다',go:'b1_sarevok'}]},
b1_sarevok:{title:'바알의 신전',who:['mordain'],text:f=>`피의 제단 위에 모르데인이 서 있다. 그가 늑대 가면을 다시 쓰고, 거대한 검을 들어 올린다.

"오르벤은 너를 숨기고 사랑했지. 나는 버려지고 단련됐다. 같은 피, 다른 운명. 오늘 그 피를 하나로 합치겠다, 형제여."${f.tamoko_gone?'':'\n\n그의 곁에 린세가 칼을 뽑아 든다. 그녀의 눈이 젖어 있다.'}`,
 combat:f=>({enemies:[boss('모르데인',6,{hp:95,ac:17,dmg:'2d6+4'}),elite('모르데인의 마법사 카덴',6,{hp:30,ac:12})].concat(f.tamoko_gone?[]:[elite('린세',6,{hp:35,ac:15})]),win:'b1_end'})},
b1_end:{title:'에필로그',ending:'win',onEnter:{gold:500},text:`모르데인이 무릎을 꿇는다. 늑대 가면이 떨어져 돌바닥을 굴러간다. 그의 몸에서 검붉은 기운이 빠져나와 신전 바닥으로 스며든다. 마지막 순간 그는 웃는 것도 우는 것도 아닌 얼굴로 중얼거린다.

<i>"…아버지는… 끝내 나를 보지 않는군. 이것이 끝이 아니다, 형제여."</i>

며칠 뒤, 발더스 게이트는 당신을 영웅으로 맞는다. 엘레노어 공작은 해독제로 회복하고, 앰과의 전쟁은 없던 일이 된다. 사람들은 당신의 이름을 노래한다. 당신 핏속의 비밀을 아는 이는 몇 되지 않는다.

티오는 마침내 발더스 게이트 전체 지도를 완성해 당신에게 선물한다. 지도 한구석에 작게 적혀 있다. <i>"우리가 지킨 도시."</i>

그날 밤, 축하연이 끝나고 일행과 함께 여관으로 돌아가는 길. 골목의 그림자가 이상하게 짙다. 누군가 당신의 이름을 부른다. 그리고 세상이 어두워진다.

<b>— 발더스 게이트 1 완료 · 이야기는 2편 「앰의 그림자」로 이어집니다 —</b>`}
}});

/* ===== BG1 확장: 사이드 퀘스트 + 야영지 대화 (오리지널 인물) ===== */
addNodes('bg1',{
/* 1장 · 여관 지하실의 망령 */
b1_ghost:{title:'우정의 팔 여관 지하실',scene:'dungeon',who:['alaric'],text:`여관 주인이 난처한 얼굴로 다가온다. "손님들, 혹시 용감하신 분들이면… 지하실에서 밤마다 쇠사슬 끄는 소리가 납니다. 술통을 꺼내러 간 일꾼이 하얗게 질려서 나왔어요."

지하실 계단을 내려가자 공기가 얼음장처럼 차가워진다. 녹슨 갑옷을 입은 반투명한 형체가 빈 술통 위에 앉아 있다. 그는 고개를 들지 않은 채 중얼거린다.

<i>"…편지를… 전하지 못했어. 엘리야에게… 돌아가겠다고 약속했는데."</i>`,
 choices:[{t:'두려워하지 않고 망령에게 말을 건다',check:{skill:'종교',dc:12,ok:'b1_ghost_talk',fail:'b1_ghost_fight'}},{t:'"무슨 편지지?" 하고 주위를 살핀다',check:{skill:'조사',dc:12,ok:'b1_ghost_talk',fail:'b1_ghost_fight'}},{t:'무기를 뽑는다',go:'b1_ghost_fight'}]},
b1_ghost_fight:{title:'여관 지하실',scene:'dungeon',who:['alaric'],text:`망령이 고개를 번쩍 든다. 텅 빈 눈에서 푸른 불꽃이 타오른다. "너희도… 날 막으러 왔구나!" 술통들이 덜컹거리며 바닥에서 해골 두 구가 기어 나온다.`,
 combat:{enemies:[elite('원한 맺힌 망령',3,{hp:22,ac:11}),mob('해골',3,{hp:8,n:2})],win:'b1_ghost_calm'}},
b1_ghost_calm:{title:'여관 지하실',scene:'dungeon',who:['alaric'],text:`흩어지던 망령이 다시 형체를 모은다. 분노는 사라지고 지친 얼굴만 남았다.

"…미안하다. 오래 혼자 있다 보니, 내가 누군지도 잊고 있었구나."`,choices:[{t:'그의 이야기를 듣는다',go:'b1_ghost_talk'}]},
b1_ghost_talk:{title:'여관 지하실',scene:'dungeon',who:['alaric'],onEnter:{set:{ghost:1},loot:'t_ring',gold:25},text:`망령의 이름은 알라릭. 삼십 년 전 이 여관에서 묵던 용병이었다. 첫 아이가 태어났다는 소식을 듣고 집에 돌아가려던 밤, 도적에게 습격당해 지하실에서 숨을 거뒀다.

술통 뒤 돌벽 틈에서 누렇게 바랜 편지와 작은 반지가 나온다. <i>"엘리야, 이번 일만 끝나면 돌아갈게. 반지는 우리 아이에게."</i>

"엘리야는… 이미 오래전에 세상을 떴겠지." 알라릭이 희미하게 웃는다. "그 반지는 네가 가져가라. 누군가를 지키는 데 쓰인다면 그걸로 됐다."

망령이 빛 속으로 흩어진다. 라스가 코를 크게 훌쩍인다. "누, 누가 지하실에 양파 썰었어?"`,choices:[{t:'여관으로 올라간다',go:'b1_jaheira'}]},
/* 2장 · 갈렌 대장의 저주받은 검 */
b1_brage:{title:'나시켈 언덕',scene:'road',who:['galen'],text:`마을 경비병 하나가 다가와 목소리를 낮춘다. "우리 대장, 갈렌 님이 미쳤어요. 사흘 전 떠돌이 상인한테 검을 하나 사셨는데… 그날 밤, 가족을…" 경비병이 말을 잇지 못한다.

"지금은 남쪽 언덕 폐가에 숨어 계세요. 현상금이 붙었지만, 전 믿을 수가 없어요. 그분은 그런 사람이 아니었어요."

언덕 위 폐가. 문틈으로 붉은 빛이 새어 나온다. 안에서 한 남자가 검을 끌어안고 흐느끼고 있다. 검날이 맥박처럼 붉게 뛴다.`,
 choices:[{t:'검을 자세히 살핀다',not:['brage_look'],set:{brage_look:1},check:{skill:'비전',dc:12,ok:'b1_brage_curse',fail:'b1_brage'}},
  {t:'"갈렌, 그 검을 내려놓으시오."',check:{skill:'설득',dc:f=>f.brage_curse?11:15,ok:'b1_brage_save',fail:'b1_brage_fight'}},
  {t:'검을 빼앗으려 달려든다',go:'b1_brage_fight'}]},
b1_brage_curse:{title:'나시켈 언덕',scene:'road',onEnter:{set:{brage_curse:1}},text:`검 손잡이에 새겨진 문양이 꿈틀거린다. 주인의 분노를 먹고 자라는 저주받은 검이다. 갈렌은 살인자가 아니라 피해자다.

브렌나가 속삭인다. "검과 그를 떼어놓으면 아직 구할 수 있을지도 몰라."`,choices:[{t:'다시 그에게 다가간다',go:'b1_brage'}]},
b1_brage_fight:{title:'폐가',scene:'road',who:['galen'],text:`갈렌이 비명을 지르며 일어선다. 그의 눈이 검날과 같은 붉은색이다. "가까이 오지 마! 이 검이… 이 검이 시키는 거야!"`,
 combat:{enemies:[elite('저주받은 갈렌',4,{hp:40,ac:16})],win:'b1_brage_end'}},
b1_brage_end:{title:'폐가',scene:'road',onEnter:{set:{brage_done:1},gold:60,loot:'w_keen'},text:`갈렌이 쓰러지는 순간 검이 손에서 떨어진다. 붉은빛이 꺼지고, 그는 잠시 맑은 눈으로 천장을 바라본다.

"…고맙소. 이제야… 내 아이들 얼굴이 생각나는군."

그는 숨을 거둔다. 검은 녹슨 쇳덩이로 바스러지고, 그 아래에서 그가 원래 차던 단검이 나온다. 경비병들이 시신을 마을로 옮긴다. 아무도 현상금 이야기를 꺼내지 않는다.`,choices:[{t:'나시켈로 돌아간다',go:'b1_nashkel'}]},
b1_brage_save:{title:'폐가',scene:'road',who:['galen'],onEnter:{set:{brage_saved:1},gold:120,potions:1},text:`당신은 천천히, 아주 천천히 다가가 그의 손등에 손을 얹는다. "그건 당신 탓이 아니오."

갈렌의 손가락이 하나씩 풀린다. 검이 바닥에 떨어지는 순간 날카로운 비명과 함께 산산조각 난다. 그는 아이처럼 울기 시작한다.

며칠 뒤, 그는 나시켈 신전에 스스로를 맡긴다. 그의 남은 부하들이 모은 돈을 당신에게 내민다. "대장님을 살려줘서, 고맙습니다."

라스가 드물게 조용히 말한다. "누군가를 구한다는 건… 이런 거구나. 방패로 막는 것보다 어렵네."`,choices:[{t:'나시켈로 돌아간다',go:'b1_nashkel'}]},
/* 3장 · 우리에 갇힌 음유시인 */
b1_bard:{title:'도적 소굴',scene:'camp',who:['rinel'],text:`천막 뒤편, 나무 우리 안에서 누군가 흥얼거린다. 금발을 길게 늘어뜨린 반엘프 음유시인이다. 귀 뒤에 꽃을 꽂았다. 류트 줄은 다 끊어졌는데도 손가락으로 박자를 맞추고 있다.

"오, 드디어 관객이! 리넬이라고 합니다. 도적들 앞에서 그들을 놀리는 노래를 불렀더니 이렇게 됐지 뭐요. 꺼내주시면 은혜는 노래로 갚겠소."`,
 choices:[{t:'자물쇠를 딴다',check:{skill:'손재주',dc:12,ok:'b1_bard_free',fail:'b1_bard_break'}},{t:'창살을 부순다',go:'b1_bard_break'}]},
b1_bard_break:{title:'도적 소굴',scene:'camp',onEnter:{dmg:'1d6'},text:`우지끈! 창살을 비틀다 손이 찢긴다. 그래도 우리가 열린다.`,choices:[{t:'리넬을 꺼낸다',go:'b1_bard_free'}]},
b1_bard_free:{title:'도적 소굴',scene:'camp',who:['rinel'],onEnter:{set:{bard:1},heal:'full',loot:'t_tongue'},text:`리넬이 기지개를 켜며 은빛 브로치를 건넨다. "공연료로 받은 건데, 말솜씨가 늘어난다는 소문이 있소."

그리고 그가 진지한 얼굴로 말한다. "모르데인이라는 이름을 쫓는다지요? 나는 그 남자를 노래로 지은 적이 있소. 철의 왕좌 수장 베일란 크로스가 어린 고아를 데려다 싸움만 가르쳤다더군. 칭찬 한마디 없이. 그 아이는 어릴 때 불에 덴 얼굴을 가리려고 늑대 가면을 쓰기 시작했고, 자라서는 자기 피 속 '아버지'의 목소리만 듣게 됐소."

그는 끊어진 류트로 짧은 노래를 부른다. 오르벤이라는 늙은 서고지기와, 그가 지키려 한 아이에 대한 노래다. 이상하게 상처가 아물고 힘이 차오른다.`,choices:[{t:'천막으로 돌아간다',go:'b1_docs_back'}]},
b1_docs_back:{title:'그락쉬의 천막',scene:'camp',text:`리넬은 손을 흔들며 숲으로 사라진다. "언젠가 당신 노래도 부르겠소!" 이제 클록우드로 향할 시간이다.`,choices:[{t:'클록우드 숲으로 간다',go:'b1_cloak'}]},
/* 4장 · 도둑 길드의 비밀 통로 */
b1_guild:{title:'발더스 게이트 도둑 길드',scene:'sewer',who:['mira','tio'],text:`티오가 낡은 서점 뒷문을 세 번, 두 번 두드린다. "캔들킵 서고에 몰래 희귀본 팔러 오던 아줌마가 있었거든. 나랑 친했어. 할아버지한텐 비밀."

지하로 내려가자 횃불 아래 도둑들이 주사위를 굴리고 있다. 붉은 단발의 길드장 미라가 눈썹을 치켜든다. "고글 꼬맹이 티오? 많이 컸네. 그래, 무슨 일이야?"

철의 왕좌 본부로 들어가는 비밀 통로가 있다고 한다. 하지만 공짜는 없다. "항구의 탐욕스러운 환전상 금고에서 장부 하나만 가져와. 우리 식구들 빚이 적힌 장부거든."`,
 choices:[{t:'환전상의 금고를 턴다',check:{skill:'손재주',dc:13,ok:'b1_guild_ok',fail:'b1_guild_fight'}},{t:'티오에게 맡긴다',req:['party:tio'],go:'b1_guild_ok'},{t:'관두고 나간다',go:'b1_c4'}]},
b1_guild_fight:{title:'환전상의 금고',scene:'city',text:`자물쇠가 비명을 지른다. 환전상의 사설 경비들이 몰려온다!`,combat:{enemies:[mob('사설 경비',6,{n:2})],win:'b1_guild_ok'}},
b1_guild_ok:{title:'발더스 게이트 도둑 길드',scene:'sewer',who:['mira'],onEnter:{set:{guild_pass:1},loot:'phoenix'},text:`장부를 받아 든 미라가 깔깔 웃는다. "좋아, 약속은 약속이지." 그녀가 붉은 깃털 하나를 던져준다. "덤이야. 죽을 뻔할 때 쓰면 한 번은 살려준대."

티오가 의기양양하게 당신 옆구리를 찌른다. "봤지? 서고지기 인맥 무시하지 마."`,choices:[{t:'비밀 통로로 철의 왕좌 본부에 잠입한다',go:'b1_throne_roof'},{t:'일단 거리로 나간다',go:'b1_c4'}]}
});

talks('bg1',{
 0:{tio:`모닥불이 타닥거린다. 티오가 무릎 위에 지도를 펼쳐 놓고, 오늘 걸은 길을 꼼꼼히 그려 넣는다.

"나 캔들킵 밖으로 이렇게 멀리 나온 거 처음이야. 지도로는 수백 번 가봤는데, 진짜 길은 냄새가 나더라. 풀 냄새, 연기 냄새…"

펜이 멈춘다. "오르벤 할아버지가 나한테 처음 펜을 쥐여줬어. 고아원에서 데려와서, '세상을 그려봐라' 하면서. 그래서 지도를 그리기 시작한 거야."

그가 고글을 이마로 올리고 당신을 본다. "…그러니까 너 혼자 슬퍼하지 마. 할아버지는 나한테도 할아버지였다고."`,
  brenna:`브렌나는 작은 주전자에 물을 올리고, 찻잎을 정확히 세 숟가락 넣는다. 하나도 더 넣지도 덜 넣지도 않는다.

"오르벤은 내가 하퍼에 처음 들어왔을 때 스승이었다. 드워프가 치유사가 되겠다고 하니까 다들 웃었지. 그 영감만 안 웃었어."

그녀가 찻잔 하나를 당신 앞에 놓는다. "마셔라. 쓰다. 원래 쓴 거다. 나는 너를 엄하게 대할 거다. 그 영감이 자랑하던 아이가 헛소리가 아니었다는 걸 증명해 봐라."`,
  ras:`라스가 당신 옆에 털썩 앉는다. 갑옷이 쩔그럭거린다.

"누나가 무섭지? 저 사람은 걱정될수록 차를 진하게 끓여. 오늘 차, 엄청 진했다. 무지 걱정하고 있다는 뜻이야. 하하!"

그가 수염 끝의 매듭을 만지작거린다. "나는 싸울 때 노래를 불러. 무서우면 목소리가 커지거든. 그러니까 내가 노래를 크게 부르면… 음, 비밀로 해 줘."`},
 1:{tio:`티오가 광산 먼지를 털며 투덜댄다. "코볼드는 왜 이렇게 냄새가 나? 지도에 '냄새 주의' 표시해야겠어."

그러다 목소리를 낮춘다. "그 점쟁이 할머니가 한 말 있잖아. 오래된 신의 피라고… 너 무섭지 않아?"

"…난 신경 안 써. 네가 무슨 피를 갖고 있든, 서고에서 같이 금지 서적 몰래 읽다 혼나던 그 애잖아. 그거면 됐어."`,
  brenna:`"광산에서 본 그 푸른 가루." 브렌나가 지도 위 나시켈을 짚는다. "드워프에게 철은 피와 같다. 대지의 뼈지. 그걸 이렇게 썩게 만드는 놈들은 용서할 수 없다."

그녀가 찻잔 너머로 당신을 본다. "오늘 넌 앞장서서 싸웠다. 오르벤이라면… 아마 차를 한 잔 더 따라줬을 거다." 그녀가 당신의 잔을 다시 채운다.`,
  ras:`라스가 갈렌 대장 이야기를 꺼낸다. "그 검 말이야. 무서웠어. 강해지고 싶은 마음이 사람을 그렇게 만들 수 있다는 게."

"나도 강해지고 싶었거든. 누나를 지킬 수 있을 만큼. 근데 이제 알 것 같아. 진짜 강한 건 칼이 아니라… 옆에 있는 사람이 쓰러질 때 손을 내미는 거라는 거."

그가 쑥스러운 듯 큰 소리로 웃는다. "이거 노래 가사로 쓰면 좋겠다!"`,
  korva:`코르바가 정체불명의 스튜를 당신 그릇에 퍼 준다. 보라색이다.

"투기장에선 열두 해 동안 사람을 쓰러뜨려서 박수를 받았다. 이제는 그게 싫다. 그래서 요리를 배운다. 요리는 사람을 일으키니까." 그녀가 눈을 가늘게 뜬다. "먹어라. 맛은 묻지 말고."

그녀가 앞치마에 수놓은 시를 가리킨다. "내가 처음 쓴 시다. '부서진 것도 끓이면 국이 된다.' …셀렌은 이게 시가 아니라 요리법이라고 하더군."`,
  selen:`셀렌이 모닥불에서 조금 떨어져 별을 올려다본다.

"놀들에게 붙잡혀 있을 때 별자리를 읽었습니다. 핏빛 별 하나가 검은 강을 건너는 모습이었죠. 그 별 곁에 작은 별들이 모여들더군요. 당신과, 이 시끄러운 일행 말입니다."

그가 코르바 쪽을 보며 웃는다. "저 사람은 제게 빚을 졌다고 따라다니지만, 사실 빚진 쪽은 저입니다. 저 사람 덕분에 혼자 별을 보지 않아도 되니까요."`},
 2:{tio:`"모르데인이라는 사람 말야." 티오가 나뭇가지로 모닥불을 쑤신다. "리넬이 부른 노래, 계속 생각나. 아무도 칭찬 안 해준 고아였다고. 불에 덴 얼굴을 가리려고 가면을 썼다고."

"너랑 나도 고아잖아. 근데 우린 오르벤 할아버지가 있었지. 그 사람은 아무도 없었고." 그가 고개를 젓는다. "그렇다고 용서할 순 없지만. 그냥… 좀 슬퍼."`,
  brenna:`브렌나가 이바르의 일지를 덮는다. "철 독점, 전쟁 유발. 교과서 같은 폭정의 수법이다. 하퍼가 수백 년간 막아온 것들이지."

"하지만 이번엔 다르다. 놈은 너와 같은 피를 가졌다. 너는 놈이 어떻게 생각하는지 이해할 수 있겠지." 그녀가 안경을 고쳐 쓰며 당신의 눈을 똑바로 본다. "이해하되, 닮지는 마라."`,
  ras:`라스가 노예들이 풀려나던 광산을 떠올린다. "그 드워프 할아버지, 릴. 마지막에 내 손을 잡고 우는 거 봤어?"

"나는 평생 누나 뒤를 따라다니는 덩치였어. 근데 오늘은 처음으로… 내 노래가 누군가의 사슬을 끊었어." 그가 쑥스럽게 웃는다. "누나한텐 비밀이야. 잘난 척한다고 혼나."`,
  korva:`"수문이 열릴 때 무서웠다." 코르바가 당당하게 고백한다. "물은 주먹으로 칠 수가 없다. 하지만 너를 건졌다."

그녀가 큰 손으로 당신 어깨를 툭 친다. "투기장에서 배운 게 하나 있다. 관중이 아무리 야유해도, 끝까지 서 있는 놈이 이긴다. 너는 끝까지 서 있을 놈이다. 내 시에 쓰마."`,
  selen:`셀렌이 당신의 손을 들여다본다. "당신 안의 힘이 커지고 있습니다. 싸울 때마다 조금씩. 느껴지십니까?"

"힘 자체는 선도 악도 아닙니다. 별처럼요. 하지만 바알의 힘은 피를 원합니다. 그 갈증이 올 때, 오늘 구한 노예들의 얼굴을 떠올리십시오. 그것이 당신을 붙잡아줄 닻이 될 겁니다."`},
 3:{tio:`축하연이 끝난 밤. 티오가 당신 옆에 털썩 앉는다.

"우리가 해냈어. 진짜로. 캔들킵 서고의 꼬맹이 둘이서 발더스 게이트를 구했다고!"

그러다 조용해진다. "…있잖아. 나 요즘 이상한 꿈을 꿔. 피 웅덩이 같은 거. 혹시 나도… 아냐, 그냥 너무 피곤해서 그런가 봐. 잊어버려."

그가 억지로 웃으며 고글을 내려쓴다. 고글 너머 눈이 보이지 않는다.`,
  brenna:`브렌나가 오랜만에 안경을 벗고 땋은 머리를 푼다.

"오르벤에게 맹세했었다. 너를 끝까지 지키겠다고. 오늘에야 그 맹세를 지킨 것 같군."

그녀가 라스 쪽을 보며 희미하게 웃는다. "이 일이 끝나면 저 녀석과 산속 고향에 돌아가 조용한 찻집이나 할까 했지. …하지만 하퍼의 일은 끝나지 않아. 너의 일도 마찬가지일 테고."`,
  ras:`"우리 다음엔 어디 갈까?" 라스가 들뜬 얼굴이다. "누나는 앰에 가보고 싶대. 거기 찻잎이 그렇게 좋대."

"너도 같이 가자. 이젠 너 없는 여행은 상상이 안 돼." 그가 잔을 든다. "오르벤 영감을 위해! 그리고 우리를 위해!" 그가 노래를 시작한다. 이번엔 무서워서 부르는 노래가 아니다.`,
  korva:`코르바가 오늘을 위해 특별히 만들었다는 케이크를 내민다. 반쯤 탔다.

"너에게 시를 하나 썼다." 그녀가 헛기침을 한다. "'피는 강이다. 하지만 배는 네가 젓는다.' …셀렌은 이번엔 괜찮다더군."

그녀가 당신을 와락 끌어안는다. 숨이 막힌다. "나는 친구가 많지 않았다. 투기장엔 적만 있으니까. 너는 내 첫 번째 친구다."`,
  selen:`셀렌이 별을 본다. 표정이 어둡다.

"모르데인은 끝이 아닙니다. 바알의 자식은 당신 하나만이 아니에요. 수십, 어쩌면 수백. 그들 모두가 같은 꿈을 꾸고 있을 겁니다."

그가 당신을 본다. "하지만 오늘 당신은 증명했습니다. 피는 운명이 아니라는 걸. 별은 길을 보여줄 뿐, 걷는 건 당신입니다. 그걸 잊지 마십시오."`}
});
