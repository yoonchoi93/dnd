 chapters:[{title:'노틸로이드와 숲',start:'b3_start'},{title:'부서진 성소',start:'b3_c2'},{title:'그림자 저주의 땅',start:'b3_c3'},{title:'왕관의 세 주인',start:'b3_c4'}],
 nodes:{
/* ---------- 1장: 노틸로이드와 숲 (Lv4) ---------- */
b3_start:{title:'노틸로이드',text:`살덩이로 된 벽이 숨을 쉰다. 당신은 끈적한 포드 안에서 눈을 뜬다.

기억나는 건 하나뿐이다. 촉수 달린 얼굴, 마인드 플레이어. 그리고 눈알 속으로 기어들던 작은 올챙이.

포드가 터지듯 열린다. 창밖으로 불타는 하늘과 날아다니는 용들이 보인다. 이 배는 지옥, 아베르누스를 날고 있다.

머릿속 깊은 곳에서 무언가가 꿈틀거린다. 며칠 뒤면 당신도 촉수 달린 괴물이 될 것이다.`,
 choices:[{t:'일어나서 복도를 나선다',go:'b3_laezel'}]},
b3_laezel:{title:'노틸로이드 복도',text:`복도 끝에서 노란 피부의 여전사가 임프들과 싸우고 있다. 기스양키다.

"멍하니 서 있지 말고 칼이나 들어라, 이스틱!" 그녀가 외친다. "너도 올챙이가 박혔지? 그럼 같은 처지다. 일단 살아남자."`,combat:{enemies:[mob('임프',4,{hp:10,n:3})],allies:[{name:'라에젤',hp:40,ac:17,atk:6,dmg:'1d10+3'}],win:'b3_pod'}},
b3_pod:{title:'노틸로이드',onEnter:{join:'laezel'},text:`임프들이 쓰러지자 여전사가 칼을 털어낸다. "라에젤이다. 이 배의 조타실로 가서 이 지옥을 빠져나간다."

복도 벽의 포드 하나에서 누군가 두드린다. "거기 누구 있어요? 꺼내줘요!" 여자 목소리다.

라에젤이 코웃음 친다. "약한 자는 버려라."`,
 choices:[{t:'포드를 연다',join:'shadowheart',go:'b3_shadow'},{t:'라에젤 말대로 지나친다',go:'b3_helm'}]},
b3_shadow:{title:'노틸로이드',text:`포드가 열리고 검은 머리의 하프엘프가 굴러 나온다. 그녀는 가슴에 무언가를 꼭 안고 있다. 이상한 문양이 새겨진 유물이다.

"섀도하트예요. 고마워요. 치유 주문을 쓸 줄 아니 쓸모는 있을 거예요." 그녀는 유물을 재빨리 숨긴다.`,choices:[{t:'조타실로 서두른다',go:'b3_helm'}]},
b3_helm:{title:'조타실',text:`조타실. 날개 달린 악마 캠비온이 마인드 플레이어와 싸우고 있다. 함선의 뇌에 연결된 신경 다발이 번쩍인다.

라에젤이 외친다. "신경을 끊으면 배가 추락한다! 하지만 이대로면 우린 다 끝장이야!"

캠비온이 당신을 돌아본다. "벌레들이 기어왔군."`,
 choices:[{t:'신경 다발을 끊어 배를 추락시킨다',check:{skill:'비전',dc:12,ok:'b3_crash',fail:'b3_helm_fight'}},{t:'캠비온과 싸운다',go:'b3_helm_fight'}]},
b3_helm_fight:{title:'조타실',text:`캠비온 잘크가 불타는 대검을 휘두른다!`,combat:{enemies:[elite('캠비온 잘크',4,{hp:34})],win:'b3_crash'}},
b3_crash:{title:'추락',onEnter:{dmg:'1d6',loot:'u_zhalk'},text:`신경이 끊기는 순간 함선이 비명을 지르며 기운다. 지옥의 하늘이 소드 코스트의 하늘로 바뀌고, 땅이 빠르게 다가온다.

…눈을 뜨니 바닷가다. 사방에 함선의 잔해가 불타고 있다.

머리가 아프다. 그런데 이상하다. 올챙이는 아직 그대로인데 변신이 시작되지 않는다.`,
 choices:[{t:'생존자를 찾는다',go:'b3_astarion'}]},
b3_astarion:{title:'해변',text:`잔해 사이에서 은발의 엘프 남자가 손을 흔든다. "이봐, 저기 마인드 플레이어가 아직 살아 있어! 도와줘!"

당신이 다가가는 순간, 그가 뒤에서 덮쳐 목에 칼을 들이댄다. "미안, 확인할 게 있어서. 너도 그 벌레 박혔지?"`,
 choices:[{t:'몸을 비틀어 빠져나온다',check:{skill:'곡예',dc:12,ok:'b3_astar_ok',fail:'b3_astar_cut'}},{t:'"우린 같은 처지야. 칼 내려."',check:{skill:'설득',dc:12,ok:'b3_astar_ok',fail:'b3_astar_cut'}}]},
b3_astar_cut:{title:'해변',onEnter:{dmg:'1d4+2'},text:`칼날이 목을 살짝 긋는다. 그 순간, 둘의 올챙이가 공명하며 서로의 머릿속이 섞인다. 그는 당황해 칼을 거둔다.`,choices:[{t:'일어선다',go:'b3_astar_ok'}]},
b3_astar_ok:{title:'해변',onEnter:{join:['astarion','gale']},text:`"아스타리온이야. 하이엘프에, 귀족에… 뭐 그런 거. 같이 다니자고. 혼자보단 낫겠지."

근처에서 푸른 빛의 마법진이 일렁이더니 손 하나가 튀어나온다. "어, 실례지만! 누가 좀 당겨주겠소?" 당신이 끌어내자 수염 난 마법사가 엉덩방아를 찧는다.

"게일이오. 워터딥의 게일. 고맙소. 여러분도 같은 벌레 동지인가 보군. 들어보니 근처 숲에 드루이드 치유사가 있다던데."

동료가 많아졌다. 함께 싸울 동료는 '동료 편성'에서 고를 수 있다.`,
 choices:[{t:'드루이드의 숲으로 간다',go:'b3_gate'}]},
b3_gate:{title:'에메랄드 숲 정문',text:`숲 속 드루이드 은신처의 정문. 고블린 떼가 화살을 퍼붓고 있다! 문 위에서 붉은 외투에 한쪽 눈이 돌로 된 남자가 혼자 고블린들을 막아내고 있다.

"지원군인가? 고맙소! 오른쪽을 맡아주시오!"`,combat:{enemies:[mob('고블린',4,{hp:12,n:3}),elite('워그 기수',4,{hp:28})],win:'b3_grove'}},
b3_grove:{title:'에메랄드 숲',onEnter:{join:'wyll'},text:`고블린들이 퇴각한다. 붉은 외투의 남자가 고개를 숙인다.

"윌이오. 사람들은 '국경의 칼날'이라 부르지." 그는 숲 안에 피난 온 티플링 난민들을 지키는 중이었다.

숲 안은 어수선하다. 드루이드들은 의식을 준비하고, 난민들은 쫓겨날까 두려워한다. 그리고 꼬마 아라벨라가 드루이드의 성물을 훔쳤다가 붙잡혀 있다.`,
 choices:[{t:'아라벨라를 변호한다',not:['arabella'],set:{arabella:1},check:{skill:'설득',dc:13,ok:'b3_ara_ok',fail:'b3_ara_fail'}},{t:'치유사를 찾는다',go:'b3_nettie'}]},
b3_ara_ok:{title:'에메랄드 숲',onEnter:{set:{ara_saved:1},potions:1},text:`드루이드 카가가 마지못해 아이를 풀어준다. "다음은 없다." 아라벨라의 부모가 눈물을 흘리며 물약 하나를 건넨다.`,choices:[{t:'치유사를 찾는다',go:'b3_nettie'}]},
b3_ara_fail:{title:'에메랄드 숲',text:`카가는 꿈쩍도 하지 않는다. 하지만 당신이 시간을 끄는 사이, 아이는 몰래 풀려나 달아난다. 카가가 당신을 노려본다.`,choices:[{t:'치유사를 찾는다',go:'b3_nettie'}]},
b3_nettie:{title:'치유사의 오두막',text:`견습 치유사 네티가 당신의 눈을 들여다보다 얼굴이 굳는다.

"이런 건… 내 힘으로는 못 고쳐요. 우리 대 드루이드 할신님이라면 모를까. 그런데 할신님은 고블린 소굴을 정찰하러 가셨다가 돌아오지 않으셨어요."

그녀가 지도를 펼친다. "고블린들은 언덕 위 부서진 성소에 진을 쳤어요. 그들의 지도자들은 '절대자'라는 존재를 섬긴대요."`,
 choices:[{t:'티플링 행상인에게 들른다',go:'b3_shop1'},{t:'모두 모닥불 가에 모인다',go:'b3_c1_end'}]},
b3_shop1:{title:'티플링 행상인',shop:'b3_grove',text:`난민 행상인 아론이 수레를 펼친다. "피난길에 챙긴 것들이에요. 싸게 드릴게요. 우릴 지켜주셨으니까."`,choices:[{t:'돌아간다',go:'b3_nettie'}]},
b3_c1_end:{title:'1장 끝',chapterEnd:true,text:`첫날 밤. 숲 밖에 피운 모닥불 주위로 낯선 동료들이 둘러앉는다. 모두 머릿속에 같은 벌레를 품고 있다.

잠이 들자 꿈을 꾼다. 금빛 피부의 아름다운 형상이 손을 내민다.

<i>"두려워하지 마라. 나는 너를 지키고 있다. 올챙이의 힘을 써라. 그것이 너를 구할 것이다."</i>

깨어나니 동료들도 같은 꿈을 꿨다고 한다. 각자에게 다른 얼굴로 나타난 '수호자'.`}
,
/* ---------- 2장: 부서진 성소 (Lv5) ---------- */
b3_c2:{title:'강가',text:`성소로 가는 길, 강가에서 비명이 들린다. 붉은 피부에 뿔이 난 거구의 티플링 여자가 갑옷 입은 기사 셋에게 둘러싸여 있다.

윌의 얼굴이 굳는다. "카를라크. 내 계약 악마가 처단하라고 명령한 '악마'다."

여자가 손을 든다. "잠깐! 칼 내려! 난 악마가 아니라고! 지옥에서 겨우 도망친 거야!"`,
 choices:[{t:'그녀의 말을 들어본다',check:{skill:'통찰',dc:12,ok:'b3_karlach_talk',fail:'b3_paladins'}},{t:'기사들 편에 선다',go:'b3_paladins'}]},
b3_karlach_talk:{title:'강가',text:`그녀의 눈에서 거짓을 찾을 수 없다. "나는 지옥의 전쟁에서 싸우던 노예였어. 내 심장을 불타는 엔진으로 바꿔버렸지. 날 거기 팔아넘긴 놈이 발더스 게이트에 있어."

그 순간 기사들이 칼을 뽑는다. 그들의 갑옷 아래로 악마의 문양이 비친다. 윌의 계약 악마가 보낸 자들이다! 윌이 이를 악문다. "…속았군."`,combat:{enemies:[mob('지옥의 기사',5,{n:3})],win:'b3_karlach'}},
b3_paladins:{title:'강가',text:`기사들과 함께 다가가자, 그들의 갑옷 아래로 악마의 문양이 비친다. 기사들이 당신에게도 칼을 겨눈다! "목격자는 모두 죽여라!"

카를라크가 도끼를 들고 당신 옆에 선다. "어이, 일단 같이 싸우자고!"`,combat:{enemies:[mob('지옥의 기사',5,{n:3})],win:'b3_karlach'}},
b3_karlach:{title:'강가',onEnter:{join:'karlach'},text:`카를라크가 크게 웃으며 당신을 껴안는다. 뜨겁다. 정말로 몸에서 열이 난다.

"고마워, 친구! 나도 올챙이 박혔어. 같이 다니자! 아, 그리고 날 아베르누스에 팔아넘긴 놈의 이름은 <b>고르타시</b>야. 언젠가 꼭 갚아줄 거야."

윌이 그녀에게 고개를 숙인다. "사과하오. 나도 속은 거였소."`,
 choices:[{t:'부서진 성소로 향한다',go:'b3_village'}]},
b3_village:{title:'황폐한 마을',text:`성소 가는 길의 폐허 마을. 마을 끝 찻집에서 친절한 노파가 차를 권한다. "고생이 많지? 올챙이도 고쳐줄 수 있단다."

아스타리온이 속삭인다. "저 할머니, 냄새가 수상해. 너무 달콤해."`,
 choices:[{t:'노파의 정체를 꿰뚫어 본다',check:{skill:'비전',dc:13,ok:'b3_hag',fail:'b3_hag_trick'}},{t:'무시하고 성소로 간다',go:'b3_sanctum'}]},
b3_hag_trick:{title:'찻집',onEnter:{dmg:'2d6'},text:`차를 한 모금 마시자 속이 뒤집힌다! 노파의 피부가 초록빛으로 변하고 손톱이 길어진다. 마녀, 해그다!`,combat:{enemies:[elite('해그 에델 할멈',5,{hp:45})],win:'b3_hag_win'}},
b3_hag:{title:'찻집',text:`노파의 그림자가 사람의 것이 아니다. 당신이 꿰뚫어 보자 노파가 웃는다. "눈이 좋구나, 얘야." 그녀의 모습이 녹색 마녀로 변한다.`,combat:{enemies:[elite('해그 에델 할멈',5,{hp:38})],win:'b3_hag_win'}},
b3_hag_win:{title:'찻집',onEnter:{potions:2,gold:60,loot:'u_hag'},text:`해그가 비명을 지르며 연기로 사라진다. 찻집 지하에서 그녀에게 납치됐던 마을 여인과 약초 물약들을 찾는다.`,choices:[{t:'부서진 성소로',go:'b3_sanctum'}]},
b3_sanctum:{title:'부서진 성소',text:`언덕 위 옛 사원. 고블린들이 우글거린다. 정문의 고블린 경비가 당신 눈을 보더니 멈칫한다.

"너… 너도 낙인이 있네? '진정한 영혼'이야?" 올챙이가 머릿속에서 꿈틀거린다. 그들은 당신을 동족으로 착각하고 있다.`,
 choices:[{t:'"그래. 절대자를 섬기는 진정한 영혼이다."',check:{skill:'기만',dc:12,ok:'b3_inside',fail:'b3_sanctum_fight'}},{t:'올챙이의 힘으로 그의 정신을 짓누른다',check:{skill:'위협',dc:13,ok:'b3_inside',fail:'b3_sanctum_fight'}},{t:'정면 돌파',go:'b3_sanctum_fight'}]},
b3_sanctum_fight:{title:'부서진 성소',text:`"가짜다! 죽여!" 고블린들이 몰려온다.`,combat:{enemies:[mob('고블린 전사',5,{n:3}),mob('고블린 궁수',5,{hp:16})],win:'b3_inside'}},
b3_inside:{title:'성소 내부',text:`성소 안에는 세 지도자가 있다. 홉고블린 사제 거트, 고블린 두목 드로르 래그즐린, 그리고 드로우 전사 민타라.

지하 감옥에서 곰 울음소리가 들린다. 곰으로 변신한 채 갇힌 대 드루이드 할신이다.`,
 choices:[{t:'몰래 지하 감옥의 할신을 풀어준다',not:['halsin'],set:{halsin:1},check:{skill:'은신',dc:14,ok:'b3_halsin',fail:'b3_halsin_fight'}},
  {t:'구석에서 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r32'],set:{r32:1},rest:1,go:'b3_inside'},
  {t:'두목 드로르 래그즐린의 왕좌로 쳐들어간다',go:'b3_dror'}]},
b3_halsin:{title:'지하 감옥',onEnter:{set:{halsin_free:1}},text:`자물쇠가 풀리자 거대한 곰이 사람으로 변한다. 근육질의 엘프, 할신이다.

"구해줘서 고맙네. 그 벌레들 말이네만… 내가 보기엔 이미 몇 번이고 변했어야 했어. 뭔가 너희를 지키고 있어. 무엇인지는 모르겠지만." 그가 주먹을 쥔다. "두목과 싸운다면 함께하겠네."`,choices:[{t:'두목의 왕좌로',go:'b3_dror'}]},
b3_halsin_fight:{title:'지하 감옥',text:`간수가 눈치챘다! "탈옥이다!"`,combat:{enemies:[mob('고블린 간수',5,{n:2})],win:'b3_halsin'}},
b3_dror:{title:'성소 왕좌',text:f=>`부서진 신상 위 왕좌에서 거대한 고블린 드로르 래그즐린이 몸을 일으킨다. "진정한 영혼인 척하는 쥐새끼들이로군!"${f.halsin_free?'\n\n문을 부수고 거대한 곰이 뛰어든다. 할신이다!':''}`,
 combat:f=>({enemies:[boss('드로르 래그즐린',5,{hp:75,attacks:1}),mob('고블린 호위',5,{n:2})],allies:f.halsin_free?[{name:'할신 (곰)',hp:50,ac:14,atk:6,dmg:'2d6+3'}]:[],win:'b3_c2_after'})},
b3_c2_after:{title:'성소',onEnter:{gold:120,loot:'u_dror'},text:`드로르가 쓰러지자 고블린들이 흩어진다. 지도자들의 방에서 문서가 나온다.

<i>"절대자의 군대는 그림자 저주의 땅을 건너 발더스 게이트로 진군한다. 달오름 탑에서 케테릭 소른 장군이 명령을 기다린다."</i>

그날 밤 꿈에서, 수호자가 다시 나타난다. <i>"잘했다. 계속 나아가라. 해답은 남쪽 그림자 속에 있다."</i>`,
 choices:[{t:'숲으로 돌아가 승리를 알린다',go:'b3_c2_end'}]},
b3_c2_end:{title:'2장 끝',chapterEnd:true,text:`티플링 난민들과 드루이드들이 함께 축제를 연다. 처음으로 다 같이 웃는 밤이다. 카를라크는 춤을 추다 무언가를 태워먹고, 게일은 별자리 이야기를 늘어놓고, 아스타리온은 피곤한 척하며 끝까지 자리에 남는다.

하지만 올챙이는 아직 머릿속에 있다. 그리고 절대자의 군대는 남쪽, 그림자 저주의 땅에서 기다리고 있다.`}
,
/* ---------- 3장: 그림자 저주의 땅 (Lv6) ---------- */
b3_c3:{title:'그림자 저주의 땅',text:`빛이 죽은 땅. 횃불을 들어도 어둠이 살갗을 파고든다. 이곳에서는 마법의 빛 없이 오래 버틸 수 없다.

멀리 희미한 빛이 보인다. 셀루네의 사제 이소벨이 지키는 여관, '마지막 빛'이다.`,
 choices:[{t:'마지막 빛 여관으로',go:'b3_lastlight'}]},
b3_lastlight:{title:'마지막 빛 여관',text:`여관 안은 하퍼 요원들과 피난민들로 가득하다. 하퍼들을 지휘하는 이는 은발의 하프엘프 노전사. 날카로운 눈매, 등에 멘 낫.

"자헤이라다." 그녀가 당신을 훑어본다. "올챙이를 품고도 멀쩡한 자들이라. 흥미롭군. 백 년 넘게 살다 보니 별일을 다 보는구나."

그 이름. 전설 속 영웅들과 함께 바알의 자식들을 쓰러뜨렸다는 그 자헤이라다.`,
 choices:[{t:'자헤이라에게 함께 싸우자고 청한다',join:'jaheira',go:'b3_raid'},{t:'정보만 얻고 떠날 채비를 한다',go:'b3_raid'}]},
b3_raid:{title:'마지막 빛 여관',text:`그날 밤, 여관을 감싼 빛이 흔들린다. 날개 달린 전사 마르쿠스가 이소벨을 납치하려고 쳐들어왔다! 그녀가 사라지면 여관의 빛도 꺼진다.`,combat:{enemies:[elite('날개 달린 마르쿠스',6),mob('절대자의 광신도',6,{n:2})],win:'b3_raid_win'}},
b3_raid_win:{title:'마지막 빛 여관',text:`이소벨이 무사하다. 자헤이라가 지도를 펼친다.

"케테릭 소른. 달오름 탑의 장군이지. 놈은 죽지 않는다. 몇 번을 찔러도 일어나. 그 불사의 비밀은 '나이트송'이라는 존재에 있다. 놈은 샤르의 시험장 깊은 곳에 그것을 가둬두었어."

섀도하트의 얼굴이 하얘진다. 그녀가 품은 유물에 새겨진 문양이 샤르의 문양과 똑같다.`,
 choices:[{t:'하퍼 보급관에게 장비를 받는다',go:'b3_shop2'},{t:'샤르의 시험장으로 간다',go:'b3_gauntlet'},{t:'먼저 숨을 돌린다',sub:'짧은 휴식 · 한 번만',not:['r33'],set:{r33:1},rest:1,go:'b3_raid_win'}]},
b3_gauntlet:{title:'샤르의 시험장',text:`완전한 어둠의 신전. 바닥은 보이지 않는 낭떠러지투성이다. 벽에 새겨진 글귀.

<i>"믿음 없는 눈은 길을 보지 못하리라."</i>`,
 choices:[{t:'샤르의 교리대로 눈을 감고 걷는다',check:{skill:'종교',dc:13,ok:'b3_g2',fail:'b3_g_fall'}},{t:'바닥의 미세한 바람을 느끼며 걷는다',check:{skill:'지각',dc:14,ok:'b3_g2',fail:'b3_g_fall'}}]},
b3_g_fall:{title:'샤르의 시험장',onEnter:{dmg:'2d8'},text:`발밑이 꺼진다! 한 층 아래로 굴러떨어진다. 다행히 길은 이어져 있다.`,choices:[{t:'일어나 계속 간다',go:'b3_g2'}]},
b3_g2:{title:'시험장 깊은 곳',text:`그림자 속에서 샤르의 그림자 전사들이 나타난다. "침입자에게 망각을."`,combat:{enemies:[mob('그림자 전사',6,{n:3})],win:'b3_nightsong'}},
b3_nightsong:{title:'나이트송',text:f=>`가장 깊은 곳, 빛나는 은발의 여인이 사슬에 묶여 공중에 떠 있다. 그녀가 바로 나이트송. 케테릭 소른을 불사로 만드는 힘의 원천이다.

${has('shadowheart')?'섀도하트에게 머릿속 목소리가 속삭인다. 그녀의 여신 샤르가 명령한다. "죽여라. 그것이 너의 마지막 시험이다."\n\n섀도하트가 창을 든 채 떨고 있다. 그녀가 당신을 본다. "…어떻게 해야 하지?"':'그녀를 풀어주면 케테릭은 불사의 힘을 잃는다.'}`,
 choices:[{t:'"네 마음이 원하는 대로 해."',req:['has:shadowheart'],set:{shar_free:1,nightsong:1},go:'b3_aylin'},{t:'사슬을 끊는다',not:['has:shadowheart'],set:{nightsong:1},go:'b3_aylin'}]},
b3_aylin:{title:'나이트송',onEnter:{loot:'u_aylin'},text:f=>`${f.shar_free?'섀도하트가 창을 내던진다. 그리고 사슬을 끊는다. 순간 그녀의 손바닥에 있던 상처가 빛으로 바뀐다. 그녀가 울면서 웃는다. "…자유야. 처음으로."\n\n':''}풀려난 여인이 날개를 편다. "나는 아일린, 셀루네의 딸. 백 년 동안 갇혀 있었다." 그녀의 눈이 분노로 타오른다. "케테릭 소른. 이제 그에게 대가를 치르게 하겠다. 함께 가자."`,
 choices:[{t:'달오름 탑으로',go:'b3_moonrise'}]},
b3_moonrise:{title:'달오름 탑',text:`어둠 속에 우뚝 선 탑. 꼭대기에서 케테릭 소른이 의식을 진행하고 있다. 거대한 낫을 든 장군, 그의 몸에서 불사의 힘이 빠져나가는 것이 보인다.

"아일린… 네가 풀려났다고? 상관없다. 절대자께서 내게 새로운 힘을 주실 것이다!"`,combat:{enemies:[boss('케테릭 소른',6,{hp:95}),mob('죽음의 수호자',6,{hp:24})],allies:[{name:'아일린',hp:60,ac:17,atk:7,dmg:'2d6+4'}],win:'b3_reveal'}},
b3_reveal:{title:'달오름 탑',text:`케테릭이 무너지며 웃는다. "늦었다… 이미 <b>왕관</b>은 발더스 게이트에 있다. 세 명의 선택받은 자가…"

그의 품에서 검게 빛나는 돌, '네더스톤'이 굴러 나온다. 그 순간 머릿속에 수호자의 목소리가 울린다. 그리고 처음으로 그 정체가 드러난다.

수호자는… 마인드 플레이어였다. 일족을 배신한 마인드 플레이어, '황제'. 처음부터 당신의 올챙이를 막아준 존재.

<i>"속인 것은 미안하다. 하지만 내가 없었다면 너는 이미 괴물이 되었을 것이다. 우리 목표는 같다. 이 왕관을 쥔 자들을 막는 것."</i>`,
 choices:[{t:'케테릭의 네더스톤을 챙긴다',item:'케테릭의 네더스톤',go:'b3_c3_end'}]},
b3_c3_end:{title:'3장 끝',chapterEnd:true,text:`케테릭의 마지막 말과 황제의 고백. 퍼즐이 맞춰진다.

절대자는 신이 아니다. 죽은 세 신, 바알, 미르쿨, 바인의 선택받은 자들이 조종하는 가짜다. 그들은 '네더스톤' 세 개로 거대한 '엘더 브레인'을 조종해, 올챙이 박힌 모든 이를 노예로 만들려 한다.

이제 남은 두 명. 발더스 게이트의 새 대공 <b>고르타시</b>, 그리고 바알의 선택받은 자 <b>붉은 오린</b>.

카를라크가 주먹을 쥔다. "고르타시. 드디어 만나겠네."`}
,

b3_c4:{title:'발더스 게이트',text:`한 세기가 흘렀지만 발더스 게이트는 여전히 시끄럽고, 붐비고, 위험하다. 거리를 쇳덩이 병사들, 강철 감시자들이 순찰한다. 새 대공 고르타시의 군대다.

하층 도시 골목에서 거대한 그림자가 길을 막는다. 근육질의 거구, 어깨 위의 작은 햄스터.

b3_shop3:{title:'발더스 게이트 대시장',shop:'b3_city',text:`항구 옆 대시장. 강철 감시자들이 순찰하는 와중에도 상인들은 목청을 높인다. 깊은 골목엔 진짜 귀한 물건을 파는 가게들이 있다.`,choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]},
b3_plan:{title:'하퍼 은신처',text:`자헤이라가 지도 위에 두 개의 점을 찍는다.

"고르타시는 철의 요새 '용의 바위'에. 오린은 지하 도시의 바알 신전에. 둘의 네더스톤을 모두 빼앗아야 엘더 브레인의 고삐를 끊을 수 있다."

 choices:[{t:'발더스 게이트 대시장에 들른다',go:'b3_shop3'},{t:'고르타시의 요새로 간다',not:['gortash_done'],go:'b3_gortash'},{t:'오린의 바알 신전으로 간다',not:['orin_done'],go:'b3_orin'},{t:'두 네더스톤을 들고 엘더 브레인에게 간다',req:['gortash_done','orin_done'],go:'b3_brain'}]},
b3_gortash:{title:'용의 바위',text:`강철 감시자들이 지키는 요새. 고르타시는 왕좌에서 당신을 기다리고 있었다.

"드디어 왔군. 우리 거래를 하자고. 오린은 미치광이다. 나와 손잡으면 이 도시를 함께 다스릴 수 있지." 그가 카를라크를 보고 웃는다. "오, 내 옛 물건도 왔네."

b3_gortash_weak:{title:'용의 바위',text:`거래를 받아들이는 척하며 강철 감시자들의 제어 장치 위치를 알아낸다. 그리고 그것을 부순다! 고르타시가 경악한다. "이 배신자가!"`,combat:{enemies:[boss('고르타시',7,{hp:95,dmg:'2d6+4'})],win:'b3_gortash_win'}},
b3_gortash_fight:{title:'용의 바위',text:`고르타시가 손가락을 튕기자 강철 감시자가 일어선다. "아깝군. 쓸모 있는 장난감이 될 수 있었는데."`,combat:{enemies:[boss('고르타시',7,{hp:95,dmg:'2d6+4'}),elite('강철 감시자',7,{ac:18})],win:'b3_gortash_win'}},
b3_gortash_win:{title:'용의 바위',onEnter:{set:{gortash_done:1},item:'고르타시의 네더스톤'},text:f=>`고르타시가 쓰러진다. 그의 손에서 두 번째 네더스톤이 빠져나온다.${has('karlach')?'\n\n카를라크가 그의 시신 앞에 서서 한참을 말이 없다. "…생각보다 시원하지 않네." 그녀가 웃는다. 눈가가 젖어 있다.':''}`,

b3_orin_trick:{title:'바알의 신전',onEnter:{dmg:'2d8'},text:`당신이 벤 것은 분신이었다! 진짜 오린이 등 뒤에서 단검을 꽂는다. "느려, 느려!"`,combat:{enemies:[boss('붉은 오린',7,{hp:90,dmg:'2d6+4'}),mob('바알 광신도',7,{n:2})],win:'b3_orin_win'}},
b3_orin_fight:{title:'바알의 신전',text:`그림자의 흔들림, 그것이 진짜다. 당신의 칼끝이 그녀를 향하자 오린이 처음으로 웃음을 멈춘다.`,combat:{enemies:[boss('붉은 오린',7,{hp:80,dmg:'2d6+4'}),mob('바알 광신도',7)],win:'b3_orin_win'}},
b3_orin_win:{title:'바알의 신전',onEnter:{set:{orin_done:1},item:'오린의 네더스톤'},text:`오린의 몸이 핏빛 웅덩이로 녹아내린다. 세 번째 네더스톤.

신전 벽에 오래된 낙서가 있다. 백 년 전 누군가 새긴 것이다. <i>"피가 아니라 선택이 우리를 정의한다."</i>

 choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]},
b3_brain:{title:'상층 도시',text:`세 개의 네더스톤이 공명한다. 도시 하늘 위로 거대한 뇌, 엘더 브레인이 떠오른다. 수천의 올챙이 박힌 사람들이 멍한 눈으로 하늘을 올려다본다.

머릿속의 황제가 말한다. <i>"이제 네더스톤으로 브레인을 지배하자. 내가 그것을 다스리면 모두 자유로워질 것이다."</i>

하지만 라에젤의 기억 속 기스양키 왕자 오르페우스가 외친다. 황제가 감금하고 있던 그 왕자다. <i>"믿지 마라! 저 마인드 플레이어는 결국 자기 일족의 길을 갈 것이다. 나를 풀어라. 함께 싸우겠다."</i>`,
 choices:[{t:'황제를 믿는다',set:{emperor:1},go:'b3_final_rest'},{t:'오르페우스 왕자를 풀어준다',check:{skill:'설득',dc:14,ok:'b3_orpheus',fail:'b3_final_rest'}}]},
b3_orpheus:{title:'상층 도시',onEnter:{set:{orpheus:1}},text:`마음속 감옥의 문이 열린다. 은빛 갑옷의 기스양키 왕자가 걸어 나온다. 황제의 분노한 목소리가 사라진다.

b3_final_rest:{title:'최후의 전야',text:`엘더 브레인이 있는 하늘의 신경 다리 앞. 동료들이 모인다.

아스타리온이 농담을 하고, 게일이 별을 올려다보고, 카를라크가 심장 엔진을 두드린다. 라에젤은 처음으로 당신에게 고개를 숙인다. "…좋은 전사다, 너는."`,
 choices:[{t:'모두 함께 숨을 고른다',sub:'짧은 휴식 · 한 번만',not:['r34'],set:{r34:1},rest:1,go:'b3_final_rest'},{t:'엘더 브레인에게 간다',go:'b3_final'}]},
b3_final:{title:'네더브레인',text:f=>`거대한 뇌가 촉수를 휘두르며 마인드 플레이어들을 불러낸다. 도시 전체가 그것의 숨결로 떨린다.

${f.orpheus?'오르페우스 왕자가 칼을 들고 앞장선다.':'황제가 당신 곁에 실체로 나타나 촉수를 펼친다.'}`,
 combat:f=>({enemies:[boss('네더브레인',7,{hp:150,ac:15,dmg:'2d6+4'}),mob('마인드 플레이어',7,{hp:30})],allies:[f.orpheus?{name:'오르페우스 왕자',hp:80,ac:18,atk:8,dmg:'2d6+5'}:{name:'황제',hp:70,ac:15,atk:8,dmg:'2d8+3'}],win:'b3_end'})},
b3_end:{title:'에필로그',ending:'win',text:f=>`엘더 브레인이 비명을 지르며 무너진다. 그 순간 수천 명의 머릿속에서 올챙이가 죽어간다. 당신의 머릿속에서도.

조용하다. 처음으로, 머릿속이 오롯이 당신 것이다.

${f.orpheus?'오르페우스 왕자는 기스양키 백성에게 돌아가 여왕의 폭정에 맞서겠다고 맹세한다. 라에젤이 그의 곁에 무릎을 꿇는다.':'황제는 고개를 숙이고 떠난다. "약속은 지켰다. 이제 우리는 각자의 길을 간다." 그가 정말 선한 존재였는지는, 아무도 모른다.'}

며칠 뒤, 동료들이 저마다의 길로 흩어지기 전 마지막 밤. 다 같이 마지막 모닥불에 둘러앉는다. 카를라크가 크게 웃고, 아스타리온이 투덜대고, 게일이 건배를 외친다. 민스크가 부를 높이 든다.

자헤이라가 당신에게만 들리게 말한다. "백 년 전에도 이런 밤이 있었지. 이 도시는 늘 영웅을 낳는구나."

<b>— 발더스 게이트 3 완료 · 모든 이야기가 끝났습니다 —</b>`}

start:{title:'회색 항구',text:`소금기 밴 안개 사이로 발더스 게이트의 성벽이 모습을 드러낸다. 배가 회색 항구에 닿자 갈매기 울음과 하역꾼들의 고함이 뒤섞인다.

품 안에는 일주일 전 받은 편지가 있다. 오랜 친구이자 항만 노동자인 토마스가 보낸 것이다.

<i>"창고에서 화물이 하나둘 사라지고 있어. 그런데 더 이상한 건… 어젯밤 부두에서 나를 봤어. 나랑 똑같은 얼굴을 한 누군가를. 하층 도시의 '부서진 닻' 여관에서 기다릴게. 빨리 와 줘."</i>

편지 끝의 글씨는 급하게 휘갈겨져 있다.`,
 choices:[{t:'부서진 닻 여관으로 간다',go:'tavern'},{t:'편지에 나온 창고 거리부터 둘러본다',go:'docks'},{t:'도시 경비대 \'불꽃 주먹\' 초소에 실종을 알린다',go:'fist'}]},

tavern:{title:'부서진 닻 여관',text:`낮인데도 어둑한 여관 안에 싸구려 맥주 냄새가 고여 있다. 주인 마르다—팔뚝이 통나무 같은 하프오크—가 잔을 닦다 고개를 든다.

"토마스? 사흘째 코빼기도 안 보여. 방값은 다음 주까지 냈으니 문은 잠가뒀지."`,
 choices:[
  {t:'친구가 위험하다고 설득해 방 열쇠를 받는다',not:['room_done','refused'],check:{skill:'설득',dc:12,ok:'tavern_key',fail:'tavern_refuse'}},
  {t:'은화 5닢을 내밀고 열쇠를 산다',not:['room_done'],gold:-5,go:'tavern_key'},
  {t:'구석 테이블 하역꾼들의 대화를 엿듣는다',not:['heard'],set:{heard:1},check:{skill:'지각',dc:11,ok:'tavern_rumor',fail:'tavern_nothing'}},
  {t:'마르다에게 물건을 산다',go:'tavern_shop'},
  {t:'창고 거리로 간다',go:'docks'},
  {t:'불꽃 주먹 초소로 간다',not:['fist_done'],go:'fist'}]},
tavern_shop:{title:'부서진 닻 여관',shop:'f_tavern',text:`마르다가 카운터 아래에서 이것저것 꺼낸다. "손님들이 술값 대신 맡기고 간 것들이야. 쓸 만할걸."`,choices:[{t:'카운터로 돌아간다',go:'tavern'}]},
tavern_key:{title:'부서진 닻 여관',text:`마르다가 놋쇠 열쇠를 카운터에 내려놓는다. "2층 끝 방이야. 어지르지 마. 이미 누가 어질러놨을지도 모르지만."`,choices:[{t:'2층으로 올라간다',go:'tavern_room'}]},
tavern_refuse:{title:'부서진 닻 여관',onEnter:{set:{refused:1}},text:`마르다가 단호하게 고개를 젓는다. "손님 방을 아무한테나 열어줄 순 없어." 그녀는 행주를 어깨에 걸치고 주방으로 사라진다.

계단은 바로 옆이다.`,
 choices:[{t:'은화 5닢을 내밀고 다시 부탁한다',gold:-5,go:'tavern_key'},
  {t:'마르다가 안 볼 때 몰래 2층으로 올라간다',check:{skill:'은신',dc:13,ok:'tavern_room',fail:'tavern_caught'}},
  {t:'포기하고 창고 거리로 간다',go:'docks'}]},
tavern_caught:{title:'계단',text:`계단 중간에서 거대한 손이 어깨를 움켜쥔다. 여관의 문지기 보른이다.

"어딜 몰래 올라가?" 대답할 틈도 없이 주먹이 날아온다!`,combat:{enemies:[F('bouncer')],win:'tavern_after_fight'}},
tavern_after_fight:{title:'부서진 닻 여관',onEnter:{gold:-3},text:`보른이 의자를 부수며 바닥에 뻗는다. 마르다가 한숨을 쉰다.

"…그렇게까지 토마스가 걱정된다면야." 그녀가 열쇠를 던져준다. "대신 의자값은 받아 가겠어."`,choices:[{t:'2층으로 올라간다',go:'tavern_room'}]},
tavern_rumor:{title:'부서진 닻 여관',onEnter:{set:{rumor:1}},text:`하역꾼들이 목소리를 낮춘다.

"밤마다 소금 창고 뒤에서 덮개 씌운 수레가 하수도 쪽으로 내려간대."
"그것보다 이상한 건 사라졌던 놈들이 다음 날 멀쩡히 일하러 나온다는 거야. 근데 자기 마누라 이름을 틀리게 부르더라고."

그들은 당신의 시선을 느끼고 입을 다문다.`,choices:[{t:'카운터로 돌아간다',go:'tavern'}]},
tavern_nothing:{title:'부서진 닻 여관',text:`시끄러운 웃음소리와 주사위 굴리는 소리에 묻혀 쓸 만한 이야기는 들리지 않는다.`,choices:[{t:'카운터로 돌아간다',go:'tavern'}]},
tavern_room:{title:'토마스의 방',onEnter:{set:{room_done:1,key:1},item:'소금 창고 3번 열쇠'},text:`방은 엉망이다. 서랍은 전부 뽑혀 있고 침대 매트리스는 찢겨 있다. 누군가 먼저 다녀갔다.

그래도 베개 속 깃털 사이에서 손끝에 차가운 것이 걸린다. <b>'소금 창고 3번'</b>이라는 꼬리표가 달린 쇠 열쇠다.`,
 choices:[{t:'바닥과 벽을 꼼꼼히 조사한다',not:['searched'],set:{searched:1},check:{skill:'조사',dc:12,ok:'room_journal',fail:'room_nofind'}},{t:'방을 나선다',go:'room_exit'}]},
room_journal:{title:'토마스의 방',onEnter:{set:{scar:1},item:'토마스의 일지'},text:`헐거운 마룻장 아래에서 낡은 일지가 나온다. 마지막 장은 떨리는 글씨다.

<i>"그놈들은 사람을 데려가고, 그 얼굴을 뒤집어쓴다. 하지만 흉내 못 내는 게 있어. 지난달 갈고리에 베인 내 <b>왼손바닥 흉터</b>. 혹시 '나'를 만나거든 왼손을 확인해."</i>`,choices:[{t:'일지를 챙겨 방을 나선다',go:'room_exit'}]},
room_nofind:{title:'토마스의 방',text:`먼지와 쥐똥, 빈 술병뿐이다.`,choices:[{t:'방을 나선다',go:'room_exit'}]},
room_exit:{title:'계단참',text:`방을 나서자 계단참에 마르다가 서 있다. 손에는 아무것도 들려 있지 않다.

"찾던 건 찾았어?"

그런데… 방금 아래층 주방에서 냄비 부딪히는 소리와 함께 마르다의 욕설이 들리지 않았던가?`,
 choices:[{t:'그녀의 눈을 똑바로 살핀다',check:{skill:'통찰',dc:13,ok:'ambush_spotted',fail:'ambush_hit'}},{t:'"응, 고마워." 하고 지나쳐 내려간다',go:'ambush_hit'}]},
ambush_spotted:{title:'계단참',text:`눈동자가 순간 잿빛으로 일렁인다. 들켰다는 걸 깨달은 '마르다'의 얼굴이 밀랍처럼 흘러내리기 시작한다.

하지만 당신이 한발 빨랐다. 놈이 단검을 뽑기도 전에 먼저 일격을 꽂는다!`,combat:{enemies:[F('doppel',{name:'변신자 (마르다의 얼굴)',hp:11})],win:'ambush_win'}},
ambush_hit:{title:'계단참',onEnter:{dmg:'1d6+2'},text:`지나치는 순간 옆구리에 단검이 박힌다!

'마르다'의 얼굴이 밀랍처럼 녹아내리며 잿빛 피부와 텅 빈 하얀 눈이 드러난다. 남의 얼굴을 훔쳐 쓰는 괴물, 변신자다.`,combat:{enemies:[F('doppel',{name:'변신자 (마르다의 얼굴)'})],win:'ambush_win'}},
ambush_win:{title:'부서진 닻 여관',onEnter:{set:{saw_doppel:1},potions:1},text:`쓰러진 괴물의 몸이 굳어 회색 반죽 덩어리처럼 변한다.

소란에 진짜 마르다가 국자를 든 채 뛰어 올라오다 그 광경에 얼어붙는다. "…이 도시가 뭔가 단단히 잘못됐어." 그녀는 말없이 <b>치유 물약</b> 하나를 당신 손에 쥐여준다.`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'불꽃 주먹 초소로 간다',not:['fist_done'],go:'fist'}]},

docks:{title:'창고 거리',text:f=>`짠내와 썩은 생선 냄새가 뒤섞인 거리. 줄지어 선 창고 중 <b>소금 창고 3번</b> 앞에는 덩치 둘이 몽둥이를 들고 어슬렁거린다.${f.key?'\n\n주머니 속 열쇠가 묵직하게 느껴진다.':''}`,
 choices:[
  {t:'늙은 하역꾼에게 토마스에 대해 묻는다',not:['asked'],go:'docks_worker'},
  {t:'열쇠로 뒷문을 열고 몰래 들어간다',req:['key'],go:'warehouse_in'},
  {t:'창고 주위를 돌며 다른 입구를 찾는다',not:['looked'],set:{looked:1},check:{skill:'지각',dc:12,ok:'docks_window',fail:'docks_spotted'}},
  {t:'"새로 온 짐꾼인데요" 하고 경비를 속인다',not:['lied'],set:{lied:1},check:{skill:'기만',dc:13,ok:'docks_bluffed',fail:'docks_spotted'}},
  {t:'정면으로 덤빈다',go:'docks_fight'},
  {t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'},
  {t:'불꽃 주먹 초소로 간다',not:['fist_done'],go:'fist'}]},
docks_worker:{title:'창고 거리',onEnter:{set:{asked:1,tomas_seen:1}},text:`그물을 깁던 늙은 하역꾼 펠이 침을 탁 뱉는다.

"토마스? 어제 봤지. 창고 앞에서 인부들한테 이래라저래라 하더군. 평생 남한테 싫은 소리 한 번 못 하던 놈이… 그리고 이 더운 날 <b>왼손에만 장갑</b>을 끼고 있더라고. 이상하지?"`,choices:[{t:'고맙다고 하고 돌아선다',go:'docks'}]},
docks_window:{title:'창고 골목',text:`창고 옆 좁은 골목, 높은 곳에 반쯤 열린 환기창이 보인다. 빈 상자를 밟고 올라 소리 없이 안으로 미끄러져 들어간다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},
docks_bluffed:{title:'창고 정문',text:`덩치 하나가 당신을 위아래로 훑더니 턱짓한다. "늦었잖아. 안에 들어가서 소금 포대나 날라."

문이 열린다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},
docks_spotted:{title:'창고 거리',text:`너무 티가 났다. "거기 너! 뭘 기웃거려?" 깡패 둘이 몽둥이를 휘두르며 달려온다!`,combat:{enemies:[F('thug'),F('punk')],win:'docks_won'}},
docks_fight:{title:'창고 거리',text:`덩치들이 낄낄대며 다가온다. "여기 볼일 없을 텐데, 친구?"

대답 대신 무기를 뽑는다.`,combat:{enemies:[F('thug'),F('punk')],win:'docks_won'}},
docks_won:{title:'창고 거리',onEnter:{gold:8},text:`한 놈은 쓰러지고 다른 놈은 꽁지 빠지게 도망쳤다. 쓰러진 놈의 주머니에서 은화 8닢이 나온다.

창고 정문이 활짝 열려 있다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},

fist:{title:'불꽃 주먹 초소',onEnter:{set:{fist_done:1}},text:`붉은 망토를 두른 경비대의 초소. 반 하사가 서류 더미 너머로 귀찮다는 듯 당신을 본다.

"하층 도시에서 사람 사라지는 게 하루 이틀 일인 줄 아나? 용건이 그거면 나가."`,
 choices:[
  {t:'"변신자를 직접 봤소." 회색 살덩이 이야기를 한다',req:['saw_doppel'],go:'fist_help'},
  {t:'사라진 사람들과 수상한 창고 이야기로 설득한다',not:['saw_doppel'],check:{skill:'설득',dc:f=>f.rumor?12:14,ok:'fist_help',fail:'fist_dismiss'}},
  {t:'은화 10닢을 서류 밑으로 슬쩍 밀어 넣는다',gold:-10,go:'fist_help'},
  {t:'그냥 나간다',go:'fist_dismiss'}]},
fist_help:{title:'불꽃 주먹 초소',onEnter:{set:{flare:1,pw:1},item:'붉은 신호탄'},text:`하사의 표정이 굳는다. "…소금 창고라. 요즘 그쪽 순찰 보고서가 이상하게 깨끗하더군."

그가 서랍에서 붉은 원통을 꺼낸다. <b>"신호탄이다. 지하에서 뭔가 찾으면 이걸 터뜨려. 우리 애들을 하수도 입구에 대기시키지."</b>

그리고 목소리를 낮춘다. "놈들 수문 암호가 <b>'썰물'</b>이라는 첩보가 있다. 믿을진 모르겠지만."`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'}]},
fist_dismiss:{title:'초소 밖',onEnter:{set:{pw:1}},text:`쫓겨나듯 초소를 나서는데, 앳된 신병 하나가 뒤따라와 소매를 잡는다.

"하사님은 안 믿으시지만… 저 하수도 수문 앞에서 밀수꾼들이 <b>'썰물'</b>이라고 말하는 걸 들었어요. 조심하세요."

신병은 그 말만 남기고 급히 돌아간다.`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'}]},

warehouse_in:{title:'소금 창고',text:`천장까지 쌓인 소금 포대와 상자들 사이로 어둠이 고여 있다.

그때 등 뒤에서 낯익은 목소리가 들린다. "…너구나! 정말 와 줬구나!"

토마스다. 수척하지만 멀쩡해 보인다. 그는 <b>왼손을 외투 주머니에 찔러 넣은 채</b> 반갑게 웃는다. "여긴 위험해. 안전한 길을 아니까 날 따라와."`,
 choices:[
  {t:'"반갑다. 왼손 좀 보여줘."',req:['scar'],go:'fake_reveal'},
  {t:'그의 말투와 몸짓을 유심히 살핀다',check:{skill:'통찰',dc:f=>f.tomas_seen?11:14,ok:'fake_reveal',fail:'fake_follow'}},
  {t:'안도하며 그를 따라간다',go:'fake_follow'}]},
fake_reveal:{title:'소금 창고',text:`'토마스'의 미소가 굳는다. 주머니에서 마지못해 빠져나온 왼손바닥은 매끈하다. 흉터 하나 없이.

"…눈치가 빠르네." 말이 끝나기도 전에 그의 얼굴이 흐물흐물 녹아내린다. 가짜다!`,combat:{enemies:[F('doppel',{name:'변신자 (토마스의 얼굴)'})],win:'warehouse_main'}},
fake_follow:{title:'함정',text:`그는 당신을 창고 뒤편 함정문으로 이끈다. 사다리를 내려가자마자 <b>철컥</b>—머리 위에서 문이 잠긴다.

어둠 속에서 '토마스'가 낄낄 웃는다. 그 얼굴이 촛농처럼 흘러내리고, 그림자에서 깡패 하나가 몽둥이를 들고 걸어 나온다.`,combat:{enemies:[F('doppel',{name:'변신자 (토마스의 얼굴)'}),F('punk',{name:'하수도 깡패'})],win:'fake_follow_win'}},
fake_follow_win:{title:'하수도 입구',text:`숨을 고른다. 함정문은 위에서 잠겼지만, 하수도는 어둠 속으로 계속 이어진다. 진짜 토마스는 어딘가 더 깊은 곳에 있을 것이다.`,
 choices:[{t:'벽에 기대 잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만 가능',not:['r1'],set:{r1:1},rest:1,go:'fake_follow_win'},{t:'하수도 깊이 들어간다',go:'sewer'}]},
warehouse_main:{title:'창고 안쪽',text:`창고는 다시 조용해졌다. 구석에는 밧줄에 묶인 채 정신을 잃은 남자가 있고, 훔친 화물 상자가 쌓여 있다. 바닥에는 쇠고리가 달린 함정문이 보인다.`,
 choices:[

${f.ledger?'당신이 건넨 장부 덕분에 불꽃 주먹은 그날 밤 바꿔치기된 관리들을 하나하나 찾아냈다. 항만장은 무사했고, 시의회는 당신에게 감사장과 함께 금화 100닢을 보냈다.':'회색 부인은 쓰러졌지만, 그녀가 누구누구의 얼굴을 훔쳤는지는 알 길이 없다. 그래도 항만장은 무사했고, 그의 사례금으로 금화 100닢이 손에 들어왔다.'}

며칠 뒤 부서진 닻 여관. 마르다가 공짜 맥주를 내려놓으며 말한다. "이 도시엔 아직 남의 얼굴을 쓴 놈들이 남아 있을 거야."

토마스가 잔을 든다. "그럼 다음에도 도와줄 거지?"

<b>— 모험 완료 —</b>`},
ending_flee:{title:'에필로그',ending:'flee',text:`당신은 수로를 거슬러 정신없이 달린다. 등 뒤에서 회색 부인의 웃음소리가 메아리친다.

 if(ds.tg!==undefined){const cb=S.adv.combat;if(cb.enemies[+ds.tg].hp>0){cb.target=+ds.tg;save();render();}return;}
 if(ds.cls){S.draft.cls=ds.cls;S.draft.name=($('#cname')||{}).value||'';save();render();return;}
 if(ds.newc){const id=ds.newc;const has=S.saves[id]||(S.adv&&S.adv.camp===id);if(has)modal('<h2>처음부터 시작할까요?</h2><p class="muted">이 모험의 진행 상황이 사라져요.</p>',[{t:'처음부터',fn:()=>{if(S.adv&&S.adv.camp===id)S.adv=null;delete S.saves[id];startCamp(id);}},{t:'취소',cls:'ghost'}]);else startCamp(id);return;}
 if(ds.resume)return resumeCamp(ds.resume);
 if(ds.rch){const[id,ch]=ds.rch.split(':');modal(`<h2>${+ch+1}장을 다시 할까요?</h2><p class="muted">그 장을 시작했던 때의 상태로 돌아가요. 이후 진행은 사라져요.</p>`,[{t:'다시 하기',fn:()=>restartChapter(id,+ch)},{t:'취소',cls:'ghost'}]);return;}
 if(ds.adj){const[k,v]=ds.adj.split(':');const c=S.char;c[k]=Math.max(0,c[k]+ +v);if(k==='hp')c.hp=Math.min(c.hp,c.maxhp);if(k==='slots')c.slots=Math.min(c.slots,c.maxSlots);save();render();return;}
 if(ds.delitem!==undefined){S.char.items.splice(+ds.delitem,1);save();render();return;}
 if(ds.die){const D=S.dice,s=+ds.die;let total,desc;
  if(s===20&&D.count===1&&D.mode!=='norm'){const r=d20(D.mode);total=r.v+D.mod;desc=`d20 ${D.mode==='adv'?'이점':'불리'} ${r.txt}${D.mod?sgn(D.mod):''}`;if(r.v===20)desc+=' · 대성공!';if(r.v===1)desc+=' · 대실패!';}
  else{const r=roll(`${D.count}d${s}${D.mod?sgn(D.mod):''}`);total=r.t;desc=`${D.count}d${s}${D.mod?sgn(D.mod):''} [${r.r.join(', ')}]`;if(s===20&&D.count===1){if(r.r[0]===20)desc+=' · 대성공!';if(r.r[0]===1)desc+=' · 대실패!';}}
  D.last={total,desc};D.hist.unshift(D.last);D.hist=D.hist.slice(0,25);save();render();return;}
 if(ds.dadj){const[k,v]=ds.dadj.split(':');const D=S.dice;D[k]+= +v;if(k==='count')D.count=Math.min(20,Math.max(1,D.count));if(k==='mod')D.mod=Math.max(-20,Math.min(20,D.mod));save();render();return;}
 if(ds.dmode){S.dice.mode=ds.dmode;save();render();return;}
 if(ds.sk){const s=ds.sk,b=skillBonus(s),r=d20(S.dice.mode);S.dice.last={total:r.v+b,desc:`${ABIL[SKILL[s]]}(${s}) ${r.txt}${sgn(b)}${r.v===20?' · 대성공!':r.v===1?' · 대실패!':''}`};S.dice.hist.unshift(S.dice.last);S.dice.hist=S.dice.hist.slice(0,25);save();render();window.scrollTo(0,0);return;}
 if(ds.like!==undefined){S.like=+ds.like;save();render();return;}
 if(ds.chaos){S.chaos=Math.max(1,Math.min(9,S.chaos+ +ds.chaos));save();render();return;}
 if(ds.gen)return gen(ds.gen);
 if(ds.buy)return buy(ds.buy);
 if(ds.sell)return sell(ds.sell);
 const a=ds.a;if(!a)return;
 ({menu:()=>{S.menu=true;save();render();window.scrollTo(0,0);},
  party:partyModal,nextch:nextChapter,bag:()=>bagModal(),cbag:()=>bagModal('combat'),
  won:()=>enterNode(S.adv.combat.win),
  mkchar:()=>{const nm=($('#cname').value||'').trim();S.hero={cls:S.draft.cls,name:nm||CLASSES[S.draft.cls].name};S.char=null;S.adv=null;S.saves={};S.menu=true;S.tab='adv';save();render();},
  newchar:()=>modal('<h2>캐릭터를 바꿀까요?</h2><p class="muted">모든 모험의 진행 상황이 사라져요.</p>',[{t:'바꾸기',cls:'red',fn:()=>{S.hero=null;S.char=null;S.adv=null;S.saves={};S.done={};S.menu=true;save();render();}},{t:'취소',cls:'ghost'}]),
  srest:()=>{const m=doRest(false);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);},
  lrest:()=>{const m=doRest(true);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);},
  additem:()=>{const v=$('#newitem').value.trim();if(v){S.char.items.push(v);save();render();}},
  clearhist:()=>{S.dice.hist=[];S.dice.last=null;save();render();},
  ask,hintoff:()=>{S.hintOff=1;save();render();},
  tojournal:()=>{const d=new Date();S.journal=(S.journal?S.journal.trimEnd()+'\n\n':'')+`[${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}] ${plainOracle()}`;save();modal('<p>기록장에 추가했어요.</p>',[{t:'확인'}]);},
  backup:()=>{const data=JSON.stringify(S);modal(`<h2>백업</h2><p class="muted">아래 내용을 전부 복사해 메모 앱에 붙여 두세요.</p><textarea rows="6" readonly onclick="this.select()">${esc(data)}</textarea>`,[{t:'닫기'}]);},
  restore:()=>{modal(`<h2>백업 불러오기</h2><textarea id="rs" rows="6" placeholder="백업 내용 붙여넣기"></textarea>`,[{t:'불러오기',fn:()=>{try{const v=JSON.parse(document.getElementById('rs').value);S=Object.assign(fresh(),v);save();render();}catch(e){modal('<p>형식이 올바르지 않아요.</p>',[{t:'확인'}]);}}},{t:'취소',cls:'ghost'}]);},
  wipe:()=>modal('<h2>전부 지울까요?</h2><p class="muted">캐릭터, 모든 모험, 기록장이 삭제돼요.</p>',[{t:'모두 삭제',cls:'red',fn:()=>{S=fresh();save();render();}},{t:'취소',cls:'ghost'}])
 }[a]||(()=>{}))();
});
let jt;document.addEventListener('input',e=>{if(e.target.id==='jr'){S.journal=e.target.value;clearTimeout(jt);jt=setTimeout(save,300);}if(e.target.id==='cname')S.draft.name=e.target.value;});
function netState(){$('#offline').textContent=navigator.onLine?'':'✈︎ 오프라인';}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if(S.adv&&!NODES[S.adv.node]){S.adv=null;S.menu=true;}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
