addNodes('bg3',{
/* 1장 · 알도르의 태엽 부엉이 */
b3_owl:{title:'추락한 잔해',scene:'beach',who:['aldor'],text:`알도르가 갑자기 주머니를 뒤지며 허둥댄다. "틱! 틱이 없어! 내 태엽 부엉이! 마흔 해 동안 만든 거라고!"

그가 손가락으로 해안 너머를 가리킨다. 모래 위에 작은 발자국들. 고블린 셋이 반짝이는 무언가를 자루에 넣고 숲 쪽으로 끌고 가고 있다. 자루 안에서 "삐-익, 삐-익" 소리가 난다.

"틱은 내 기억을 저장해 둔 장치요. 내가 건망증이 심해서… 그게 없으면 내가 뭘 발명했는지도 다 잊어버린단 말이오!"`,
 choices:[{t:'고블린들을 쫓는다',go:'b3_owl_fight'},{t:'몰래 따라가 자루만 훔친다',check:{skill:'손재주',dc:13,ok:'b3_owl_ok',fail:'b3_owl_fight'}}]},
b3_owl_fight:{title:'해안 숲',scene:'forest',text:`고블린들이 자루를 내던지고 녹슨 칼을 뽑는다. "반짝이는 건 우리 거다!"`,combat:{enemies:[mob('고블린 약탈꾼',4,{hp:11,n:3})],win:'b3_owl_ok'}},
b3_owl_ok:{title:'해안 숲',scene:'forest',who:['aldor'],onEnter:{set:{owl:1},bond:{aldor:1},loot:'t_focus'},text:`자루에서 손바닥만 한 놋쇠 부엉이가 튀어나와 알도르의 머리 위로 날아간다. 알도르가 그것을 품에 안고 한참 쓰다듬는다.

"틱, 틱. 다행이다." 부엉이의 눈이 깜빡이며 작은 목소리로 녹음된 말을 재생한다. <i>"알도르, 오늘 할 일: 비행 기계 날개 고치기. 점심 먹기. 그리고 잊지 마. 너는 좋은 사람이야."</i>

알도르가 헛기침을 한다. "어, 그 마지막 건… 아내가 녹음해 둔 거요. 오래전에 떠났지만." 그가 주머니에서 작은 수정을 꺼낸다. "이건 고마움의 표시요. 틱 예비 부품인데, 마법 집중에도 좋소."`,choices:[{t:'숲으로 향한다',go:'b3_gate'}]},
/* 2장 · 브루노의 쇠팔 */
b3_arm:{title:'황폐한 마을 대장간',scene:'ruins',who:['bruno','torga'],text:f=>`마을에 들어서자 브루노가 비틀거린다. 쇠팔에서 검은 연기가 뿜어져 나오고, 관절이 끼익거리며 굳는다. "젠장… 지옥 쇠는 이 세상 공기가 안 맞나 봐. 이러다 팔이 통째로 굳어버리겠어."

폐허 한가운데 무너진 대장간이 있다. 화덕은 아직 쓸 만해 보인다.${has('torga')?'\n\n토르가가 말없이 대장간으로 걸어간다. 망치를 집어 들고, 화덕에 불을 지핀다. 그녀가 브루노를 본다. "팔. 이리."':''}`,
 choices:[{t:'토르가에게 맡긴다',req:['has:torga'],go:'b3_arm_torga'},{t:'직접 고쳐본다',check:{skill:'조사',dc:13,ok:'b3_arm_ok',fail:'b3_arm_fail'}},{t:'나중에 한다',go:'b3_village'}]},
b3_arm_torga:{title:'대장간',scene:'ruins',who:['torga','bruno'],onEnter:{set:{arm:1},bond:{torga:1,bruno:1}},text:`토르가가 지옥 쇠를 화덕에 넣는다. 그녀의 비늘이 불빛에 붉게 빛난다. 망치 소리가 일정하게 울린다. 땅, 땅, 땅.

한참 뒤 그녀가 처음으로 길게 말한다. "우리 가문은 대장장이였다. 마을이 불탔을 때 다 잃었다. 망치 하나만 남았지. 그래서 아무것도 안 만들었다. 만들면 또 잃을 테니까."

그녀가 수리한 쇠팔을 브루노에게 끼워준다. 증기가 깨끗하게 뿜어져 나온다. "오늘 처음으로 다시 만들었다. 나쁘지 않군."

브루노가 쇠팔로 그녀의 어깨를 조심스럽게 두드린다. "…최고다, 대장장이."`,choices:[{t:'마을을 둘러본다',go:'b3_village'}]},
b3_arm_ok:{title:'대장간',scene:'ruins',who:['bruno'],onEnter:{set:{arm:1},bond:{bruno:1}},text:`화덕의 열로 굳은 관절을 달구고, 녹을 긁어낸다. 손이 데었지만 쇠팔이 다시 움직인다. 브루노가 손가락을 하나씩 접어본다.

"지옥에서 이 팔을 단 놈은 날 물건 취급했지. 근데 넌 사람 팔 고치듯 고쳐주네." 그가 크게 웃는다. "이거 평생 갚아야겠는데?"`,choices:[{t:'마을을 둘러본다',go:'b3_village'}]},
b3_arm_fail:{title:'대장간',scene:'ruins',onEnter:{dmg:'1d6'},text:`불꽃이 튀어 손등을 덴다. 쇠팔은 여전히 끼익거린다. 브루노가 웃는다. "괜찮아. 마음만 받을게. 아직 주먹은 쥐어지니까."`,choices:[{t:'마을을 둘러본다',go:'b3_village'}]},
/* 3장 · 세이의 옛 주인 */
b3_sei:{title:'그림자 속 야영지',scene:'shadow',who:['sei'],text:`마지막 빛 여관으로 끌려온 절대자 광신도 포로들 사이에서, 세이가 한 남자를 보고 얼어붙는다. 살찐 얼굴, 손가락마다 반지. 그는 세이를 보고 이를 드러낸다.

"이게 누구야, 우리 곡예단의 꼬마 새 아닌가? 줄 위에서 떨어질 때마다 밥을 굶겼던." 그가 낄낄댄다. "벌레 박혀서 돌아왔구나. 절대자께서 너도 다시 내 소유로 돌려주실 거다."

세이의 웃음이 사라진다. 그녀의 손이 칼자루로 간다. 손이 떨린다.`,
 choices:[{t:'"세이, 너는 이제 누구의 소유도 아니야."',check:{skill:'설득',dc:13,ok:'b3_sei_free',fail:'b3_sei_rage'}},{t:'세이가 원하는 대로 하게 둔다',go:'b3_sei_rage'}]},
b3_sei_free:{title:'그림자 속 야영지',scene:'shadow',who:['sei'],onEnter:{set:{sei_free:1},bond:{sei:2},loot:'t_shadow'},text:`세이가 칼을 뽑는다. 그리고 남자의 목 대신, 그의 손가락에서 반지를 하나씩 베어 떨어뜨린다. 곡예단 아이들에게서 빼앗은 돈으로 산 반지들이다.

"이거, 곡예단 애들 몫이야. 내가 찾아서 돌려줄 거야." 그녀가 남자를 하퍼들에게 넘긴다. "재판받아. 나는 너처럼 안 해."

그날 밤, 세이가 당신에게 낡은 가죽 장갑을 건넨다. "줄 탈 때 끼던 거야. 이제 필요 없어. 이제 땅 위를 걸을 거니까." 처음으로, 눈까지 웃고 있다.`,choices:[{t:'여관으로 돌아간다',go:'b3_raid_win'}]},
b3_sei_rage:{title:'그림자 속 야영지',scene:'shadow',who:['sei'],onEnter:{set:{sei_free:1},bond:{sei:1}},text:`세이의 칼이 남자의 목 앞에서 멈춘다. 한참을 그대로 있다가, 그녀가 칼을 거둔다.

"…안 돼. 이러면 나도 저놈이랑 똑같아져." 그녀가 주저앉는다. 당신이 곁에 앉자, 그녀가 어깨에 머리를 기댄다. "조금만 이러고 있자. 조금만."`,choices:[{t:'여관으로 돌아간다',go:'b3_raid_win'}]},
/* 4장 · 피오나의 계약 */
b3_pact:{title:'하퍼 은신처 뒷마당',scene:'city',who:['fiona'],text:`밤. 피오나의 덩굴 문신이 붉게 타오르며 그녀의 목을 조여든다. 그녀가 숨을 헐떡이며 무릎을 꿇는다.

허공에 가시덤불 왕관을 쓴 형체가 나타난다. 그녀가 '숲의 정령'이라 믿었던 존재, 그 정체는 가시의 군주라는 이름의 악마다.

<i>"계약을 잊었느냐, 사냥꾼. 쇠팔의 사내를 죽이지 않았지. 대가는 네 영혼이다. 아니면… 지금 네 동료 하나를 바쳐라."</i>`,
 choices:[{t:'계약서의 허점을 찾아 따진다',check:{skill:'비전',dc:14,ok:'b3_pact_break',fail:'b3_pact_fight'}},{t:'"그녀는 너를 정령이라 믿고 계약했다. 거짓 계약은 무효다!"',check:{skill:'설득',dc:14,ok:'b3_pact_break',fail:'b3_pact_fight'}},{t:'가시의 군주에게 칼을 겨눈다',go:'b3_pact_fight'}]},
b3_pact_fight:{title:'가시의 군주',scene:'city',text:`가시의 군주가 웃는다. "그럼 힘으로 빼앗아 보거라." 바닥에서 가시덤불 하수인들이 솟아오른다.`,combat:{enemies:[elite('가시의 군주의 그림자',7),mob('가시덤불 하수인',7,{n:2})],win:'b3_pact_break'}},
b3_pact_break:{title:'하퍼 은신처 뒷마당',scene:'city',who:['fiona'],onEnter:{set:{pact_free:1},bond:{fiona:2}},text:`가시덤불 왕관이 비명을 지르며 흩어진다. 피오나의 뺨에서 덩굴 문신이 마른 잎처럼 바스러져 떨어진다.

그녀가 맨 뺨을 만져본다. 그리고 웃는다. 울면서. "…힘이 다 빠져나갔어. 이제 그냥 활 쏘는 하프엘프야."

그녀가 활을 고쳐 잡는다. "근데 이상하지. 계약 있을 때보다 지금이 더 잘 쏠 것 같아. 내 손으로 쏘는 거니까."`,choices:[{t:'은신처로 돌아간다',go:'b3_plan'}]}
});

talks('bg3',{
 0:{torga:`토르가는 모닥불 가에서 망치 손잡이를 천으로 닦고 있다. 한참 아무 말이 없다.

"…불은 좋다." 그녀가 마침내 말한다. "쇠를 부드럽게 한다. 사람도."

그녀가 망치를 내려놓는다. "이 망치. 아버지 것이다. 마을이 불탔을 때 이것만 남았다. 너도 뭔가 잃었나." 당신이 대답하기 전에 그녀가 고개를 끄덕인다. "그래. 그럼 우린 같은 쇠다."`,
  olly:`올리가 약초를 다듬으며 쉬지 않고 떠든다. 이 풀은 배탈에 좋고, 저 풀은 불면증에, 그리고 이건 그냥 맛있어서.

그러다 갑자기 조용해진다. "있잖아요. 저 어릴 때 기억이 없어요. 일곱 살 전부. 눈 떠보니 약초원 할머니 집이었어요. 할머니는 제가 길에 쓰러져 있었대요."

그가 외투 안의 유물을 만진다. "이것만 쥐고 있었대요. 이게 뭔지 모르겠어요. 근데 이상하게… 버릴 수가 없어요."`,
  sei:`세이가 단검 세 개로 저글링을 한다. 칼날이 불빛에 반짝인다.

"곡예단에서 자랐어. 줄타기, 공중제비, 칼 던지기. 관객들은 늘 웃었지. 나도 웃었고. 웃어야 밥을 줬거든."

칼 하나가 손에서 미끄러진다. 그녀가 그걸 바닥에 떨어지기 전에 받는다. "…그 버릇이 아직 안 없어져. 아무 때나 웃는 거. 이상하면 말해 줘."`,
  aldor:`알도르가 고글을 이마에 올리고 별을 올려다본다. "저건 큰곰자리고, 저건… 음, 저것도 큰곰자리인가?"

"나는 노움치고도 건망증이 심하오. 아내가 그래서 틱을 만들어 줬지. 내 기억을 대신 들고 다니라고." 그가 놋쇠 부엉이를 쓰다듬는다.

"아내가 떠난 지 스무 해요. 근데 틱 덕분에 아내 목소리는 안 잊어버렸소. 발명이란 그런 거요. 잃어버릴 것들을 붙잡아 두는 거."`,
  fiona:`피오나가 화살촉을 갈고 있다. 뺨의 덩굴 문신이 모닥불에 희미하게 빛난다.

"어릴 때 숲에서 길을 잃었어. 사흘 동안. 굶어 죽기 직전에 목소리가 들렸지. 살려줄 테니 계약하자고. 그게 숲의 정령이었어."

그녀가 문신을 손가락으로 쓸어본다. "그 뒤로 활을 쏘면 절대 안 빗나가. 근데 가끔… 그 목소리가 너무 다정해서 무서워."`},
 1:{torga:`토르가가 모닥불 앞에서 작은 쇳조각을 두드리고 있다. 무언가를 만들고 있다.

"브루노의 팔을 고치고 나서. 손이 근질거린다. 다시 만들고 싶다." 그녀가 완성된 작은 쇠 장미를 당신에게 내민다. "연습이다. 받아라."

그녀가 잠깐 망설인다. "…다시 만들기 시작한 건 너희 덕이다. 말은 못 하겠으니 쇠로 한다."`,
  olly:`올리가 축제에서 얻어온 과자를 모두에게 나눠준다. 자기 몫은 없다.

"저는 괜찮아요! 사제는 나누는 사람이니까요!" 그가 웃다가, 목소리를 낮춘다. "근데요… 요즘 꿈에서 누가 자꾸 불러요. '귀여운 아이야, 돌아오렴.' 엄청 다정한 목소리인데 소름이 끼쳐요."

"그 유물 때문일까요? 그래도 못 버리겠어요. 이게 제 과거의 유일한 조각이니까."`,
  sei:`세이가 줄 위에서 내려와 당신 옆에 앉는다. 숨이 차 있다.

"오늘 축제에서 공중제비 돌았잖아. 다들 박수 쳐줬지. 근데 이번엔 밥 때문에 돈 게 아니야. 그냥 하고 싶어서 했어." 그녀가 손목의 족쇄 자국을 만진다.

"이게 처음이야. 하고 싶어서 재주를 부린 거. 기분 이상하다. 좋은 쪽으로."`,
  aldor:`알도르가 무언가를 열심히 그리고 있다. '하늘 다람쥐 5호' 설계도다.

"이번엔 날개를 네 개로 하겠소. 3호는 두 개라 떨어졌고, 4호는 세 개라 마인드 플레이어한테 잡혔지." 그가 진지하게 고개를 끄덕인다. "네 개면 완벽하오."

"다 만들면 제일 먼저 태워주겠소. 물론 떨어질 수도 있지만, 그건 과학의 영광이오!"`,
  fiona:`피오나가 브루노 쪽을 힐끔 본다. 브루노는 장작을 패다 또 장작더미를 무너뜨렸다.

"내 계약 정령이 저 사람을 죽이라고 했어. 근데 저 사람, 아까 티플링 애들한테 쇠팔로 그네 태워주고 있더라. 악마가 저렇게 웃을 리가 없잖아."

그녀가 문신을 손톱으로 긁는다. "내가 믿어온 게 뭐였는지 모르겠어. 십 년 넘게 그 목소리를 믿었는데."`,
  bruno:`브루노가 쇠팔을 모닥불에 대고 손바닥을 데운다. 쇠팔은 아무것도 못 느끼지만, 버릇이라고 한다.

"지옥 전쟁터에서 십 년. 거기선 불이 다 적이었지. 근데 이 불은 따뜻하네." 그가 크게 웃는다. 웃음이 조금 떨린다.

"하겐. 내 상관이었어. 날 믿었던 부하들까지 같이 팔아넘겼지. 나만 살아 돌아왔어." 그가 주먹을 쥔다. 쇠가 삐걱거린다. "그 녀석들 몫까지 갚아줄 거야."`},
 2:{torga:`토르가가 마르케스의 낫 조각을 들어 살핀다. "좋은 쇠다. 나쁜 손에 있었을 뿐."

그녀가 당신을 본다. "쇠는 탓하지 않는다. 쥔 손을 탓한다. 너의 머리 벌레도 마찬가지다. 그것이 너를 만들지 않는다. 네 손이 만든다."

그 말을 하고 그녀는 망치질로 돌아간다. 오늘 그녀가 한 말 중 가장 길다.`,
  olly:f=>f.shar_free?`올리가 엄마의 노래를 흥얼거린다. 서툴지만 계속.

"기억이 다 돌아왔어요. 샤르 교단이 저를 데려가서 기억을 지웠어요. 그 유물로 저를 첩자로 키우려고. 근데 일곱 살에 도망쳤대요. 그 기억까지 지워버렸던 거고."

그가 당신 손을 잡는다. "그때 '네 마음대로 해'라고 해줘서 고마워요. 처음으로 누가 제 마음을 물어봐 줬어요."`:`올리가 시험장에서 돌아온 뒤로 말수가 줄었다. 유물은 아직 그의 외투 안에 있다.

"그 목소리가 '보답하라'고 했어요. 저를 길러준 자들한테. 근데 저를 길러준 건 약초원 할머니인데…" 그가 고개를 흔든다. "생각할 시간이 필요해요."`,
  sei:`세이가 하퍼들에게 넘겨진 옛 주인 쪽을 보지 않는다.

"생각보다 작더라. 그 남자. 어릴 땐 산만 하게 보였는데." 그녀가 웃는다. 이번엔 진짜 웃음이다.

"곡예단 애들 찾을 거야. 반지 팔아서. 다 끝나면. 같이 찾아줄래? 넌 사람 찾는 데 소질 있잖아. 날 찾았으니까."`,
  aldor:`알도르가 틱을 무릎에 올려놓고 무언가를 녹음하고 있다.

"오늘 일을 녹음해 두는 거요. 잊어버리기 전에. '마지막 빛 여관에서 브렌나라는 드워프가 너무 쓴 차를 줬음. 근데 맛있었음.'"

그가 틱을 당신 쪽으로 돌린다. "당신도 한마디 해 주시오. 나중에 내가 잊어버려도, 틱은 기억할 테니까."`,
  fiona:`피오나가 숲 쪽을 오래 바라본다. 문신이 요즘 자주 아프다고 한다.

"그림자 저주 땅에 오니까 목소리가 더 커졌어. 쇠팔 사내를 죽이라고, 죽이라고." 그녀가 귀를 막는다. "안 할 거야. 근데 언젠가 대가를 치러야겠지."

"그때 옆에 있어 줄래? 혼자는 좀… 무서워서."`,
  bruno:`브루노가 마르케스의 탑을 돌아본다. "저놈도 결국 누군가한테 이용당한 거 아닐까. 불사의 힘이라는 미끼에."

"나도 지옥에서 그런 놈들 많이 봤어. 처음엔 다 영웅이 되고 싶었지." 그가 쇠팔을 쥐었다 편다.

"고마워. 너희랑 다니면서 이 팔이 무기만은 아니라는 걸 알았어. 애들 그네도 태우고, 장작도 패고." 그가 웃는다. "장작은 망가뜨렸지만."`,
  brenna_old:`브렌나가 찻잔 두 개를 꺼낸다. 하나는 당신 것, 하나는 빈자리에 놓는다.

"백 년 전, 나는 발더스 게이트를 구한 녀석들과 다녔다. 고글 쓴 수다쟁이 꼬마, 시 쓰는 하프오크, 별쟁이 엘프. 그리고…" 그녀가 머리의 은 구슬을 만진다. "내 동생. 노래를 크게 부르던."

"인간은 금방 늙더군. 그 꼬마도 오래전에 갔다. 드워프는 남겨지는 종족이야." 그녀가 빈 잔에 차를 따른다. "그래도 이렇게 다시 시끄러운 녀석들을 만나는군. 나쁘지 않다."`},
 3:{torga:`토르가가 마지막 밤, 모두에게 작은 쇠 조각을 하나씩 나눠준다. 당신 것은 작은 별 모양이다.

"다시 대장간을 연다. 내 마을이 있던 자리에." 그녀가 당신을 본다. 드래곤본의 얼굴로는 표정을 읽기 어렵지만, 지금은 분명히 웃고 있다. "찾아와라. 무기는 공짜다. 수리비는 받는다."`,
  olly:`올리가 모두를 위해 마지막 요리를 한다. 이번엔 자기 몫도 챙겼다.

"약초원으로 돌아갈 거예요. 할머니한테 다 말할 거예요. 기억이 돌아왔다고." 그가 웃는다. "그리고 샤르 교단에서 도망친 다른 아이들도 찾을 거예요. 저 같은 애들 많을 거예요."

"사제는 나누는 사람이니까요. 이번엔 기억도 나눠줄 거예요."`,
  sei:`세이가 모닥불 위로 마지막 공중제비를 돈다. 박수가 쏟아진다. 그녀가 착지해서 고개를 숙인다.

"곡예단을 만들 거야. 내 곡예단. 아무도 굶기지 않고, 아무도 사슬에 묶이지 않는." 그녀가 당신에게 첫 공연 표를 내민다. 손으로 그린 표다.

"맨 앞자리야. 꼭 와야 해. 안 오면 찾아갈 거야. 나 사람 찾는 데도 소질 있거든."`,
  aldor:`알도르가 '하늘 다람쥐 5호' 설계도를 완성했다. 날개가 다섯 개다. 네 개에서 하나가 늘었다.

"오늘 일은 틱에 다 녹음했소. 하나도 안 잊을 거요." 그가 틱의 버튼을 누른다. 녹음된 당신의 목소리가 흘러나온다. 언젠가 했던 말이다.

알도르가 웃는다. "봤소? 발명이란 이런 거요. 좋은 순간을 붙잡아 두는 것."`,
  fiona:f=>f.pact_free?`피오나가 맨 뺨에 바람을 맞으며 눈을 감는다.

"계약 없이 쏘는 활, 생각보다 자주 빗나가." 그녀가 웃는다. "근데 맞으면 진짜 내가 맞힌 거야. 그게 좋아."

"숲으로 돌아갈 거야. 이번엔 길 잃은 아이들을 찾아주는 사냥꾼이 될 거야. 다정한 목소리로 속이는 놈들 말고, 진짜로 데려다주는."`:`피오나의 문신은 아직 그대로다. 하지만 요즘은 아프지 않다고 한다.

"목소리가 조용해졌어. 너희랑 있으면 그 목소리보다 너희 목소리가 더 커서." 그녀가 웃는다. "언젠가 꼭 이 계약 끊을 거야. 그때도 도와줘."`,
  bruno:`브루노가 쇠팔을 하늘로 번쩍 든다. "끝났다! 진짜로 끝났어!"

"불꽃 주먹에 다시 들어갈 거야. 이번엔 대위 말고 그냥 병사로. 처음부터. 내 부하들한테 못 해준 거, 새 녀석들한테 해줄 거야."

그가 당신을 쇠팔로 끌어안는다. 차갑지만, 따뜻하다. "고마워, 친구. 지옥에서 돌아온 보람이 있었어."`,
  brenna_old:`브렌나가 오랜만에 안경을 벗는다.

"백 년 전에도 이런 밤이 있었다고 했지. 그때 그 고글 꼬마가 신전 벽에 낙서를 했었다. 피가 아니라 선택이라고. 오늘 그걸 다시 봤다."

그녀가 당신에게 찻잔을 내민다. 오늘 차는 쓰지 않다. "드워프는 남겨지는 종족이지만… 이번엔 남겨지는 게 나쁘지 않군. 기억할 게 많으니까."`,
  selen_old:`셀렌이 마지막 밤, 오랫동안 별을 읽는다.

"백 년 전 나는 어떤 핏빛 별을 따라다녔습니다. 그 별 곁에 작은 별들이 모였죠. 시끄러운 별, 노래하는 별, 시 쓰는 별." 그가 웃는다. "오늘 밤 하늘이 그때와 똑같습니다."

"엘프는 오래 삽니다. 그래서 같은 하늘을 두 번 볼 수 있죠. 이번 하늘도 잊지 않겠습니다. 당신의 별도요."`}

addLine('b3_start',f=>f.heir?`정신이 흐려지는 와중에도 손끝에 익숙한 감촉이 있다. 가문 대대로 내려온 유품. 100년 전 ${heirName()}이라는 영웅의 것이다. 어릴 때부터 들어온 이야기 속 그 이름. 유품은 아직 잠든 듯 조용하다.`:'');
addLine('b3_lastlight',f=>f.heir?`브렌나가 찻잔을 내려놓고 당신 얼굴을 오래 들여다본다. 안경 너머 눈이 흔들린다.

"…그 눈. 그리고 그 유품." 그녀가 낮게 말한다. "${heirName()}. 백 년 전 나와 함께 싸웠던 녀석이다. 이름까지 물려받았구나. 네가 그 핏줄이로구나."${f.p2_slayer?'\n\n그녀가 목소리를 낮춘다. "네 조상은 생명의 나무 앞에서 학살자의 힘을 받아들였다. 그리고 끝내 그 힘에 먹히지 않았지. 너도 그럴 거다."':''}${f.p2_yoshi?'\n\n"이세라는 검객이 있었다. 맹약 때문에 네 조상에게 칼을 겨눴고, 네 조상은 그녀를 원망하지 않았지. 그런 사람이었다."':''}`:'');
addLine('b3_c4',f=>f.heir?`셀렌이 당신의 손을 잡고 오래 들여다본다. "역시. ${heirName()}과 같은 별이군요. 핏빛이지만, 그 곁에 늘 작은 별들이 모이는 별."${f.p1_dyna?' 그가 웃는다. "그 사람이 저를 놀 요새에서 구해줬답니다. 백 년이 지나도 그 빚은 그대로군요."':''}`:'');
addLine('b3_orin_win',f=>f.heir?`브렌나가 덧붙인다. "이 낙서를 쓴 꼬마는 네 조상의 가장 친한 친구였다. 둘이 같이 이 신전에서 늑대 가면을 쓰러뜨렸지."`:'');
addLine('b3_end',f=>f.heir?`당신은 조상의 유품을 바라본다. 이제 그 힘이 완전히 깨어나 있다. 백 년 전 ${heirName()}이 그랬듯이, 당신도 이 도시를 지켰다. 브렌나가 찻잔을 들어 올린다. "두 번째로 같은 이름에게 건배하는군."`:'');

b3m_start:{title:'산맥의 길',scene:'road',who:['bruno','aldor'],text:`축제 다음 날. 남쪽 그림자 저주의 땅으로 가려면 '은빛 등뼈' 산맥을 넘어야 한다.

b3m_hilde:{title:'바위턱 마을',scene:'village',who:['hilde'],onEnter:{set:{b3m_rumor:1}},text:`"한 달 전부터 사원에 순례자가 몰려. 다들 머리가 아프다, 벌레가 있다 하면서. 수도사들이 꺼내 준다고 하니까."

토르가가 처음으로 입을 연다. "…사원 아래에 옛 드워프 광산이 있다. 우리 일족이 쓰던 곳이다. 거기로 들어가면 사원 지하로 통한다." 모두가 그를 본다. 그가 덧붙인다. "내 할아버지가 거기서 망치를 쳤다."`,choices:[{t:'고맙다고 한다',go:'b3m_town'}]},
b3m_shop:{title:'바위턱 교역소',scene:'village',shop:'b3_ledge',text:`산에서 캔 광석과 드워프 공예품. 남쪽 종족들의 물건도 들어온다. 주인이 종족별 부적을 자랑한다. "어느 핏줄이든 맞는 게 있지!"`,choices:[{t:'나온다',go:'b3m_town'}]},

b3m_temple:{title:'구름 사원',scene:'temple',who:['abbot_k'],text:f=>f.b3m_done?`사원은 조용하다. 풀려난 순례자들이 산을 내려간다.`:f.b3m_seen?`수도사들이 미소 짓는다. 사원장 카이렌이 다시 당신을 부른다. "준비가 되면 '정화의 방'으로 오시오."`:`구름 위로 솟은 하얀 사원. 종소리가 맑다. 하얀 옷의 수도사들이 순례자들을 맞는다. 모두 평온한 얼굴이다. 너무 평온하다.

백발의 사원장 카이렌이 두 팔을 벌린다. "머릿속의 벌레로 고통받는 이여. 이곳은 정화의 사원이오. 우리가 그 벌레를 꺼내 드리리다. 대가는 없소. 자비는 값을 묻지 않으니."

피오나가 당신 귀에 속삭인다. "정령과 계약했을 때도 저렇게 말했어. 대가는 없다고."

올리가 갑자기 머리를 감싼다. "…이 종소리. 들어 본 적 있어. 어릴 때. 기억이… 안 나."`,
 onEnter:{set:{b3m_seen:1}},
 choices:[{t:'정화를 받겠다고 하고 안쪽으로 들어간다',not:['b3m_done'],check:{skill:'기만',dc:15,ok:'b3m_inner',fail:'b3m_inner_alarm'}},{t:'사원장의 정체를 캐묻는다',not:['b3m_done','b3m_ask'],set:{b3m_ask:1},check:{skill:'통찰',dc:15,ok:'b3m_ask_ok',fail:'b3m_temple'}},{t:'광산 통로로 사원 지하에 몰래 들어간다',req:['b3m_mine_done'],not:['b3m_done'],go:'b3m_under'},{t:'사원을 떠난다',go:R33}]},
b3m_ask_ok:{title:'구름 사원',scene:'temple',who:['abbot_k'],onEnter:{set:{b3m_truth:1}},text:`카이렌의 미소는 완벽하다. 하지만 그의 귀 뒤로 가느다란 흉터가 보인다. 정확히 올챙이가 들어가는 자리다. 그도 감염자다. 그리고 그의 눈동자가 미묘하게 보랏빛이다. 절대자의 신도들과 같은 빛.

이곳은 정화의 사원이 아니다. 감염자를 모아 절대자의 군대로 '숙성'시키는 곳이다.`,choices:[{t:'모른 척하고 물러난다',go:'b3m_temple'}]},
b3m_inner:{title:'정화의 방',scene:'temple',who:['abbot_k'],text:`수도사가 당신을 안쪽 방으로 안내한다. 방 가득 순례자들이 눈을 감고 누워 있다. 이마에 보랏빛 문양이 그려져 있다. 그들의 입술이 같은 말을 중얼거린다. "절대자… 절대자…"

이건 정화가 아니다. 올챙이를 '깨우는' 의식이다.

카이렌이 문을 닫는다. "아, 눈치챘구려. 괜찮소. 당신도 곧 평온해질 거요."`,choices:[{t:'싸운다',go:'b3m_boss'}]},
b3m_inner_alarm:{title:'구름 사원',scene:'temple',who:['abbot_k'],text:`수도사 하나가 당신의 눈을 들여다보더니 고개를 젓는다. "이분은 아직 '준비'가 안 되셨군요."

종이 거칠게 울린다. 평온한 얼굴의 수도사들이 일제히 지팡이를 든다.`,choices:[{t:'싸운다',go:'b3m_boss'}]},
b3m_under:{title:'사원 지하',scene:'dungeon',who:['abbot_k'],text:`토르가 할아버지의 광산 통로는 사원 지하 저장고로 이어진다. 저장고에는 쇠사슬에 묶인 순례자들. 그리고 거대한 보랏빛 수정 하나가 맥박친다. 순례자들의 올챙이를 깨우는 장치다.

당신이 수정을 부수려는 순간, 계단 위에서 카이렌이 내려온다. 그의 미소가 처음으로 일그러진다. "드워프의 쥐구멍이었군."`,

},fightNode('b3m_boss',{title:'정화의 방',scene:'temple',who:['abbot_k'],text:`카이렌의 얼굴 피부가 벗겨지듯 갈라지며 보랏빛 촉수가 꿈틀거린다. 이미 올챙이가 그를 다 먹어 버렸다. 수도사들이 지팡이를 들고 둘러싼다.`,

b3m_end:{title:'구름 사원',scene:'temple',text:`순례자들을 바위턱 마을로 데려다준다. 힐데가 사촌을 끌어안고 운다. 사촌의 눈에 처음으로 빛이 돌아와 있다.

산맥 남쪽 너머, 회색 안개가 땅을 덮고 있다. 그림자 저주의 땅이다.`,
 choices:[{t:'남쪽으로 내려간다',go:'b3m_c_end'},{t:'떠나기 전에 산을 더 둘러본다',go:R33}]},
b3m_c_end:{title:'3장 끝',_rt:1,chapterEnd:true,text:`산맥의 남쪽 비탈. 첫눈이 내린다.

알도르가 지도를 고친다. 이번엔 진짜로 본 것만 그린다. 세이가 눈송이를 혀로 받아 먹는다. 피오나는 정령에게서 받은 계약 문신을 오래 문지른다.

올리가 모닥불 앞에서 조용히 말한다. "나 있잖아. 내가 누군지 잘 모르겠어. 근데 너희랑 있으면, 그래도 괜찮은 것 같아."

브루노가 쇠팔로 그의 머리를 조심스럽게 쓰다듬는다. 증기가 따뜻하다.`},

b3m_mine:{title:'옛 드워프 광산',scene:'mine',who:['torga'],text:f=>f.b3m_mine_done?`광산 깊은 곳까지 토르가가 등불을 달아 두었다. 사원 지하로 가는 길이 열려 있다.`:`산허리의 무너진 광산 입구. 문틀에 드래곤본 문양이 새겨져 있다. 토르가가 손바닥으로 문양을 쓰다듬는다.

"…우리 일족은 드워프들과 이 광산을 함께 썼다. 백 년 전 무너졌지. 할아버지는 끝까지 대장간 불을 지켰다고 들었다."

광산 안쪽에서 무언가 바위를 긁는 소리가 들린다.${f.bt3_porter?'\n\n입구 근처에 짐꾼들의 배낭이 버려져 있다. 사라진 짐꾼들이 여기로 들어간 것 같다.':''}`,
 choices:[{t:'광산 깊이 들어간다',not:['b3m_mine_done'],go:'b3m_mine_fight'},{t:'돌아간다',go:R33}]},
},fightNode('b3m_mine_fight',{title:'광산 깊은 곳',scene:'mine',who:['torga'],text:`어둠 속에서 바위를 씹어 먹는 괴물, 엄버 헐크가 고개를 든다. 그 옆엔 동굴 거미들이 짐꾼들을 고치처럼 감아 두었다.`,
 enemies:[elite('엄버 헐크',8,{hp:70}),mob('동굴 거미',8,{n:2})],after:`괴물이 쓰러진다. 거미줄 고치를 갈라 짐꾼 셋을 꺼낸다. 다행히 숨이 붙어 있다.

광산 가장 깊은 곳, 꺼진 대장간 화로 옆에 녹슨 망치 하나가 놓여 있다. 토르가가 무릎을 꿇는다. 그리고 망치 손잡이에 새겨진 이름을 손끝으로 읽는다. 할아버지의 이름이다.

화로 너머 통로는 위로, 사원 지하로 이어진다.`,reward:{set:{b3m_mine_done:1,bt3_porter_done:1},gold:60,loot:'u_forge',bond:{torga:2}},back:R33}),

addChapter('bg3',2,{title:'구름 사원',start:'b3m_start',talks:{
 torga:`토르가가 할아버지의 망치를 숫돌에 간다. 한참 아무 말도 없다.

"…할아버지는 말이 없었다. 나도 그렇다. 우리 일족은 말 대신 망치를 쳤다." 그가 망치를 내려놓는다. "그런데 너희랑 있으면, 말하고 싶어진다. 이상하다."

그가 아주 작게 웃는다. "…이것도 할아버지한테 배운 거다. 웃는 건 말보다 짧아서 좋다고."`,
 olly:`올리가 모닥불을 뒤적인다. 평소처럼 수다를 떨지 않는다.

"그림자의 아이래. 나." 그가 손바닥을 본다. "근데 나는 약초 냄새가 좋고, 아침 햇살이 좋고, 너희가 웃는 게 좋아. 그림자랑은 하나도 안 어울리잖아."

그가 고개를 든다. "…그러니까 나는 내가 좋아하는 걸로 정할래. 내가 누군지."`,
 sei:`세이가 눈 위에 발자국으로 그림을 그린다. 곡예단 천막이다.

"나는 어릴 때 곡예단에 팔려 갔어. 족쇄 차고 줄 탔지." 그녀가 손목을 문지른다. "그래서 사원에서 묶여 있던 사람들 보니까… 웃음이 안 나더라."

"근데 다 풀어 줬잖아. 그럼 이제 웃어도 되지?" 그녀가 웃는다. 이번엔 눈도 같이 웃는다.`,
 aldor:`알도르가 고친 지도를 자랑스럽게 펼친다. "봐, 이번엔 다 진짜야! 내가 직접 본 것만 그렸지!"

그가 안경을 고쳐 쓴다. "사실 나는 기억력이 나빠. 그래서 지도를 그려. 잊어버려도 다시 볼 수 있게." 그가 지도 구석의 작은 그림을 가리킨다. 모닥불 주위의 일행이다. "이건 절대 안 잊어버리려고."`,
 fiona:`피오나가 팔의 계약 문신을 문지른다. 문신이 희미하게 빛난다.

"사원장이 '대가는 없다'고 했을 때, 소름 끼쳤어. 나도 그 말을 믿었었거든. 숲의 정령이라던 그것에게."

그녀가 문신을 소매로 가린다. "언젠가 이 계약 얘기를 다 할게. 지금은… 조금만 더 용기가 필요해."`,
 bruno:`브루노가 쇠팔의 볼트를 조인다. 증기가 쉭쉭 샌다. "산에선 추워서 관절이 굳어."

그가 팔을 굽혔다 편다. "지옥의 전쟁터에선 이 팔로 사람을 많이 죽였다. 근데 오늘은 이 팔로 눈사태에 묻힌 너희를 파냈지." 그가 쇠주먹을 쥔다. "이쪽이 훨씬 낫다."`}});

b3r_start:{title:'치온타르 강변',scene:'road',who:['brenna_old','bruno'],text:`그림자 저주의 땅을 빠져나오자, 눈이 아플 만큼 밝은 햇살. 강 너머 북쪽에 발더스 게이트의 성벽이 희미하게 보인다.

b3r_harper:{title:'하퍼 접선',scene:'camp',who:['brenna_old'],onEnter:{set:{b3r_harper:1,b3r_plan:1}},text:`노인이 브렌나를 보더니 눈을 크게 뜬다. "브렌나 님? 전설 속 그 브렌나 님?" 브렌나가 귀찮다는 듯 손을 휘젓는다.

b3r_win:{title:'동쪽 다리',scene:'keep',who:['captain_s','bruno'],onEnter:{set:{b3r_done:1},gold:200,loot:'u_steel'},text:`스틸이 다리 난간에 기대 쓰러진다. 브루노가 그의 멱살을 잡는다. 쇠팔이 붉게 달아올라 있다.

b3r_end:{title:'치온타르 강변',scene:'road',text:f=>`동쪽 다리가 열렸다. ${f.b3r_circus?'서커스단의 축제 행렬도 성문 앞에 줄을 섰다. ':''}발더스 게이트로 들어갈 길이 생겼다.

b3r_c_end:{title:'5장 끝',_rt:1,chapterEnd:true,text:f=>`해 질 녘, 동쪽 다리를 건넌다. 저항군이 횃불을 들고 길을 비춘다. 난민 아이들이 손을 흔든다.

addChapter('bg3',4,{title:'치온타르 강변',start:'b3r_start',talks:{
 brenna_old:`브렌나가 백 년째 같은 방식으로 차를 끓인다. 정확히 세 숟가락.

"백 년 전, 나는 동생을 잃었다. 라스. 노래를 크게 부르던 녀석이었지." 그녀가 찻잔을 내민다. "그 뒤로 많은 사람을 잃었다. 오래 산다는 건 그런 거다."

"그래서 이제 정을 안 줄 생각이었는데." 그녀가 당신을 본다. "…또 실패했군. 쓰지? 마셔라."`,
 bruno:`브루노가 쇠팔을 무릎에 올려놓고 한참 본다.

"스틸을 죽이지 않은 거, 잘한 걸까." 그가 중얼거린다. "지옥에선 매일 그놈 얼굴을 떠올렸다. 그게 날 살게 했지. 이제 그 얼굴이 사라졌으니, 뭘 떠올리지?"

그가 모닥불 주위의 일행을 둘러본다. 그리고 픽 웃는다. "…아, 이거면 되겠군."`,
 sei:`세이가 서커스 천막 쪽을 바라본다. 로사가 단원증을 하나 더 줬다고 한다. 진짜 단원증.

"모든 게 끝나면, 거기 갈까 봐. 족쇄 없는 서커스." 그녀가 웃는다. "그때 보러 와. 맨 앞자리 줄게. 공짜로."`,
 olly:`올리가 그림자 사자 옆에 기대 졸고 있다. 사자도 졸고 있다.

깨어난 올리가 말한다. "이 녀석 이름 지어 줬어. '햇살'이야. 그림자 사자한테 햇살. 웃기지?"

그가 사자 갈기를 쓰다듬는다. "그림자의 아이도 햇살을 좋아할 수 있다는 거, 증명하고 싶었어."`,
 torga:`토르가가 할아버지의 망치로 난민들의 냄비를 고쳐 준다. 줄이 길다.

"…대장장이는 무기만 만드는 게 아니다." 그가 망치질을 멈추지 않고 말한다. "할아버지가 그랬다. 냄비를 고치는 망치가 진짜 망치라고."`,
 aldor:`알도르가 강철 감시자 부품을 분해하고 있다. 눈이 반짝인다.

"이 녀석들 구조가 아름다워! 하겐은 악당이지만 기술자로선… 아, 아니야, 악당이야." 그가 톱니 하나를 들어 보인다. "이걸로 내 비행 기계를 고칠 수 있을지도 몰라. 다 끝나면 태워 줄게!"`,
 fiona:`피오나가 강물에 손을 담근다. 계약 문신이 물속에서 빛난다.

"계약 얘기 할게." 그녀가 마침내 말한다. "나는 힘을 받는 대신, 언젠가 '가장 소중한 것'을 내주기로 했어. 그게 뭔지 몰랐어. 이제는 알 것 같아."

그녀가 당신을 보다가 시선을 피한다. "…그러니까 그 전에 계약을 끊어야 해. 도와줄 거지?"`}});

bgChoice('bg1','b1_c4','soldier','경비대 하사관에게 옛 부대 계급장을 보여준다',
 `하사관의 눈이 계급장에 머문다. "…남부 국경 수비대? 거기서 살아 돌아온 사람은 손에 꼽는데." 그가 경례를 붙인다.

"사령관님께 바로 모시겠습니다. 일지도 함께요." 아무도 당신의 말을 의심하지 않는다. 같은 진흙탕을 걸어본 사람끼리는 말이 짧다.`,'b1_fist',{req:['bg:soldier','item:이바르의 일지']});
bgChoice('bg1','b1_tent_sneak','thief','길드에서 배운 대로 경첩에 기름을 먹이고 연다',
 `손끝에 침을 묻혀 바람을 재고, 등잔 기름 한 방울을 경첩에 떨어뜨린다. 뒷골목에서 수백 번 해본 일이다.

상자가 숨소리보다 조용히 열린다. 그락쉬는 코를 골며 돌아눕는다.`,'b1_docs');
bgChoice('bg1','b1_start','scholar','연구 노트에 적어둔 서가 번호로 곧장 예언서를 찾는다',
 `몇 년 전 당신이 직접 정리한 서가다. 노트에 적어둔 번호를 따라가자 먼지 쌓인 가죽 표지가 손에 잡힌다. 찾느라 헤맬 필요도 없다.`,'b1_prophecy',{not:['library'],set:{library:1}});
bgChoice('bg1','b1_ghost','acolyte','신전에서 배운 장례 기도문을 낮게 읊는다',
 `신전에서 수없이 읊던 위로의 기도. 낮은 목소리가 지하실의 냉기를 천천히 데운다.

망령의 어깨에서 힘이 빠진다. "…오랜만에 듣는 기도로구나." 그가 싸울 마음을 내려놓는다.`,'b1_ghost_talk');
bgChoice('bg1','b1_palace','noble','가문의 인장 반지를 들어 귀족의 발언권을 청한다',
 `반지의 문장을 본 귀족들이 웅성거린다. 대관식장에서 귀족이 정식으로 발언을 청하면, 누구도 막을 수 없는 것이 이 도시의 오래된 예법이다.

모두의 시선이 당신에게 쏠린다. 당신은 천천히, 또박또박 모르데인의 죄를 말한다.`,'b1_expose');
bgChoice('bg1','b1_recruit','artist','곡예로 관중부터 사로잡는다',
 `당신은 대답 대신 공중제비를 돈다. 부두목의 도끼 위를 밟고 뛰어올라 그의 등 뒤에 착지하자 도적들이 배를 잡고 웃는다.

"하하! 저놈 물건이네!" 부두목도 머리를 긁적이며 웃고 만다. 결투는 없던 일이 된다.`,'b1_recruit_win');
bgChoice('bg1','b1_farm','farmer','밭고랑을 따라 바람 아래쪽으로 다가간다',
 `시골에서 자란 사람은 안다. 짐승은 바람을 맡는다. 바람이 놈들 쪽에서 불어오는 고랑을 골라 몸을 낮춘다.

놀들은 당신이 코앞에 올 때까지 아무것도 눈치채지 못한다.`,'b1_farm_ambush');
/* 2편 */
bgChoice('bg2','b2_ustnatha','thief','도둑 길드의 표식을 드로우 밀수꾼에게 보인다',
 `도시 외곽에서 표식을 알아보는 드로우 밀수꾼을 찾는다. 지상과 지하의 도둑들은 같은 수신호를 쓴다.

"금고까지 가는 하수 통로라… 비싸지만, 동업자 할인이다." 그가 길을 그려준다.`,'b2_eggs');
bgChoice('bg2','b2_trials','scholar','"이건 고대 문헌의 \'두 문지기 수수께끼\'다" 하고 곧장 답을 낸다',
 `학자 시절 수없이 읽은 고전 수수께끼다. 하나는 늘 거짓을, 하나는 늘 진실을 말한다. 답은 질문의 형태에 있다.

당신은 석상에게 묻지도 않고 오른쪽 문을 연다. 함정은 작동하지 않는다.`,'b2_trial2');
bgChoice('bg2','b2_keep','noble','로셀 가문과의 사교계 인연을 꺼낸다',
 `"어머, 그 가문의…!" 이델이 당신의 인장을 알아본다. 어릴 적 무도회에서 한 번 본 적이 있다고 한다.

그녀가 가문 사람만 아는 비밀 통로를 알려준다. 트롤 무리를 통째로 건너뛰어 곧장 지하로 내려간다.`,'b2_keep_boss');
bgChoice('bg2','b2_circus','artist','곡예단 시절의 눈으로 무대 장치를 읽는다',
 `줄 위에서 자란 사람에게 무대는 비밀이 없다. 환영이 일그러지는 지점마다 같은 박자로 떨리는 줄 하나가 보인다.

당신은 관객석을 가로질러 무대 뒤 도르래를 끊는다. 환영이 한꺼번에 무너진다.`,'b2_circus_boss');
bgChoice('bg2','b2_c3','sailor','뱃사람 말로 해적들과 술잔부터 기울인다',
 `부두 선술집. 당신이 매듭 하나를 묶어 보이자 해적들이 휘파람을 분다. "어디 배 출신이야?"

밤새 노래를 부르고 나니 해적 영주의 인장이 찍힌 방문 허가증이 손에 들려 있다.`,'b2_asylum');
/* 3편 */
bgChoice('bg3','b3_c2','soldier','그의 자세를 본다. 탈영병이 아니라 포로였던 병사다',

bgChoice('bg3','b3_village','farmer','할머니 약초 주머니 냄새로 찻잔 속을 알아챈다',

당신이 찻잔을 내려놓자 노파의 미소가 굳는다.`,'b3_hag');
bgChoice('bg3','b3_gauntlet','acolyte','신전에서 배운 대로 어둠의 신에게도 예를 갖추며 걷는다',

보이지 않던 디딤돌이 발밑에 하나씩 떠오른다.`,'b3_g2');

function makeTrials(cid,hook,tag){const nodes={};
 Object.entries(TRIALS).forEach(([cls,T])=>{const p=`tr_${tag}_${cls}`;
  nodes[p+'_a']={title:T.place,who:[T.who],scene:'trial',text:T.intro+'\n\n<small class="muted">시험관이 먼저 상처를 돌봐 준다. (HP·능력 회복)</small>',onEnter:{heal:'full',rest:1},choices:[
   {t:'시험을 받는다',go:p+'_b',tone:'curious'},{t:'지금은 아니다 (돌아간다)',go:hook}]};
  nodes[p+'_b']={title:T.place,who:[T.who],scene:'trial',text:T.ch,choices:[
   {t:`도전한다 (${T.skill})`,check:{skill:T.skill,dc:()=>10+fl((S.char?S.char.level:10)/2),ok:p+'_ok',fail:p+'_fail'}}]};
  nodes[p+'_ok']={title:T.place,who:[T.who],scene:'trial',text:T.ok,choices:[{t:'싸운다',go:p+'_c'}]};
  nodes[p+'_fail']={title:T.place,who:[T.who],scene:'trial',text:T.fail,onEnter:{dmg:'3d6'},choices:[{t:'싸운다',go:p+'_c'}]};
  nodes[p+'_c']={title:T.place,scene:'trial',text:'시험의 상대가 앞으로 나선다. 동료들이 한 걸음 물러선다. "이건 네 시험이야. 우린 여기서 볼게."',
   combat:()=>({enemies:T.foes(Math.max(1,(S.char?S.char.level:10)-foeDelta())),win:p+'_d',noParty:true})};
  nodes[p+'_d']={title:T.place,who:[T.who],scene:'trial',text:T.pass+JOB_WARN,onEnter:{set:{trial_done:1},heal:'full'},
   choices:subsOf(cls).map(s=>({t:`${SUBS[s].icon} ${SUBS[s].name} — ${SUBS[s].desc}`,sub:SUBS[s].perks.join(' · '),job:s,go:hook})).concat([{t:'조금 더 생각해 본다 (나중에 다시 와서 고를 수 있어요)',go:hook}])};
 });
 addNodes(cid,nodes);
 const n=NODES[hook];const at=n.choices.length;
 Object.keys(TRIALS).forEach(cls=>{
  n.choices.push({t:`🌟 2차 전직의 시험 (${CLASSES[cls].name} · 10레벨 이상)`,req:['class:'+cls,'lv:10'],not:['trial_done'],go:`tr_${tag}_${cls}_a`});
  n.choices.push({t:'🌟 2차 전직 고르기',req:['class:'+cls,'trial_done'],not:['sub:any'],go:`tr_${tag}_${cls}_d`});});}

  {t:'"새로 온 짐꾼인데요" 하고 경비를 속인다',not:['lied'],set:{lied:1},check:{skill:'기만',dc:13,ok:'docks_bluffed',fail:'docks_spotted'}},
  {t:'정면으로 덤빈다',go:'docks_fight'},
  {t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'},
  {t:'불꽃 주먹 초소로 간다',not:['fist_done'],go:'fist'}]},
docks_worker:{title:'창고 거리',onEnter:{set:{asked:1,tomas_seen:1}},text:`그물을 깁던 늙은 하역꾼 펠이 침을 탁 뱉는다.

"토마스? 어제 봤지. 창고 앞에서 인부들한테 이래라저래라 하더군. 평생 남한테 싫은 소리 한 번 못 하던 놈이… 그리고 이 더운 날 <b>왼손에만 장갑</b>을 끼고 있더라고. 이상하지?"`,choices:[{t:'고맙다고 하고 돌아선다',go:'docks'}]},
docks_window:{title:'창고 골목',text:`창고 옆 좁은 골목, 높은 곳에 반쯤 열린 환기창이 보인다. 빈 상자를 밟고 올라 소리 없이 안으로 미끄러져 들어간다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},
docks_bluffed:{title:'창고 정문',text:`덩치 하나가 당신을 위아래로 훑더니 턱짓한다. "늦었잖아. 안에 들어가서 소금 포대나 날라."

문이 열린다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},
docks_spotted:{title:'창고 거리',text:`너무 티가 났다. "거기 너! 뭘 기웃거려?" 깡패 둘이 몽둥이를 휘두르며 달려온다!`,combat:{enemies:[F('thug'),F('punk')],win:'docks_won'}},
docks_fight:{title:'창고 거리',text:`덩치들이 낄낄대며 다가온다. "여기 볼일 없을 텐데, 친구?"

대답 대신 무기를 뽑는다.`,combat:{enemies:[F('thug'),F('punk')],win:'docks_won'}},
docks_won:{title:'창고 거리',onEnter:{gold:8},text:`한 놈은 쓰러지고 다른 놈은 꽁지 빠지게 도망쳤다. 쓰러진 놈의 주머니에서 은화 8닢이 나온다.

창고 정문이 활짝 열려 있다.`,choices:[{t:'창고 안으로',go:'warehouse_in'}]},

fist:{title:'불꽃 주먹 초소',onEnter:{set:{fist_done:1}},text:`붉은 망토를 두른 경비대의 초소. 반 하사가 서류 더미 너머로 귀찮다는 듯 당신을 본다.

"하층 도시에서 사람 사라지는 게 하루 이틀 일인 줄 아나? 용건이 그거면 나가."`,
 choices:[
  {t:'"변신자를 직접 봤소." 회색 살덩이 이야기를 한다',req:['saw_doppel'],go:'fist_help'},
  {t:'사라진 사람들과 수상한 창고 이야기로 설득한다',not:['saw_doppel'],check:{skill:'설득',dc:f=>f.rumor?12:14,ok:'fist_help',fail:'fist_dismiss'}},
  {t:'은화 10닢을 서류 밑으로 슬쩍 밀어 넣는다',gold:-10,go:'fist_help'},
  {t:'그냥 나간다',go:'fist_dismiss'}]},
fist_help:{title:'불꽃 주먹 초소',onEnter:{set:{flare:1,pw:1},item:'붉은 신호탄'},text:`하사의 표정이 굳는다. "…소금 창고라. 요즘 그쪽 순찰 보고서가 이상하게 깨끗하더군."

그가 서랍에서 붉은 원통을 꺼낸다. <b>"신호탄이다. 지하에서 뭔가 찾으면 이걸 터뜨려. 우리 애들을 하수도 입구에 대기시키지."</b>

그리고 목소리를 낮춘다. "놈들 수문 암호가 <b>'썰물'</b>이라는 첩보가 있다. 믿을진 모르겠지만."`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'}]},
fist_dismiss:{title:'초소 밖',onEnter:{set:{pw:1}},text:`쫓겨나듯 초소를 나서는데, 앳된 신병 하나가 뒤따라와 소매를 잡는다.

"하사님은 안 믿으시지만… 저 하수도 수문 앞에서 밀수꾼들이 <b>'썰물'</b>이라고 말하는 걸 들었어요. 조심하세요."

신병은 그 말만 남기고 급히 돌아간다.`,
 choices:[{t:'창고 거리로 간다',go:'docks'},{t:'부서진 닻 여관으로 간다',not:['room_done'],go:'tavern'}]},

warehouse_in:{title:'소금 창고',text:`천장까지 쌓인 소금 포대와 상자들 사이로 어둠이 고여 있다.

그때 등 뒤에서 낯익은 목소리가 들린다. "…너구나! 정말 와 줬구나!"

토마스다. 수척하지만 멀쩡해 보인다. 그는 <b>왼손을 외투 주머니에 찔러 넣은 채</b> 반갑게 웃는다. "여긴 위험해. 안전한 길을 아니까 날 따라와."`,
 choices:[
  {t:'"반갑다. 왼손 좀 보여줘."',req:['scar'],go:'fake_reveal'},
  {t:'그의 말투와 몸짓을 유심히 살핀다',check:{skill:'통찰',dc:f=>f.tomas_seen?11:14,ok:'fake_reveal',fail:'fake_follow'}},
  {t:'안도하며 그를 따라간다',go:'fake_follow'}]},
fake_reveal:{title:'소금 창고',text:`'토마스'의 미소가 굳는다. 주머니에서 마지못해 빠져나온 왼손바닥은 매끈하다. 흉터 하나 없이.

"…눈치가 빠르네." 말이 끝나기도 전에 그의 얼굴이 흐물흐물 녹아내린다. 가짜다!`,combat:{enemies:[F('doppel',{name:'변신자 (토마스의 얼굴)'})],win:'warehouse_main'}},
fake_follow:{title:'함정',text:`그는 당신을 창고 뒤편 함정문으로 이끈다. 사다리를 내려가자마자 <b>철컥</b>—머리 위에서 문이 잠긴다.

어둠 속에서 '토마스'가 낄낄 웃는다. 그 얼굴이 촛농처럼 흘러내리고, 그림자에서 깡패 하나가 몽둥이를 들고 걸어 나온다.`,combat:{enemies:[F('doppel',{name:'변신자 (토마스의 얼굴)'}),F('punk',{name:'하수도 깡패'})],win:'fake_follow_win'}},
fake_follow_win:{title:'하수도 입구',text:`숨을 고른다. 함정문은 위에서 잠겼지만, 하수도는 어둠 속으로 계속 이어진다. 진짜 토마스는 어딘가 더 깊은 곳에 있을 것이다.`,
 choices:[{t:'벽에 기대 잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만 가능',not:['r1'],set:{r1:1},rest:1,go:'fake_follow_win'},{t:'하수도 깊이 들어간다',go:'sewer'}]},
warehouse_main:{title:'창고 안쪽',text:`창고는 다시 조용해졌다. 구석에는 밧줄에 묶인 채 정신을 잃은 남자가 있고, 훔친 화물 상자가 쌓여 있다. 바닥에는 쇠고리가 달린 함정문이 보인다.`,
 choices:[
  {t:'상자들을 뒤진다',not:['crates'],set:{crates:1},check:{skill:'조사',dc:11,ok:'crate_loot',fail:'crate_meh'}},
  {t:'묶인 남자를 깨운다',not:['captive'],go:'captive'},
  {t:'상자에 기대 잠시 숨을 돌린다',sub:'짧은 휴식 · 한 번만 가능',not:['r1'],set:{r1:1},rest:1,go:'warehouse_main'},
  {t:'함정문을 열고 하수도로 내려간다',go:'sewer'}]},
crate_loot:{title:'창고 안쪽',onEnter:{set:{ledger:1},gold:15,potions:1,item:'밀수 장부'},text:`훔친 화물 사이에서 <b>치유 물약</b> 하나와 은화 15닢, 그리고 가죽 장부를 찾는다.

장부에는 '바꿔치기'한 사람들의 이름과 날짜가 빼곡하다. 항만 관리관, 불꽃 주먹 장교 둘… 그리고 내일 날짜 옆에는 단 한 단어: <b>'항만장'</b>.`,choices:[{t:'장부를 챙긴다',go:'warehouse_main'}]},
crate_meh:{title:'창고 안쪽',onEnter:{gold:4},text:`소금, 소금, 또 소금. 상자 틈에 굴러다니던 은화 4닢이 전부다.`,choices:[{t:'돌아선다',go:'warehouse_main'}]},
captive:{title:'창고 안쪽',onEnter:{set:{captive:1}},text:`찬물을 끼얹자 남자가 콜록이며 눈을 뜬다. 하역꾼 데인이다.

"그놈들이… 토마스를 아래로 끌고 갔어. 지하 저수조로. 두목은 <b>'회색 부인'</b>이라 불리는 여자야. 토마스 얼굴로 뭔가 큰일을 꾸민다고 했어…"

밧줄을 풀어주자 그는 비틀거리며 창고 밖으로 달아난다.`,choices:[{t:'돌아선다',go:'warehouse_main'}]},

sewer:{title:'하수도',text:`무릎까지 차오르는 오물 냄새가 코를 찌른다. 어둠 저편에서 찍찍거리는 소리와 함께 붉은 눈 여러 쌍이 번득인다. 개만 한 쥐들이다.`,
 choices:[
  {t:'벽에 바짝 붙어 소리 없이 지나간다',check:{skill:'은신',dc:12,ok:'sewer_gate',fail:'sewer_rats'}},
  {t:'횃불을 휘둘러 쥐떼를 쫓아낸다',check:{skill:'생존',dc:12,ok:'sewer_gate',fail:'sewer_rats'}},
  {t:'먼저 공격한다',go:'sewer_rats'}]},
sewer_rats:{title:'하수도',text:`굶주린 거대 쥐들이 이빨을 드러내며 덮쳐온다!`,combat:{enemies:[F('rat'),F('rat')],win:'sewer_gate'}},
sewer_gate:{title:'수문',text:`녹슨 철창 수문이 길을 막는다. 너머로 횃불 빛이 일렁인다. 철창 틈새로 쉰 목소리가 흘러나온다.

"…암호."`,
 choices:[
  {t:'"썰물."',req:['pw'],go:'gate_pass'},
  {t:'"…밀물?" 그럴듯하게 둘러댄다',not:['pw','gtry'],set:{gtry:1},check:{skill:'기만',dc:15,ok:'gate_pass',fail:'gate_fight'}},
  {t:'문지기가 한눈판 사이 자물쇠를 딴다',not:['gtry'],set:{gtry:1},check:{skill:'손재주',dc:14,ok:'gate_sneak',fail:'gate_fight'}},
  {t:'철창을 힘으로 비틀어 연다',not:['gtry'],set:{gtry:1},check:{skill:'운동',dc:15,ok:'gate_sneak',fail:'gate_fight'}},
  {t:'"열어라!" 하고 문지기에게 덤빈다',go:'gate_fight'}]},
gate_pass:{title:'수문',text:`수문이 삐걱이며 열린다. 문지기는 당신을 힐끗 보더니 관심을 끈다.

"회색 부인께서 기다리신다. 늦었어."`,choices:[{t:'안으로 들어간다',go:'cistern'}]},
gate_sneak:{title:'수문',text:`철창이 소리 없이 열린다. 문지기는 벽에 기대 꾸벅꾸벅 졸고 있다. 그 옆을 숨죽여 지나간다.`,choices:[{t:'안으로 들어간다',go:'cistern'}]},
gate_fight:{title:'수문',text:`"침입자다!" 문지기가 갈고리 칼을 뽑아 들고 철창을 밀어젖힌다!`,combat:{enemies:[F('gate')],win:'cistern'}},

cistern:{title:'지하 저수조',text:`거대한 돌 아치 아래 검은 물이 고요하다. 물 한가운데 섬처럼 솟은 단 위에 <b>토마스가 기둥에 묶여 있다</b>. 진짜 토마스다. 왼손바닥의 흉터가 횃불에 비친다.

그 앞의 잿빛 로브 여인, <b>회색 부인</b>이 토마스의 얼굴을 손끝으로 더듬으며 자기 얼굴을 천천히 그의 모습으로 빚고 있다. 곁에선 변신자 졸개 하나가 칼을 갈고 있다.

"내일 아침, 항만장은 '친구 토마스'를 반갑게 맞아 금고 문을 열어주겠지…"

아직 당신을 못 봤다.`,
 choices:[
  {t:'붉은 신호탄을 터뜨린다',req:['flare'],go:'final_backup'},
  {t:'장부를 치켜들고 외친다: "사본은 이미 불꽃 주먹에 넘어갔다!"',req:['ledger'],check:{skill:'위협',dc:13,ok:'final_bluff',fail:'final_full'}},
  {t:'그림자를 따라 몰래 다가가 토마스를 풀어준다',check:{skill:'은신',dc:14,ok:'final_freed',fail:'final_full'}},
  {t:'숨어서 잠시 숨을 고른다',sub:'짧은 휴식 · 한 번만 가능',not:['r2'],set:{r2:1},rest:1,go:'cistern'},
  {t:'무기를 뽑고 돌격한다',go:'final_full'},
  {t:'…감당할 수 없다. 돌아서 도망친다',go:'ending_flee'}]},
final_full:{title:'지하 저수조',text:`회색 부인이 고개를 돌린다. 반쯤 토마스가 된 얼굴이 기괴하게 웃는다.

"손님이 왔네. 마침 얼굴 하나가 더 필요했는데."

졸개가 칼을 들고 물을 가르며 달려온다!`,combat:{enemies:[F('boss'),F('doppel',{name:'변신자 졸개',hp:14,max:14})],win:'ending_win'}},
final_backup:{title:'지하 저수조',onEnter:{set:{backup:1}},text:`붉은 빛이 아치 천장을 핏빛으로 물들인다. 잠시 후 수로 저편에서 군화 소리와 함성—<b>불꽃 주먹이다!</b>

병사들이 졸개를 덮쳐 물속에 처박는다. 회색 부인이 날카롭게 비명을 지르며 당신에게 달려든다.`,combat:{enemies:[F('boss')],allies:[{name:'불꽃 주먹 병사들',atk:4,dmg:'1d6+2',hp:30,ac:15}],win:'ending_win'}},
final_bluff:{title:'지하 저수조',text:`졸개의 얼굴이 하얗게 질린다. "끝났어, 다 끝났다고!" 놈은 칼을 버리고 검은 물속으로 뛰어들어 달아난다.

회색 부인이 이를 간다. "겁쟁이 같으니. 그럼 너라도 데려가야지."`,combat:{enemies:[F('boss')],win:'ending_win'}},
final_freed:{onEnter:{set:{freed:1}},title:'지하 저수조',text:`기둥 뒤로 숨어든 당신이 밧줄을 끊는다. 토마스가 눈을 번쩍 뜬다.

그 순간 들킨다! 하지만 토마스가 풀린 쇠사슬을 휘둘러 달려오던 졸개를 물속으로 처박는다.

"이 녀석은 내가 맡을게! 저 여자를 막아!"`,combat:{enemies:[F('boss')],allies:[{name:'토마스',atk:3,dmg:'1d6+1',hp:30,ac:15}],win:'ending_win'}},

ending_win:{title:'에필로그',ending:'win',onEnter:{gold:100},text:f=>`회색 부인의 몸이 잿빛 밀랍처럼 무너져 내린다. 저수조에 정적이 내려앉는다.

${f.freed?'토마스가 거친 숨을 몰아쉬며 당신 어깨를 붙잡는다.':'당신은 기둥으로 달려가 토마스의 밧줄을 끊는다.'} "올 줄 알았어. 정말 올 줄 알았다고."

${f.ledger?'당신이 건넨 장부 덕분에 불꽃 주먹은 그날 밤 바꿔치기된 관리들을 하나하나 찾아냈다. 항만장은 무사했고, 시의회는 당신에게 감사장과 함께 금화 100닢을 보냈다.':'회색 부인은 쓰러졌지만, 그녀가 누구누구의 얼굴을 훔쳤는지는 알 길이 없다. 그래도 항만장은 무사했고, 그의 사례금으로 금화 100닢이 손에 들어왔다.'}

며칠 뒤 부서진 닻 여관. 마르다가 공짜 맥주를 내려놓으며 말한다. "이 도시엔 아직 남의 얼굴을 쓴 놈들이 남아 있을 거야."

<b>— 모험 완료 —</b>`},

const UP_MAX=3;
function upOf(id){return(S.char&&S.char.up&&S.char.up[id])||0;}
function upCost(id){const it=ITEMS[id],u=upOf(id);return Math.round((it.uniq?90:40*(it.tier||1)+20)*(u+1)*(1+(S.char.level||1)/10));}
function upDesc(id){const it=ITEMS[id];if(it.type==='weapon')return(it.cls&&!it.cls.some(x=>MARTIAL.includes(x)))?'주문 명중 +1 · DC +1':'명중 +1 · 피해 +1';if(it.type==='armor')return'AC +1';return'최대 HP +5 · 모든 기술 +1';}
function upMat(skip){const c=inv(S.char);const ids=Object.keys(c.bag).filter(id=>c.bag[id]>0&&isGear(id)&&id!==skip&&!ITEMS[id].uniq);return ids.sort((a,b)=>priceOf(a)-priceOf(b))[0]||null;}
function smithList(){const c=inv(S.char),list=[];Object.entries(c.eq).forEach(([sl,id])=>{if(id)list.push({id,who:'나 · '+SLOTN[sl]});});
 if(S.adv)Object.entries(S.adv.cs||{}).forEach(([k,cs])=>{if(!S.adv.roster.includes(k))return;Object.entries(cs.eq||{}).forEach(([sl,id])=>{if(id)list.push({id,who:camp(S.adv.camp).comps[k].name+' · '+CSLOT[sl]});});});
 Object.keys(c.bag).forEach(id=>{if(c.bag[id]>0&&isGear(id))list.push({id,who:'가방'});});
 const seen=new Set();return list.filter(x=>seen.has(x.id)?false:(seen.add(x.id),true));}
function smithModal(){const c=inv(S.char);c.up=c.up||{};
 const rows=smithList().map(({id,who})=>{const u=upOf(id),cost=upCost(id),mat=upMat(id),max=u>=UP_MAX;
  return`<li style="text-align:left"><span class="itemrow">${itemIcon(id)}<span><b>${esc(iname(id))}</b> <small class="muted">${esc(who)}</small><br><small class="muted">${max?'최대 강화':`다음 강화: ${upDesc(id)} · 💰 ${cost}${mat?` · 재료: ${esc(ITEMS[mat].name)}`:' · 재료 없음'}`}</small></span></span>${max?'<span class="chip">+3</span>':`<button class="btn sm" data-up="${id}" ${c.gold<cost||!mat?'disabled':''}>강화</button>`}</li>`;}).join('');
 modal(`<div style="font-size:40px">⚒️</div><h2>대장장이</h2><p class="muted" style="font-size:13px">쓰지 않는 장비 하나를 재료로 녹여 아끼는 장비를 강화해요. 최대 +3. 동료가 입은 장비도 강화할 수 있어요.<br>재료는 가방의 장비 중 가장 싼 것이 자동으로 쓰여요 (고유 장비는 재료로 쓰지 않아요).</p><ul class="list" style="max-height:55vh;overflow:auto">${rows||'<li class="muted">강화할 장비가 없어요.</li>'}</ul>`,[{t:'닫기',fn:()=>{save();render();}}]);
 $('#overlay').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.up){const id=b.dataset.up,cost=upCost(id),mat=upMat(id);if(!mat||c.gold<cost||upOf(id)>=UP_MAX)return;
   c.gold-=cost;c.bag[mat]--;if(!c.bag[mat])delete c.bag[mat];c.up[id]=upOf(id)+1;syncChar(false);save();smithModal();return;}

  <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-a="rest">🏕️ 휴식</button></div></div>`:''}
 <div class="card"><h3>공격과 능력</h3><ul class="list">${[...k.attacks,...k.feats].map(a=>`<li><span><b>${a.name}</b><br><span class="muted">${a.desc}</span></span>${a.max&&live?`<span class="chip">${c.uses[a.id]||0}/${a.max}</span>`:''}</li>`).join('')}${k.passive.map(p=>`<li><span><b>${p[0]}</b><br><span class="muted">${p[1]}</span></span><span class="chip">상시</span></li>`).join('')}</ul></div>
 <div class="card"><h3>기술 (★ 숙련)</h3><div class="skills">${Object.keys(SKILL).map(s=>`<div class="${k.prof.includes(s)?'p':''}"><span>${k.prof.includes(s)?'★ ':''}${s} <small class="muted">${ABIL[SKILL[s]]}</small></span><span>${sgn(skillBonus(s,c))}</span></div>`).join('')}</div></div>
 ${live?`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">장비</h3><button class="btn sm" data-a="bag">🎒 가방 열기</button></div><ul class="list" style="margin-top:8px">${Object.keys(SLOTN).map(sl=>{const id=inv(c).eq[sl];return`<li><span class="itemrow">${id?itemIcon(id):'<span class="ico slot"></span>'}<span><span class="muted" style="font-size:12px">${SLOTN[sl]}</span><br>${id?`<b>${esc(iname(id,c))}</b> <small class="muted">${esc(ITEMS[id].desc)}</small>`:'<span class="muted">비어 있음</span>'}</span></span></li>`;}).join('')}</ul></div>
 <div class="card"><h3>중요 물품</h3><ul class="list">${c.items.map((it,i)=>`<li><span>${esc(it)}</span><button class="btn ghost sm" data-delitem="${i}">버리기</button></li>`).join('')}</ul>
  <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="newitem" placeholder="아이템 추가"><button class="btn sm" data-a="additem">추가</button></div></div>`:''}
 <div class="card"><h3>관리</h3><p class="muted" style="font-size:13px;margin-top:0">마지막 파일 백업: ${S.lastBackup?new Date(S.lastBackup).toLocaleString('ko-KR'):'아직 없음'} · 장이 끝날 때마다 저장 창이 자동으로 떠요.</p><div class="row"><button class="btn ghost sm" data-a="newchar">캐릭터 바꾸기</button><button class="btn ghost sm" data-a="backup">📁 파일로 백업</button><button class="btn ghost sm" data-a="restore">📂 파일에서 불러오기</button><button class="btn red sm" data-a="wipe">전체 초기화</button></div></div>`;}
function vDice(){const D=S.dice;const l=D.last;
 return`<div class="card"><h2>주사위</h2>
  <div class="dicebox" id="dbox">${D20SVG}<div class="big num">${l?l.total:'–'}</div></div><div class="muted" id="ddesc" style="text-align:center">${l?esc(l.desc):'주사위를 눌러 굴리세요'}</div>
  <hr><div class="dice">${[4,6,8,10,12,20,100].map(s=>`<button class="die" data-die="${s}">d${s}</button>`).join('')}<button class="die" data-a="clearhist">지우기</button></div>
  <div class="grid2" style="margin-top:14px"><div><div class="muted">개수</div><span class="stepper"><button data-dadj="count:-1">−</button><output>${D.count}</output><button data-dadj="count:1">+</button></span></div>
   <div><div class="muted">보정치</div><span class="stepper"><button data-dadj="mod:-1">−</button><output>${sgn(D.mod)}</output><button data-dadj="mod:1">+</button></span></div></div>
  <div class="muted" style="margin-top:12px">d20 굴림 방식</div><div class="seg">${[['norm','일반'],['adv','이점'],['dis','불리']].map(([m,t])=>`<button class="${D.mode===m?'on':''}" data-dmode="${m}">${t}</button>`).join('')}</div></div>
  ${S.hero?`<div class="card"><h3>내 캐릭터로 기술 판정</h3><div class="grid3">${Object.keys(SKILL).map(s=>`<button class="btn ghost sm" data-sk="${s}">${s} ${sgn(skillBonus(s))}</button>`).join('')}</div></div>`:''}
  <div class="card"><h3>최근 기록</h3><ul class="list">${D.hist.map(h=>`<li><span class="muted">${esc(h.desc)}</span><b>${h.total}</b></li>`).join('')||'<li class="muted">아직 없어요</li>'}</ul></div>`;}
function vOracle(){const o=S.olast;
 return`<div class="card"><h2>예/아니오 오라클</h2><p class="muted">GM 없이 혼자 할 때, 궁금한 걸 질문하고 굴리세요. "문이 잠겨 있나?" "경비병이 깨어 있나?"</p>
  <input id="oq" placeholder="질문 (선택)">
  <div class="muted" style="margin-top:10px">가능성</div><div class="seg" style="flex-wrap:wrap">${LIKE.map((l,i)=>`<button class="${S.like===i?'on':''}" data-like="${i}">${l[0]}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px;justify-content:space-between"><span>혼돈 지수 <span class="stepper" style="display:inline-flex"><button data-chaos="-1">−</button><output>${S.chaos}</output><button data-chaos="1">+</button></span></span>
  <button class="btn" data-a="ask">질문하기</button></div>
  <div class="muted" style="font-size:12px;margin-top:6px">혼돈 지수가 높을수록 무작위 사건이 자주 터져요. 일이 잘 풀리면 낮추고, 꼬이면 올리세요.</div>
  ${o?`<div class="res">${o}</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="tojournal">기록에 추가</button></div>`:''}</div>
 <div class="card"><h3>생성기</h3><div class="grid2">
  <button class="btn ghost" data-gen="scene">🎬 장면 체크</button><button class="btn ghost" data-gen="event">⚡ 무작위 사건</button>
  <button class="btn ghost" data-gen="npc">🧑 NPC</button><button class="btn ghost" data-gen="loot">💎 보물</button>
  <button class="btn ghost" data-gen="place">🏚️ 장소</button><button class="btn ghost" data-gen="idea">💡 영감 (행동+주제)</button>
  <button class="btn ghost" data-gen="enc:도시">🏙️ 도시 조우</button><button class="btn ghost" data-gen="enc:야생">🌲 야생 조우</button>
  <button class="btn ghost" data-gen="enc:던전" style="grid-column:span 2">🕳️ 던전 조우</button></div></div>
 <div class="card"><h3>혼자 하는 법</h3><p class="muted" style="margin:0">1) 장면을 정하고 '장면 체크'로 예상대로 흘러가는지 확인 → 2) 궁금한 건 오라클에 질문 → 3) 막히면 '영감'이나 '무작위 사건' → 4) 결과를 '기록'에 남기기. 전투는 주사위 탭에서 굴리세요.</p></div>`;}
function vJournal(){return vBook()+`<div class="card"><h2>모험 기록장</h2><p class="muted">자동 저장돼요. 오라클 결과를 여기로 보낼 수 있어요.</p><textarea id="jr" rows="12" placeholder="오늘의 모험…">${esc(S.journal)}</textarea></div>`;}
function installHint(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(!ios||navigator.standalone||S.hintOff)return'';
 return`<div class="banner">📲 오프라인으로 쓰려면 Safari 아래쪽 <b>공유 버튼 → 홈 화면에 추가</b>를 누르고, 홈 화면 아이콘으로 실행하세요. <button class="btn ghost sm" data-a="hintoff" style="margin-top:6px">닫기</button></div>`;}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 $('#statbar').innerHTML=statbar();
 $('#view').innerHTML=installHint()+({adv:vAdv,char:vChar,dice:vDice,oracle:vOracle,journal:vJournal}[S.tab])();
 const cb=S.adv&&S.adv.combat;if(cb&&cb.ev&&cb.ev.length&&S.tab==='adv'&&!S.menu){const ev=cb.ev;cb.ev=[];setTimeout(()=>playFx(ev),20);}}

/* ================= 오라클 로직 ================= */
function plainOracle(){return(S.olast||'').replace(/<br>/g,'\n').replace(/<[^>]+>/g,'');}
function evt(){const r=rnd(100);const f=T.focus.find(x=>r<=x[0])[1];return`${f} — <i>${pick(T.action)} / ${pick(T.subject)}</i>`;}
function ask(){const th=LIKE[S.like][1],r=rnd(100);const q=($('#oq')||{}).value||'';let a,cls;
 if(r<=Math.ceil(th/5)){a='예, 그리고 더!';cls='ok-c';}else if(r<=th){a='예';cls='ok-c';}else if(r>100-Math.ceil((100-th)/5)){a='아니오, 오히려 반대로!';cls='bad-c';}else{a='아니오';cls='bad-c';}
 let ev='';const t=r%10,tens=fl(r/10)%10;if(r<100&&r>10&&t===tens&&t<=S.chaos)ev=`<br><b>⚡ 무작위 사건!</b> ${evt()}`;
 S.olast=`${q?`<div class="muted">Q. ${esc(q)}</div>`:''}<span class="k ${cls}">${a}</span> <span class="muted">(🎲${r} / ${LIKE[S.like][0]})</span>${ev}`;save();render();}
function gen(g){let h;
 if(g==='scene'){const r=rnd(10);h=r>S.chaos?'<span class="k">예상대로 진행</span><br>생각한 장면 그대로 시작하세요.':r%2?'<span class="k">변경된 장면</span><br>예상과 조금 다르게 흘러가요. 한 가지 요소를 바꾸세요.':`<span class="k">중단된 장면</span><br>전혀 다른 일이 끼어듭니다: ${evt()}`;h+=` <span class="muted">(🎲${r} vs 혼돈 ${S.chaos})</span>`;}
 else if(g==='event')h=`<span class="k">⚡ 무작위 사건</span><br>${evt()}`;
 else if(g==='npc')h=`<span class="k">${pick(T.name)}</span><br>${pick(T.trait)} ${pick(T.race)} ${pick(T.job)}<br>원하는 것: ${pick(T.want)}<br>비밀: ${pick(T.secret)}`;
 else if(g==='loot')h=`<span class="k">💎 보물</span><br>${pick(T.loot)}`;
 else if(g==='place')h=`<span class="k">${pick(T.place)}</span><br>분위기: ${pick(T.mood)}`;
 else if(g==='idea')h=`<span class="k">${pick(T.action)} / ${pick(T.subject)}</span><br><span class="muted">두 단어를 지금 상황에 맞게 해석해 보세요.</span>`;
 else{const w=g.split(':')[1];const r=rnd(12);h=`<span class="k">${w} 조우</span> <span class="muted">(d12 → ${r})</span><br>${T.enc[w][r-1]}`;}
 S.olast=h;save();render();}

/* ================= 이벤트 ================= */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-cr]');if(!t||t.closest('#overlay'))return;const ds=t.dataset;
 if(ds.tab){S.tab=ds.tab;save();render();window.scrollTo(0,0);return;}
 if(ds.goTab){S.tab=ds.goTab;save();render();return;}
 if(ds.ch!==undefined)return choose(+ds.ch);
 if(ds.act)return act(ds.act==='potion'?'potion':'x',ds.act);
 if(ds.place!==undefined)return goPlace(+ds.place);
 if(ds.aact){const[i,kd]=ds.aact.split(':');return allyAct(+i,kd);}
 if(ds.tg!==undefined){const cb=S.adv.combat;if(cb.enemies[+ds.tg].hp>0){cb.target=+ds.tg;save();render();}return;}
 if(ds.cr!==undefined)return crClick(ds);
 if(ds.newc&&!ds.fresh&&askLegacy(ds.newc))return;
 if(ds.newc){const id=ds.newc;const has=S.saves[id]||(S.adv&&S.adv.camp===id);if(has)modal('<h2>처음부터 시작할까요?</h2><p class="muted">이 모험의 진행 상황이 사라져요.</p>',[{t:'처음부터',fn:()=>{if(S.adv&&S.adv.camp===id)S.adv=null;delete S.saves[id];startCamp(id);}},{t:'취소',cls:'ghost'}]);else startCamp(id);return;}
 if(ds.resume)return resumeCamp(ds.resume);
 if(ds.rch){const[id,ch]=ds.rch.split(':');modal(`<h2>${+ch+1}장을 다시 할까요?</h2><p class="muted">그 장을 시작했던 때의 상태로 돌아가요. 이후 진행은 사라져요.</p>`,[{t:'다시 하기',fn:()=>restartChapter(id,+ch)},{t:'취소',cls:'ghost'}]);return;}
 if(ds.adj){const[k,v]=ds.adj.split(':');const c=S.char;c[k]=Math.max(0,c[k]+ +v);if(k==='hp')c.hp=Math.min(c.hp,c.maxhp);if(k==='slots')c.slots=Math.min(c.slots,c.maxSlots);save();render();return;}
 if(ds.delitem!==undefined){S.char.items.splice(+ds.delitem,1);save();render();return;}
 if(ds.die){const D=S.dice,s=+ds.die;let total,desc;
  if(s===20&&D.count===1&&D.mode!=='norm'){const r=d20(D.mode);total=r.v+D.mod;desc=`d20 ${D.mode==='adv'?'이점':'불리'} ${r.txt}${D.mod?sgn(D.mod):''}`;if(r.v===20)desc+=' · 대성공!';if(r.v===1)desc+=' · 대실패!';}
  else{const r=roll(`${D.count}d${s}${D.mod?sgn(D.mod):''}`);total=r.t;desc=`${D.count}d${s}${D.mod?sgn(D.mod):''} [${r.r.join(', ')}]`;if(s===20&&D.count===1){if(r.r[0]===20)desc+=' · 대성공!';if(r.r[0]===1)desc+=' · 대실패!';}}
  D.last={total,desc};D.hist.unshift(D.last);D.hist=D.hist.slice(0,25);save();render();const dd=$('#ddesc');if(dd)dd.style.visibility='hidden';rollAnim($('#dbox'),total,s===100?100:s,600,()=>{if(dd)dd.style.visibility='visible';});return;}
 if(ds.dadj){const[k,v]=ds.dadj.split(':');const D=S.dice;D[k]+= +v;if(k==='count')D.count=Math.min(20,Math.max(1,D.count));if(k==='mod')D.mod=Math.max(-20,Math.min(20,D.mod));save();render();return;}
 if(ds.dmode){S.dice.mode=ds.dmode;save();render();return;}
 if(ds.sk){const s=ds.sk,b=skillBonus(s),r=d20(S.dice.mode);S.dice.last={total:r.v+b,desc:`${ABIL[SKILL[s]]}(${s}) ${r.txt}${sgn(b)}${r.v===20?' · 대성공!':r.v===1?' · 대실패!':''}`};S.dice.hist.unshift(S.dice.last);S.dice.hist=S.dice.hist.slice(0,25);save();render();window.scrollTo(0,0);const dd=$('#ddesc');if(dd)dd.style.visibility='hidden';rollAnim($('#dbox'),S.dice.last.total,20,600,()=>{if(dd)dd.style.visibility='visible';});return;}
 if(ds.like!==undefined){S.like=+ds.like;save();render();return;}
 if(ds.chaos){S.chaos=Math.max(1,Math.min(9,S.chaos+ +ds.chaos));save();render();return;}
 if(ds.gen)return gen(ds.gen);
 if(ds.buy)return buy(ds.buy);
 if(ds.talk)return talk(ds.talk);
 if(ds.sell)return sell(ds.sell);
 const a=ds.a;if(!a)return;
 ({menu:()=>{S.menu=true;save();render();window.scrollTo(0,0);},
  party:partyModal,nextch:nextChapter,bag:()=>bagModal(),cbag:()=>bagModal('combat'),
  won:()=>enterNode(S.adv.combat.win),
  mkchar:createHero,
  newchar:()=>modal('<h2>캐릭터를 바꿀까요?</h2><p class="muted">모든 모험의 진행 상황이 사라져요.</p>',[{t:'바꾸기',cls:'red',fn:()=>{S.hero=null;S.char=null;S.adv=null;S.saves={};S.done={};S.legacy={};S.menu=true;save();render();}},{t:'취소',cls:'ghost'}]),
  rest:restModal,smith:smithModal,search:exploreSearch,srest:()=>{const m=doRest(false);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);},
  lrest:()=>{const m=doRest(true);save();render();modal(`<p>${m}</p>`,[{t:'확인'}]);},
  additem:()=>{const v=$('#newitem').value.trim();if(v){S.char.items.push(v);save();render();}},
  clearhist:()=>{S.dice.hist=[];S.dice.last=null;save();render();},
  ask,hintoff:()=>{S.hintOff=1;save();render();},
  tojournal:()=>{const d=new Date();S.journal=(S.journal?S.journal.trimEnd()+'\n\n':'')+`[${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}] ${plainOracle()}`;save();modal('<p>기록장에 추가했어요.</p>',[{t:'확인'}]);},
  backup:saveBackupFile,
  restore:loadBackupFile,
  wipe:()=>modal('<h2>전부 지울까요?</h2><p class="muted">캐릭터, 모든 모험, 기록장이 삭제돼요.</p>',[{t:'모두 삭제',cls:'red',fn:()=>{S=fresh();save();render();}},{t:'취소',cls:'ghost'}])
 }[a]||(()=>{}))();
});
let jt;document.addEventListener('input',e=>{if(e.target.id==='jr'){S.journal=e.target.value;clearTimeout(jt);jt=setTimeout(save,300);}if(e.target.id==='cname')draft().name=e.target.value;});
function netState(){$('#offline').textContent=navigator.onLine?'':'✈︎ 오프라인';}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if(S.adv&&!NODES[S.adv.node]){S.adv=null;S.menu=true;}
applyChapters();try{migrateChapters();migrateAll();}catch(e){console.error(e);}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
